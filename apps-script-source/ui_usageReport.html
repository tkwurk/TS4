<script>
  // Global variables for usage table sorting
  let usageTableSortColumn = null;
  let usageTableSortDirection = 'asc';

  // Chicken piece configuration
  const CHICKEN_PIECES = {
    HOT: {
      'AYAM HOT DADA': 3,
      'AYAM HOT PAHA BAWAH': 2,
      'AYAM HOT PAHA ATAS': 2,
      'AYAM HOT SAYAP': 2
    },
    ORI: {
      'AYAM ORI DADA': 3,
      'AYAM ORI PAHA BAWAH': 2,
      'AYAM ORI PAHA ATAS': 2,
      'AYAM ORI SAYAP': 2
    }
  };

  // Function to calculate complete chickens sold
  function calculateCompleteChickens(data) {
    const chickenCounts = {
      HOT: { 
        totalPieces: 0, 
        completedChickens: 0, 
        purchasedChickens: 0,
        pieces: {} 
      },
      ORI: { 
        totalPieces: 0, 
        completedChickens: 0, 
        purchasedChickens: 0,
        pieces: {} 
      }
    };

    // Initialize piece counters
    Object.keys(CHICKEN_PIECES.HOT).forEach(piece => {
      chickenCounts.HOT.pieces[piece] = 0;
    });
    Object.keys(CHICKEN_PIECES.ORI).forEach(piece => {
      chickenCounts.ORI.pieces[piece] = 0;
    });

    // Count pieces from the data
    data.forEach(row => {
      const product = (row.product || '').toUpperCase();
      const qty = Number(row.qty) || 0;

      // Check for full chicken packages purchased
      if (product.includes('AYAM HOT EKOR')) {
        chickenCounts.HOT.purchasedChickens += qty;
      }
      if (product.includes('AYAM ORI EKOR')) {
        chickenCounts.ORI.purchasedChickens += qty;
      }

      // Check HOT chicken pieces sold
      Object.keys(CHICKEN_PIECES.HOT).forEach(piece => {
        if (product.includes(piece)) {
          chickenCounts.HOT.pieces[piece] += qty;
          chickenCounts.HOT.totalPieces += qty;
        }
      });

      // Check ORI chicken pieces sold
      Object.keys(CHICKEN_PIECES.ORI).forEach(piece => {
        if (product.includes(piece)) {
          chickenCounts.ORI.pieces[piece] += qty;
          chickenCounts.ORI.totalPieces += qty;
        }
      });
    });

    // Calculate complete chickens for HOT
    let minCompleteHot = Infinity;
    Object.keys(CHICKEN_PIECES.HOT).forEach(piece => {
      const requiredPieces = CHICKEN_PIECES.HOT[piece];
      const availablePieces = chickenCounts.HOT.pieces[piece];
      const possibleChickens = Math.floor(availablePieces / requiredPieces);
      minCompleteHot = Math.min(minCompleteHot, possibleChickens);
    });
    chickenCounts.HOT.completedChickens = minCompleteHot === Infinity ? 0 : minCompleteHot;

    // Calculate complete chickens for ORI
    let minCompleteOri = Infinity;
    Object.keys(CHICKEN_PIECES.ORI).forEach(piece => {
      const requiredPieces = CHICKEN_PIECES.ORI[piece];
      const availablePieces = chickenCounts.ORI.pieces[piece];
      const possibleChickens = Math.floor(availablePieces / requiredPieces);
      minCompleteOri = Math.min(minCompleteOri, possibleChickens);
    });
    chickenCounts.ORI.completedChickens = minCompleteOri === Infinity ? 0 : minCompleteOri;

    return chickenCounts;
  }

  function renderUsageReportTable(data) {
  const hideMonth = document.getElementById('hideMonthToggle') && document.getElementById('hideMonthToggle').checked;
  const hideProduct = document.getElementById('hideProductToggle') && document.getElementById('hideProductToggle').checked;
  const hideZeroPrice = document.getElementById('hideZeroPriceToggle') && document.getElementById('hideZeroPriceToggle').checked;
  const tableDiv = document.getElementById('usage-table-content');
  
  if (!tableDiv) {
    console.error('Usage table container not found');
    return;
  }
  
  if (!data || !Array.isArray(data) || data.length === 0) {
    tableDiv.innerHTML = '<div class="no-products">No usage data found.</div>';
    return;
  }

  // Count and filter zero-price items (each item row evaluated independently)
  const isZeroPrice = row => {
    if (row.category === 'PURCHASES') return false;
    return row.isZeroPrice === true;
  };
  const zeroPriceCount = data.filter(isZeroPrice).length;
  if (hideZeroPrice) {
    data = data.filter(row => !isZeroPrice(row));
  }

  console.log('Rendering usage report with data:', data);

  // Summing logic
  let sumMap = {};
  let totalQty = 0;

  data.forEach((row, index) => {
    console.log('Processing row ' + index + ':', row);
    
    // Key logic: controls the grouping
    let key = '';
    if (!hideMonth && !hideProduct) {
      key = (row.month || '') + '||' + (row.product || '');
    } else if (!hideMonth && hideProduct) {
      key = row.month || '';
    } else if (hideMonth && !hideProduct) {
      key = row.product || '';
    } else {
      key = 'total'; // everything
    }

    if (!sumMap[key]) {
      sumMap[key] = {
        month: row.month,
        product: row.product,
        qty: 0
      };
    }
    
    // Ensure we're working with numbers
    const qty = Number(row.qty) || 0;
    
    sumMap[key].qty += qty;

    totalQty += qty;
  });

  console.log('Aggregated data:', sumMap);
  console.log('Totals:', { totalQty });

  // Convert to array for sorting
  let dataArray = Object.values(sumMap);
  
  // Sort data if a sort column is selected
  if (usageTableSortColumn !== null) {
    dataArray.sort((a, b) => {
      let valueA, valueB;
      
      switch (usageTableSortColumn) {
        case 'month':
          valueA = (a.month || '').toLowerCase();
          valueB = (b.month || '').toLowerCase();
          break;
        case 'product':
          valueA = (a.product || '').toLowerCase();
          valueB = (b.product || '').toLowerCase();
          break;
        case 'qty':
          valueA = Number(a.qty) || 0;
          valueB = Number(b.qty) || 0;
          break;
        case 'sellAmount':
          valueA = Number(a.sellAmount) || 0;
          valueB = Number(b.sellAmount) || 0;
          break;
        case 'buyAmount':
          valueA = Number(a.buyAmount) || 0;
          valueB = Number(b.buyAmount) || 0;
          break;
        case 'profit':
          valueA = Number(a.profit) || 0;
          valueB = Number(b.profit) || 0;
          break;
        default:
          return 0;
      }
      
      let comparison = 0;
      if (typeof valueA === 'string') {
        comparison = valueA.localeCompare(valueB);
      } else {
        comparison = valueA - valueB;
      }
      
      return usageTableSortDirection === 'asc' ? comparison : -comparison;
    });
  }

  // Table header with sortable columns
  let html = `<table style="width:99%;margin-top:8px;margin-bottom:16px;border-collapse:collapse;"><tr>`;
  
  const headerStyle = "padding:8px 12px;border-bottom:2px solid #ddd;cursor:pointer;user-select:none;transition:background-color 0.2s;";
  const headerHoverStyle = "background-color:#f0f0f0;";
  
  if (!hideMonth) {
    const monthSortIcon = usageTableSortColumn === 'month' ? (usageTableSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
    html += `<th style="text-align:left;${headerStyle}" onclick="sortUsageTable('month')" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor=''">Month${monthSortIcon}</th>`;
  }
  
  if (!hideProduct) {
    const productSortIcon = usageTableSortColumn === 'product' ? (usageTableSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
    html += `<th style="text-align:left;${headerStyle}" onclick="sortUsageTable('product')" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor=''">Product${productSortIcon}</th>`;
  }
  
  const qtySortIcon = usageTableSortColumn === 'qty' ? (usageTableSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
  
  html += `
    <th style="text-align:right;${headerStyle}" onclick="sortUsageTable('qty')" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor=''">Total Quantity${qtySortIcon}</th>
  </tr>`;

  // Rows (now using sorted data)
  dataArray.forEach((row, index) => {
    const rowStyle = index % 2 === 0 ? "background-color:#f9f9f9;" : "";
    html += `<tr style="${rowStyle}">`;
    if (!hideMonth) html += `<td style="padding:6px 12px;">${row.month || ''}</td>`;
    if (!hideProduct) html += `<td style="padding:6px 12px;">${row.product || ''}</td>`;
    html += `
      <td style="text-align:right;padding:6px 12px;">${row.qty}</td>
    </tr>`;
  });

  // Total row (footer)
  html += `<tr style="font-weight:bold;background:#e3f2fd;border-top:2px solid #2196f3;">`;
  if (!hideMonth) html += hideProduct ? `<td style="padding:10px 12px;">TOTAL</td>` : `<td style="padding:10px 12px;"></td>`;
  if (!hideProduct) html += `<td style="padding:10px 12px;">TOTAL</td>`;
  html += `
    <td style="text-align:right;padding:10px 12px;">${totalQty}</td>
  </tr>`;
  html += '</table>';

  // Add filter status information
  const isFiltered = window._filteredUsageReportData !== null && window._filteredUsageReportData !== undefined;
  if (isFiltered) {
    const selectedCategories = getSelectedCategories();
    html += `
      <div style="margin-top: 10px; padding: 8px; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 6px; font-size: 12px; color: #856404;">
        <strong>🔍 Filter Applied:</strong> Showing ${selectedCategories.length} of ${(window._allCategories || []).length} categories: 
        <em>${selectedCategories.join(', ')}</em>
        <button onclick="clearCategoryFilter()" style="margin-left: 10px; font-size: 11px; padding: 2px 6px; background: #6c757d; color: white; border: none; border-radius: 3px; cursor: pointer;">Clear Filter</button>
      </div>
    `;
  }

  // Show zero-price filter status
  if (hideZeroPrice && zeroPriceCount > 0) {
    html += `
      <div style="margin-top: 8px; padding: 8px; background: #e8f4fd; border: 1px solid #bee5eb; border-radius: 6px; font-size: 12px; color: #0c5460;">
        <strong>💰 Zero Price Filter:</strong> Hiding ${zeroPriceCount} item(s) with zero price (in Orders or Products sheet). Uncheck "Hide Zero Price" to show them.
      </div>
    `;
  } else if (!hideZeroPrice && zeroPriceCount > 0) {
    html += `
      <div style="margin-top: 8px; padding: 8px; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 6px; font-size: 12px; color: #856404;">
        <strong>💰 Zero Price:</strong> Showing all items including ${zeroPriceCount} item(s) with zero price (in Orders or Products sheet).
      </div>
    `;
  }

  // Calculate and display chicken counts
  const chickenCounts = calculateCompleteChickens(data);
  
  html += `
    <div style="margin-top: 20px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
      <!-- HOT Chicken Summary -->
      <div style="background: linear-gradient(135deg, #ff6b6b, #ff5252); color: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); min-width: 220px;">
        <h4 style="margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; justify-content: center;">
          <span style="font-size: 20px;">🔥</span>
          HOT Chickens
        </h4>
        
        <!-- Purchased vs Sold Stats -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div style="text-align: center; flex: 1;">
            <div style="font-size: 18px; font-weight: bold;">${chickenCounts.HOT.purchasedChickens}</div>
            <div style="font-size: 10px; opacity: 0.8;">📦 Purchased</div>
          </div>
          <div style="text-align: center; flex: 1;">
            <div style="font-size: 18px; font-weight: bold;">${chickenCounts.HOT.completedChickens}</div>
            <div style="font-size: 10px; opacity: 0.8;">✅ Complete Sold</div>
          </div>
        </div>
        
        <!-- Utilization Rate -->
        <div style="background: rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; text-align: center;">
          <div style="font-size: 11px; opacity: 0.9;">Utilization Rate</div>
          <div style="font-size: 14px; font-weight: bold;">
            ${chickenCounts.HOT.purchasedChickens > 0 ? 
              Math.round((chickenCounts.HOT.completedChickens / chickenCounts.HOT.purchasedChickens) * 100) + '%' : 
              'N/A'}
          </div>
        </div>
        
        <div style="font-size: 10px; opacity: 0.8; margin-top: 6px; text-align: center;">
          Total pieces sold: ${chickenCounts.HOT.totalPieces}
        </div>
      </div>
      
      <!-- ORI Chicken Summary -->
      <div style="background: linear-gradient(135deg, #4fc3f7, #29b6f6); color: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(79, 195, 247, 0.3); min-width: 220px;">
        <h4 style="margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; justify-content: center;">
          <span style="font-size: 20px;">🐔</span>
          ORI Chickens
        </h4>
        
        <!-- Purchased vs Sold Stats -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div style="text-align: center; flex: 1;">
            <div style="font-size: 18px; font-weight: bold;">${chickenCounts.ORI.purchasedChickens}</div>
            <div style="font-size: 10px; opacity: 0.8;">📦 Purchased</div>
          </div>
          <div style="text-align: center; flex: 1;">
            <div style="font-size: 18px; font-weight: bold;">${chickenCounts.ORI.completedChickens}</div>
            <div style="font-size: 10px; opacity: 0.8;">✅ Complete Sold</div>
          </div>
        </div>
        
        <!-- Utilization Rate -->
        <div style="background: rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; text-align: center;">
          <div style="font-size: 11px; opacity: 0.9;">Utilization Rate</div>
          <div style="font-size: 14px; font-weight: bold;">
            ${chickenCounts.ORI.purchasedChickens > 0 ? 
              Math.round((chickenCounts.ORI.completedChickens / chickenCounts.ORI.purchasedChickens) * 100) + '%' : 
              'N/A'}
          </div>
        </div>
        
        <div style="font-size: 10px; opacity: 0.8; margin-top: 6px; text-align: center;">
          Total pieces sold: ${chickenCounts.ORI.totalPieces}
        </div>
      </div>
      
      <!-- Overall Summary Card -->
      <div style="background: linear-gradient(135deg, #48bb78, #38a169); color: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3); min-width: 200px;">
        <h4 style="margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; justify-content: center;">
          <span style="font-size: 20px;">📊</span>
          Overall Summary
        </h4>
        
        <div style="margin-bottom: 8px;">
          <div style="display: flex; justify-content: space-between; font-size: 12px;">
            <span>Total Purchased:</span>
            <span style="font-weight: bold;">${chickenCounts.HOT.purchasedChickens + chickenCounts.ORI.purchasedChickens}</span>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 12px;">
            <span>Total Complete Sold:</span>
            <span style="font-weight: bold;">${chickenCounts.HOT.completedChickens + chickenCounts.ORI.completedChickens}</span>
          </div>
        </div>
        
        <div style="background: rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; text-align: center;">
          <div style="font-size: 11px; opacity: 0.9;">Overall Efficiency</div>
          <div style="font-size: 14px; font-weight: bold;">
            ${(chickenCounts.HOT.purchasedChickens + chickenCounts.ORI.purchasedChickens) > 0 ? 
              Math.round(((chickenCounts.HOT.completedChickens + chickenCounts.ORI.completedChickens) / 
                         (chickenCounts.HOT.purchasedChickens + chickenCounts.ORI.purchasedChickens)) * 100) + '%' : 
              'N/A'}
          </div>
        </div>
      </div>
    </div>
  `;

  // Add detailed breakdown (expandable)
  html += `
    <div style="margin-top: 15px; text-align: center;">
      <button onclick="toggleChickenBreakdown()" style="
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.3s ease;
      " onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform=''">
        <span id="breakdown-toggle-text">Show Detailed Breakdown</span> <span id="breakdown-arrow">▼</span>
      </button>
    </div>
    
    <div id="chicken-breakdown" style="display: none; margin-top: 15px; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #e9ecef;">
      <!-- Purchase Summary Row -->
      <div style="margin-bottom: 15px; padding: 12px; background: #e8f5e8; border-radius: 8px; border-left: 4px solid #28a745;">
        <h5 style="margin: 0 0 8px 0; color: #155724; text-align: center;">📦 Chicken Purchases Summary</h5>
        <div style="display: flex; justify-content: center; gap: 30px; font-size: 14px;">
          <div style="text-align: center;">
            <div style="font-weight: bold; color: #ff5252;">${chickenCounts.HOT.purchasedChickens}</div>
            <div style="font-size: 12px; color: #666;">HOT Chickens Purchased</div>
            <div style="font-size: 10px; color: #888;">(AYAM HOT EKOR)</div>
          </div>
          <div style="text-align: center;">
            <div style="font-weight: bold; color: #29b6f6;">${chickenCounts.ORI.purchasedChickens}</div>
            <div style="font-size: 12px; color: #666;">ORI Chickens Purchased</div>
            <div style="font-size: 10px; color: #888;">(AYAM ORI EKOR)</div>
          </div>
          <div style="text-align: center;">
            <div style="font-weight: bold; color: #28a745;">${chickenCounts.HOT.purchasedChickens + chickenCounts.ORI.purchasedChickens}</div>
            <div style="font-size: 12px; color: #666;">Total Purchased</div>
            <div style="font-size: 10px; color: #888;">(All Types)</div>
          </div>
        </div>
      </div>
      
      <div style="display: flex; gap: 30px; justify-content: center;">
        <!-- HOT Breakdown -->
        <div style="flex: 1; max-width: 300px;">
          <h5 style="color: #ff5252; margin-bottom: 10px; text-align: center;">🔥 HOT Chicken Breakdown</h5>
          <div style="margin-bottom: 8px; text-align: center; font-size: 12px; color: #666;">
            Purchased: <strong>${chickenCounts.HOT.purchasedChickens}</strong> | 
            Complete Sold: <strong>${chickenCounts.HOT.completedChickens}</strong>
          </div>
          <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
            <tr style="background: #fff3e0;">
              <th style="text-align: left; padding: 4px 8px; border: 1px solid #ddd;">Piece</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Required</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Sold</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Sets</th>
            </tr>`;
            
  Object.keys(CHICKEN_PIECES.HOT).forEach(piece => {
    const required = CHICKEN_PIECES.HOT[piece];
    const sold = chickenCounts.HOT.pieces[piece];
    const sets = Math.floor(sold / required);
    html += `
            <tr>
              <td style="padding: 4px 8px; border: 1px solid #ddd; font-size: 10px;">${piece.replace('AYAM HOT ', '')}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${required}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${sold}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${sets}</td>
            </tr>`;
  });
  
  html += `
          </table>
        </div>
        
        <!-- ORI Breakdown -->
        <div style="flex: 1; max-width: 300px;">
          <h5 style="color: #29b6f6; margin-bottom: 10px; text-align: center;">🐔 ORI Chicken Breakdown</h5>
          <div style="margin-bottom: 8px; text-align: center; font-size: 12px; color: #666;">
            Purchased: <strong>${chickenCounts.ORI.purchasedChickens}</strong> | 
            Complete Sold: <strong>${chickenCounts.ORI.completedChickens}</strong>
          </div>
          <table style="width: 100%; font-size: 12px; border-collapse: collapse;">
            <tr style="background: #e3f2fd;">
              <th style="text-align: left; padding: 4px 8px; border: 1px solid #ddd;">Piece</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Required</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Sold</th>
              <th style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">Sets</th>
            </tr>`;
            
  Object.keys(CHICKEN_PIECES.ORI).forEach(piece => {
    const required = CHICKEN_PIECES.ORI[piece];
    const sold = chickenCounts.ORI.pieces[piece];
    const sets = Math.floor(sold / required);
    html += `
            <tr>
              <td style="padding: 4px 8px; border: 1px solid #ddd; font-size: 10px;">${piece.replace('AYAM ORI ', '')}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${required}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${sold}</td>
              <td style="text-align: center; padding: 4px 8px; border: 1px solid #ddd;">${sets}</td>
            </tr>`;
  });
  
  html += `
          </table>
        </div>
      </div>
      
      <div style="margin-top: 15px; padding: 12px; background: #fff; border-radius: 6px; font-size: 11px; color: #666; text-align: center;">
        <div style="margin-bottom: 8px;">
          <strong>Complete Chicken Calculation:</strong><br>
          A complete chicken requires all pieces in the correct quantities. The count is limited by the piece type with the fewest complete sets.
        </div>
        <div style="font-size: 10px; color: #888; border-top: 1px solid #eee; padding-top: 8px;">
          <strong>Purchase Tracking:</strong><br>
          • AYAM HOT EKOR = 1 complete HOT chicken package<br>
          • AYAM ORI EKOR = 1 complete ORI chicken package<br>
          • Utilization Rate = (Complete Chickens Sold ÷ Chickens Purchased) × 100%
        </div>
      </div>
    </div>
  `;

  tableDiv.innerHTML = html;
}

function showUsageReport() {
  const usageReportTable = document.getElementById('usage-report-table');
  if (!usageReportTable) return;
  
  usageReportTable.innerHTML = `
    <div style="margin-bottom:15px;">
      <!-- Category Filter Section -->
      <div style="margin-bottom:10px; padding:10px; background:#f8f9fa; border-radius:6px; border:1px solid #e9ecef;">
        <label style="font-weight:bold; margin-bottom:8px; display:block; color:#495057;">Product Category Filter:</label>
        <div id="category-filter-container" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
          <div class="loading" style="font-size:12px; color:#666;">Loading categories...</div>
        </div>
        <div style="margin-top:8px;">
          <button onclick="selectAllCategories()" style="font-size:11px; padding:4px 8px; margin-right:8px; background:#007bff; color:white; border:none; border-radius:3px; cursor:pointer;">Select All</button>
          <button onclick="deselectAllCategories()" style="font-size:11px; padding:4px 8px; margin-right:8px; background:#6c757d; color:white; border:none; border-radius:3px; cursor:pointer;">Deselect All</button>
          <button onclick="applyUsageReportFilter()" style="font-size:11px; padding:4px 8px; background:#28a745; color:white; border:none; border-radius:3px; cursor:pointer;">Apply Filter</button>
        </div>
      </div>
      
      <!-- Display Options -->
      <div style="text-align:right;">
        <label style="font-size:0.97em;">
          <input type="checkbox" id="hideZeroPriceToggle" checked onchange="renderUsageReportTable(window._filteredUsageReportData || window._usageReportData)"> Hide Zero Price
        </label>
        &nbsp;&nbsp;
        <label style="font-size:0.97em;">
          <input type="checkbox" id="hideMonthToggle" onchange="renderUsageReportTable(window._filteredUsageReportData || window._usageReportData)"> Hide Month
        </label>
        &nbsp;&nbsp;
        <label style="font-size:0.97em;">
          <input type="checkbox" id="hideProductToggle" onchange="renderUsageReportTable(window._filteredUsageReportData || window._usageReportData)"> Hide Product
        </label>
      </div>
    </div>
    <div id="usage-table-content"><div class="loading">Loading...</div></div>
  `;
  
  const renderCounter = getCurrentRenderCounter();
  
  // Get clean login session data for backend call
  const deviceId = window.LoginState?.deviceId || null;
  const username = window.LoginState?.user || null;
  
  console.log('Usage Report: Using session data - DeviceId:', deviceId ? 'Present' : 'Missing', 'Username:', username || 'Missing');
  
  google.script.run
    .withSuccessHandler(function(data) {
      console.log('Usage report success handler called with data:', data);
      // Check if this render is still valid
      if (!isCurrentTabRender('usageReport', renderCounter)) {
        console.log('Ignoring stale usage report render');
        return;
      }
      window._usageReportData = data;
      window._filteredUsageReportData = null; // Reset filter
      
      // Initialize category filter
      initializeCategoryFilter(data);
      
      // Render initial table
      renderUsageReportTable(data);
    })
    .withFailureHandler(function(error) {
      console.error('Usage report error:', error);
      const tableDiv = document.getElementById('usage-table-content');
      if (tableDiv) {
        tableDiv.innerHTML = `<div class="no-products">Error loading usage data: ${error.message || error}</div>`;
      }
    })
    .getUsageReportData(deviceId, username);
}


function showMonthlyUsageReport() {
  var tableDiv = document.getElementById('usage-report-table');
  if (!tableDiv) return;
  
  tableDiv.innerHTML = '<div class="loading" style="text-align:center;padding:40px;">Loading monthly usage...</div>';
  
  var deviceId = window.LoginState?.deviceId || null;
  var username = window.LoginState?.user || null;
  
  google.script.run.withSuccessHandler(function(data) {
    window._monthlyRawData = data || [];
    // Populate shared category filter
    var cats = new Set();
    data.forEach(function(row) {
      if (row.category && row.category.trim()) cats.add(row.category.trim());
    });
    var sorted = Array.from(cats).sort();
    window._allCategories = sorted;
    renderCategoryChips(sorted);
    window._displayedMonthlyData = data;
    renderMonthlyUsageTable(data);
  }).withFailureHandler(function(error) {
    tableDiv.innerHTML = '<div class="no-products" style="color:red;">Error: ' + (error.message || error) + '</div>';
  }).getMonthlyUsageReport(deviceId, username);
}

var monthlySortCol = 'month';
var monthlySortDir = 'desc';

function renderMonthlyUsageTable(data) {
  var tableDiv = document.getElementById('usage-report-table');
  if (!tableDiv) return;
  
  if (!data || data.length === 0) {
    tableDiv.innerHTML = '<div class="no-products">No monthly usage data found.</div>';
    return;
  }
  
  window._displayedMonthlyData = data;
  
  // Sort
  var sorted = data.slice().sort(function(a, b) {
    var va, vb;
    switch (monthlySortCol) {
      case 'month': va = a.month || ''; vb = b.month || ''; break;
      case 'category': va = (a.category || '').toLowerCase(); vb = (b.category || '').toLowerCase(); break;
      case 'name': va = (a.name || '').toLowerCase(); vb = (b.name || '').toLowerCase(); break;
      case 'qty': va = a.qty; vb = b.qty; break;
      default: return 0;
    }
    var cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return monthlySortDir === 'asc' ? cmp : -cmp;
  });
  
  var hs = 'padding:8px 6px;border-bottom:2px solid #ddd;cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;';
  function si(col) { return monthlySortCol === col ? (monthlySortDir === 'asc' ? ' \u25B2' : ' \u25BC') : ''; }
  
  var html = '<table style="width:99%;margin-top:8px;margin-bottom:16px;border-collapse:collapse;font-size:13px;">';
  html += '<tr>';
  html += '<th style="text-align:left;' + hs + '" onclick="sortMonthlyTable(\'month\')">Month' + si('month') + '</th>';
  html += '<th style="text-align:left;' + hs + '" onclick="sortMonthlyTable(\'category\')">Category' + si('category') + '</th>';
  html += '<th style="text-align:left;' + hs + '" onclick="sortMonthlyTable(\'name\')">Product' + si('name') + '</th>';
  html += '<th style="text-align:right;' + hs + '" onclick="sortMonthlyTable(\'qty\')">Quantity' + si('qty') + '</th>';
  html += '</tr>';
  
  var totalQty = 0;
  sorted.forEach(function(row, idx) {
    var bg = idx % 2 === 0 ? 'background:#f9f9f9;' : '';
    html += '<tr style="' + bg + '">';
    html += '<td style="padding:6px;">' + (row.month || '') + '</td>';
    html += '<td style="padding:6px;">' + (row.category || '') + '</td>';
    html += '<td style="padding:6px;">' + (row.name || '') + '</td>';
    html += '<td style="text-align:right;padding:6px;">' + row.qty + '</td>';
    html += '</tr>';
    totalQty += row.qty;
  });
  
  html += '<tr style="font-weight:bold;background:#e3f2fd;border-top:2px solid #2196f3;">';
  html += '<td style="padding:10px 6px;"></td><td style="padding:10px 6px;"></td>';
  html += '<td style="padding:10px 6px;">TOTAL</td>';
  html += '<td style="text-align:right;padding:10px 6px;">' + totalQty + '</td>';
  html += '</tr></table>';
  
  tableDiv.innerHTML = html;
}

function sortMonthlyTable(col) {
  if (monthlySortCol === col) {
    monthlySortDir = monthlySortDir === 'asc' ? 'desc' : 'asc';
  } else {
    monthlySortCol = col;
    monthlySortDir = 'asc';
  }
  if (window._displayedMonthlyData) {
    renderMonthlyUsageTable(window._displayedMonthlyData);
  }
}

  // Function to sort usage table by column
  function sortUsageTable(column) {
    // Toggle sort direction if clicking the same column
    if (usageTableSortColumn === column) {
      usageTableSortDirection = usageTableSortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      usageTableSortColumn = column;
      usageTableSortDirection = 'asc';
    }
    
    // Re-render the table with sorted data
    if (window._usageReportData) {
      renderUsageReportTable(window._usageReportData);
    }
  }

  // Function to toggle chicken breakdown visibility
  function toggleChickenBreakdown() {
    const breakdown = document.getElementById('chicken-breakdown');
    const toggleText = document.getElementById('breakdown-toggle-text');
    const arrow = document.getElementById('breakdown-arrow');
    
    if (breakdown && toggleText && arrow) {
      if (breakdown.style.display === 'none') {
        breakdown.style.display = 'block';
        toggleText.textContent = 'Hide Detailed Breakdown';
        arrow.textContent = '▲';
      } else {
        breakdown.style.display = 'none';
        toggleText.textContent = 'Show Detailed Breakdown';
        arrow.textContent = '▼';
      }
    }
  }

  // Shared category filter functions
  function renderCategoryChips(categories) {
    var container = document.getElementById('category-filter-container');
    if (!container) return;
    
    var html = '';
    categories.forEach(function(category) {
      var safeId = 'cat_' + category.replace(/[^a-zA-Z0-9]/g, '_');
      html += '<label style="display:flex; align-items:center; background:white; padding:6px 10px; border:1px solid #ced4da; border-radius:4px; cursor:pointer; font-size:12px; white-space:nowrap;">' +
        '<input type="checkbox" id="' + safeId + '" value="' + category + '" checked style="margin-right:6px;">' +
        '<span>' + category + '</span></label>';
    });
    container.innerHTML = html;
  }

  function selectAllCategories() {
    var checkboxes = document.querySelectorAll('#category-filter-container input[type="checkbox"]');
    checkboxes.forEach(function(cb) { cb.checked = true; });
  }

  function deselectAllCategories() {
    var checkboxes = document.querySelectorAll('#category-filter-container input[type="checkbox"]');
    checkboxes.forEach(function(cb) { cb.checked = false; });
  }

  function getSelectedCategories() {
    var checkboxes = document.querySelectorAll('#category-filter-container input[type="checkbox"]:checked');
    return Array.from(checkboxes).map(function(cb) { return cb.value; });
  }

  function applySharedFilter() {
    var selected = getSelectedCategories();
    
    if (window._activeUsageView === 'stock') {
      if (!window._inventoryStockData) return;
      if (selected.length === 0) {
        renderInventoryStockTable([]);
      } else if (selected.length === (window._allCategories || []).length) {
        renderInventoryStockTable(window._inventoryStockData);
      } else {
        var filtered = window._inventoryStockData.filter(function(item) {
          return selected.includes(item.category);
        });
        renderInventoryStockTable(filtered);
      }
    } else if (window._activeUsageView === 'monthly') {
      if (!window._monthlyRawData) return;
      if (selected.length === 0) {
        renderMonthlyUsageTable([]);
      } else if (selected.length === (window._allCategories || []).length) {
        renderMonthlyUsageTable(window._monthlyRawData);
      } else {
        var filtered = window._monthlyRawData.filter(function(row) {
          return selected.includes(row.category);
        });
        renderMonthlyUsageTable(filtered);
      }
    }
  }
  // ====== View Switcher ======
  window._activeUsageView = 'stock';

  function switchUsageView(view) {
    window._activeUsageView = view;
    var btnMonthly = document.getElementById('btnMonthlyView');
    var btnStock = document.getElementById('btnStockView');
    var activeStyle = 'flex:1;padding:10px;border:2px solid #2196f3;background:#2196f3;color:white;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;';
    var inactiveStyle = 'flex:1;padding:10px;border:2px solid #ddd;background:white;color:#333;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;';
    
    if (btnMonthly) btnMonthly.style.cssText = (view === 'monthly') ? activeStyle : inactiveStyle;
    if (btnStock) btnStock.style.cssText = (view === 'stock') ? activeStyle : inactiveStyle;
    
    var tableDiv = document.getElementById('usage-report-table');
    if (!tableDiv) return;
    
    if (view === 'monthly') {
      showMonthlyUsageReport();
    } else if (view === 'stock') {
      showInventoryStock();
    }
  }

  // ====== Inventory Stock Report ======
  let stockSortColumn = 'remaining';
  let stockSortDirection = 'asc';

  function showInventoryStock() {
    var tableDiv = document.getElementById('usage-report-table');
    if (!tableDiv) return;
    
    tableDiv.innerHTML = '<div class="loading" style="text-align:center;padding:40px;">Loading inventory stock...</div>';
    
    var deviceId = window.LoginState?.deviceId || null;
    var username = window.LoginState?.user || null;
    
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.error) {
          tableDiv.innerHTML = '<div class="no-products" style="color:red;">Error: ' + result.error + '</div>';
          return;
        }
        window._inventoryStockData = result.items || [];
        // Populate shared category filter from stock data
        var cats = new Set();
        window._inventoryStockData.forEach(function(item) {
          if (item.category && item.category.trim()) cats.add(item.category.trim());
        });
        var sorted = Array.from(cats).sort();
        window._allCategories = sorted;
        renderCategoryChips(sorted);
        renderInventoryStockTable(window._inventoryStockData);
      })
      .withFailureHandler(function(error) {
        tableDiv.innerHTML = '<div class="no-products" style="color:red;">Error loading inventory: ' + (error.message || error) + '</div>';
      })
      .getInventoryStockReport(deviceId, username);
  }

  function renderInventoryStockTable(items) {
    window._displayedStockData = items;
    var tableDiv = document.getElementById('usage-report-table');
    if (!tableDiv) return;
    
    if (!items || items.length === 0) {
      tableDiv.innerHTML = '<div class="no-products">No inventory stock data found. Make sure Products sheet has ParentProductCode and UnitsPerParent columns configured.</div>';
      return;
    }
    
    // Sort
    var sorted = items.slice().sort(function(a, b) {
      var va, vb;
      switch (stockSortColumn) {
        case 'product': va = (a.product || '').toLowerCase(); vb = (b.product || '').toLowerCase(); break;
        case 'category': va = (a.category || '').toLowerCase(); vb = (b.category || '').toLowerCase(); break;
        case 'parentCode': va = (a.parentCode || '').toLowerCase(); vb = (b.parentCode || '').toLowerCase(); break;
        case 'parentPurchased': va = a.parentPurchased; vb = b.parentPurchased; break;
        case 'available': va = a.available; vb = b.available; break;
        case 'sold': va = a.sold; vb = b.sold; break;
        case 'remaining': va = a.remaining; vb = b.remaining; break;
        default: return 0;
      }
      var cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      return stockSortDirection === 'asc' ? cmp : -cmp;
    });
    
    var headerStyle = 'padding:8px 6px;border-bottom:2px solid #ddd;cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;';
    
    function sortIcon(col) {
      return stockSortColumn === col ? (stockSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
    }
    
    var html = '<table style="width:99%;margin-top:8px;margin-bottom:16px;border-collapse:collapse;font-size:13px;">';
    html += '<tr>';
    html += '<th style="text-align:left;' + headerStyle + '" onclick="sortStockTable(\'product\')">Product' + sortIcon('product') + '</th>';
    html += '<th style="text-align:left;' + headerStyle + '" onclick="sortStockTable(\'category\')">Category' + sortIcon('category') + '</th>';
    html += '<th style="text-align:left;' + headerStyle + '" onclick="sortStockTable(\'parentCode\')">Parent Code' + sortIcon('parentCode') + '</th>';
    html += '<th style="text-align:right;' + headerStyle + '" onclick="sortStockTable(\'parentPurchased\')">Purchased' + sortIcon('parentPurchased') + '</th>';
    html += '<th style="text-align:right;' + headerStyle + '" onclick="sortStockTable(\'available\')">Available' + sortIcon('available') + '</th>';
    html += '<th style="text-align:right;' + headerStyle + '" onclick="sortStockTable(\'sold\')">Sold' + sortIcon('sold') + '</th>';
    html += '<th style="text-align:right;' + headerStyle + '" onclick="sortStockTable(\'remaining\')">Remaining' + sortIcon('remaining') + '</th>';
    html += '<th style="text-align:center;' + headerStyle + '">Status</th>';
    html += '</tr>';
    
    sorted.forEach(function(item, idx) {
      var pct = item.available > 0 ? Math.round((item.remaining / item.available) * 100) : 0;
      var statusColor, statusText, rowBg;
      
      if (item.remaining <= 0) {
        statusColor = '#dc3545'; statusText = 'OUT'; rowBg = '#fff5f5';
      } else if (pct <= 20) {
        statusColor = '#fd7e14'; statusText = 'LOW'; rowBg = '#fff8f0';
      } else if (pct <= 50) {
        statusColor = '#ffc107'; statusText = 'MED'; rowBg = idx % 2 === 0 ? '#f9f9f9' : '';
      } else {
        statusColor = '#28a745'; statusText = 'OK'; rowBg = idx % 2 === 0 ? '#f9f9f9' : '';
      }
      
      html += '<tr style="background:' + rowBg + ';">';
      html += '<td style="padding:6px;">' + (item.product || '') + '</td>';
      html += '<td style="padding:6px;">' + (item.category || '') + '</td>';
      html += '<td style="padding:6px;">' + (item.parentCode || '') + '</td>';
      html += '<td style="text-align:right;padding:6px;">' + item.parentPurchased + '</td>';
      html += '<td style="text-align:right;padding:6px;">' + item.available + '</td>';
      html += '<td style="text-align:right;padding:6px;">' + item.sold + '</td>';
      html += '<td style="text-align:right;padding:6px;font-weight:bold;color:' + statusColor + ';">' + item.remaining + '</td>';
      html += '<td style="text-align:center;padding:6px;"><span style="background:' + statusColor + ';color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;">' + statusText + '</span></td>';
      html += '</tr>';
    });
    
    html += '</table>';
    
    // Summary cards
    var outCount = items.filter(function(i) { return i.remaining <= 0; }).length;
    var lowCount = items.filter(function(i) { return i.remaining > 0 && i.available > 0 && (i.remaining / i.available) <= 0.2; }).length;
    var okCount = items.length - outCount - lowCount;
    
    html += '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px;">';
    html += '<div style="background:#dc3545;color:white;padding:12px 20px;border-radius:10px;text-align:center;min-width:100px;"><div style="font-size:24px;font-weight:bold;">' + outCount + '</div><div style="font-size:11px;">Out of Stock</div></div>';
    html += '<div style="background:#fd7e14;color:white;padding:12px 20px;border-radius:10px;text-align:center;min-width:100px;"><div style="font-size:24px;font-weight:bold;">' + lowCount + '</div><div style="font-size:11px;">Low Stock</div></div>';
    html += '<div style="background:#28a745;color:white;padding:12px 20px;border-radius:10px;text-align:center;min-width:100px;"><div style="font-size:24px;font-weight:bold;">' + okCount + '</div><div style="font-size:11px;">In Stock</div></div>';
    html += '</div>';
    
    tableDiv.innerHTML = html;
  }

  function sortStockTable(column) {
    if (stockSortColumn === column) {
      stockSortDirection = stockSortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      stockSortColumn = column;
      stockSortDirection = 'asc';
    }
    if (window._displayedStockData) {
      renderInventoryStockTable(window._displayedStockData);
    }
  }
</script>
