<!-- Performance Optimization Module -->
<script>
  // Global cache for reducing server calls
  window.AppCache = {
    data: {},
    timestamps: {},
    TTL: {
      products: 5 * 60 * 1000,        // 5 minutes
      accounts: 10 * 60 * 1000,       // 10 minutes
      outlets: 30 * 60 * 1000,        // 30 minutes
      paymentSources: 30 * 60 * 1000, // 30 minutes
      session: 2 * 60 * 1000,         // 2 minutes
      reports: 1 * 60 * 1000          // 1 minute for dynamic data
    },
    
    // Sanitize cache keys to prevent special character issues
    sanitizeKey: function(key) {
      if (!key || typeof key !== 'string') {
        return 'invalid_key';
      }
      return key
        .replace(/[^a-zA-Z0-9\-_]/g, '_') // Replace special chars with underscore
        .replace(/_{2,}/g, '_')           // Replace multiple underscores with single
        .replace(/^_+|_+$/g, '')         // Remove leading/trailing underscores
        .toLowerCase()                   // Convert to lowercase for consistency
        .substring(0, 100);              // Limit length to prevent issues
    },
    
    set: function(key, data, customTTL) {
      const cleanKey = this.sanitizeKey(key);
      
      // Validate data can be safely cached
      try {
        const testSerialization = JSON.stringify(data);
        if (testSerialization.length > 1024 * 1024) { // 1MB limit
          console.warn(`Cache data too large for key: ${cleanKey} (${testSerialization.length} bytes)`);
          return false;
        }
      } catch (error) {
        console.error(`Cache data serialization failed for key: ${cleanKey}`, error);
        return false;
      }
      
      this.data[cleanKey] = data;
      this.timestamps[cleanKey] = Date.now();
      if (customTTL) {
        this.TTL[cleanKey] = customTTL;
      }
      console.log(`Cache SET: ${cleanKey} (TTL: ${this.TTL[cleanKey] || 'default'}ms, original key: "${key}")`);
      return true;
    },
    
    get: function(key) {
      const cleanKey = this.sanitizeKey(key);
      
      if (!this.data[cleanKey] || !this.timestamps[cleanKey]) {
        return null;
      }
      
      const age = Date.now() - this.timestamps[cleanKey];
      const ttl = this.TTL[cleanKey] || 5 * 60 * 1000; // Default 5 minutes
      
      if (age > ttl) {
        console.log(`Cache EXPIRED: ${cleanKey} (age: ${age}ms, TTL: ${ttl}ms)`);
        delete this.data[cleanKey];
        delete this.timestamps[cleanKey];
        return null;
      }
      
      console.log(`Cache HIT: ${cleanKey} (age: ${age}ms, original key: "${key}")`);
      return this.data[cleanKey];
    },
    
    invalidate: function(key) {
      const cleanKey = this.sanitizeKey(key);
      delete this.data[cleanKey];
      delete this.timestamps[cleanKey];
      console.log(`Cache INVALIDATED: ${cleanKey} (original key: "${key}")`);
    },
    
    clear: function() {
      this.data = {};
      this.timestamps = {};
      console.log('Cache CLEARED');
    },
    
    // ✅ CACHE DIAGNOSTICS: Test cache with various key types
    testCacheKeys: function() {
      const testKeys = [
        'simple-key',
        'key with spaces',
        'key-with-special-chars!@#$%',
        'key_with_underscores',
        'UPPERCASE_KEY',
        'key/with/slashes',
        'key\\with\\backslashes',
        'key"with"quotes',
        "key'with'single'quotes",
        'key\nwith\nnewlines',
        'very-long-key-that-exceeds-normal-limits-and-should-be-truncated-if-necessary-for-safe-storage-in-cache-system'
      ];
      
      console.log('🧪 CACHE KEY TESTING:');
      testKeys.forEach(originalKey => {
        const sanitizedKey = this.sanitizeKey(originalKey);
        console.log(`"${originalKey}" → "${sanitizedKey}"`);
        
        // Test actual cache operations
        this.set(originalKey, { test: 'data', key: originalKey }, 1000);
        const retrieved = this.get(originalKey);
        const success = retrieved && retrieved.key === originalKey;
        console.log(`  Storage test: ${success ? '✅' : '❌'}`);
      });
    }
  };

  // Batched server call manager
  window.BatchManager = {
    pending: {},
    batchDelay: 50, // 50ms delay to batch similar calls
    
    // Batch similar calls together
    batch: function(batchKey, serverFunction, params) {
      return new Promise((resolve, reject) => {
        if (!this.pending[batchKey]) {
          this.pending[batchKey] = {
            requests: [],
            timer: null
          };
        }
        
        this.pending[batchKey].requests.push({ resolve, reject, params });
        
        // Clear existing timer and set new one
        if (this.pending[batchKey].timer) {
          clearTimeout(this.pending[batchKey].timer);
        }
        
        this.pending[batchKey].timer = setTimeout(() => {
          this.executeBatch(batchKey, serverFunction);
        }, this.batchDelay);
      });
    },
    
    executeBatch: function(batchKey, serverFunction) {
      const batch = this.pending[batchKey];
      if (!batch || batch.requests.length === 0) return;
      
      console.log(`Executing batch: ${batchKey} (${batch.requests.length} requests)`);
      
      // For now, execute the first request (can be enhanced for true batching)
      const firstRequest = batch.requests[0];
      
      google.script.run
        .withSuccessHandler(result => {
          // Resolve all pending requests with the same result
          batch.requests.forEach(req => req.resolve(result));
        })
        .withFailureHandler(error => {
          batch.requests.forEach(req => req.reject(error));
        })[serverFunction](firstRequest.params);
      
      delete this.pending[batchKey];
    }
  };

  // Enhanced server call wrapper with caching
  window.cachedServerCall = function(functionName, params, cacheKey, customTTL) {
    return new Promise((resolve, reject) => {
      // Try cache first
      const cached = window.AppCache.get(cacheKey);
      if (cached) {
        resolve(cached);
        return;
      }
      
      // Make server call
      const startTime = Date.now();
      console.log(`Server call START: ${functionName}`);
      
      google.script.run
        .withSuccessHandler(result => {
          const duration = Date.now() - startTime;
          console.log(`Server call SUCCESS: ${functionName} (${duration}ms)`);
          
          // Cache the result
          window.AppCache.set(cacheKey, result, customTTL);
          resolve(result);
        })
        .withFailureHandler(error => {
          const duration = Date.now() - startTime;
          console.log(`Server call ERROR: ${functionName} (${duration}ms)`, error);
          reject(error);
        })[functionName](params);
    });
  };

  // Preload commonly used data
  window.preloadCommonData = function() {
    console.log('Preloading common data...');
    
    // Preload products (most frequently accessed)
    if (window.getCurrentUser && window.getCurrentUser()) {
      cachedServerCall('getProducts', null, 'products')
        .then(() => console.log('Products preloaded'))
        .catch(() => console.log('Failed to preload products'));
      
      // Preload accounts
      cachedServerCall('getExpenseAccounts', null, 'expenseAccounts')
        .then(() => console.log('Expense accounts preloaded'))
        .catch(() => console.log('Failed to preload expense accounts'));
      
      // Preload payment sources
      cachedServerCall('getPaymentSources', null, 'paymentSources')
        .then(() => console.log('Payment sources preloaded'))
        .catch(() => console.log('Failed to preload payment sources'));
    }
  };

  // Debounced function creator
  window.debounce = function(func, wait, immediate) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        timeout = null;
        if (!immediate) func.apply(this, args);
      };
      const callNow = immediate && !timeout;
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
      if (callNow) func.apply(this, args);
    };
  };

  // Throttled function creator
  window.throttle = function(func, limit) {
    let inThrottle;
    return function() {
      const args = arguments;
      const context = this;
      if (!inThrottle) {
        func.apply(context, args);
        inThrottle = true;
        setTimeout(() => inThrottle = false, limit);
      }
    };
  };

  // Performance monitoring
  window.PerformanceMonitor = {
    metrics: {},
    
    startTimer: function(name) {
      this.metrics[name] = { start: Date.now() };
    },
    
    endTimer: function(name) {
      if (this.metrics[name]) {
        this.metrics[name].duration = Date.now() - this.metrics[name].start;
        console.log(`Performance: ${name} took ${this.metrics[name].duration}ms`);
      }
    },
    
    getMetrics: function() {
      return this.metrics;
    }
  };

  // Initialize performance optimizations on DOM ready
  document.addEventListener('DOMContentLoaded', function() {
    // Clear cache on logout
    const originalLogout = window.doLogout;
    if (originalLogout) {
      window.doLogout = function() {
        window.AppCache.clear();
        originalLogout.apply(this, arguments);
      };
    }
  });
  
  // Preload commonly used data
  window.preloadCommonData = function() {
    if (window.preloadInProgress) {
      console.log('Preloading already in progress, skipping...');
      return;
    }
    
    window.preloadInProgress = true;
    console.log('Preloading common data for better performance');
    
    // Preload products (most frequently accessed)
    if (!window.AppCache.get('products')) {
      console.log('Preloading products...');
      google.script.run
        .withSuccessHandler((data) => {
          try {
            const products = JSON.parse(data);
            window.AppCache.set('products', products, 300000); // 5 minutes
            console.log('Products preloaded and cached');
          } catch (error) {
            console.error('Error preloading products:', error);
          }
        })
        .withFailureHandler((error) => {
          console.error('Failed to preload products:', error);
        })
        .getProducts();
    }
    
    // Preload expense accounts
    if (!window.AppCache.get('expenseAccounts')) {
      console.log('Preloading expense accounts...');
      google.script.run
        .withSuccessHandler((accounts) => {
          window.AppCache.set('expenseAccounts', accounts, 1800000); // 30 minutes
          console.log('Expense accounts preloaded and cached');
        })
        .withFailureHandler((error) => {
          console.error('Failed to preload expense accounts:', error);
        })
        .getExpenseAccounts();
    }
    
    // Preload payment sources
    if (!window.AppCache.get('paymentSources')) {
      console.log('Preloading payment sources...');
      google.script.run
        .withSuccessHandler((payments) => {
          window.AppCache.set('paymentSources', payments, 1800000); // 30 minutes
          console.log('Payment sources preloaded and cached');
        })
        .withFailureHandler((error) => {
          console.error('Failed to preload payment sources:', error);
        })
        .getInvestmentAccounts();
    }
    
    // Preload outlets if user has access
    if (!window.AppCache.get('outlets')) {
      console.log('Preloading outlets...');
      google.script.run
        .withSuccessHandler((outlets) => {
          window.AppCache.set('outlets', outlets, 1800000); // 30 minutes
          console.log('Outlets preloaded and cached');
          setTimeout(() => { window.preloadInProgress = false; }, 1000); // Reset flag after completion
        })
        .withFailureHandler((error) => {
          console.error('Failed to preload outlets:', error);
          setTimeout(() => { window.preloadInProgress = false; }, 1000); // Reset flag even on failure
        })
        .getOutlets();
    } else {
      // If no additional preloading needed, reset flag
      setTimeout(() => { window.preloadInProgress = false; }, 1000);
    }
  };
  
  // Auto-preload on page load
  document.addEventListener('DOMContentLoaded', function() {
    // For page-refresh: fire payment methods fetch as soon as LoginState is available
    setTimeout(function() {
      if (window.LoginState && window.LoginState.user) {
        if (typeof window.initPaymentMethodsCache === 'function') {
          window.initPaymentMethodsCache();
        }
      }
    }, 300);

    // General data preload after app fully initializes
    setTimeout(() => {
      if (window.LoginState?.user && !window.preloadInProgress) {
        window.preloadCommonData();
      }
    }, 2000);
  });
</script>
