<style>
  /* ── Admin Shell Layout ────────────────────────────────────── */
  .admin-shell {
    display: flex;
    align-items: flex-start;
    min-height: 80vh;
    gap: 0;
  }

  /* Left sidebar */
  .admin-sidebar {
    width: 200px;
    flex-shrink: 0;
    background: #1e293b;
    border-radius: 12px 0 0 12px;
    display: flex;
    flex-direction: column;
    padding: 16px 0 16px;
    min-height: 80vh;
  }

  .admin-sidebar-title {
    font-size: 0.7em;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #94a3b8;
    padding: 0 16px 12px;
    border-bottom: 1px solid #334155;
    margin-bottom: 8px;
  }

  .admin-nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: none;
    border: none;
    color: #cbd5e1;
    font-size: 0.88em;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    width: 100%;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .admin-nav-btn:hover {
    background: #334155;
    color: #f1f5f9;
  }
  .admin-nav-btn.active {
    background: #334155;
    color: #ffffff;
    border-left-color: #5066e0;
  }
  .admin-nav-btn .nav-icon { font-size: 1.1em; }

  .admin-sidebar-spacer { flex: 1; }

  .admin-back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 12px 0;
    padding: 9px 14px;
    background: #5066e0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .admin-back-btn:hover { background: #3a4fc4; }

  /* Content pane */
  .admin-content {
    flex: 1;
    min-width: 0;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-left: none;
    border-radius: 0 12px 12px 0;
    padding: 20px;
    min-height: 80vh;
  }

  .admin-tab-pane { display: none; }
  .admin-tab-pane.active { display: block; }

  /* Admin sub-nav inside main sidebar */
  .sidebar-tabs .admin-sidebar-title {
    font-size: 0.7em;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #94a3b8;
    padding: 8px 16px 10px;
    border-bottom: 1px solid #334155;
    margin-bottom: 4px;
  }
  .sidebar-tabs .admin-nav-btn {
    display: flex !important;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: none;
    border: none;
    color: #cbd5e1;
    font-size: 0.88em;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    width: 100%;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-tabs .admin-nav-btn:hover {
    background: #334155;
    color: #f1f5f9;
  }
  .sidebar-tabs .admin-nav-btn.active {
    background: #334155;
    color: #ffffff;
    border-left-color: #5066e0;
  }
  .sidebar-tabs .admin-back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 12px 12px 8px;
    padding: 9px 14px;
    background: #5066e0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 700;
    cursor: pointer;
    width: calc(100% - 24px);
  }
  .sidebar-tabs .admin-back-btn:hover { background: #3a4fc4; }

  /* Admin / Checklist sub-nav inside main sidebar scroll area */
  .sidebar-tabs .admin-nav-btn,
  .sidebar-tabs .cl-nav-btn {
    display: flex !important;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: none;
    border: none;
    color: #cbd5e1;
    font-size: 0.88em;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    width: 100%;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .sidebar-tabs .cl-nav-btn { color: #ccfbf1; }
  .sidebar-tabs .admin-nav-btn:hover,
  .sidebar-tabs .cl-nav-btn:hover { background: #334155; color: #f1f5f9; }
  .sidebar-tabs .cl-nav-btn:hover { background: #115e59; color: #fff; }
  .sidebar-tabs .admin-nav-btn.active { background: #334155; color: #fff; border-left-color: #5066e0; }
  .sidebar-tabs .cl-nav-btn.active { background: #115e59; color: #fff; border-left-color: #5eead4; }

  /* In-panel admin sub-tab bar (always visible in main content) */
  .admin-top-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid #e2e8f0;
  }
  .admin-top-nav-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #475569;
    font-size: 0.88em;
    font-weight: 600;
    cursor: pointer;
  }
  .admin-top-nav-btn:hover { background: #f1f5f9; }
  .admin-top-nav-btn.active {
    background: #5066e0;
    color: #fff;
    border-color: #5066e0;
  }

  @media (max-width: 700px) {
    .admin-shell { flex-direction: column; }
    .admin-sidebar {
      width: 100%;
      border-radius: 12px 12px 0 0;
      flex-direction: row;
      flex-wrap: wrap;
      min-height: unset;
      padding: 8px;
      gap: 4px;
    }
    .admin-sidebar-title { display: none; }
    .admin-nav-btn { width: auto; border-left: none; border-bottom: 3px solid transparent; padding: 8px 12px; font-size: 0.8em; }
    .admin-nav-btn.active { border-bottom-color: #5066e0; border-left: none; }
    .admin-sidebar-spacer { display: none; }
    .admin-back-btn { margin: 4px; }
    .admin-content { border-left: 1px solid #e2e8f0; border-radius: 0 0 12px 12px; }
  }
  /* ─────────────────────────────────────────────────────────── */
</style>

<script>
  function adminT(key) {
    return (typeof t === 'function') ? (t(key) || key) : key;
  }

  function adminTf(key, vars) {
    var s = adminT(key);
    if (vars) {
      Object.keys(vars).forEach(function(k) {
        s = s.replace('{' + k + '}', vars[k]);
      });
    }
    return s;
  }

  function buildAdminSidebarHtml() {
    return `
        <div class="admin-sidebar-title">⚙️ ${adminT('adminPanelTitle')}</div>
        <button class="admin-nav-btn active" onclick="switchAdminTab('orders')" id="admin-nav-orders">
          <span>📋</span> ${adminT('adminNavOrders')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('products')" id="admin-nav-products">
          <span>📦</span> ${adminT('adminNavProducts')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('checklistdefs')" id="admin-nav-checklistdefs">
          <span>📁</span> ${adminT('adminNavChecklists')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('checklistquestions')" id="admin-nav-checklistquestions">
          <span>❓</span> ${adminT('adminNavChecklistQuestions')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('smartpicks')" id="admin-nav-smartpicks">
          <span>⚡</span> ${adminT('adminNavSmartPicks')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('bomconsumption')" id="admin-nav-bomconsumption">
          <span>🧾</span> ${adminT('adminNavBomConsumption')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('people')" id="admin-nav-people">
          <span>👥</span> ${adminT('adminNavPeople')}
        </button>
        <button class="admin-nav-btn" onclick="switchAdminTab('printer')" id="admin-nav-printer">
          <span>🖨️</span> ${adminT('adminNavPrinters')}
        </button>
        <button class="admin-back-btn" onclick="adminGoToSelling()">${adminT('adminBackSelling')}</button>
      `;
  }

  function mountAdminSidebarNav() {
    if (window.SnowbeeSidebarModes && typeof window.SnowbeeSidebarModes.setTabsHtml === 'function') {
      window.SnowbeeSidebarModes.setTabsHtml(buildAdminSidebarHtml());
      return;
    }
    var sidebarNav = document.getElementById('sidebarNav');
    if (!sidebarNav) return;
    if (!window._sellingNavHTML) window._sellingNavHTML = sidebarNav.innerHTML;
    sidebarNav.classList.remove('collapsed');
    document.body.classList.remove('sidebar-collapsed');
    var tabsContainer = sidebarNav.querySelector('.sidebar-tabs');
    if (tabsContainer) {
      tabsContainer.innerHTML = buildAdminSidebarHtml();
    } else {
      sidebarNav.innerHTML = buildAdminSidebarHtml();
    }
  }
  window.mountAdminSidebarNav = mountAdminSidebarNav;

  window.refreshAdminPanelI18n = function() {
    if ((window.currentTab || activeTab) !== 'adminOrders') return;
    var activeSub = window._activeAdminTab || 'orders';
    mountAdminSidebarNav();
    if (typeof showAdminOrdersTab === 'function') {
      showAdminOrdersTab();
      setTimeout(function() {
        if (typeof switchAdminTab === 'function') switchAdminTab(activeSub);
      }, 30);
    }
  };

  function showAdminOrdersTab() {
    console.log('Admin Orders: showAdminOrdersTab called');

    // Check authentication
    if (!window.SecurityWrapper || !window.SecurityWrapper.isUserAuthenticated()) {
      getElem('main').innerHTML = '<div style="padding:20px; text-align:center;">' + adminT('adminPleaseLogin') + '</div>';
      return;
    }

    // Hide the order queue sidebar & floating cart
    var oqs = document.getElementById('orderQueueSidebar');
    if (oqs) oqs.style.display = 'none';
    var floatingCart = document.getElementById('floatingCart');
    if (floatingCart) floatingCart.style.display = 'none';

    // Replace sidebar tabs with admin sub-navigation (keep toggle, user, controls)
    mountAdminSidebarNav();

    // Create the admin orders HTML structure (content area only, no sidebar)
    const adminOrdersHTML = `
      <div class="admin-content" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;min-height:80vh;">

          <div class="admin-top-nav" id="admin-top-nav">
            <button type="button" class="admin-top-nav-btn active" data-tab="orders" onclick="switchAdminTab('orders')">📋 ${adminT('adminNavOrders')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="products" onclick="switchAdminTab('products')">📦 ${adminT('adminNavProducts')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="checklistdefs" onclick="switchAdminTab('checklistdefs')">📁 ${adminT('adminNavChecklists')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="checklistquestions" onclick="switchAdminTab('checklistquestions')">❓ ${adminT('adminNavChecklistQuestions')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="smartpicks" onclick="switchAdminTab('smartpicks')">⚡ ${adminT('adminNavSmartPicks')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="bomconsumption" onclick="switchAdminTab('bomconsumption')">🧾 ${adminT('adminNavBomConsumption')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="people" onclick="switchAdminTab('people')">👥 ${adminT('adminNavPeople')}</button>
            <button type="button" class="admin-top-nav-btn" data-tab="printer" onclick="switchAdminTab('printer')">🖨️ ${adminT('adminNavPrinters')}</button>
          </div>

          <!-- ORDERS TAB -->
          <div class="admin-tab-pane active" id="admin-pane-orders">
            <h3 style="margin-top:0;">📋 ${adminT('adminOrdersH')}</h3>
            <div class="admin-filters">
              <div class="filter-group">
                <label for="admin-from-date">${adminT('adminFrom')}</label>
                <input type="date" id="admin-from-date">
              </div>
              <div class="filter-group">
                <label for="admin-to-date">${adminT('adminTo')}</label>
                <input type="date" id="admin-to-date">
              </div>
              <div class="filter-group">
                <label for="admin-outlet-filter">${adminT('adminOutletLabel')}</label>
                <select id="admin-outlet-filter">
                  <option value="">${adminT('adminAllOutlets')}</option>
                </select>
              </div>
              <button onclick="fetchAdminOrders()" class="fetch-btn">${adminT('adminFetchOrders')}</button>
              <button onclick="clearGlobalCache()" class="btn-clear-cache" style="margin-left:10px;">${adminT('adminClearCache')}</button>
            </div>

            <div class="search-section" style="margin:15px 0;display:none;" id="search-section">
              <div class="filter-group">
                <label for="quick-search">${adminT('adminQuickSearch')}</label>
                <input type="text" id="quick-search" placeholder="${adminT('adminQuickSearch')}" onkeyup="filterOrders()">
                <button onclick="clearSearch()" class="btn-clear" style="margin-left:10px;">${adminT('adminClear')}</button>
              </div>
            </div>

            <div id="admin-orders-list">
              <p style="text-align:center;padding:20px;">${adminT('adminClickFetch')}</p>
            </div>

            <div id="bulk-save-bar" style="display:none;position:sticky;bottom:0;background:#fff3cd;border-top:2px solid #ffc107;padding:10px 15px;text-align:right;z-index:20;">
              <span id="changes-count" style="margin-right:15px;font-weight:bold;color:#856404;">0 ${adminT('adminChanges')}</span>
              <button onclick="discardAllChanges()" style="background:#6c757d;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;margin-right:8px;">${adminT('adminDiscard')}</button>
              <button onclick="saveAllChanges()" style="background:#28a745;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold;">${adminT('adminSaveAll')}</button>
            </div>
          </div>

          <!-- PRODUCTS TAB -->
          <div class="admin-tab-pane" id="admin-pane-products">
            <!-- Sub-tab toggle -->
            <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;padding-bottom:10px;">
              <button id="prod-tab-create" onclick="switchProductsView('create')" style="padding:8px 18px;border-radius:8px;border:none;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;font-size:0.9em;">${adminT('adminCreateTab')}</button>
              <button id="prod-tab-browse" onclick="switchProductsView('browse')" style="padding:8px 18px;border-radius:8px;border:none;background:#f1f5f9;color:#475569;font-weight:700;cursor:pointer;font-size:0.9em;">${adminT('adminBrowseTab')}</button>
            </div>

            <!-- CREATE VIEW -->
            <div id="prod-create-view">
            <h3 style="margin-top:0;">📦 ${adminT('adminCreateProductH')}</h3>

            <!-- Type toggle -->
            <div style="display:flex;gap:8px;margin-bottom:14px;">
              <button id="prodTypeSell" onclick="setProductType('Sell')" style="padding:7px 22px;border-radius:20px;border:2px solid #16a34a;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;">${adminT('adminTypeSell')}</button>
              <button id="prodTypeBuy" onclick="setProductType('Buy')" style="padding:7px 22px;border-radius:20px;border:2px solid #ccc;background:#fff;color:#6b7280;font-weight:700;cursor:pointer;">${adminT('adminTypeBuy')}</button>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="productFormGrid">
              <div style="grid-column:span 2;">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminProductName')}</label>
                <input id="pf-name" type="text" placeholder="${adminT('adminPlaceholderProductName')}" oninput="updateProductCodePreview()"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div>
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminCategory')}</label>
                <div style="display:flex;gap:6px;">
                  <select id="pf-category" oninput="updateProductCodePreview()" onchange="updateProductCodePreview()"
                    style="flex:1;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                    <option value="">${adminT('adminSelectCreate')}</option>
                  </select>
                  <button onclick="promptNewCategory()" title="${adminT('adminNewCategory')}"
                    style="padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;background:#f9fafb;cursor:pointer;font-size:0.9em;">+</button>
                </div>
              </div>
              <div id="pf-navcategory-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminNavCategory')}</label>
                <div style="display:flex;gap:6px;">
                  <select id="pf-navcategory"
                    style="flex:1;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                    <option value="">${adminT('adminSelectCreate')}</option>
                  </select>
                  <button onclick="promptNewNavCategory()" title="${adminT('adminNewNavCategory')}"
                    style="padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;background:#f9fafb;cursor:pointer;font-size:0.9em;">+</button>
                </div>
              </div>
              <div style="grid-column:span 2;">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminProductCode')}</label>
                <input id="pf-productcode" type="text" readonly placeholder="${adminT('adminCodeAutoHint')}"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;background:#f3f4f6;font-family:monospace;color:#374151;">
              </div>
              <div id="pf-price-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminSellPrice')}</label>
                <input id="pf-price" type="number" min="0" step="0.01" placeholder="0.00"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div id="pf-buyprice-row">
                <label id="pf-buyprice-label" style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminBuyPrice')}</label>
                <input id="pf-buyprice" type="number" min="0" step="0.01" placeholder="0.00"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div>
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminSupplier')}</label>
                <div style="display:flex;gap:6px;">
                  <select id="pf-supplier"
                    style="flex:1;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                    <option value="">${adminT('adminSelectSupplier')}</option>
                  </select>
                  <button onclick="promptNewSupplier()" title="${adminT('adminNewSupplier')}"
                    style="padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;background:#f9fafb;cursor:pointer;font-size:0.9em;">+</button>
                </div>
              </div>
              <div>
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('outlet')}</label>
                <select id="pf-outlet"
                  style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                  <option value="">${adminT('adminAllOutlets')}</option>
                </select>
              </div>
              <div id="pf-sellunit-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminSellUnit')}</label>
                <input id="pf-sellunit" type="text" placeholder="${adminT('adminPlaceholderSellUnit')}"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div id="pf-unitsforselling-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminUnitsForSelling')}</label>
                <input id="pf-unitsforselling" type="number" min="0" step="1" placeholder="1"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div id="pf-mode-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminMode')}</label>
                <select id="pf-mode"
                  style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                  <option value="N">${adminT('adminModeNormal')}</option>
                  <option value="L">${adminT('adminModeLocal')}</option>
                  <option value="LO">${adminT('adminModeLocalOnly')}</option>
                </select>
              </div>
              <div id="pf-quantityvariable-row">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminQtyVariable')}</label>
                <select id="pf-quantityvariable"
                  style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                  <option value="">${adminT('adminNo')}</option>
                  <option value="Y">${adminT('adminYes')}</option>
                </select>
              </div>
              <div id="pf-imagefileid-row" style="grid-column:span 2;">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminImageFileId')}</label>
                <input id="pf-imagefileid" type="text" placeholder="${adminT('adminImageOptional')}"
                  style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
              </div>
              <div id="pf-parent-row" style="grid-column:span 2;">
                <label style="font-size:0.82em;font-weight:600;color:#374151;">${adminT('adminParentProduct')}</label>
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                  <select id="pf-parentproductcode"
                    style="flex:1;min-width:160px;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                    <option value="">${adminT('adminNone')}</option>
                  </select>
                  <input id="pf-unitsperparent" type="number" min="0" step="0.001" placeholder="${adminT('adminUnitsPerParent')}"
                    style="width:140px;padding:7px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:0.9em;">
                  <button onclick="showInlineBuyProductForm()" title="${adminT('adminQuickBuy')}"
                    style="padding:7px 12px;background:#0369a1;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:0.85em;white-space:nowrap;">${adminT('adminNewBuyInline')}</button>
                </div>
              </div>
              <div id="pf-cooking-row" style="grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">

  function loadOutlets() {
    console.log('Admin Orders: Loading outlets...');
    
    // Show loading state in outlet dropdown
    const outletFilter = getElem('admin-outlet-filter');
    if (outletFilter) {
      outletFilter.innerHTML = '<option value="">' + adminT('adminLoadingOutlets') + '</option>';
    }
    
    // Direct call to load outlets without testing connection first
    SecurityWrapper.secureServerCall('getOutletsForAdminSecure', {})
      .then(response => {
        console.log('Admin Orders: Outlets response:', response);
        handleOutletsResponse(response);
      })
      .catch(error => {
        console.error('Admin Orders: Error loading outlets:', error);
        
        // Reset dropdown on error
        if (outletFilter) {
          outletFilter.innerHTML = '<option value="">' + adminT('adminAllOutlets') + '</option>';
        }
        
        // Retry once after a short delay
        setTimeout(() => {
          console.log('Admin Orders: Retrying outlet load...');
          SecurityWrapper.secureServerCall('getOutletsForAdminSecure', {})
            .then(response => {
              console.log('Admin Orders: Retry outlets response:', response);
              handleOutletsResponse(response);
            })
            .catch(retryError => {
              console.error('Admin Orders: Retry failed:', retryError);
              showError(adminT('adminFailedLoadOutlets') + ' ' + retryError.message);
            });
        }, 1000);
      });
  }

  function testServerConnection() {
    console.log('Admin Orders: Testing server connection...');
    
    return SecurityWrapper.secureServerCall('testAdminConnection', {})
      .then(response => {
        console.log('Admin Orders: Test connection response:', response);
        
        if (!response || !response.success) {
          throw new Error('Server connection test failed');
        }
        
        return response;
      });

  function handleOutletsResponse(response) {
    console.log('Admin Orders: Processing outlets response:', response);
    
    const outletFilter = getElem('admin-outlet-filter');
    if (!outletFilter) {
      // Admin panel was closed before response arrived — ignore
      return;
    }

    if (!response || !response.success) {
      console.error('Admin Orders: Invalid outlets response:', response);
      outletFilter.innerHTML = '<option value="">' + adminT('adminAllOutlets') + '</option>';
      showError(adminT('adminErrorLoadingOutlets') + ' ' + (response ? response.error : adminT('adminNoResponse')));
      return;
    }

    // Clear existing options
    outletFilter.innerHTML = '<option value="">' + adminT('adminAllOutlets') + '</option>';

    // Add outlet options - handle different response formats
    let outlets = [];
    if (response.data && Array.isArray(response.data)) {
      outlets = response.data;
    } else if (response.data && Array.isArray(response.data.outlets)) {
      outlets = response.data.outlets;
    } else if (response.outlets && Array.isArray(response.outlets)) {
      outlets = response.outlets;
    } else {
      console.warn('Admin Orders: No outlets data in response');
    }

    outlets = outlets.map(function(o) {
      if (typeof o === 'string') return o.trim();
      if (o && o.name) return String(o.name).trim();
      return '';
    }).filter(Boolean);

    if (outlets.length === 0 && window.LoginState && window.LoginState.outlet) {
      outlets = [String(window.LoginState.outlet).trim()];
    }

    if (outlets.length === 0) {
      console.warn('Admin Orders: No outlets found');
      return;
    }

    outlets.forEach(outlet => {
      const option = document.createElement('option');
      const name = (typeof outlet === 'string') ? outlet : (outlet.name || outlet);
      option.value = name;
      option.textContent = name;
      outletFilter.appendChild(option);
    });

    // Also populate printer outlet select with all outlets
    const printerOutletSel = document.getElementById('printer-outlet-select');
    if (printerOutletSel) {
      printerOutletSel.innerHTML = '<option value="">' + adminT('adminSelectOutlet') + '</option>';
      outlets.forEach(outlet => {
        const option = document.createElement('option');
        const name = (typeof outlet === 'string') ? outlet : (outlet.name || outlet);
        option.value = name;
        option.textContent = name;
        printerOutletSel.appendChild(option);
      });
    }
    
    console.log('Admin Orders: Successfully loaded', outlets.length, 'outlets');
  }

  function fetchAdminOrders() {
    console.log('Admin Orders: Fetching orders...');
    
    const fromDate = getElem('admin-from-date').value;
    const toDate = getElem('admin-to-date').value;
    const outlet = getElem('admin-outlet-filter').value;

    if (!fromDate || !toDate) {
      showError(adminT('adminSelectDates'));
      return;
    }

    const params = {
      fromDate: fromDate,
      toDate: toDate,
      outlet: outlet
    };

    console.log('Admin Orders: Calling getOrdersForAdminSecure with params:', params);
    console.log('Admin Orders: Outlet value:', "'" + outlet + "'", 'Type:', typeof outlet, 'Length:', outlet ? outlet.length : 'null/undefined');

    // Show loading state
    const container = getElem('admin-orders-list');
    container.innerHTML = '<p style="text-align: center; padding: 20px;">' + adminT('adminLoadingOrders') + '</p>';

    SecurityWrapper.secureServerCall('getOrdersForAdminSecure', params)
      .then(response => {
        console.log('Admin Orders: Orders response:', response);
        renderAdminOrders(response);
      })
      .catch(error => {
        console.error('Admin Orders: Error fetching orders:', error);
        showError(adminT('adminErrorFetchingOrders') + ' ' + error.message);
      });
  }

  function renderAdminOrders(response) {
    const container = getElem('admin-orders-list');
    
    if (!response || !response.success) {
      container.innerHTML = '<div class="error-message">' + (response ? response.error : adminT('adminNoResponse')) + '</div>';
      return;
    }

    let orders;
    try {
      orders = typeof response.orders === 'string' ? JSON.parse(response.orders) : response.orders;
    } catch (e) {
      container.innerHTML = '<div class="error-message">' + adminT('adminParseFailed') + '</div>';
      return;
    }

    if (!Array.isArray(orders) || orders.length === 0) {
      container.innerHTML = '<p style="text-align: center; padding: 20px;">' + adminT('adminNoOrdersFound') + '</p>';
      return;
    }

    window.adminOrdersData = orders;
    window._orderChanges = {};

  function onCellChange(el) {
    var idx = parseInt(el.getAttribute('data-idx'));
    var field = el.getAttribute('data-field');
    var order = window.adminOrdersData[idx];
    if (!order) return;

    var newVal = parseFloat(el.value) || 0;

    // Compare to original
    var origVal = order[field];
    var changed = (newVal !== origVal);

    // Init change record for this row
    if (!window._orderChanges[idx]) {
      window._orderChanges[idx] = { rowIndex: order.rowIndex };
    }

    if (changed) {
      window._orderChanges[idx][field] = newVal;
      el.parentElement.classList.add('cell-changed');
    } else {
      delete window._orderChanges[idx][field];
      el.parentElement.classList.remove('cell-changed');
      // If only rowIndex left, remove the change entry
      var keys = Object.keys(window._orderChanges[idx]);
      if (keys.length === 1 && keys[0] === 'rowIndex') {
        delete window._orderChanges[idx];
      }
    }

    // Recalculate total for this row
    if (field === 'qty' || field === 'price') {
      var row = document.getElementById('order-row-' + idx);
      var qtyInput = row.querySelector('input[data-field="qty"]');
      var priceInput = row.querySelector('input[data-field="price"]');
      var qty = parseFloat(qtyInput.value) || 0;
      var price = parseFloat(priceInput.value) || 0;
      var total = qty * price;
      document.getElementById('total-' + idx).textContent = formatCurrency(total);
      // Store total in changes
      if (window._orderChanges[idx]) {
        window._orderChanges[idx].total = total;
      }
    }

    // Highlight row
    var tr = document.getElementById('order-row-' + idx);
    if (window._orderChanges[idx]) {
      tr.classList.add('row-changed');
    } else {
      tr.classList.remove('row-changed');
    }

    updateSaveBar();
  }

  function updateSaveBar() {
    var count = Object.keys(window._orderChanges || {}).length;
    var bar = getElem('bulk-save-bar');
    var countEl = getElem('changes-count');
    if (count > 0) {
      bar.style.display = 'block';
      countEl.textContent = adminTf('adminRowsChanged', { count: count });
    } else {
      bar.style.display = 'none';
    }

  function saveAllChanges() {
    var changes = window._orderChanges || {};
    var arr = [];
    Object.keys(changes).forEach(function(idx) {
      arr.push(changes[idx]);
    });
    if (arr.length === 0) return;

    showConfirm(adminTf('adminSaveConfirm', { count: arr.length }), function() {
    var container = getElem('admin-orders-list');
    container.innerHTML = '<p style="text-align:center;padding:20px;">' + adminTf('adminSavingNChanges', { count: arr.length }) + '</p>';
    getElem('bulk-save-bar').style.display = 'none';

    SecurityWrapper.secureServerCall('bulkUpdateOrdersSecure', { changes: arr })
      .then(function(response) {
        if (response && response.success) {
          var msg = adminTf('adminUpdatedRows', { updated: response.updated, total: response.total });
          if (response.errors && response.errors.length > 0) msg += ' ' + adminT('adminErrorPrefix') + ' ' + response.errors.join(', ');

    if (!Array.isArray(items) || items.length === 0) {
      return '<span class="no-items">' + adminT('noItems').replace(/<[^>]+>/g, '') + '</span>';
    }

    let html = '<div class="order-items">';
    items.forEach(item => {
      html += `<div class="order-item">${item.qty || 1}x ${item.name} @ ${formatCurrency(item.price)}</div>`;
    });
    html += '</div>';
    
    return html;
  }

  function renderOrderItemNames(items) {
    if (!Array.isArray(items) || items.length === 0) {

    return items.map(item => item.name).join(', ');

  function getOrderTotalQty(items) {
    if (!Array.isArray(items) || items.length === 0) {
      return 0;
    }
    return items.reduce((total, item) => total + (item.qty || 0), 0);
  }

  function getOrderTotalPrice(items) {
    if (!Array.isArray(items) || items.length === 0) {
      return 0;
    }
    return items.reduce((total, item) => total + ((item.price || 0) * (item.qty || 0)), 0);
  }

  function filterOrders() {
    const searchTerm = getElem('quick-search').value.toLowerCase();
    const table = document.querySelector('.admin-orders-table tbody');
    
    if (!table) return;
    
    const rows = table.querySelectorAll('tr');
    let visibleCount = 0;
    
    rows.forEach(row => {
      const itemName = row.getAttribute('data-item-name') || '';
      const payment = row.getAttribute('data-payment') || '';
      const cells = row.querySelectorAll('td');
      
      // Search in item name and payment type
      const shouldShow = itemName.includes(searchTerm) || 
                        payment.includes(searchTerm) ||
                        searchTerm === '';
      
      if (shouldShow) {
        row.style.display = '';
        visibleCount++;
      } else {
        row.style.display = 'none';
      }
    });
    
    // Update search info
    updateSearchInfo(visibleCount, rows.length);

  function loadPrinterOutlets() {
    // Pre-select the current user's outlet in the printer dropdown.

    var sel = document.getElementById('printer-outlet-select');
    if (!sel) return;
    var userOutlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    if (userOutlet && sel.querySelector('option[value="' + userOutlet + '"]')) {
      sel.value = userOutlet;
    } else if (userOutlet) {
      // Fallback: add it if somehow missing
      var opt = document.createElement('option');
      opt.value = userOutlet;
      opt.textContent = userOutlet;
      opt.selected = true;
      sel.appendChild(opt);
    }
    loadAutoPrintForSelectedOutlet();
  }

  function loadAutoPrintForSelectedOutlet() {
    var sel = document.getElementById('printer-outlet-select');
    var cb = document.getElementById('printer-auto-print-cb');
    var pinSel = document.getElementById('printer-drawer-pin-select');
    if (!cb) return;
    var outlet = sel ? sel.value : '';
    if (!outlet) {
      cb.checked = false;
      cb.disabled = true;
      if (pinSel) { pinSel.disabled = true; pinSel.value = 'both'; }
      var pinInp0 = document.getElementById('drawer-unlock-pin-input');
      var saveBtn0 = document.getElementById('drawer-unlock-save-btn');
      var actBtn0 = document.getElementById('drawer-unlock-activate-btn');
      if (pinInp0) { pinInp0.disabled = true; pinInp0.value = ''; }
      if (saveBtn0) saveBtn0.disabled = true;
      if (actBtn0) actBtn0.disabled = true;
      loadDrawerUnlockAdminStatus();
      return;
    }
    cb.disabled = false;
    if (pinSel) pinSel.disabled = false;
    var pinInp = document.getElementById('drawer-unlock-pin-input');
    var saveBtn = document.getElementById('drawer-unlock-save-btn');
    var actBtn = document.getElementById('drawer-unlock-activate-btn');
    if (pinInp) pinInp.disabled = false;
    if (saveBtn) saveBtn.disabled = false;
    if (actBtn) actBtn.disabled = false;
    if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) return;
    SecurityWrapper.secureServerCall('getOutletPrinterSecure', { outlet: outlet })
      .then(function(res) {
        cb.checked = !!(res && res.printer && res.printer.autoPrint);
        var pin = (res && res.printer && res.printer.drawerPin) ? res.printer.drawerPin : 'both';
        if (pinSel) pinSel.value = pin;
        localStorage.setItem('outletDrawerPin_' + outlet, pin);
      })
      .catch(function() {
        cb.checked = false;
        if (pinSel) {
          var cached = localStorage.getItem('outletDrawerPin_' + outlet) || 'both';
          pinSel.value = cached;
        }
      });
    loadDrawerUnlockAdminStatus();

          statusEl.textContent = adminT('adminDrawerUnlockStatusNoPin');

          statusEl.textContent = adminTf('adminDrawerUnlockStatusActive', { until: new Date(res.activeUntil).toLocaleString() });
        } else {
          statusEl.textContent = adminT('adminDrawerUnlockStatusInactive');

  function adminSetupPrinterBT() {
    var outlet = document.getElementById('printer-outlet-select').value;
    if (!outlet) { showPrinterMsg(adminT('adminSelectOutletFirst'), 'error'); return; }

    // ---- Native Android WebView bridge (preferred) ----
    if (window.AndroidPrint && typeof window.AndroidPrint.discoverPrinters === 'function') {
      showPrinterMsg(adminT('adminScanningBt'), 'info');

      var result = window.AndroidPrint.discoverPrinters();

      // Check for error
      if (typeof result === 'string' && result.indexOf('error:') === 0) {
        showPrinterMsg(result.replace('error:', ''), 'error');
        return;
      }

      // Parse the JSON array of "Name|MAC" entries
      var devices;
      try { devices = JSON.parse(result); } catch(e) { devices = []; }

      if (!devices || devices.length === 0) {
        showPrinterMsg(adminT('adminNoPairedBt'), 'error');
        return;
      }

      // Show a selection list
      var html = '<div style="font-weight:bold;margin-bottom:8px;">' + adminTf('adminFoundPairedDevices', { count: devices.length }) + '</div>';
      devices.forEach(function(entry) {
        var parts = entry.split('|');
        var name = parts[0] || adminT('adminUnknown');
        var mac = parts[1] || '';
        html += '<button onclick="adminSelectDiscoveredPrinter(\'' + name.replace(/'/g, "\\'") + '\')" ' +
          'style="display:block;width:100%;text-align:left;padding:10px 12px;margin:4px 0;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.95em;">' +
          '<strong>' + name + '</strong>' +
          (mac ? ' <span style="color:#666;font-size:0.85em;">(' + mac + ')</span>' : '') +
          '</button>';
      });

      var container = document.getElementById('printer-list');
      if (container) container.innerHTML = html;
      showPrinterMsg(adminT('adminSelectPrinterBelow'), 'success');
      return;
    }

    // ---- Fallback: Web Bluetooth API (Chrome browser — inline overlay, no popup) ----
    window._btDiscoverOutlet = outlet;
    window.closeBtDiscoverOverlay();
    var overlay = document.createElement('div');
    overlay.id = 'btDiscoverOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:99998;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;-webkit-overflow-scrolling:touch;';
    overlay.innerHTML =
      '<div style="background:#fff;border-radius:12px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);">' +
      '<h3 style="margin:0 0 8px;font-size:1.1rem;">🔍 ' + adminT('adminDiscoverPrinterTitle') + '</h3>' +
      '<p style="margin:0 0 16px;color:#64748b;font-size:0.9em;">' + adminT('adminDiscoverForOutlet') + ' <strong>' + outlet + '</strong></p>' +
      '<div id="btDiscoverStatus" style="display:none;padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:0.9em;"></div>' +
      '<button type="button" onclick="adminBtDiscoverScan()" style="display:block;width:100%;padding:14px;margin-bottom:8px;border:none;border-radius:8px;background:#007bff;color:#fff;font-size:1rem;cursor:pointer;font-weight:600;">' + adminT('adminScanForPrinters') + '</button>' +

  window.adminBtDiscoverScan = function() {

      return;

    showBtStatus(adminT('adminScanning'), 'info');
    var SVC = ['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb'];

          showBtStatus(adminT('adminCancelled'), 'info');

  function loadProductFormData() {
    SecurityWrapper.secureServerCall('getProductsForAdminSecure', {})
      .then(function(res) {
        if (!res || !res.success) { console.warn('getProductsForAdminSecure failed', res); return; }
        _pfAdminData.categories = res.categories || [];
        _pfAdminData.navCategories = res.navCategories || [];
        _pfAdminData.suppliers = res.suppliers || [];
        _pfAdminData.buyProducts = (res.products || []).filter(function(p) {
          if (!window._isProductActive(p)) return false;
          return (p['TYPE'] || p['Type'] || '').toString().toLowerCase() === 'buy';
        });
        populateProductFormDropdowns();
      })
      .catch(function(e) { console.error('loadProductFormData error', e); });

  function populateProductFormDropdowns() {
    populateSelect('pf-category', _pfAdminData.categories);
    populateSelect('pf-navcategory', _pfAdminData.navCategories);
    populateSelect('pf-supplier', _pfAdminData.suppliers);
    populateSelect('pf-buy-supplier', _pfAdminData.suppliers);
    populateSelect('pf-buy-category', _pfAdminData.categories);
    populateSelect('pf-buy-outlet', _pfAdminData.outlets || []);

    var parentSel = document.getElementById('pf-parentproductcode');
    if (parentSel) {
      parentSel.innerHTML = '<option value="">' + adminT('adminNone') + '</option>';
      _pfAdminData.buyProducts.forEach(function(p) {
        var code = p['PRODUCTCODE'] || p['ProductCode'] || '';
        var name = p['NAME'] || p['Name'] || code;
        var opt = document.createElement('option');
        opt.value = code;
        opt.textContent = name + (code ? ' (' + code + ')' : '');
        parentSel.appendChild(opt);
      });
    }

    // Populate outlets from admin outlet filter if already loaded
    var outletSel = document.getElementById('pf-outlet');
    var buyOutletSel = document.getElementById('pf-buy-outlet');
    var adminOutletSel = document.getElementById('admin-outlet-filter');
    if (adminOutletSel) {
      Array.from(adminOutletSel.options).forEach(function(opt) {
        if (opt.value) {
          if (outletSel) {
            var o = document.createElement('option');
            o.value = opt.value;
            o.textContent = opt.textContent;
            outletSel.appendChild(o);
          }
          if (buyOutletSel) {
            var o2 = document.createElement('option');
            o2.value = opt.value;
            o2.textContent = opt.textContent;
            buyOutletSel.appendChild(o2);
          }
        }
      });
    }
    // Auto-select the user's outlet
    var userOutlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    if (userOutlet) {
      [outletSel, buyOutletSel].forEach(function(sel) {
        if (!sel) return;
        if (!Array.from(sel.options).find(function(o) { return o.value === userOutlet; })) {
          var opt = document.createElement('option');
          opt.value = userOutlet; opt.textContent = userOutlet;
          sel.appendChild(opt);
        }
        sel.value = userOutlet;
      });
    }
  }

  function populateSelect(id, items) {
    var sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '<option value="">' + adminT('adminSelectCreate') + '</option>';
    (items || []).forEach(function(item) {
      var opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      sel.appendChild(opt);
    });
  }

  function generateProductCodeClient(category, name) {
    var code = ((category || '') + '_' + (name || '')).toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, '').replace(/^_+|_+$/g, '').replace(/_+/g, '_');
    return code || '';
  }

  window.updateProductCodePreview = function() {
    var cat = (document.getElementById('pf-category').value || '').trim();
    var name = (document.getElementById('pf-name').value || '').trim();
    document.getElementById('pf-productcode').value = generateProductCodeClient(cat, name);
  };

  window.updateBuyProductCodePreview = function() {
    var cat = (document.getElementById('pf-buy-category').value || '').trim();
    var name = (document.getElementById('pf-buy-name').value || '').trim();
    document.getElementById('pf-buy-productcode').value = generateProductCodeClient(cat, name);

  window.setProductType = function(type) {

      ? 'padding:7px 22px;border-radius:20px;border:2px solid #16a34a;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;'
      : 'padding:7px 22px;border-radius:20px;border:2px solid #ccc;background:#fff;color:#6b7280;font-weight:700;cursor:pointer;';
    document.getElementById('prodTypeBuy').style.cssText = !isSell
      ? 'padding:7px 22px;border-radius:20px;border:2px solid #0369a1;background:#0369a1;color:#fff;font-weight:700;cursor:pointer;'
      : 'padding:7px 22px;border-radius:20px;border:2px solid #ccc;background:#fff;color:#6b7280;font-weight:700;cursor:pointer;';

    // Show/hide sell-only rows
    ['pf-navcategory-row','pf-price-row','pf-sellunit-row','pf-unitsforselling-row','pf-mode-row','pf-quantityvariable-row','pf-imagefileid-row','pf-parent-row','pf-cooking-row'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = isSell ? '' : 'none';

    // Show/hide buy-only rows

    updateProductCodePreview();

  window.promptNewNavCategory = function() {
    var val = prompt(adminT('adminPromptNewNavCategory'));
    if (val && val.trim()) addOptionAndSelect('pf-navcategory', val.trim());
  };
  window.promptNewSupplier = function() {
    var val = prompt(adminT('adminPromptNewSupplier'));
    if (val && val.trim()) addOptionAndSelect('pf-supplier', val.trim());

  window.promptNewBuyCategory = function() {

  function addOptionAndSelect(selectId, value) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    var existing = Array.from(sel.options).find(function(o) { return o.value === value; });
    if (!existing) {
      var opt = document.createElement('option');
      opt.value = value;
      opt.textContent = value;
      sel.appendChild(opt);
    }
    sel.value = value;
  }

  window.showInlineBuyProductForm = function() {
    var el = document.getElementById('pf-inline-buy-form');
    if (el) el.style.display = '';
  };
  window.cancelInlineBuyProduct = function() {
    var el = document.getElementById('pf-inline-buy-form');
    if (el) el.style.display = 'none';
    ['pf-buy-name','pf-buy-price','pf-buy-unit','pf-buy-unitsize','pf-buy-productcode'].forEach(function(id) {
      var el2 = document.getElementById(id);
      if (el2) el2.value = '';
    });
    var buyCat = document.getElementById('pf-buy-category');
    if (buyCat) buyCat.value = '';

  window.saveInlineBuyProduct = function() {
    var name = (document.getElementById('pf-buy-name').value || '').trim();
    var category = (document.getElementById('pf-buy-category').value || '').trim();
    if (!name) { alert(adminT('adminBuyNameRequired')); return; }
    if (!category) { alert(adminT('adminBuyCategoryRequired')); return; }

    var productCode = generateProductCodeClient(category, name);
    var buyProduct = {
      NAME: name,
      CATEGORY: category,
      TYPE: 'Buy',
      BUYPRICE: parseFloat(document.getElementById('pf-buy-price').value) || '',
      BUYUNIT: (document.getElementById('pf-buy-unit').value || '').trim(),
      'BUYUNIT SIZE': (document.getElementById('pf-buy-unitsize').value || '').trim(),
      SUPPLIER: (document.getElementById('pf-buy-supplier').value || '').trim(),
      OUTLET: (document.getElementById('pf-buy-outlet').value || '').trim(),
      ACTIVE: 'Y',
      PRODUCTCODE: productCode
    };

    var btn = document.querySelector('#pf-inline-buy-form button');
    if (btn) { btn.disabled = true; btn.textContent = adminT('adminSaving'); }

    SecurityWrapper.secureServerCall('saveProductSecure', { product: buyProduct })
      .then(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = adminT('adminSaveBuyProduct'); }
        if (!res || !res.success) {
          alert(adminT('adminErrorPrefix') + ' ' + (res && res.error ? res.error : adminT('adminUnknownError')));
          return;
        }
        var parentSel = document.getElementById('pf-parentproductcode');
        if (parentSel) {
          var opt = document.createElement('option');
          opt.value = productCode;
          opt.textContent = name + ' (' + productCode + ')';
          parentSel.appendChild(opt);
          parentSel.value = productCode;
        }
        _pfAdminData.buyProducts.push(buyProduct);
        cancelInlineBuyProduct();
        showProductFormMsg(adminTf('adminBuyProductCreated', { name: name }), '#f0fdf4', '#166534');
      })
      .catch(function(e) {
        if (btn) { btn.disabled = false; btn.textContent = adminT('adminSaveBuyProduct'); }
        alert(adminT('adminServerError') + ' ' + e.message);
      });
  };

  window.submitNewProduct = function() {
    var name = (document.getElementById('pf-name').value || '').trim();
    var category = (document.getElementById('pf-category').value || '').trim();
    if (!name) { showProductFormMsg(adminT('adminProductNameRequired'), '#fff7ed', '#c2410c'); return; }
    if (!category) { showProductFormMsg(adminT('adminCategoryRequired'), '#fff7ed', '#c2410c'); return; }

    var isSell = _pfCurrentType === 'Sell';
    var navCategory = (document.getElementById('pf-navcategory').value || '').trim();
    if (isSell && !navCategory) { showProductFormMsg(adminT('adminNavCategoryRequired'), '#fff7ed', '#c2410c'); return; }
    var price = parseFloat(document.getElementById('pf-price').value);
    if (isSell && isNaN(price)) { showProductFormMsg(adminT('adminSellPriceRequired'), '#fff7ed', '#c2410c'); return; }

    var productCode = generateProductCodeClient(category, name);

    var product = {
      NAME: name,
      CATEGORY: category,
      PRICE: isSell ? price : '',
      IMAGEFILEID: isSell ? (document.getElementById('pf-imagefileid').value || '').trim() : '',
      TYPE: _pfCurrentType,
      SUPPLIER: (document.getElementById('pf-supplier').value || '').trim(),
      OUTLET: (document.getElementById('pf-outlet').value || '').trim(),
      BUYPRICE: parseFloat(document.getElementById('pf-buyprice').value) || '',
      PRODUCTCODE: productCode,
      SELLUNIT: isSell ? (document.getElementById('pf-sellunit').value || '').trim() : '',
      BUYUNIT: !isSell ? (document.getElementById('pf-buyunit').value || '').trim() : '',
      'BUYUNIT SIZE': !isSell ? (document.getElementById('pf-buyunitsize').value || '').trim() : '',
      PARENTPRODUCTCODE: isSell ? (document.getElementById('pf-parentproductcode').value || '').trim() : '',
      'UNITSPERPARENT ': isSell ? (parseFloat(document.getElementById('pf-unitsperparent').value) || '') : '',
      'SORT ORDER': parseInt(document.getElementById('pf-sortorder').value) || '',
      QUANTITYVARIABLE: isSell ? (document.getElementById('pf-quantityvariable').value || '') : '',
      MODE: isSell ? (document.getElementById('pf-mode').value || 'N') : '',
      UNITSFORSELLING: isSell ? (parseFloat(document.getElementById('pf-unitsforselling').value) || '') : '',
      NAVCATEGORY: isSell ? navCategory : '',
      COOKING_PRODUCT: isSell ? (document.getElementById('pf-cookingproduct').value || '') : '',
      RECOOK_THRESHOLD: isSell ? (parseFloat(document.getElementById('pf-recookthreshold').value) || '') : '',
      FRESH_HOURS: isSell ? (parseInt(document.getElementById('pf-freshhours').value, 10) || '') : '',
      ACTIVE: (document.getElementById('pf-active') && document.getElementById('pf-active').value) || 'Y'
    };

    var btn = document.querySelector('[onclick="submitNewProduct()"]');
    if (btn) { btn.disabled = true; btn.textContent = adminT('adminSaving'); }

    SecurityWrapper.secureServerCall('saveProductSecure', { product: product })
      .then(function(res) {
        if (btn) { btn.disabled = false; btn.textContent = adminT('adminCreateProductBtn'); }
        if (!res || res.success === false) {
          showProductFormMsg(adminT('adminErrorPrefix') + ' ' + (res && res.error ? res.error : adminT('adminUnknownError')), '#fef2f2', '#b91c1c');
          return;
        }
        showProductFormMsg(adminT('adminProductSaved'), '#f0fdf4', '#166534');
        resetProductForm();
        if (!isSell) {
          _pfAdminData.buyProducts.push(product);
          var parentSel = document.getElementById('pf-parentproductcode');
          if (parentSel) {
            var opt = document.createElement('option');
            opt.value = productCode;
            opt.textContent = name + ' (' + productCode + ')';
            parentSel.appendChild(opt);
          }
        }
      })
      .catch(function(e) {
        if (btn) { btn.disabled = false; btn.textContent = adminT('adminCreateProductBtn'); }
        showProductFormMsg(adminT('adminServerError') + ' ' + e.message, '#fef2f2', '#b91c1c');
      });
  };

  window.resetProductForm = function() {
    ['pf-name','pf-imagefileid','pf-price','pf-buyprice','pf-sellunit','pf-buyunit','pf-buyunitsize','pf-unitsperparent','pf-sortorder','pf-unitsforselling','pf-productcode'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    ['pf-category','pf-navcategory','pf-supplier','pf-parentproductcode','pf-outlet'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var modeEl = document.getElementById('pf-mode');
    if (modeEl) modeEl.value = 'N';
    var qvEl = document.getElementById('pf-quantityvariable');
    if (qvEl) qvEl.value = '';
    var activeEl = document.getElementById('pf-active');
    if (activeEl) activeEl.value = 'Y';
    hidePfMsg();
    setProductType('Sell');
  };

  function showProductFormMsg(text, bgColor, color) {
    var el = document.getElementById('pf-msg');
    if (!el) return;
    el.style.display = '';
    el.style.background = bgColor || '#f0fdf4';
    el.style.color = color || '#166534';
    el.style.border = '1px solid ' + (color || '#166534') + '33';
    el.textContent = text;
  }
  function hidePfMsg() {
    var el = document.getElementById('pf-msg');
    if (el) el.style.display = 'none';
  }

  // ── End Product Form ───────────────────────────────────────────────

  // ── Products Browse / Edit / Copy ─────────────────────────────────

  var _browseProductsData = [];
  window._browseSort   = { col: 'NAME', asc: true };
  window._browseFilter = { q: '', type: '', category: '', active: '' };
  var _browseEditing   = null;

  window._isProductActive = function(p) {
    var v = (p.ACTIVE || p.active || 'Y').toString().trim().toUpperCase();
    return v !== 'N' && v !== 'NO' && v !== 'FALSE' && v !== '0';
  };

  window.switchProductsView = function(view) {
    var cv = document.getElementById('prod-create-view');
    var bv = document.getElementById('prod-browse-view');
    var cb = document.getElementById('prod-tab-create');
    var bb = document.getElementById('prod-tab-browse');
    if (view === 'create') {
      if (cv) cv.style.display = '';
      if (bv) bv.style.display = 'none';
      if (cb) { cb.style.background = '#16a34a'; cb.style.color = '#fff'; }
      if (bb) { bb.style.background = '#f1f5f9'; bb.style.color = '#475569'; }
    } else {
      if (cv) cv.style.display = 'none';
      if (bv) bv.style.display = '';
      if (cb) { cb.style.background = '#f1f5f9'; cb.style.color = '#475569'; }
      if (bb) { bb.style.background = '#1e293b'; bb.style.color = '#fff'; }
      loadBrowseProducts();
    }
  };

  window.loadBrowseProducts = function() {
    var container = document.getElementById('browse-products-table');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">' + adminT('adminLoadingProducts') + '</div>';
    SecurityWrapper.secureServerCall('getProductsForAdminSecure', {})
      .then(function(res) {
        if (!res || !res.success) {
          container.innerHTML = '<div style="color:#dc3545;padding:16px;">' + adminT('adminFailedLoadProducts') + '</div>';
          return;
        }
        // Normalize all keys to uppercase for consistent access
        _browseProductsData = (res.products || []).map(function(p) {
          var n = {};
          Object.keys(p).forEach(function(k) { n[k.trim().toUpperCase()] = p[k]; });
          return n;
        });
        // Populate category filter
        var catFilter = document.getElementById('browse-cat-filter');
        if (catFilter) {
          var cats = [];
          _browseProductsData.forEach(function(p) { var c = p.CATEGORY || ''; if (c && cats.indexOf(c) === -1) cats.push(c); });
          cats.sort();
          catFilter.innerHTML = '<option value="">' + adminT('adminAllCategories') + '</option>';
          cats.forEach(function(c) {
            var o = document.createElement('option'); o.value = c; o.textContent = c;
            catFilter.appendChild(o);
          });
        }
        window.renderBrowseTable();
      })
      .catch(function(e) {
        var container2 = document.getElementById('browse-products-table');
        if (container2) container2.innerHTML = '<div style="color:#dc3545;padding:16px;">' + adminT('adminErrorPrefix') + ' ' + e.message + '</div>';
      });
  };

  window.renderBrowseTable = function() {
    var container = document.getElementById('browse-products-table');
    if (!container) return;
    var q = (window._browseFilter.q || '').toLowerCase().trim();
    var typeF = (window._browseFilter.type || '').toLowerCase();
    var catF = window._browseFilter.category || '';
    var activeF = window._browseFilter.active || '';

    var filtered = _browseProductsData.filter(function(p) {
      if (typeF && (p.TYPE || '').toLowerCase() !== typeF) return false;
      if (catF && p.CATEGORY !== catF) return false;
      if (activeF === 'Y' && !window._isProductActive(p)) return false;
      if (activeF === 'N' && window._isProductActive(p)) return false;
      if (q && !(p.NAME || '').toLowerCase().includes(q) &&
               !(p.PRODUCTCODE || '').toLowerCase().includes(q) &&
               !(p.CATEGORY || '').toLowerCase().includes(q)) return false;
      return true;
    });

    var col = window._browseSort.col, asc = window._browseSort.asc;
    filtered.sort(function(a, b) {
      var va = (a[col] !== undefined && a[col] !== null) ? a[col] : '';
      var vb = (b[col] !== undefined && b[col] !== null) ? b[col] : '';
      if (!isNaN(va) && !isNaN(vb) && va !== '' && vb !== '') { va = parseFloat(va); vb = parseFloat(vb); }
      else { va = va.toString().toLowerCase(); vb = vb.toString().toLowerCase(); }
      return va < vb ? (asc ? -1 : 1) : va > vb ? (asc ? 1 : -1) : 0;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">' + adminT('adminNoProductsFound') + '</div>';
      return;
    }

    function th(label, colKey) {
      var arrow = window._browseSort.col === colKey ? (window._browseSort.asc ? ' ↑' : ' ↓') : ' <span style="opacity:0.3">↕</span>';
      return '<th onclick="window._browseSortBy(\'' + colKey + '\')" style="padding:9px 12px;cursor:pointer;white-space:nowrap;user-select:none;background:#1e293b;color:#fff;">' + label + arrow + '</th>';
    }

    var html = '<div style="overflow-x:auto;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,0.08);">' +
      '<table style="width:100%;border-collapse:collapse;font-size:0.84em;">' +
      '<thead><tr>' +
      '<th style="padding:9px 8px;width:32px;background:#1e293b;color:#fff;">#</th>' +
      th(adminT('adminName'), 'NAME') + th(adminT('adminCategory'), 'CATEGORY') + th(adminT('adminBrowseType'), 'TYPE') +
      th(adminT('adminBrowsePrice'), 'PRICE') + th(adminT('adminBuyPrice'), 'BUYPRICE') + th(adminT('outlet'), 'OUTLET') +
      th(adminT('adminActive'), 'ACTIVE') +
      '<th style="padding:9px 12px;background:#1e293b;color:#fff;">' + adminT('adminColActions') + '</th>' +
      '</tr></thead><tbody>';

    filtered.forEach(function(p, idx) {
      var code = (p.PRODUCTCODE || '').toString();
      var type = (p.TYPE || '').toString();
      var typeLower = type.toLowerCase();
      var isSell = typeLower === 'sell';
      var isActive = window._isProductActive(p);
      var eid = encodeURIComponent(code) + '-' + encodeURIComponent(type);
      var bg = !isActive ? '#f1f5f9' : (idx % 2 === 0 ? '#fff' : '#f8fafc');
      var rowStyle = !isActive ? 'opacity:0.72;' : '';
      html += '<tr style="background:' + bg + ';border-bottom:1px solid #e2e8f0;' + rowStyle + '">';
      html += '<td style="padding:7px 8px;color:#94a3b8;text-align:center;">' + (idx + 1) + '</td>';
      html += '<td style="padding:7px 12px;font-weight:600;"><span id="bsn-' + eid + '">' + (p.NAME || '') + '</span></td>';
      html += '<td style="padding:7px 12px;color:#475569;">' + (p.CATEGORY || '-') + '</td>';
      html += '<td style="padding:7px 12px;"><span style="padding:2px 8px;border-radius:12px;font-size:0.8em;font-weight:700;background:' +
        (isSell ? '#dcfce7' : '#dbeafe') + ';color:' + (isSell ? '#166534' : '#1d4ed8') + ';">' + type + '</span></td>';
      html += '<td style="padding:7px 12px;text-align:right;"><span id="bsp-' + eid + '">' + (isSell ? (p.PRICE !== '' && p.PRICE !== undefined ? p.PRICE : '-') : '-') + '</span></td>';
      html += '<td style="padding:7px 12px;text-align:right;"><span id="bsbp-' + eid + '">' + (!isSell ? (p.BUYPRICE !== '' && p.BUYPRICE !== undefined ? p.BUYPRICE : '-') : '-') + '</span></td>';
      html += '<td style="padding:7px 12px;color:#475569;">' + (p.OUTLET || '-') + '</td>';
      html += '<td style="padding:7px 12px;text-align:center;"><span style="padding:2px 8px;border-radius:12px;font-size:0.78em;font-weight:700;background:' +
        (isActive ? '#dcfce7' : '#fee2e2') + ';color:' + (isActive ? '#166534' : '#991b1b') + ';">' +
        (isActive ? adminT('adminStatusActive') : adminT('adminInactive')) + '</span></td>';
      var safeCode = code.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      var safeType = type.replace(/'/g, "\\'");
      html += '<td style="padding:7px 8px;white-space:nowrap;">' +
        '<button onclick="window._browseEditRow(\'' + safeCode + '\',\'' + safeType + '\')" style="padding:4px 8px;background:#0ea5e9;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;margin-right:4px;">' + adminT('adminBrowseEdit') + '</button>' +
        '<button onclick="window._browseCopyProduct(\'' + safeCode + '\',\'' + safeType + '\')" style="padding:4px 8px;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;margin-right:4px;">' + adminT('adminBrowseCopy') + '</button>' +
        (isActive
          ? '<button onclick="window._browseToggleActive(\'' + safeCode + '\',\'' + safeType + '\',false)" style="padding:4px 8px;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">' + adminT('adminDeactivate') + '</button>'
          : '<button onclick="window._browseToggleActive(\'' + safeCode + '\',\'' + safeType + '\',true)" style="padding:4px 8px;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">' + adminT('adminActivate') + '</button>') +
        '</td></tr>';
      // Inline edit row (hidden)
      html += '<tr id="ber-' + eid + '" style="display:none;background:#eff6ff;">';
      html += '<td colspan="9" style="padding:10px 14px;">';
      html += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">';
      html += '<label style="font-size:0.82em;font-weight:600;color:#374151;">' + adminT('adminName') + ':</label>';
      html += '<input id="ben-' + eid + '" type="text" value="' + (p.NAME || '').replace(/"/g, '&quot;') + '" style="padding:5px 8px;border:1px solid #93c5fd;border-radius:4px;font-size:0.88em;min-width:180px;">';
      html += '<label style="font-size:0.82em;font-weight:600;color:#374151;">' + (isSell ? adminT('adminSellPrice') : adminT('adminBuyPrice')) + '</label>';
      html += '<input id="bep-' + eid + '" type="number" value="' + (isSell ? (p.PRICE || '') : (p.BUYPRICE || '')) + '" style="padding:5px 8px;border:1px solid #93c5fd;border-radius:4px;font-size:0.88em;width:110px;">';
      if (isSell) {
        html += '<label style="font-size:0.82em;font-weight:600;color:#374151;">' + adminT('adminImageUrl') + '</label>';
        html += '<input id="bei-' + eid + '" type="text" value="' + (p.IMAGEFILEID || '').replace(/"/g, '&quot;') + '" placeholder="' + adminT('adminImageFileIdOrUrl') + '" style="padding:5px 8px;border:1px solid #93c5fd;border-radius:4px;font-size:0.88em;min-width:200px;">';
      }
      html += '<button onclick="window._browseSaveEdit(\'' + safeCode + '\',\'' + safeType + '\')" style="padding:5px 12px;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.85em;font-weight:700;">' + adminT('adminSaveAll') + '</button>';
      html += '<button onclick="window._browseCancelEdit(\'' + safeCode + '\',\'' + safeType + '\')" style="padding:5px 10px;background:#fff;color:#374151;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;font-size:0.85em;">' + adminT('adminCancel') + '</button>';
      html += '<span id="bem-' + eid + '" style="font-size:0.82em;"></span>';
      html += '</div></td></tr>';
    });

    html += '</tbody></table></div><p style="font-size:0.8em;color:#94a3b8;margin-top:6px;">' + adminTf('adminBrowseProductCount', { count: filtered.length }) + '</p>';
    container.innerHTML = html;
  };

  window._browseSortBy = function(col) {
    if (window._browseSort.col === col) window._browseSort.asc = !window._browseSort.asc;
    else { window._browseSort.col = col; window._browseSort.asc = true; }
    window.renderBrowseTable();
  };

  window._browseEditRow = function(code, type) {
    if (_browseEditing) window._browseCancelEdit(_browseEditing.code, _browseEditing.type);
    _browseEditing = { code: code, type: type };
    var eid = encodeURIComponent(code) + '-' + encodeURIComponent(type);
    var row = document.getElementById('ber-' + eid);
    if (row) row.style.display = '';
  };

  window._browseCancelEdit = function(code, type) {
    var eid = encodeURIComponent(code) + '-' + encodeURIComponent(type);
    var row = document.getElementById('ber-' + eid);
    if (row) row.style.display = 'none';
    _browseEditing = null;
  };

  window._browseSaveEdit = function(code, type) {
    var eid = encodeURIComponent(code) + '-' + encodeURIComponent(type);
    var nameEl  = document.getElementById('ben-' + eid);
    var priceEl = document.getElementById('bep-' + eid);
    var imgEl   = document.getElementById('bei-' + eid);
    var msgEl   = document.getElementById('bem-' + eid);
    if (!nameEl) return;
    var newName  = nameEl.value.trim();
    var newPrice = priceEl ? parseFloat(priceEl.value) : NaN;
    var newImage = imgEl ? imgEl.value.trim() : null;
    if (!newName) { if (msgEl) { msgEl.textContent = adminT('adminNameRequired'); msgEl.style.color = '#dc2626'; } return; }
    if (msgEl) { msgEl.textContent = adminT('adminSaving'); msgEl.style.color = '#666'; }
    SecurityWrapper.secureServerCall('updateProductFieldsSecure', {
      productCode: code, productType: type,
      name: newName,
      price: isNaN(newPrice) ? null : newPrice,
      imageFileId: newImage
    }).then(function(res) {
      if (!res || !res.success) {
        if (msgEl) { msgEl.textContent = adminT('adminErrorPrefix') + ' ' + (res && res.error ? res.error : adminT('adminFailed')); msgEl.style.color = '#dc2626'; }
        return;
      }
      if (msgEl) { msgEl.textContent = adminT('adminSaved'); msgEl.style.color = '#16a34a'; }
      var p = _browseProductsData.find(function(x) {
        return (x.PRODUCTCODE || '') === code && (x.TYPE || '') === type;
      });
      if (p) {
        p.NAME = newName;
        if (type.toLowerCase() === 'buy') { if (!isNaN(newPrice)) p.BUYPRICE = newPrice; }
        else { if (!isNaN(newPrice)) p.PRICE = newPrice; }
        if (newImage !== null) p.IMAGEFILEID = newImage;
      }
      var nameSpan = document.getElementById('bsn-' + eid);
      if (nameSpan) nameSpan.textContent = newName;
      if (!isNaN(newPrice)) {
        var priceSpan = document.getElementById(type.toLowerCase() === 'buy' ? 'bsbp-' + eid : 'bsp-' + eid);
        if (priceSpan) priceSpan.textContent = newPrice;
      }
      setTimeout(function() { window._browseCancelEdit(code, type); }, 1200);
    }).catch(function(e) {
      if (msgEl) { msgEl.textContent = adminT('adminErrorPrefix') + ' ' + e.message; msgEl.style.color = '#dc2626'; }
    });
  };

  window._browseToggleActive = function(code, type, activate) {
    if (!activate && !confirm(adminT('adminConfirmDeactivate'))) return;
    var fn = activate ? 'activateProductSecure' : 'deactivateProductSecure';
    SecurityWrapper.secureServerCall(fn, { productCode: code, productType: type })
      .then(function(res) {
        if (!res || !res.success) {
          alert(adminT('adminErrorPrefix') + ' ' + (res && res.error ? res.error : adminT('adminFailed')));
          return;
        }
        if (typeof window.invalidateProductCaches === 'function') {
          window.invalidateProductCaches({ refetchOrders: true });
        } else if (typeof window.sellProductsCache !== 'undefined') {
          window.sellProductsCache = null;
        }
        SecurityWrapper.secureServerCall('clearAllUsersCacheSecure', {}).catch(function() {});
        loadBrowseProducts();
        if (_pfAdminData.categories.length > 0) loadProductFormData();
      })
      .catch(function(e) {
        alert(adminT('adminErrorPrefix') + ' ' + e.message);
      });
  };

  window._browseCopyProduct = function(code, type) {
    var p = _browseProductsData.find(function(x) { return (x.PRODUCTCODE || '') === code && (x.TYPE || '') === type; });
    if (!p) return;
    switchProductsView('create');
    setTimeout(function() {
      setProductType(type.charAt(0).toUpperCase() + type.slice(1).toLowerCase());
      var set = function(id, val) { var el = document.getElementById(id); if (el) el.value = val !== undefined && val !== null ? val : ''; };
      // Clear name and code (must be new/unique)
      set('pf-name', '');
      set('pf-productcode', '');
      // Copy all other fields
      if (p.CATEGORY) addOptionAndSelect('pf-category', p.CATEGORY);
      if (p.NAVCATEGORY) addOptionAndSelect('pf-navcategory', p.NAVCATEGORY);
      if (p.SUPPLIER) addOptionAndSelect('pf-supplier', p.SUPPLIER);
      set('pf-outlet', p.OUTLET || '');
      set('pf-price', p.PRICE || '');
      set('pf-buyprice', p.BUYPRICE || '');
      set('pf-sellunit', p.SELLUNIT || '');
      set('pf-buyunit', p.BUYUNIT || '');
      set('pf-buyunitsize', p['BUYUNIT SIZE'] || '');
      set('pf-mode', p.MODE || 'N');
      set('pf-quantityvariable', p.QUANTITYVARIABLE || '');
      set('pf-unitsforselling', p.UNITSFORSELLING || '');
      set('pf-parentproductcode', p.PARENTPRODUCTCODE || '');
      set('pf-cookingproduct', p.COOKING_PRODUCT || '');
      set('pf-recookthreshold', p.RECOOK_THRESHOLD || '');
      set('pf-freshhours', p.FRESH_HOURS || (p.FRESH_DAYS ? String(Number(p.FRESH_DAYS) * 24) : '24'));
      set('pf-sortorder', p['SORT ORDER'] || '');
      set('pf-imagefileid', p.IMAGEFILEID || '');
      set('pf-active', 'Y');
      showProductFormMsg(adminTf('adminCopiedFrom', { name: p.NAME }), '#eff6ff', '#1d4ed8');
      var nameEl = document.getElementById('pf-name');
      if (nameEl) nameEl.focus();
    }, 80);
  };

  // ── End Products Browse ────────────────────────────────────────────

</script>
