<script>
  // Split payment checkout (not a PaymentMethod sheet row)
  window._splitMethodsList = [];

  function isCheckoutOnlyPaymentKey(key) {
    key = (key || '').toString().trim().toLowerCase();
    return key === 'partial' || key === 'split';
  }

  function loadSplitPaymentMethods(callback) {
    if (window._getCachedPaymentMethodsForModule) {
      window._getCachedPaymentMethodsForModule('selling', function(methods) {
        window._splitMethodsList = (methods || []).filter(function(m) {
          return !isCheckoutOnlyPaymentKey(m.name);
        });
        callback(window._splitMethodsList);
      });
    } else {
      callback([]);
    }
  }

  function findSplitDefaultMethod_() {
    var list = window._splitMethodsList || [];
    var i;
    for (i = 0; i < list.length; i++) {
      if ((list[i].name || '').toString().trim().toLowerCase() === 'qris') {
        return list[i].name;
      }
    }
    return '';
  }

  function buildSplitMethodOptions(selectedName) {
    var selectedKey = (selectedName || '').toString().trim().toLowerCase();
    var opts = '<option value="">' + (t('selectPaymentMethod') || 'Select method') + '</option>';
    (window._splitMethodsList || []).forEach(function(m) {
      var sel = selectedKey && m.name && selectedKey === m.name.toString().trim().toLowerCase() ? ' selected' : '';
      opts += '<option value="' + m.name.replace(/"/g, '&quot;') + '"' + sel + '>' + m.name + '</option>';
    });
    return opts;
  }

  function showSplitPaymentForm() {
    if (!window._pendingOrder) {
      window.showErrorModal(t('noOrderFound') || 'No order found. Please try again.');
      return;
    }
    var nf = lang === 'id' ? 'id-ID' : 'en-US';
    var total = window._pendingOrder.total;
    var currencySymbol = lang === 'id' ? 'Rp' : 'IDR';
    var html = '<div class="split-payment-screen">' +
      '<h2 style="text-align:center">' + (t('splitPayment') || 'Split Payment') + '</h2>' +
      '<div class="order-summary-preview"><h3>' + (t('orderSummary') || 'Order Summary') + '</h3>' +
      '<table style="width:100%;margin-bottom:16px;"><tr><th>' + (t('item') || 'Item') + '</th><th>' + (t('qty') || 'Qty') + '</th><th>' + (t('amount') || 'Amount') + '</th></tr>' +
      window._pendingOrder.items.map(function(item) {
        return '<tr><td>' + item.name + '</td><td style="text-align:center;">' + item.qty + '</td><td style="text-align:right;">' + currencySymbol + ' ' + (item.price * item.qty).toLocaleString(nf) + '</td></tr>';
      }).join('') +
      '<tr style="font-weight:bold;border-top:2px solid #ddd;"><td colspan="2" style="text-align:right;">Total:</td><td style="text-align:right;">' + currencySymbol + ' ' + total.toLocaleString(nf) + '</td></tr></table></div>' +
      '<div style="background:#f8f9fa;border:2px solid #e9ecef;border-radius:12px;padding:20px;margin:20px 0;">' +
      '<h3 style="margin-top:0;color:#495057;">' + (t('paymentBreakdown') || 'Payment Breakdown') + '</h3>' +
      '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;" id="splitPaymentTable">' +
      '<thead><tr style="background:#e2e8f0;"><th style="padding:8px;text-align:left;">' + (t('paymentMethod') || 'Payment Method') + '</th>' +
      '<th style="padding:8px;text-align:right;">' + (t('amount') || 'Amount') + '</th><th style="padding:8px;width:40px;"></th></tr></thead>' +
      '<tbody id="splitPaymentBody"></tbody></table></div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button type="button" class="pay-btn" style="padding:8px 14px;" onclick="addSplitPaymentRow()">+ ' + (t('addPaymentRow') || 'Add row') + '</button>' +
      '<button type="button" class="remove-btn" style="padding:8px 14px;" onclick="fillSplitRemainderCash()">' + (t('restAsCash') || 'Rest as Cash') + '</button>' +
      '</div>' +
      '<div style="margin-top:12px;padding:12px;background:#fff;border-radius:8px;border:1px solid #ddd;">' +
      '<div style="display:flex;justify-content:space-between;font-weight:bold;"><span>' + (t('remaining') || 'Remaining') + ':</span><span id="splitRemainingDisplay">' + currencySymbol + ' ' + total.toLocaleString(nf) + '</span></div>' +
      '</div>' +
      '<div class="validation-message" id="splitValidationMessage" style="margin-top:12px;padding:8px;border-radius:4px;display:none;"></div>' +
      '</div>' +
      '<div style="text-align:center;margin-top:20px;">' +
      '<button id="confirmSplitPaymentBtn" class="pay-btn" onclick="confirmSplitPayment()" style="margin-right:16px;padding:16px 32px;font-size:16px;" disabled>' + (t('confirmPayment') || 'Confirm Payment') + '</button>' +
      '<button onclick="showPaymentSelection(window._pendingOrder)" class="remove-btn" style="padding:16px 32px;font-size:16px;">' + (t('back') || 'Back') + '</button>' +
      '</div></div>';
    getElem('main').innerHTML = html;
    loadSplitPaymentMethods(function() {
      addSplitPaymentRow(findSplitDefaultMethod_());
      calculateSplitPayment();
    });
  }

  function addSplitPaymentRow(methodName, amount) {
    var tbody = document.getElementById('splitPaymentBody');
    if (!tbody) return;
    var rowId = 'splitRow_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var tr = document.createElement('tr');
    tr.id = rowId;
    tr.innerHTML = '<td style="padding:6px;"><select class="split-method-select" style="width:100%;padding:8px;" onchange="calculateSplitPayment()">' + buildSplitMethodOptions(methodName || '') + '</select></td>' +
      '<td style="padding:6px;"><input type="number" class="split-amount-input" min="0" step="1000" value="' + (amount || amount === 0 ? amount : '') + '" placeholder="0" style="width:100%;padding:8px;text-align:right;" oninput="calculateSplitPayment()"></td>' +
      '<td style="padding:6px;text-align:center;"><button aria-label="Remove split payment row" type="button" class="remove-btn" style="padding:4px 8px;" onclick="removeSplitPaymentRow(\'' + rowId + '\')">×</button></td>';
    tbody.appendChild(tr);
    calculateSplitPayment();
  }

  function removeSplitPaymentRow(rowId) {
    var row = document.getElementById(rowId);
    if (row) row.remove();
    calculateSplitPayment();
  }

  function getSplitRowsFromTable() {
    var rows = document.querySelectorAll('#splitPaymentBody tr');
    var splits = [];
    rows.forEach(function(tr) {
      var methodSel = tr.querySelector('.split-method-select');
      var amountInput = tr.querySelector('.split-amount-input');
      var method = methodSel ? methodSel.value.trim() : '';
      var amount = amountInput ? (parseFloat(amountInput.value) || 0) : 0;
      if (method && amount > 0) {
        var meta = typeof getPaymentMethodMeta === 'function' ? getPaymentMethodMeta(method) : null;
        splits.push({
          method: method,
          amount: amount,
          destinationAccount: meta ? meta.destinationAccount : ''
        });
      }
    });
    return splits;
  }

  function calculateSplitPayment() {
    if (!window._pendingOrder) return;
    var total = window._pendingOrder.total;
    var splits = getSplitRowsFromTable();
    var allocated = splits.reduce(function(sum, s) { return sum + s.amount; }, 0);
    var remaining = Math.round((total - allocated) * 100) / 100;
    var nf = lang === 'id' ? 'id-ID' : 'en-US';
    var currencySymbol = lang === 'id' ? 'Rp' : 'IDR';
    var remainingEl = document.getElementById('splitRemainingDisplay');
    if (remainingEl) {
      remainingEl.textContent = currencySymbol + ' ' + remaining.toLocaleString(nf);
      remainingEl.style.color = remaining === 0 ? '#16a34a' : (remaining < 0 ? '#dc2626' : '#d97706');
    }
    var validationMsg = document.getElementById('splitValidationMessage');
    var confirmBtn = document.getElementById('confirmSplitPaymentBtn');
    if (!confirmBtn) return;
    if (splits.length === 0) {
      validationMsg.innerHTML = '⚠️ ' + (t('splitAmountRequired') || 'Enter at least one payment amount.');
      validationMsg.style.display = 'block';
      validationMsg.style.background = '#fff3cd';
      confirmBtn.disabled = true;
    } else if (remaining > 0) {
      validationMsg.innerHTML = '⚠️ ' + (t('splitMustEqualTotal') || 'Split amounts must equal the order total.');
      validationMsg.style.display = 'block';
      validationMsg.style.background = '#fff3cd';
      confirmBtn.disabled = true;
    } else if (remaining < 0) {
      validationMsg.innerHTML = '⚠️ ' + (t('splitExceedsTotal') || 'Split amounts exceed the order total.');
      validationMsg.style.display = 'block';
      validationMsg.style.background = '#fee2e2';
      confirmBtn.disabled = true;
    } else {
      validationMsg.style.display = 'none';
      confirmBtn.disabled = false;
    }
  }

  function fillSplitRemainderCash() {
    if (!window._pendingOrder) return;
    var total = window._pendingOrder.total;
    var splits = getSplitRowsFromTable();
    var allocated = splits.reduce(function(sum, s) { return sum + s.amount; }, 0);
    var remaining = Math.round((total - allocated) * 100) / 100;
    if (remaining <= 0) return;
    var tbody = document.getElementById('splitPaymentBody');
    if (!tbody) return;
    var cashRow = null;
    tbody.querySelectorAll('tr').forEach(function(tr) {
      var sel = tr.querySelector('.split-method-select');
      if (sel && sel.value.toLowerCase() === 'cash') cashRow = tr;
    });
    if (!cashRow) {
      addSplitPaymentRow('Cash', remaining);
      return;
    }
    var input = cashRow.querySelector('.split-amount-input');
    var current = input ? (parseFloat(input.value) || 0) : 0;
    if (input) input.value = current + remaining;
    calculateSplitPayment();
  }

  function confirmSplitPayment() {
    if (!window._pendingOrder) {
      window.showErrorModal(t('noOrderFound') || 'No order found. Please try again.');
      return;
    }
    var splits = getSplitRowsFromTable();
    var total = window._pendingOrder.total;
    var allocated = splits.reduce(function(sum, s) { return sum + s.amount; }, 0);
    if (Math.round((total - allocated) * 100) / 100 !== 0) {
      alert(t('splitMustEqualTotal') || 'Split amounts must equal the order total.');
      return;
    }
    var cashAmount = splits.filter(function(s) { return s.method.toLowerCase() === 'cash'; }).reduce(function(sum, s) { return sum + s.amount; }, 0);
    window._pendingSplitData = { splits: splits, cash: cashAmount, total: total };
    window._pendingPartialData = window._pendingSplitData;
    if (cashAmount > 0) {
      showSplitCashTenderedForm(cashAmount);
    } else {
      processSplitPayment(window._pendingSplitData);
    }
  }

  function showSplitCashTenderedForm(cashAmount) {
    var nf = lang === 'id' ? 'id-ID' : 'en-US';
    var currencySymbol = lang === 'id' ? 'Rp' : 'IDR';
    var splitLines = (window._pendingSplitData.splits || []).map(function(s) {
      return '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>' + s.method + ':</span><span>' + currencySymbol + ' ' + s.amount.toLocaleString(nf) + '</span></div>';
    }).join('');
    var html = '<div class="cash-tendered-screen">' +
      '<h2 style="text-align:center">💰 ' + (t('splitPayment') || 'Split Payment') + ' - ' + (t('cashPortion') || 'Cash Portion') + '</h2>' +
      '<div style="background:#e8f4fd;border:2px solid #bee5eb;border-radius:12px;padding:16px;margin:16px 0;">' + splitLines +
      '<hr style="margin:8px 0;"><div style="display:flex;justify-content:space-between;font-weight:bold;"><span>💵 ' + (t('cashPortion') || 'Cash Portion') + ':</span><span style="color:#28a745;">' + currencySymbol + ' ' + cashAmount.toLocaleString(nf) + '</span></div></div>' +
      '<div style="background:#f8f9fa;border:2px solid #e9ecef;border-radius:12px;padding:20px;margin:20px 0;text-align:center;">' +
      '<label for="partialCashTenderedInput" style="display:block;font-weight:bold;margin-bottom:8px;">' + (t('amountPaid') || 'Amount Paid') + ' (' + (t('cash') || 'Cash') + '):</label>' +
      '<input type="number" id="partialCashTenderedInput" min="' + cashAmount + '" step="1000" placeholder="' + cashAmount + '" style="width:80%;max-width:300px;padding:14px;font-size:1.3em;border:2px solid #28a745;border-radius:8px;text-align:center;" oninput="calculateSplitPartialChange()" autofocus>' +
      '<div id="partialChangeDisplay" style="margin-top:16px;background:#fff;padding:16px;border-radius:8px;border:1px solid #ddd;">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span>' + (t('paid') || 'Paid') + ':</span><span id="partialPaidAmountDisplay">' + currencySymbol + ' 0</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-weight:bold;"><span>' + (t('change') || 'Change') + ':</span><span id="partialChangeAmountDisplay" style="color:#dc3545;">' + currencySymbol + ' 0</span></div></div>' +
      '<div id="partialCashValidationMessage" style="margin-top:12px;display:none;"></div></div>' +
      '<div style="text-align:center;"><button id="confirmPartialCashBtn" class="pay-btn" onclick="confirmSplitCashPayment()" disabled style="margin-right:16px;padding:16px 32px;">' + (t('confirmPayment') || 'Confirm') + '</button>' +
      '<button onclick="showSplitPaymentForm()" class="remove-btn" style="padding:16px 32px;">' + (t('back') || 'Back') + '</button></div></div>';
    getElem('main').innerHTML = html;
    setTimeout(function() {
      var input = document.getElementById('partialCashTenderedInput');
      if (input) input.focus();
      calculateSplitPartialChange();
    }, 100);
  }

  function buildLegacyPaymentDetailsFromSplits(splitData) {
    var splits = splitData.splits || [];
    var cash = splits.filter(function(s) { return s.method.toLowerCase() === 'cash'; }).reduce(function(sum, s) { return sum + s.amount; }, 0);
    var nonCashSplits = splits.filter(function(s) { return s.method.toLowerCase() !== 'cash'; });
    var digital = nonCashSplits.reduce(function(sum, s) { return sum + s.amount; }, 0);
    var firstNonCash = nonCashSplits[0] || {};
    return {
      splits: splits,
      cash: cash,
      nonCash: digital,
      dana: digital,
      nonCashMethod: firstNonCash.method || '',
      total: splitData.total
    };
  }

  function processSplitPayment(splitData) {
    if (window._selectingPayment) return;
    window._selectingPayment = true;
    var confirmBtn = document.getElementById('confirmSplitPaymentBtn') || document.getElementById('confirmPartialCashBtn');
    if (confirmBtn) {
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = '0.6';
      confirmBtn.innerHTML = '⏳ ' + (t('processing') || 'Processing...');
    }
    window._pendingOrder.payment = 'cash';
    window._pendingOrder.paymentSplits = splitData.splits || [];
    window._pendingOrder.paymentDetails = buildLegacyPaymentDetailsFromSplits(splitData);
    if (typeof window.attachPaymentMetaToOrder_ === 'function') {
      window.attachPaymentMetaToOrder_(window._pendingOrder);
    }
    window._pendingOrder.openCashDrawer = resolveOrderOpenCashDrawer(window._pendingOrder);
    window._pendingOrder.submittedAt = formatDateForBackend(new Date());
    submitOrderDirectly(window._pendingOrder);
  }

  function calculateSplitPartialChange() {
    var splitData = window._pendingSplitData || window._pendingPartialData;
    if (!window._pendingOrder || !splitData) return;
    var cashPortion = splitData.cash || 0;
    var cashInput = document.getElementById('partialCashTenderedInput');
    var amountPaid = cashInput ? (parseFloat(cashInput.value) || 0) : 0;
    var change = amountPaid - cashPortion;
    var nf = lang === 'id' ? 'id-ID' : 'en-US';
    var currencySymbol = lang === 'id' ? 'Rp' : 'IDR';
    var paidEl = document.getElementById('partialPaidAmountDisplay');
    var changeEl = document.getElementById('partialChangeAmountDisplay');
    var confirmBtn = document.getElementById('confirmPartialCashBtn');
    if (paidEl) paidEl.textContent = currencySymbol + ' ' + amountPaid.toLocaleString(nf);
    if (changeEl) {
      changeEl.textContent = currencySymbol + ' ' + Math.max(0, change).toLocaleString(nf);
      changeEl.style.color = change >= 0 ? '#28a745' : '#dc3545';
    }
    if (confirmBtn) confirmBtn.disabled = amountPaid < cashPortion;
  }

  function confirmSplitCashPayment() {
    var splitData = window._pendingSplitData || window._pendingPartialData;
    if (!window._pendingOrder || !splitData) return;
    var cashPortion = splitData.cash || 0;
    var amountPaid = parseFloat(document.getElementById('partialCashTenderedInput').value) || 0;
    if (amountPaid < cashPortion) {
      window.showErrorModal(t('insufficientAmount') || 'Insufficient amount.');
      return;
    }
    window._pendingOrder.cashTendered = amountPaid;
    window._pendingOrder.changeAmount = amountPaid - cashPortion;
    processSplitPayment(splitData);
  }

  window.showSplitPaymentForm = showSplitPaymentForm;
  window.showPartialPaymentForm = showSplitPaymentForm;
  window.addSplitPaymentRow = addSplitPaymentRow;
  window.removeSplitPaymentRow = removeSplitPaymentRow;
  window.calculateSplitPayment = calculateSplitPayment;
  window.fillSplitRemainderCash = fillSplitRemainderCash;
  window.confirmSplitPayment = confirmSplitPayment;
  window.showSplitCashTenderedForm = showSplitCashTenderedForm;
  window.processSplitPayment = processSplitPayment;
  window.processPartialPayment = processSplitPayment;
  window.calculateSplitPartialChange = calculateSplitPartialChange;
  window.confirmSplitCashPayment = confirmSplitCashPayment;
  window.confirmPartialPayment = confirmSplitPayment;
  window.calculatePartialPayment = calculateSplitPayment;
  window.calculatePartialChange = calculateSplitPartialChange;
  window.confirmPartialCashPayment = confirmSplitCashPayment;
  window.showPartialCashTenderedForm = showSplitCashTenderedForm;
</script>
