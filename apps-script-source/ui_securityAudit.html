<!-- Security Audit Tool - Identifies unauthorized server calls -->
<script>
  window.SecurityAudit = {
    // Track all server calls to identify unauthorized ones
    unauthorizedCalls: [],
    authorizedCalls: [],
    
    // Start monitoring server calls
    startAudit: function() {
      console.log('🔍 SECURITY AUDIT: Starting audit of server calls...');
      
      // Override google.script.run to track calls
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        const originalRun = google.script.run;
        const audit = this;
        
        google.script.run = {
          withSuccessHandler: function(successCallback) {
            return {
              withFailureHandler: function(failureCallback) {
                return new Proxy({}, {
                  get: function(target, functionName) {
                    return function(params) {
                      const callInfo = {
                        functionName: functionName,
                        timestamp: new Date().toISOString(),
                        authenticated: window.SecurityWrapper ? window.SecurityWrapper.isUserAuthenticated() : false,
                        hasAuthContext: params && params._authContext,
                        stackTrace: new Error().stack
                      };
                      
                      if (callInfo.authenticated && callInfo.hasAuthContext) {
                        audit.authorizedCalls.push(callInfo);
                        console.log('✅ AUTHORIZED CALL:', functionName);
                      } else {
                        audit.unauthorizedCalls.push(callInfo);
                        console.warn('❌ UNAUTHORIZED CALL:', functionName, callInfo);
                      }
                      
                      // Make the actual call
                      return originalRun.withSuccessHandler(successCallback)
                                      .withFailureHandler(failureCallback)[functionName](params);
                    };
                  }
                });
              }
            };
          }
        };
      }
      
      console.log('🔍 SECURITY AUDIT: Monitoring started. Check console for unauthorized calls.');
    },
    
    // Generate audit report
    generateReport: function() {
      console.log('\n📊 SECURITY AUDIT REPORT');
      console.log('========================');
      console.log(`Total Calls: ${this.authorizedCalls.length + this.unauthorizedCalls.length}`);
      console.log(`✅ Authorized: ${this.authorizedCalls.length}`);
      console.log(`❌ Unauthorized: ${this.unauthorizedCalls.length}`);
      
      if (this.unauthorizedCalls.length > 0) {
        console.log('\n🚨 UNAUTHORIZED CALLS DETECTED:');
        this.unauthorizedCalls.forEach((call, index) => {
          console.log(`${index + 1}. ${call.functionName}`);
          console.log(`   Time: ${call.timestamp}`);
          console.log(`   Authenticated: ${call.authenticated}`);
          console.log(`   Has Auth Context: ${call.hasAuthContext}`);
          console.log(`   Stack: ${call.stackTrace.split('\n')[1]?.trim()}`);
          console.log('');
        });
        
        console.log('🔧 ACTION REQUIRED: Replace unauthorized calls with SecurityWrapper.secureServerCall()');
      } else {
        console.log('✅ No unauthorized calls detected!');
      }
      
      return {
        totalCalls: this.authorizedCalls.length + this.unauthorizedCalls.length,
        authorizedCalls: this.authorizedCalls.length,
        unauthorizedCalls: this.unauthorizedCalls.length,
        unauthorizedDetails: this.unauthorizedCalls,
        auditTime: new Date().toISOString()
      };
    },
    
    // Find functions that need security updates
    findUnsecureFunctions: function() {
      const unsecurePatterns = [
        'google.script.run',
        'getProducts',
        'getExpenseAccounts',
        'getPaymentSources',
        'getDepositAccounts',
        'recordExpense',
        'recordDeposit',
        'saveOrder'
      ];
      
      console.log('🔍 SCANNING FOR UNSECURE PATTERNS...');
      
      // This would require file scanning capability
      // For now, provide manual guidance
      console.log('📝 MANUAL SCAN REQUIRED:');
      console.log('Search your codebase for these patterns:');
      unsecurePatterns.forEach(pattern => {
        console.log(`   - ${pattern}`);
      });
      
      console.log('\n🔧 REPLACEMENT GUIDE:');
      console.log('Replace: google.script.run.withSuccessHandler(...).FUNCTION(...)');
      console.log('With:    SecurityWrapper.secureServerCall("FUNCTION", params)');
    },
    
    // Clear audit data
    clearAudit: function() {
      this.unauthorizedCalls = [];
      this.authorizedCalls = [];
      console.log('🧹 AUDIT: Data cleared');
    },
    
    // Quick security check
    quickSecurityCheck: function() {
      console.log('⚡ QUICK SECURITY CHECK');
      console.log('======================');
      
      const checks = [
        {
          name: 'SecurityWrapper loaded',
          check: () => typeof window.SecurityWrapper !== 'undefined',
          fix: 'Include ui_securityWrapper.html in ui_index.html'
        },
        {
          name: 'User authentication state',
          check: () => window.SecurityWrapper && window.SecurityWrapper.isUserAuthenticated(),
          fix: 'User needs to log in'
        },
        {
          name: 'SecureServerCall available',
          check: () => typeof window.secureServerCall !== 'undefined',
          fix: 'SecurityWrapper not properly initialized'
        },
        {
          name: 'PreloadCommonData secured',
          check: () => {
            const func = window.preloadCommonData;
            return func && func.toString().includes('isUserAuthenticated');
          },
          fix: 'Update preloadCommonData to use security checks'
        }
      ];
      
      checks.forEach(check => {
        const passed = check.check();
        console.log(`${passed ? '✅' : '❌'} ${check.name}`);
        if (!passed) {
          console.log(`   Fix: ${check.fix}`);
        }
      });
      
      const passedChecks = checks.filter(c => c.check()).length;
      console.log(`\nSecurity Score: ${passedChecks}/${checks.length} (${Math.round(passedChecks/checks.length*100)}%)`);
      
      return {
        score: passedChecks,
        total: checks.length,
        percentage: Math.round(passedChecks/checks.length*100),
        failed: checks.filter(c => !c.check())
      };
    }
  };

  // Auto-start audit on page load for debugging
  document.addEventListener('DOMContentLoaded', function() {
    // Only start audit if in development mode
    if (window.location.href.includes('dev') || window.location.href.includes('localhost')) {
      setTimeout(() => {
        window.SecurityAudit.startAudit();
        console.log('🔍 SECURITY AUDIT: Auto-started (development mode detected)');
      }, 1000);
    }
  });

  // Make audit available globally
  window.audit = window.SecurityAudit;
  
  console.log('🔒 SECURITY AUDIT: Tool loaded. Use window.audit.quickSecurityCheck() to run checks.');
</script>

<!-- 
USAGE INSTRUCTIONS:

1. Include this file in ui_index.html temporarily for auditing:

   - audit.quickSecurityCheck()     // Quick overview
   - audit.startAudit()            // Start monitoring calls
