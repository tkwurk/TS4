// Global variables for inventory consumption
let buyTypeProducts = [];
let consumptionData = {};
let todaysSummary = null;
window._topConsumedCodes = [];
window._autoConsumptionItems = [];
window._consumptionSortCol = null;
window._consumptionSortAsc = true;
window._recipeOnlyFilter = false;
window._showSellProduct = false;

function filterSoldAutoConsumptionItems(items) {
  return (items || []).filter(function(item) {
    return (Number(item.suggestedQuantity) || 0) > 0;
  });
}

// Collapse auto-consumption lines that share the same buy product into a single row,
// summing the suggested consumption quantity. Used when the sell product is hidden.
function aggregateAutoItemsByBuyProduct_(items) {
  var map = {};
  var order = [];
  (items || []).forEach(function(item) {
    var code = String(item.productCode || '').trim();
    if (!code) return;
    if (!map[code]) {
      map[code] = {
        productCode: code,
        sellProductCode: '',
        sellProductName: '',
        consumptionRowKey: code,
        name: item.name,
        category: item.category,
        navCategory: item.navCategory,
        unit: item.unit,
        buyPrice: item.buyPrice,
        suggestedQuantity: 0,
        soldUnitsToday: 0,
        qtyPerServing: item.qtyPerServing || '',
        _sellCount: 0
      };
      order.push(code);
    }
    var agg = map[code];
    agg.suggestedQuantity += Number(item.suggestedQuantity) || 0;
    agg.soldUnitsToday += Number(item.soldUnitsToday) || 0;
    agg._sellCount += 1;
    // Qty per serving only meaningful when a single sell product feeds this buy product.
    if (agg._sellCount > 1) agg.qtyPerServing = '';
    return;
  });
  return order.map(function(code) { return map[code]; });
}

// Returns the auto-consumption rows for display, aggregated by buy product unless
// the user has enabled the sell-product breakdown.
function getAutoConsumptionDisplayItems_() {
  var sold = filterSoldAutoConsumptionItems(window._autoConsumptionItems);
  return window._showSellProduct ? sold : aggregateAutoItemsByBuyProduct_(sold);
}


function productHasBomRecipe_(product) {
  if (!product) return false;
  if (product.hasRecipe != null) return !!product.hasRecipe;
  var code = (product.productCode || '').toString().trim();
  if (!code) return false;
  var kf = (window._keyfigureItems || []).find(function(k) {
    return k.productCode && k.productCode === code;
  });
  if (kf && kf.hasRecipe != null) return !!kf.hasRecipe;
  return false;
}

function filterByRecipeFlag_(items) {
  if (!window._recipeOnlyFilter) return items || [];
  return (items || []).filter(function(item) { return productHasBomRecipe_(item); });
}

function consumptionRowKey_(productCode, sellProductCode) {
  var buy = String(productCode || '').trim();
  var sell = String(sellProductCode || '').trim();
  return sell ? (buy + '|' + sell) : buy;
}

function consumptionDataKeyForProduct_(product) {
  if (!product) return '';
  if (product.consumptionRowKey) return product.consumptionRowKey;
  if (product.sellProductCode) return consumptionRowKey_(product.productCode, product.sellProductCode);
  return product.productCode || '';
}

function consumptionQtyInputId_(dataKey) {
  return 'qty_' + encodeURIComponent(String(dataKey || ''));
}

function aggregateConsumptionDataForSave_(data) {
  var aggregated = {};
  Object.keys(data || {}).forEach(function(key) {
    var buyCode = key.indexOf('|') >= 0 ? key.split('|')[0] : key;
    aggregated[buyCode] = (aggregated[buyCode] || 0) + (Number(data[key]) || 0);
  });
  return aggregated;
}

function countUniqueBuyProductsInConsumptionData_(data) {
  var seen = {};
  Object.keys(data || {}).forEach(function(key) {
    var buyCode = key.indexOf('|') >= 0 ? key.split('|')[0] : key;
    seen[buyCode] = true;
  });
  return Object.keys(seen).length;
}

function _escapeJsString(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function _renderConsumptionQtyCell(product) {
  var dataKey = consumptionDataKeyForProduct_(product);
  var currentValue = consumptionData[dataKey] || '';
  var hasVal = currentValue !== '' && currentValue > 0;
  var escKey = _escapeJsString(dataKey);
  var inputId = consumptionQtyInputId_(dataKey);
  return '<td class="text-right"><input type="text" inputmode="decimal" class="qty-input' + (hasVal ? ' has-value' : '') + '" id="' + inputId + '" value="' + _formatQtyInputValue(hasVal ? currentValue : '') + '" placeholder="0" onchange="updateConsumption(\'' + escKey + '\', this.value)" onblur="updateConsumption(\'' + escKey + '\', this.value)" onfocus="this.select()"></td>';
}

function _parseDisplayNum(str) {
  return typeof parseLocaleNumber === 'function' ? parseLocaleNumber(str) : (parseFloat(str) || 0);
}

function _formatKeyfigureCell(val) {
  if (val === null || val === undefined || val === '' || val === '-') return '-';
  return typeof formatQty === 'function' ? formatQty(val) : val;
}

function _formatQtyInputValue(val) {
  if (val === '' || val === null || val === undefined) return '';
  var num = Number(val);
  if (isNaN(num) || num <= 0) return '';
  return typeof formatQty === 'function' ? formatQty(num) : String(num);
}

function _autoQtyPerServingDisplay(product) {
  return typeof formatConsumptionRatioDisplay === 'function'
    ? formatConsumptionRatioDisplay(
        product && product.qtyPerServing,
        product && product.suggestedQuantity,
        product && product.soldUnitsToday
      )
    : '-';
}

function _renderAutoConsumptionExtraCells(product) {
  var sold = product && product.soldUnitsToday != null && Number(product.soldUnitsToday) > 0
    ? formatQty(product.soldUnitsToday)
    : '-';
  var per = _autoQtyPerServingDisplay(product);
  return '<td class="text-right">' + sold + '</td>' +
    '<td class="text-right" style="color:#475569;font-size:0.92em;">' + per + '</td>';
}

function _renderKeyfigureCells(product) {
  var kf = (window._keyfigureItems || []).find(function(k) {
    if (!k.name && !k.productCode) return false;
    var prodName = (product.name || '').toString().trim().toLowerCase();
    var kfName = (k.name || '').toString().trim().toLowerCase();
    if (prodName && kfName && prodName === kfName) return true;
    if (product.productCode && k.productCode && product.productCode === k.productCode) return true;
    return false;
  });
  return '<td class="text-right">' + _formatKeyfigureCell(kf && kf.totalPurchased) + '</td>' +
    '<td class="text-right">' + _formatKeyfigureCell(kf && kf.totalConsumed) + '</td>' +
    '<td class="text-right">' + _formatKeyfigureCell(kf && kf.totalSold) + '</td>' +
    '<td class="text-right">' + _formatKeyfigureCell(kf && kf.remaining) + '</td>';
}

// Use categoryIcons from ui_core.html (already declared globally)

function showInventoryConsumption() {
  console.log('showInventoryConsumption called');
  const main = document.getElementById('main');
  if (!main) {
    console.error('Main element not found');
    return;
  }

  // Show loading
  main.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>Loading inventory consumption...</p></div>';

  // Single server call — one Orders scan + one Consumption scan (was 5 parallel calls).
  var deviceId = window.LoginState?.deviceId;
  var username = window.LoginState?.currentusername || window.LoginState?.user || window.currentUser;
  var loadBundle = function() {
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      return window.SecurityWrapper.secureServerCall('getDailyClosingBundleSecure', { deviceId: deviceId, username: username });
    }
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .getDailyClosingBundle(deviceId, username);
    });
  };
  loadBundle().then(function(bundle) {
    if (!bundle || bundle.success === false) {
      throw new Error((bundle && bundle.error) || 'Failed to load daily closing data');
    }
    buyTypeProducts = bundle.products || [];
    todaysSummary = bundle.summary || { totalItems: 0, totalQuantity: 0, items: [] };
    var autoPrefill = bundle.autoPrefill || {};
    window._autoConsumptionItems = filterSoldAutoConsumptionItems(autoPrefill.items || []);
    window._keyfigureItems = (bundle.keyfigures && bundle.keyfigures.items) || [];
    var spResult = bundle.smartPicks || window._smartPicksCache;
    if (spResult && !window._smartPicksCache) {
      window._smartPicksCache = spResult;
      console.log('⚡ Smart picks loaded inline:', (spResult.consumption || []).length, 'consumption');
    }
    window._topConsumedCodes = (window._smartPicksCache && window._smartPicksCache.consumption) || [];
    window.currentConsumptionCategory = null;
    window._autoConsumptionApplied = false;
    renderInventoryConsumption();
  }).catch(error => {
    console.error('Error loading inventory consumption data:', error);
    main.innerHTML = '<div class="error-state">Error loading data: ' + error + '</div>';
  });
}

window.showInventoryConsumption = showInventoryConsumption;
window.renderInventoryConsumption = renderInventoryConsumption;

function renderInventoryConsumption() {
  const main = document.getElementById('main');
  if (!main) return;

  // Add styles
  if (!document.getElementById('inventoryConsumptionStyles')) {
    const styleElement = document.createElement('style');
    styleElement.id = 'inventoryConsumptionStyles';
    styleElement.innerHTML = inventoryConsumptionStyles;
    document.head.appendChild(styleElement);
  }

  // Group products by POS category (for navigation tabs only; product.category is still used for recording)
  const productsByCategory = {};
  filterByRecipeFlag_(buyTypeProducts).forEach(function(product) {
    const navCat = (product.navCategory || product.category || (typeof t === 'function' ? t('uncategorized') : 'Uncategorized')).toString().trim() || (typeof t === 'function' ? t('uncategorized') : 'Uncategorized');
    if (!productsByCategory[navCat]) productsByCategory[navCat] = [];
    productsByCategory[navCat].push(product);
  });
  const sortedCategories = Object.keys(productsByCategory).sort();

  // Build Smart Picks from top consumed product codes
  var smartPicksKey = '__smart_picks__';
  var autoConsumptionKey = '__auto_consumption__';
  var autoProducts = getAutoConsumptionDisplayItems_().map(function(item) {
    var rowKey = consumptionRowKey_(item.productCode, item.sellProductCode);
    return {
      productCode: item.productCode,
      sellProductCode: item.sellProductCode || '',
      sellProductName: item.sellProductName || '',
      consumptionRowKey: rowKey,
      name: item.name,
      category: item.category,
      navCategory: item.navCategory,
      unit: item.unit,
      buyPrice: item.buyPrice,
      suggestedQuantity: item.suggestedQuantity,
      soldUnitsToday: item.soldUnitsToday,
      qtyPerServing: item.qtyPerServing || ''
    };
  });
  var smartProducts = [];
  if (window._topConsumedCodes && window._topConsumedCodes.length > 0) {
    var codeSet = {};
    window._topConsumedCodes.forEach(function(c) { codeSet[c] = true; });
    smartProducts = buyTypeProducts.filter(function(p) { return codeSet[p.productCode]; });
    // Preserve the ranking order from backend
    smartProducts.sort(function(a, b) {
      return window._topConsumedCodes.indexOf(a.productCode) - window._topConsumedCodes.indexOf(b.productCode);
    });
  }
  smartProducts = filterByRecipeFlag_(smartProducts);

  if (!window.currentConsumptionCategory) {
    window.currentConsumptionCategory = autoProducts.length > 0 ? autoConsumptionKey : (smartProducts.length > 0 ? smartPicksKey : (sortedCategories.length > 0 ? sortedCategories[0] : null));
  }

  if (window.currentConsumptionCategory === autoConsumptionKey && !window._autoConsumptionApplied) {
    applyAutoConsumptionPrefill();
    window._autoConsumptionApplied = true;
  }

  var isAutoConsumptionTab = window.currentConsumptionCategory === autoConsumptionKey;

  const currentItems = Object.keys(consumptionData);
  const currentTotal = currentItems.reduce(function(sum, code) { return sum + (consumptionData[code] || 0); }, 0);
  const currentBuyProductCount = countUniqueBuyProductsInConsumptionData_(consumptionData);

  var html = '<div class="inventory-consumption-container">';

  // Header with buttons
  html += '<div class="consumption-header">';
  html += '<h3>\ud83d\udccb ' + (typeof t === 'function' ? t('dailyClosing') : 'Daily Closing') + '</h3>';
  html += '<div class="consumption-header-btns">';

// Search/filter consumption table rows by product name — searches ALL products, not just current category
window._searchConsumptionTable = function() {
  var q = (document.getElementById('consumptionSearchInput') ? document.getElementById('consumptionSearchInput').value : '').toLowerCase().trim();
  if (!q) {
    // Empty search: restore current category view
    renderInventoryConsumption();
    // Re-focus the search box after re-render
    setTimeout(function() {
      var si = document.getElementById('consumptionSearchInput');
      if (si) si.focus();
    }, 50);
    return;
  }
  // Search across products for current view (auto / smart / all)
  var searchPool = filterByRecipeFlag_(buyTypeProducts || []);
  if (window.currentConsumptionCategory === '__auto_consumption__') {
    searchPool = getAutoConsumptionDisplayItems_().map(function(item) {
      var p = (buyTypeProducts || []).find(function(b) { return b.productCode === item.productCode; });
      var merged = Object.assign({}, p || {}, item);
      merged.productCode = item.productCode || (p && p.productCode);
      merged.name = item.name || (p && p.name);
      merged.consumptionRowKey = consumptionRowKey_(merged.productCode, merged.sellProductCode);
      return merged;
    });
  }
  var isAutoSearch = window.currentConsumptionCategory === '__auto_consumption__';
  var showSellCol = isAutoSearch && window._showSellProduct;
  var colSpan = isAutoSearch ? (showSellCol ? 7 : 6) : 8;
  var matched = searchPool.filter(function(p) {
    var haystack = ((p.name || p.productCode || '') + ' ' + (p.sellProductName || p.sellProductCode || '')).toLowerCase();
    return haystack.indexOf(q) !== -1;
  });
  var tbody = document.querySelector('#consumptionEntryTable tbody');
  if (!tbody) return;
  var rows = '';
  matched.forEach(function(product, idx) {
    rows += '<tr>';
    rows += '<td class="row-num">' + (idx + 1) + '</td>';
    rows += '<td class="product-name">' + (product.name || product.productCode) + '</td>';
    if (showSellCol) {
      rows += '<td class="sell-product-col">' + (product.sellProductName || product.sellProductCode || '-') + '</td>';
    }
    rows += '<td class="unit-col">' + (product.unit || '-') + '</td>';
    rows += _renderConsumptionQtyCell(product);
    rows += isAutoSearch ? _renderAutoConsumptionExtraCells(product) : _renderKeyfigureCells(product);
    rows += '</tr>';
  });
  if (matched.length === 0) {
    rows = '<tr><td colspan="' + colSpan + '" style="text-align:center;padding:20px;color:#94a3b8;">' + (typeof t === 'function' ? t('noResults') || 'No results found' : 'No results found') + '</td></tr>';
  }
  tbody.innerHTML = rows;
};

function updateConsumption(productCode, quantity) {
  const qty = typeof parseLocaleNumber === 'function' ? parseLocaleNumber(quantity) : (parseFloat(quantity) || 0);
  if (qty > 0) {
    consumptionData[productCode] = qty;
  } else {
    delete consumptionData[productCode];
  }
  
  // Update input styling
  var input = document.getElementById(consumptionQtyInputId_(productCode));
  if (input) {
    if (qty > 0) {
      input.classList.add('has-value');
      input.value = _formatQtyInputValue(qty);
    } else {
      input.classList.remove('has-value');
      input.value = '';
    }
  }
  
  // Update save button & summary bar
  var saveBtn = document.getElementById('saveConsumptionBtn');
  if (saveBtn) {
    var hasData = Object.keys(consumptionData).length > 0;
    saveBtn.disabled = !hasData;
    saveBtn.textContent = hasData ? 
      '\ud83d\udcbe ' + (typeof t === 'function' ? t('saveConsumption') : 'Save Consumption') : 
      '\ud83d\udcbe ' + (typeof t === 'function' ? t('noDataToSave') : 'No Data to Save');
  }
}

function saveConsumption() {
  const consumptionItems = Object.keys(consumptionData);
  if (consumptionItems.length === 0) {
    alert(typeof t === 'function' ? t('noConsumptionData') : 'Please enter consumption quantities for at least one product.');
    return;
  }

  // Show confirmation screen instead of saving directly
  _showSaveConfirmation();
}

  html += '<button class="confirm-btn-save" id="confirmSaveBtn" onclick="_doSaveConsumption()">\u2705 ' + (typeof t === 'function' ? t('confirmSave') : 'Confirm & Save') + '</button>';

function _doSaveConsumption() {
  if (window._savingConsumption) return;
  const aggregated = aggregateConsumptionDataForSave_(consumptionData);
  const consumptionItems = Object.keys(aggregated);
  const saveBtn = document.getElementById('confirmSaveBtn');
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = '\u23f3 ' + (typeof t === 'function' ? t('saving') : 'Saving...');
  }
  window._savingConsumption = true;
  if (!window._consumptionPendingRequestId) {
    window._consumptionPendingRequestId = 'ic-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }

  const submissionData = {
    items: consumptionItems.map(function(productCode) {
      return {
        productCode: productCode,
        quantity: aggregated[productCode]
      };
    }),
    clientRequestId: window._consumptionPendingRequestId
  };

  if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
    window.SecurityWrapper.secureServerCall('recordInventoryConsumptionSecure', submissionData)
      .then(function(result) {
        window._savingConsumption = false;
        window._consumptionPendingRequestId = null;
        if (result.success) {
          const main = document.getElementById('main');
          main.innerHTML = '<div class="confirm-container"><div class="success-message" style="padding:24px;font-size:1.1em;">\u2705 ' + (result.message || (typeof t === 'function' ? t('consumptionSaved') : 'Consumption data saved successfully!')) + '</div></div>';
          consumptionData = {};
          setTimeout(function() { showInventoryConsumption(); }, 2000);
        } else {
          throw new Error(result.message || 'Failed to save consumption data');
        }
      })
      .catch(function(error) {
        window._savingConsumption = false;
        if (error && error.toString().toLowerCase().includes('authentication')) {
          window.SecurityWrapper.forceLogout();
        } else {
          var actionsDiv = document.querySelector('.confirm-actions');
          if (actionsDiv) {
            actionsDiv.insertAdjacentHTML('beforebegin', '<div class="error-message" style="margin:0 24px 0;">\u274c ' + (typeof t === 'function' ? t('saveFailed') : 'Failed to save') + ': ' + (error.message || error) + '</div>');
          }
        }
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '\u2705 ' + (typeof t === 'function' ? t('confirmSave') : 'Confirm & Save');
        }
      });
  } else {
    window._savingConsumption = false;
    var actionsDiv = document.querySelector('.confirm-actions');
    if (actionsDiv) {
      actionsDiv.insertAdjacentHTML('beforebegin', '<div class="error-message" style="margin:0 24px 0;">\u274c Security system not available. Please refresh the page.</div>');
    }
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = '\u2705 ' + (typeof t === 'function' ? t('confirmSave') : 'Confirm & Save');
    }
  }
}

  html += '</select>';
  if (groupBy !== 'none') {
    html += '<button class="consumption-btn" style="background:#e2e8f0;color:#1e293b;font-size:12px;" onclick="window._toggleAllGroups(true)">' + (typeof t === 'function' ? t('expandAll') : 'Expand All') + '</button>';
    html += '<button class="consumption-btn" style="background:#e2e8f0;color:#1e293b;font-size:12px;" onclick="window._toggleAllGroups(false)">' + (typeof t === 'function' ? t('collapseAll') : 'Collapse All') + '</button>';
  }
  html += '</div>';

  if (data.length === 0) {
    html += '<div class="no-data-msg">\ud83d\udcdd ' + (typeof t === 'function' ? t('noConsumptionHistory') : 'No consumption history found.') + '</div>';
  } else {
    html += '<div class="history-table-wrapper" id="consumptionHistoryTable">';
    html += _buildHistoryTable(data, groupBy);
    html += '</div>';
  }

  html += '</div>';
  main.innerHTML = html;

  // Auto-collapse top-level groups (sub-groups stay expanded internally)
  if (groupBy !== 'none') {
    document.querySelectorAll('.history-group-header').forEach(function(header) {
      var gid = header.getAttribute('data-group');
      if (!gid) return;
      header.classList.add('collapsed');
      // Hide everything under this top-level group (visually hidden, but sub-groups keep expanded state)
      document.querySelectorAll('[data-parent="' + gid + '"]').forEach(function(row) {
        row.classList.add('group-row-hidden');
        // Also hide sub-group children (since parent group is collapsed)
        var subGid = row.getAttribute('data-group');
        if (subGid) {
          document.querySelectorAll('[data-parent="' + subGid + '"]').forEach(function(child) {
            child.classList.add('group-row-hidden');
          });
        }
      });
    });
  }
}

function _buildHistoryTable(data, groupBy) {
  var sortCol = window._historySortCol;
  var sortAsc = window._historySortAsc;
  function arrow(col) {
    if (sortCol !== col) return ' \u2195';
    return sortAsc ? ' \u2191' : ' \u2193';
  }

  var html = '<table class="history-table">';
  html += '<thead><tr>';
  html += '<th onclick="window._sortHistory(\'date\')" style="text-align:left;">' + (typeof t === 'function' ? t('date') : 'Date') + arrow('date') + '</th>';
  html += '<th onclick="window._sortHistory(\'product\')" style="text-align:left;">' + (typeof t === 'function' ? t('product') : 'Product') + arrow('product') + '</th>';
  html += '<th onclick="window._sortHistory(\'productCode\')" style="text-align:left;">' + (typeof t === 'function' ? t('productCode') : 'Product Code') + arrow('productCode') + '</th>';
  html += '<th onclick="window._sortHistory(\'quantity\')" style="text-align:right;">' + (typeof t === 'function' ? t('quantity') : 'Quantity') + arrow('quantity') + '</th>';
  html += '<th onclick="window._sortHistory(\'user\')" style="text-align:left;">' + (typeof t === 'function' ? t('user') : 'User') + arrow('user') + '</th>';
  html += '</tr></thead>';
  html += '<tbody>';

  if (groupBy === 'none') {
    data.forEach(function(entry) {
      html += _historyRow(entry);
    });
  } else if (groupBy === 'product') {
    var groups = _groupByProduct(data);
    Object.keys(groups).sort().forEach(function(product) {
      var gid = 'g_' + product.replace(/\W/g, '_');
      var totalQty = groups[product].reduce(function(s, e) { return s + (parseFloat(e.quantity) || 0); }, 0);
      html += '<tr class="history-group-header" data-group="' + gid + '" onclick="window._toggleGroup(\'' + gid + '\')">';
      html += '<td colspan="3"><span class="toggle-icon">\u25bc</span> \ud83d\udce6 ' + product + '</td>';
      html += '<td style="text-align:right;font-weight:700;">' + formatQty(totalQty) + '</td>';
      html += '<td>' + groups[product].length + ' ' + (typeof t === 'function' ? t('records') : 'records') + '</td></tr>';
      groups[product].forEach(function(entry) {
        html += _historyRow(entry, gid);
      });
    });
  } else if (groupBy === 'monthProduct') {
    // Level 1: Month, Level 2: Product
    var monthGroups = _groupByMonth(data);
    Object.keys(monthGroups).sort().reverse().forEach(function(month) {
      var gid = 'g_' + month.replace(/\W/g, '_');
      var totalQty = monthGroups[month].reduce(function(s, e) { return s + (parseFloat(e.quantity) || 0); }, 0);
      html += '<tr class="history-group-header" data-group="' + gid + '" onclick="window._toggleGroup(\'' + gid + '\')">';
      html += '<td colspan="3"><span class="toggle-icon">\u25bc</span> \ud83d\udcc5 ' + month + '</td>';
      html += '<td style="text-align:right;font-weight:700;">' + formatQty(totalQty) + '</td>';
      html += '<td>' + monthGroups[month].length + ' ' + (typeof t === 'function' ? t('records') : 'records') + '</td></tr>';
      // Sub-group by product within this month
      var subGroups = _groupByProduct(monthGroups[month]);
      Object.keys(subGroups).sort().forEach(function(product) {
        var sgid = gid + '_' + product.replace(/\W/g, '_');
        var subQty = subGroups[product].reduce(function(s, e) { return s + (parseFloat(e.quantity) || 0); }, 0);
        html += '<tr class="history-sub-group-header" data-group="' + sgid + '" data-parent="' + gid + '" onclick="event.stopPropagation();window._toggleGroup(\'' + sgid + '\')">';
        html += '<td colspan="3"><span class="toggle-icon">\u25bc</span> \ud83d\udce6 ' + product + '</td>';
        html += '<td style="text-align:right;font-weight:600;">' + formatQty(subQty) + '</td>';
        html += '<td>' + subGroups[product].length + '</td></tr>';
        subGroups[product].forEach(function(entry) {
          html += _historyRow(entry, sgid);
        });
      });
    });
  } else if (groupBy === 'productMonth') {
    // Level 1: Product, Level 2: Month
    var productGroups = _groupByProduct(data);
    Object.keys(productGroups).sort().forEach(function(product) {
      var gid = 'g_' + product.replace(/\W/g, '_');
      var totalQty = productGroups[product].reduce(function(s, e) { return s + (parseFloat(e.quantity) || 0); }, 0);
      html += '<tr class="history-group-header" data-group="' + gid + '" onclick="window._toggleGroup(\'' + gid + '\')">';
      html += '<td colspan="3"><span class="toggle-icon">\u25bc</span> \ud83d\udce6 ' + product + '</td>';
      html += '<td style="text-align:right;font-weight:700;">' + formatQty(totalQty) + '</td>';
      html += '<td>' + productGroups[product].length + ' ' + (typeof t === 'function' ? t('records') : 'records') + '</td></tr>';
      // Sub-group by month within this product
      var subGroups = _groupByMonth(productGroups[product]);
      Object.keys(subGroups).sort().reverse().forEach(function(month) {
        var sgid = gid + '_' + month.replace(/\W/g, '_');
        var subQty = subGroups[month].reduce(function(s, e) { return s + (parseFloat(e.quantity) || 0); }, 0);
        html += '<tr class="history-sub-group-header" data-group="' + sgid + '" data-parent="' + gid + '" onclick="event.stopPropagation();window._toggleGroup(\'' + sgid + '\')">';
        html += '<td colspan="3"><span class="toggle-icon">\u25bc</span> \ud83d\udcc5 ' + month + '</td>';
        html += '<td style="text-align:right;font-weight:600;">' + formatQty(subQty) + '</td>';
        html += '<td>' + subGroups[month].length + '</td></tr>';
        subGroups[month].forEach(function(entry) {
          html += _historyRow(entry, sgid);
        });
      });
    });
  }

  html += '</tbody></table>';
  return html;
}

// Grouping helpers
function _groupByMonth(data) {
  var groups = {};
  data.forEach(function(entry) {
    var d = entry.timestamp ? new Date(entry.timestamp) : null;
    var key = d ? (d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')) : 'Unknown';
    if (!groups[key]) groups[key] = [];
    groups[key].push(entry);
  });
  return groups;
}

function _groupByProduct(data) {
  var groups = {};
  data.forEach(function(entry) {
    var key = entry.productName || entry.productCode || 'Unknown';
    if (!groups[key]) groups[key] = [];
    groups[key].push(entry);
  });
  return groups;
}

function _historyRow(entry, groupId) {
  var cls = groupId ? ' class="group-child" data-parent="' + groupId + '"' : '';
  var html = '<tr' + cls + '>';
  html += '<td>' + formatDisplayDate(entry.timestamp) + '</td>';
  html += '<td style="font-weight:600;">' + (entry.productName || entry.productCode) + '</td>';
  html += '<td style="color:#64748b;font-size:0.85em;">' + (entry.productCode || '') + '</td>';
  html += '<td style="text-align:right;">' + formatQty(entry.quantity) + '</td>';
  html += '<td>' + (entry.username || 'N/A') + '</td>';
  html += '</tr>';
  return html;
}

// Toggle a group (collapse/expand)
window._toggleGroup = function(gid) {
  var header = document.querySelector('[data-group="' + gid + '"]');
  if (!header) return;
  var isCollapsed = header.classList.contains('collapsed');

  if (isCollapsed) {
    // Expand
    header.classList.remove('collapsed');
    // Show direct children
    document.querySelectorAll('[data-parent="' + gid + '"]').forEach(function(row) {
      row.classList.remove('group-row-hidden');
      // If it's a sub-group header that was expanded, also show its children
      var subGid = row.getAttribute('data-group');
      if (subGid && !row.classList.contains('collapsed')) {
        document.querySelectorAll('[data-parent="' + subGid + '"]').forEach(function(child) {
          child.classList.remove('group-row-hidden');
        });
      }
    });
  } else {
    // Collapse
    header.classList.add('collapsed');
    // Hide all direct children and their nested children
    document.querySelectorAll('[data-parent="' + gid + '"]').forEach(function(row) {
      row.classList.add('group-row-hidden');
      // Also hide nested children of sub-groups
      var subGid = row.getAttribute('data-group');
      if (subGid) {
        document.querySelectorAll('[data-parent="' + subGid + '"]').forEach(function(child) {
          child.classList.add('group-row-hidden');
        });
      }
    });
  }
};

// Toggle all groups expand/collapse
window._toggleAllGroups = function(expand) {
  var headers = document.querySelectorAll('.history-group-header, .history-sub-group-header');
  headers.forEach(function(header) {
    var gid = header.getAttribute('data-group');
    if (!gid) return;
    if (expand) {
      header.classList.remove('collapsed');
      document.querySelectorAll('[data-parent="' + gid + '"]').forEach(function(row) {
        row.classList.remove('group-row-hidden');
      });
    } else {
      header.classList.add('collapsed');
      document.querySelectorAll('[data-parent="' + gid + '"]').forEach(function(row) {
        row.classList.add('group-row-hidden');
      });
    }
  });
};

// Sort history
window._sortHistory = function(col) {
  if (window._historySortCol === col) {
    window._historySortAsc = !window._historySortAsc;
  } else {
    window._historySortCol = col;
    window._historySortAsc = true;
  }
  window._applyHistorySort();
  renderConsumptionHistory();
};

window._applyHistorySort = function() {
  var col = window._historySortCol;
  if (!col) {
    window._historyFiltered = window._historyData.slice();
    return;
  }
  var asc = window._historySortAsc;
  window._historyFiltered = window._historyData.slice().sort(function(a, b) {
    var va, vb;
    if (col === 'date') {
      va = a.timestamp ? new Date(a.timestamp).getTime() : 0;
      vb = b.timestamp ? new Date(b.timestamp).getTime() : 0;
    } else if (col === 'product') {
      va = (a.productName || a.productCode || '').toLowerCase();
      vb = (b.productName || b.productCode || '').toLowerCase();
    } else if (col === 'productCode') {
      va = (a.productCode || '').toLowerCase();
      vb = (b.productCode || '').toLowerCase();
    } else if (col === 'quantity') {
      va = parseFloat(a.quantity) || 0;
      vb = parseFloat(b.quantity) || 0;
    } else if (col === 'user') {
      va = (a.username || '').toLowerCase();
      vb = (b.username || '').toLowerCase();
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
};

// Print consumption history (mobile-safe overlay)
window._printConsumptionHistory = function() {
  var wrapper = document.getElementById('consumptionHistoryTable');
  if (!wrapper) return;
  var tableHtml = window.cloneElementHtmlForPrint
    ? window.cloneElementHtmlForPrint(wrapper)
    : wrapper.innerHTML;
  var title = typeof t === 'function' ? t('consumptionHistory') : 'Consumption History';
  var extraStyles = '#printReportBody .history-group-header{background:#e2e8f0!important;font-weight:700;} #printReportBody .history-group-header td{border-bottom:2px solid #cbd5e1;}';
  if (typeof window.printHtmlReport === 'function') {
    window.printHtmlReport('\ud83d\udcca ' + title, tableHtml, { extraStyles: extraStyles });
  }
};

window._sortConsumption = function(col) {
  if (window._consumptionSortCol === col) {
    window._consumptionSortAsc = !window._consumptionSortAsc;
  } else {
    window._consumptionSortCol = col;
    window._consumptionSortAsc = true;
  }
  renderInventoryConsumption();
};

function applyAutoConsumptionPrefill() {
  getAutoConsumptionDisplayItems_().forEach(function(item) {
    var q = Number(item.suggestedQuantity) || 0;
    if (q > 0) {
      consumptionData[consumptionDataKeyForProduct_(item)] = q;
    }
  });
}

// Remove any prefilled auto-consumption entries (both aggregated and per-sell key
// formats) so the two views never double-count the same buy product on save.
function clearAutoConsumptionPrefill_() {
  filterSoldAutoConsumptionItems(window._autoConsumptionItems).forEach(function(item) {
    delete consumptionData[String(item.productCode || '').trim()];
    delete consumptionData[consumptionRowKey_(item.productCode, item.sellProductCode)];
  });
}

function switchConsumptionCategory(category) {
  window.currentConsumptionCategory = category;
  if (category === '__auto_consumption__') {
    applyAutoConsumptionPrefill();
    window._autoConsumptionApplied = true;
  }
  renderInventoryConsumption();
}

window._toggleRecipeOnlyFilter = function(checked) {
  window._recipeOnlyFilter = !!checked;
  renderInventoryConsumption();
};

window._toggleShowSellProduct = function(checked) {
  window._showSellProduct = !!checked;
  // Re-derive the auto prefill for the new grouping so quantities are keyed correctly.
  clearAutoConsumptionPrefill_();
  applyAutoConsumptionPrefill();
  window._autoConsumptionApplied = true;
  renderInventoryConsumption();
};

function formatDisplayDate(dateString) {
  if (!dateString) return 'N/A';
  try {
    const date = new Date(dateString);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
  } catch (error) {
    return dateString;
  }
}

// Initialize when document is ready
if (typeof document !== 'undefined') {
  document.addEventListener('DOMContentLoaded', function() {
    consumptionData = {};
  });
}
</script>
