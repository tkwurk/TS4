<script>
/**
 * ✅ CLEAN LOGIN SYSTEM - Google Apps Script Compatible
 * Designed for multi-user access on shared devices
 * Single source of truth for authentication
 */

// Clean login state for current session
window.LoginState = {
  isLoggedIn: false,
  user: null,
  outlet: null,
  allowedTabs: [],
  deviceId: null,
  loginTime: null
};

var _loginInFlight = false;
var _loginSeq = 0;
var _resumeSeq = 0;

/**
 * Single, simplified login function for Google Apps Script
 */
function cleanLogin(username, password) {
  console.log('🔍 Clean login started for:', username);

  if (_loginInFlight) {
    console.warn('Login already in progress — ignoring duplicate submit');
    showLoginStatus('Login in progress…', 'loading');
    return false;
  }

  var previousUser = LoginState.user;
  var previousDeviceId = LoginState.deviceId;
  var loginSeq = ++_loginSeq;
  _loginInFlight = true;
  ++_resumeSeq;
  setLoginFormDisabled_(true);
  
  // Clear any previous state (client caches + cookies)
  clearLoginState();
  clearClientCachesForUserSwitch_();
  
  // Show loading
  showLoginStatus('Logging in...', 'loading');
  
  if (!username || !password) {
    _loginInFlight = false;
    setLoginFormDisabled_(false);
    console.log('❌ Missing credentials');
    showLoginStatus('Please enter both username and code', 'error');
    return false;
  }
  
  // Generate session-specific device ID for multi-user support
  const deviceId = generateSessionDeviceId(username);
  console.log('🔑 Generated device ID:', deviceId);
  
  function finishLoginAttempt_() {
    if (loginSeq === _loginSeq) {
      _loginInFlight = false;
      setLoginFormDisabled_(false);
    }
  }

  // Use the clean authentication function from backend
  google.script.run
    .withSuccessHandler(function(result) {
      if (loginSeq !== _loginSeq) {
        console.warn('Ignoring stale login response');
        return;
      }
      finishLoginAttempt_();
      console.log('Authentication result:', result);
      
      if (result && result.success) {
        var resolvedDeviceId = result.deviceId || deviceId;

        // End prior user's server session only after new login succeeds (different user)
        if (previousUser && previousDeviceId &&
            previousUser.toLowerCase() !== String(result.username || '').toLowerCase()) {
          console.log('🔁 Ending prior browser session for:', previousUser);
          google.script.run
            .withFailureHandler(function(err) {
              console.warn('Could not end prior session (non-fatal):', err);
            })
            .endBrowserSessionForUser(previousDeviceId, previousUser);
        }

        setLoginState({
          username: result.username,
          outlet: result.outlet,
          allowedTabs: result.allowedTabs || [],
          role: result.role || 'cashier',
          deviceId: resolvedDeviceId
        });

        if (typeof window.initPaymentMethodsCache === 'function') {
          window.initPaymentMethodsCache(resolvedDeviceId, result.username);
        }
        
        showLoginStatus('Login successful!', 'success');
        setTimeout(function() {
          showApp();
          if (window.preloadCommonData) {
            setTimeout(function() { window.preloadCommonData(); }, 500);
          }
        }, 300);
        
      } else {
        const errorMsg = result ? (result.message || 'Invalid credentials') : 'No response from server';
        console.error('Login failed:', errorMsg);
        showLoginStatus(errorMsg, 'error');
      }
    })
    .withFailureHandler(function(error) {
      if (loginSeq !== _loginSeq) return;
      finishLoginAttempt_();
      console.error('Login error:', error);
      showLoginStatus('Login failed: ' + error.toString(), 'error');
    })
    .authenticateUserClean(username.trim(), password.trim(), deviceId);
  
  return false;
}

function setLoginFormDisabled_(disabled) {
  var userEl = document.getElementById('loginUser');
  var codeEl = document.getElementById('loginCode');
  var submitBtn = document.querySelector('#loginForm button[type="submit"], #loginForm input[type="submit"]');
  if (userEl) userEl.disabled = !!disabled;
  if (codeEl) codeEl.disabled = !!disabled;
  if (submitBtn) submitBtn.disabled = !!disabled;
}

/**
 * Session validation using existing Google Apps Script functions
 */
function validateCurrentSession() {
  if (!LoginState.deviceId || !LoginState.user) {
    return Promise.resolve(false);
  }
  
  return new Promise((resolve) => {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.valid && result.username === LoginState.user) {
          // Session is still valid, update state
          setLoginState({
            username: result.username,
            outlet: result.outlet,
            allowedTabs: result.allowedTabs || [],
            role: result.role || LoginState.role || 'cashier',
            deviceId: LoginState.deviceId
          });
          resolve(true);
        } else {
          clearLoginState();
          resolve(false);
        }
      })
      .withFailureHandler(function(error) {
        console.error('Session validation error:', error);
        clearLoginState();
        resolve(false);
      })
      .validateUserSession(LoginState.deviceId, LoginState.user);
  });
}

/**
 * Clean logout using existing Google Apps Script functions
 * EXPLICIT logout: clears server-side active_session so refresh won't resume
 */
function cleanLogout() {
  const currentDeviceId = LoginState.deviceId;
  const currentUser = LoginState.user;
  
  // Clear local state immediately (cookie + sessionStorage)
  clearLoginState();
  clearClientCachesForUserSwitch_();
  
  if (currentDeviceId && currentUser) {
    // Notify server about EXPLICIT logout - this clears active_session_{username}
    // Page refresh will NOT call this, so the server session stays active
    google.script.run
      .withSuccessHandler(function(result) {
        console.log('Logout successful:', result);
      })
      .withFailureHandler(function(error) {
        console.error('Logout error:', error);
      })
      .logoutUser(currentDeviceId, currentUser);
  }
  
  // Always show login screen
  showLogin();
}

/**
 * Set login state from server response
 * Persists username via cookie and sessionStorage for page refresh recovery
 * Server-side active_session_{username} handles the actual session data
 */
function normalizeClientAllowedTabs_(allowedTabs, role) {
  var list = Array.isArray(allowedTabs) ? allowedTabs.slice() : [];
  var r = (role || 'cashier').toString().trim().toLowerCase();
  if (r === 'admin' || list.indexOf('*') >= 0 || list.indexOf('admin') >= 0) {
    return ['*'];
  }
  return list;
}

function setLoginState(data) {
  console.log('🔧 Setting login state:', data);
  
  LoginState.isLoggedIn = true;
  LoginState.user = data.username;
  LoginState.outlet = data.outlet;
  LoginState.role = data.role || 'cashier';
  LoginState.allowedTabs = normalizeClientAllowedTabs_(data.allowedTabs, LoginState.role);
  LoginState.deviceId = data.deviceId;
  LoginState.loginTime = Date.now();

  try {
    localStorage.setItem('lastUsername', data.username);
    localStorage.setItem('lastLoginTime', String(LoginState.loginTime));
  } catch (e) {}

  if (window.clearSellProductsCache && typeof window.clearSellProductsCache === 'function') {
    window.clearSellProductsCache();
  }
  
  if (!data.outlet) {
    console.warn('⚠️ Login state has no outlet — assign outlet on People sheet');
  }
  
  // Persist username for page refresh recovery
  // Cookie: survives iframe reloads, 24hr expiry
  try {
    var expires = new Date(Date.now() + 24 * 60 * 60 * 1000).toUTCString();
    document.cookie = 'pos_username=' + encodeURIComponent(data.username) + '; expires=' + expires + '; path=/; SameSite=None; Secure';
    console.log('Cookie saved for:', data.username);
  } catch (e) {
    console.warn('Could not save cookie:', e);
  }
  // sessionStorage: persists within same tab across reloads
  try {
    sessionStorage.setItem('pos_username', data.username);
  } catch (e) {
    console.warn('Could not save sessionStorage:', e);
  }
  
  // Update user display in navigation
  updateUserDisplay();
  
  // Update tab visibility based on permissions
  updateTabVisibility();
  
  // Set global variables for backward compatibility with existing code
  window.isLoggedIn = true;
  window.currentUser = data.username;
  window.currentOutlet = data.outlet;
  window.allowedTabs = LoginState.allowedTabs;
  window.currentRole = LoginState.role;
  
  try {
    window.dispatchEvent(new CustomEvent('loginSuccess', { detail: { user: LoginState.user, role: LoginState.role } }));
  } catch (e) {}
  
  console.log('✅ Login successful: ' + data.username + ' at ' + data.outlet);
  
  // Load smart picks cache (once per login, background)
  _loadSmartPicksCache();
}

function clearClientCachesForUserSwitch_() {
  window._cachedPaymentMethods = null;
  window._paymentMethodsPromise = null;
  window._smartPicksCache = null;
  window._smartPicksInitialSet = false;
  try {
    localStorage.removeItem('lastUsername');
    localStorage.removeItem('lastLoginTime');
  } catch (e) {}
  if (window.AppCache && typeof window.AppCache.clear === 'function') {
    try { window.AppCache.clear(); } catch (e) {}
  }
  if (window.clearSellProductsCache && typeof window.clearSellProductsCache === 'function') {
    try { window.clearSellProductsCache(); } catch (e) {}
  }
}

/**
 * Clear all login state (client-side only)
 * Does NOT clear server-side active_session - that's only cleared by explicit logout
 */
function clearLoginState() {
  LoginState.isLoggedIn = false;
  LoginState.user = null;
  LoginState.outlet = null;
  LoginState.role = 'cashier';
  LoginState.allowedTabs = [];
  LoginState.deviceId = null;
  LoginState.loginTime = null;
  
  // Clear persisted username from cookie
  try {
    document.cookie = 'pos_username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=None; Secure';
  } catch (e) {}
  // Clear sessionStorage
  try {
    sessionStorage.removeItem('pos_username');
  } catch (e) {}
  
  // Clear global variables
  window.isLoggedIn = false;
  window.currentUser = null;
  window.currentOutlet = null;
  window.currentRole = 'cashier';
  window.allowedTabs = [];
  
  console.log('🔄 Login state cleared');
}

/**
 * Generate session-specific device ID for multi-user support
 * Each login session gets a unique device ID to prevent user mixing
 */
function generateSessionDeviceId(username) {
  const timestamp = Date.now();
  const randomId = Math.random().toString(36).substring(2, 15);
  const safeUsername = username.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  
  return `device_${timestamp}_session_${randomId}_user_${safeUsername}`;
}

/**
 * Helper: read a named cookie value
 */
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

/**
 * Session resumption for page refresh
 * Reads username from cookie/sessionStorage, then asks server for active session
 * Server keeps active_session_{username} until explicit logout, so refresh survives
 */
function attemptSessionResumption() {
  console.log('🔄 Attempting session resumption...');

  if (LoginState.isLoggedIn && LoginState.user && LoginState.deviceId) {
    console.log('✅ Already logged in, skipping session resumption');
    return;
  }
  
  var savedUsername = null;
  
  // Try sessionStorage first (same-tab reload)
  try {
    savedUsername = sessionStorage.getItem('pos_username');
  } catch (e) {}
  
  // Fallback: try cookie
  if (!savedUsername) {
    try {
      savedUsername = getCookie('pos_username');
    } catch (e) {}
  }
  
  if (savedUsername) {
    console.log('💾 Found saved username:', savedUsername, '- checking server for active session...');
    var resumeSeq = ++_resumeSeq;
    resumeFromServer(savedUsername, resumeSeq);
    return;
  }
  
  console.log('❌ No saved username found, showing login');
  showLogin();
}

/**
 * Ask server for active session by username
 * Server returns full session data if active_session_{username} exists and is valid
 */
function resumeFromServer(username, resumeSeq) {
  google.script.run
    .withSuccessHandler(function(result) {
      if (_loginInFlight || (resumeSeq && resumeSeq !== _resumeSeq)) {
        console.log('Skipping stale session resume');
        return;
      }
      if (LoginState.isLoggedIn && LoginState.user && LoginState.deviceId) {
        console.log('Skipping session resume — already logged in as', LoginState.user);
        return;
      }
      if (result && result.valid) {
        console.log('✅ Server session active, resuming for:', result.username);
        setLoginState({
          username: result.username,
          outlet: result.outlet,
          allowedTabs: result.allowedTabs || [],
          role: result.role || 'cashier',
          deviceId: result.deviceId
        });
        if (typeof window.initPaymentMethodsCache === 'function') {
          window.initPaymentMethodsCache(result.deviceId, result.username);
        }
        showApp();
      } else {
        console.log('❌ No active server session:', result ? result.reason : 'no result');
        if (_loginInFlight || LoginState.isLoggedIn) return;
        clearPersistedSession();
        showLogin();
      }
    })
    .withFailureHandler(function(error) {
      console.error('Session resume error:', error);
      if (_loginInFlight || LoginState.isLoggedIn) return;
      clearPersistedSession();
      showLogin();
    })
    .resumeSessionByUsername(username);
}

/**
 * Clear persisted session data from cookie and sessionStorage
 */
function clearPersistedSession() {
  try { document.cookie = 'pos_username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=None; Secure'; } catch (e) {}
  try { sessionStorage.removeItem('pos_username'); } catch (e) {}
}

/**
 * UI Management Functions
 */
function showLogin() {
  const loginModal = document.getElementById('loginModal');
  const appContent = document.getElementById('appContent');
  const initialLoading = document.getElementById('initialLoading');
  
  if (loginModal) loginModal.style.display = 'flex';
  if (appContent) appContent.style.display = 'none';
  if (initialLoading) initialLoading.style.display = 'none';
  if (window.SnowbeeI18n && typeof window.SnowbeeI18n.applyLoginI18n === 'function') {
    window.SnowbeeI18n.applyLoginI18n();
  }
  
  // Clear any login status
  showLoginStatus('', 'hidden');
  
  // Focus on username field
  setTimeout(() => {
    const loginUser = document.getElementById('loginUser');
    if (loginUser) loginUser.focus();
  }, 100);
}

function showApp() {
  const loginModal = document.getElementById('loginModal');
  const appContent = document.getElementById('appContent');
  const initialLoading = document.getElementById('initialLoading');
  
  if (loginModal) loginModal.style.display = 'none';
  if (appContent) appContent.style.display = 'block';
  if (initialLoading) initialLoading.style.display = 'none';
  
  // Update user display
  updateUserDisplay();
  
  // Update tab visibility
  updateTabVisibility();
  
  // Sync language dropdown and tab labels
  var languageSelect = document.getElementById('languageSelect');
  if (languageSelect) languageSelect.value = lang || 'id';
  if (typeof updateTabLabels === 'function') updateTabLabels();
  
  // Ensure authentication state is properly set before switching tabs
  console.log('🔍 Authentication check before tab switch:', {
    isLoggedIn: LoginState.isLoggedIn,
    isUserAuthenticated: isUserAuthenticated(),
    isSessionValid: isSessionValid(),
    user: LoginState.user,
    deviceId: LoginState.deviceId
  });
  
  // Switch to role-appropriate default tab when authenticated
  if (typeof switchTab === 'function' && isUserAuthenticated()) {
    setTimeout(function() {
      var defaultTab = (window.SnowbeeRoleNav && window.SnowbeeRoleNav.getDefaultTab)
        ? window.SnowbeeRoleNav.getDefaultTab()
        : ((window.SnowbeeAccess && window.SnowbeeAccess.getAccessibleDefaultTab)
          ? window.SnowbeeAccess.getAccessibleDefaultTab()
          : 'orders');
      switchTab(defaultTab, { silentDeny: true, fallback: true });
    }, 100);
  } else {
    console.error('❌ Cannot switch to orders - not authenticated');
  }
}

function showLoginStatus(message, type) {
  let statusDiv = document.getElementById('loginStatus');
  
  if (!statusDiv) {
    statusDiv = document.createElement('div');
    statusDiv.id = 'loginStatus';
    statusDiv.style.cssText = `
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: 500;
    `;
    
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.appendChild(statusDiv);
    }
  }
  
  if (type === 'hidden') {
    statusDiv.style.display = 'none';
    return;
  }
  
  statusDiv.style.display = 'block';
  statusDiv.textContent = message;
  
  switch (type) {
    case 'loading':
      statusDiv.style.cssText += 'background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb;';
      break;
    case 'success':
      statusDiv.style.cssText += 'background: #e8f5e8; color: #2e7d32; border: 1px solid #c8e6c9;';
      break;
    case 'error':
      statusDiv.style.cssText += 'background: #ffebee; color: #c62828; border: 1px solid #ffcdd2;';
      break;
  }
}

function updateUserDisplay() {
  const currentUserDisplay = document.getElementById('currentUserDisplay');
  const userDisplay = document.getElementById('userDisplay'); // Add support for new navigation
  const currentOutletDisplay = document.getElementById('currentOutletDisplay');
  const userInfo = document.getElementById('userInfo');
  
  const userName = LoginState.user || LoginState.currentusername || window.currentUser || '';
  
  if (currentUserDisplay) currentUserDisplay.textContent = userName;
  if (userDisplay) userDisplay.textContent = userName; // Update new navigation user display
  if (currentOutletDisplay) currentOutletDisplay.textContent = LoginState.outlet || '';
  if (userInfo) userInfo.style.display = LoginState.isLoggedIn ? 'flex' : 'none';
  
  console.log('Updated user display with:', userName);
}

function updateTabVisibility() {
  if (window.SnowbeeAccess && typeof window.SnowbeeAccess.updateTabVisibility === 'function') {
    window.SnowbeeAccess.updateTabVisibility();
  }
  if (window.SnowbeeRoleNav && typeof window.SnowbeeRoleNav.organizeSidebar === 'function') {
    window.SnowbeeRoleNav.organizeSidebar();
  }
}

/**
 * Replace the old login function
 */
function doLogin(event) {
  event.preventDefault();
  
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginCode').value.trim();
  
  console.log('📝 Form values - Username:', username, 'Password length:', password.length);
  
  if (!username || !password) {
    showLoginStatus('Please enter both username and code', 'error');
    return false;
  }
  
  // Call cleanLogin with the actual values, not the event
  cleanLogin(username, password);
  return false;
}

/**
 * Replace the old logout function
 */
function doLogout() {
  cleanLogout();
}

// Make this available globally too
window.forceShowAdminTab = forceShowAdminTab;

/**
 * Check if user is authenticated (SecurityWrapper compatibility)
 * This function must be available immediately
 */
function isUserAuthenticated() {
  if (LoginState.isLoggedIn && LoginState.user && !window.currentUser) {
    window.currentUser = LoginState.user;
  }
  if (LoginState.isLoggedIn && LoginState.user && !window.currentOutlet && LoginState.outlet) {
    window.currentOutlet = LoginState.outlet;
  }
  return !!(LoginState.isLoggedIn && LoginState.user && LoginState.deviceId);
}

/**
 * Check if session is valid (SecurityWrapper compatibility)
 * This function must be available immediately
 */
function isSessionValid() {
  // If no login time, check if we at least have user data (fresh login)
  if (!LoginState.loginTime) {
    // For fresh logins, if we have user data, consider it valid temporarily
    const hasFreshLogin = !!(LoginState.user && LoginState.deviceId && LoginState.isLoggedIn);
    console.log('❓ No login time, checking fresh login:', hasFreshLogin);
    return hasFreshLogin;
  }
  
  // Normal session age check
  const sessionAge = Date.now() - LoginState.loginTime;
  const isValid = sessionAge < 4 * 60 * 60 * 1000; // 4 hours
  
  console.log('🔍 Session validation:', {
    loginTime: LoginState.loginTime,
    sessionAge: Math.floor(sessionAge / 1000) + 's',
    maxAge: '4 hours',
    isValid: isValid
  });
  
  return isValid;
}

/**
 * Get device ID for SecurityWrapper compatibility
 * This function must be available immediately
 */
function getDeviceId(username) {
  console.log('🔍 getDeviceId called with:', username, 'Current state:', {
    currentDeviceId: LoginState.deviceId,
    currentUser: LoginState.user,
    globalCurrentUser: window.currentUser
  });
  
  // Return current session device ID when user matches (or no username passed)
  if (LoginState.deviceId && LoginState.user) {
    if (!username || LoginState.user === username) {
      console.log('✅ Returning existing device ID:', LoginState.deviceId);
      return LoginState.deviceId;
    }
  }

  console.warn('⚠️ getDeviceId: no active session for', username, '- login required');
  return null;
}

// Make these functions globally available IMMEDIATELY
window.isUserAuthenticated = isUserAuthenticated;
window.isSessionValid = isSessionValid;
window.getDeviceId = getDeviceId;

/**
 * Force logout function for SecurityWrapper compatibility
 */
function forceLogout() {
  console.log('🚨 Force logout called by SecurityWrapper');
  cleanLogout();
}

// Make forceLogout available immediately
window.forceLogout = forceLogout;

/**
 * Initialize clean login system
 */
function initializeCleanLogin() {
  console.log('🚀 Initializing Clean Login System for Google Apps Script');
  
  // Override old functions for compatibility
  window.doLogin = doLogin;
  window.doLogout = doLogout;
  window.isUserAuthenticated = isUserAuthenticated;
  window.isSessionValid = isSessionValid;
  window.getDeviceId = getDeviceId;
  
  // Register beforeunload: on page refresh, re-save username to sessionStorage
  // This ensures sessionStorage has the username even if it was cleared by GAS iframe quirks
  // IMPORTANT: We do NOT call logoutUser here - only explicit logout clears the server session
  window.addEventListener('beforeunload', function() {
    if (LoginState.user) {
      try { sessionStorage.setItem('pos_username', LoginState.user); } catch (e) {}
      try {
        var expires = new Date(Date.now() + 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = 'pos_username=' + encodeURIComponent(LoginState.user) + '; expires=' + expires + '; path=/; SameSite=None; Secure';
      } catch (e) {}
    }
  });
  
  // Start session resumption only if DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        updateTabVisibility();
        attemptSessionResumption();
      }, 100);
    });
  } else {
    setTimeout(function() {
      updateTabVisibility();
      attemptSessionResumption();
    }, 100);
  }
}

// Initialize when ready
initializeCleanLogin();

// Export for use in other modules// ========== Smart Picks Cache ==========
window._smartPicksCache = null;

function _loadSmartPicksCache() {
  if (window._smartPicksCache) return; // Already loaded
  var deviceId = LoginState.deviceId;
  var username = LoginState.user;
  if (!deviceId || !username) return;
  
  console.log('⚡ Loading smart picks cache...');
  google.script.run
    .withSuccessHandler(function(result) {
      window._smartPicksCache = result || { orders: [], consumption: [] };
      var sp = window._smartPicksCache;
      console.log('⚡ Smart picks cached:', (sp.orders || []).length, 'orders,', (sp.consumption || []).length, 'consumption');
    })
    .withFailureHandler(function(err) {
      console.warn('Smart picks cache load failed:', err);
      window._smartPicksCache = { orders: [], consumption: [] };
    })
    .getAllSmartPicks(deviceId, username);
}

  generateDeviceId: generateSessionDeviceId
};

console.log('✅ Clean Login System loaded for Google Apps Script');
