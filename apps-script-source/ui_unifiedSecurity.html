<!-- 
UNIFIED CLIENT-SIDE AUTHENTICATION WRAPPER
This replaces ui_securityWrapper.html with a clean, conflict-free implementation
Ensures all server calls include proper authentication context
-->

<script>
// ============================
// AUTHENTICATION STATE MANAGEMENT
// ============================

/**
 * Check if user is authenticated by verifying session state only
 */
function isUserAuthenticated() {
  const session = window.LoginState;
  
  if (!session) {
    console.log('🔐 No session found');
    return false;
  }
  
  const required = ['isLoggedIn', 'user', 'outlet', 'deviceId'];
  for (const field of required) {
    if (!session[field]) {
      console.log('🔐 Missing session field:', field);
      return false;
    }
  }
  
  // Check session age (optional client-side check)
  if (session.loginTime) {
    const sessionAge = Date.now() - session.loginTime;
    const maxAge = 24 * 60 * 60 * 1000; // 24 hours
    
    if (sessionAge > maxAge) {
      console.log('🔐 Session expired (client-side check)');
      return false;
    }
  }
  
  return session.isLoggedIn === true;
}

/**
 * Get current session context for authentication
 */
function getAuthenticationContext(functionName) {
  const session = window.LoginState;
  
  if (!isUserAuthenticated()) {
    throw new Error('Authentication required: No valid session');
  }
  
  return {
    username: session.user,
    deviceId: session.deviceId,
    outlet: session.outlet,
    timestamp: Date.now(),
    functionName: functionName || 'unknown'
  };
}

// ============================
// SECURE SERVER COMMUNICATION
// ============================

/**
 * Secure server call wrapper
 * All server calls must go through this function
 */
function secureServerCall(functionName, params = {}) {
  return new Promise((resolve, reject) => {
    try {
      console.log('🔐 secureServerCall starting for:', functionName);
      
      // Verify authentication before any server call
      if (!isUserAuthenticated()) {
        console.error('🔐 Authentication check failed in secureServerCall');
        reject(new Error('Authentication required: Please log in first'));
        return;
      }
      
      console.log('🔐 Authentication check passed in secureServerCall');
      
      // Add authentication context to all server calls
      const authContext = getAuthenticationContext(functionName);
      const enhancedParams = {
        ...params,
        _authContext: authContext
      };
      
      console.log('🔐 Secure server call:', functionName, 'for user:', authContext.username);
      console.log('🔐 Enhanced params:', {
        ...enhancedParams,
        _authContext: { ...authContext, timestamp: '[timestamp]' } // Don't log full timestamp for cleaner logs
      });
      
      // Check if the server function exists
      if (!google?.script?.run || typeof google.script.run[functionName] !== 'function') {
        console.error('❌ Server function not found:', functionName);
        reject(new Error(`Server function '${functionName}' not available`));
        return;
      }
      
      console.log('🔐 Making server call to:', functionName);
      
      // Make the server call
      google.script.run
        .withSuccessHandler(result => {
          console.log('✅ Server call successful:', functionName);
          console.log('✅ Server response type:', typeof result, 'Length:', result?.length || 'N/A');
          resolve(result);
        })
        .withFailureHandler(error => {
          console.error('❌ Server call failed:', functionName, error);
          
          // Check if it's an authentication error
          if (error.toString().includes('Authentication') || 
              error.toString().includes('session') ||
              error.toString().includes('AUTHENTICATION')) {
            
            console.log('🔐 Authentication error detected, session may be invalid');
          }
          
          reject(error);
        })
        [functionName](enhancedParams);
        
    } catch (error) {
      console.error('❌ Error in secureServerCall:', error);
      reject(error);
    }
  });
}

// ============================
// SECURE DATA LOADING FUNCTIONS
// ============================

/**
 * Load products securely
 */
async function loadProducts(type = 'Sell') {
  try {
    console.log('📦 UnifiedSecurity.loadProducts called with type:', type);
    
    // Check authentication first
    if (!isUserAuthenticated()) {
      throw new Error('Authentication required: Please log in first');
    }
    
    console.log('📦 Authentication check passed, making server call...');
    
    const products = await secureServerCall('loadProducts', { type: type });
    
    console.log('📦 Server response type:', typeof products, 'Length/Value:', products?.length || products);
    
    let productList;
    if (typeof products === 'string') {
      try {
        productList = JSON.parse(products);
      } catch (parseError) {
        console.error('❌ Failed to parse products JSON:', parseError);
        throw new Error('Invalid product data format received from server');
      }
    } else if (Array.isArray(products)) {
      productList = products;
    } else {
      console.error('❌ Unexpected product data type:', typeof products, products);
      throw new Error('Unexpected product data format from server');
    }
    
    if (!Array.isArray(productList)) {
      console.error('❌ Product list is not an array:', productList);
      throw new Error('Invalid product data structure received');
    }
    
    console.log('📦 Successfully loaded', productList.length, 'products');
    
    // Log sample products for debugging
    if (productList.length > 0) {
      console.log('📦 Sample product:', {
        name: productList[0].Name,
        category: productList[0].Category,
        type: productList[0].Type,
        price: productList[0].Price
      });
    }
    
    return productList;
    
  } catch (error) {
    console.error('❌ Failed to load products:', error);
    throw error;
  }
}

/**
 * Load expense accounts securely
 */
async function loadExpenseAccounts() {
  try {
    console.log('💰 Loading expense accounts');
    
    const accounts = await secureServerCall('loadExpenseAccounts');
    
    console.log('💰 Loaded', accounts.length, 'expense accounts');
    return accounts;
    
  } catch (error) {
    console.error('❌ Failed to load expense accounts:', error);
    throw error;
  }
}

/**
 * Load payment sources securely
 */
async function loadPaymentSources() {
  try {
    console.log('💳 Loading payment sources');
    
    const sources = await secureServerCall('loadPaymentSources');
    
    console.log('💳 Loaded', sources.length, 'payment sources');
    return sources;
    
  } catch (error) {
    console.error('❌ Failed to load payment sources:', error);
    throw error;
  }
}

// ============================
// CHECKOUT CONTEXT MANAGEMENT
// ============================

/**
 * Temporary storage for checkout context
 * This is a secure, in-memory store for passing data between order and checkout pages
 */
let _checkoutContext = null;

/**
 * Set checkout context securely
 */
function setCheckoutContext(context) {
  console.log('🛒 Setting checkout context:', context);
  
  // Validate the context
  if (!context || typeof context !== 'object') {
    throw new Error('Invalid checkout context: must be an object');
  }
  
  if (!context.cart || !Array.isArray(context.cart)) {
    throw new Error('Invalid checkout context: cart must be an array');
  }
  
  if (typeof context.total !== 'number' || context.total <= 0) {
    throw new Error('Invalid checkout context: total must be a positive number');
  }
  
  // Store the context with timestamp for security
  _checkoutContext = {
    ...context,
    timestamp: Date.now(),
    sessionId: window.LoginState?.deviceId || 'unknown'
  };
  
  console.log('🛒 Checkout context set successfully');
}

/**
 * Get checkout context securely
 */
function getCheckoutContext() {
  console.log('🛒 Getting checkout context');
  
  if (!_checkoutContext) {
    console.warn('🛒 No checkout context found');
    return null;
  }
  
  // Check if context is too old (5 minutes timeout)
  const maxAge = 5 * 60 * 1000; // 5 minutes
  const age = Date.now() - _checkoutContext.timestamp;
  
  if (age > maxAge) {
    console.warn('🛒 Checkout context expired, clearing');
    _checkoutContext = null;
    return null;
  }
  
  // Verify session matches (basic security check)
  const currentSessionId = window.LoginState?.deviceId || 'unknown';
  if (_checkoutContext.sessionId !== currentSessionId) {
    console.warn('🛒 Checkout context session mismatch, clearing');
    _checkoutContext = null;
    return null;
  }
  
  console.log('🛒 Checkout context retrieved successfully');
  return _checkoutContext;
}

/**
 * Clear checkout context
 */
function clearCheckoutContext() {
  console.log('🛒 Clearing checkout context');
  _checkoutContext = null;
}

// ============================
// UNIFIED SECURITY INTERFACE
// ============================

/**
 * Main security interface - replaces SecurityWrapper
 * Provides clean API for secure data access
 */
window.UnifiedSecurity = {
  // Authentication
  isAuthenticated: isUserAuthenticated,
  getAuthContext: getAuthenticationContext,
  
  // Secure server calls
  call: secureServerCall,
  
  // Data loading
  loadProducts: loadProducts,
  loadExpenseAccounts: loadExpenseAccounts,
  loadPaymentSources: loadPaymentSources,
  
  // Checkout context management
  setCheckoutContext: setCheckoutContext,
  getCheckoutContext: getCheckoutContext,
  clearCheckoutContext: clearCheckoutContext,
  
  // Testing
  test: testUnifiedSecurity
};

// ============================
// BACKWARD COMPATIBILITY
// ============================

/**
 * Maintain compatibility with existing code
 */
window.SecurityWrapper = {
  SecureUI: {
    loadProducts: loadProducts,
    loadExpenseAccounts: loadExpenseAccounts,
    loadPaymentSources: loadPaymentSources
  }
};

window.SecureUI = {
  loadProducts: loadProducts,
  loadExpenseAccounts: loadExpenseAccounts,
  loadPaymentSources: loadPaymentSources
};

// ============================
// INITIALIZATION AND TESTING
// ============================

/**
 * Test the unified security system
 */
function testUnifiedSecurity() {
  console.log('🧪 Testing Unified Security System...');
  
  // Test authentication check
  const isAuth = isUserAuthenticated();
  console.log('🧪 Authentication status:', isAuth);
  
  if (isAuth) {
    console.log('🧪 LoginState:', window.LoginState);
    
    try {
      const authContext = getAuthenticationContext('test');
      console.log('🧪 Auth context:', authContext);
    } catch (error) {
      console.error('🧪 Error getting auth context:', error);
    }
  }
  
  // Test if server functions are available
  const serverFunctions = ['loadProducts', 'loadExpenseAccounts', 'loadPaymentSources'];
  serverFunctions.forEach(funcName => {
    const available = google?.script?.run && typeof google.script.run[funcName] === 'function';
    console.log(`🧪 Server function '${funcName}':`, available ? '✅ Available' : '❌ Not found');
  });
  
  return {
    isAuthenticated: isAuth,
    loginState: window.LoginState,
    serverFunctionsAvailable: serverFunctions.map(f => ({
      name: f,
      available: google?.script?.run && typeof google.script.run[f] === 'function'
    }))
  };
}

/**
 * Validate session on page load
 */
function validateSessionOnLoad() {
  console.log('🔐 Validating session on load...');
  
  if (window.LoginState && window.LoginState.isLoggedIn) {
    const session = window.LoginState;
    console.log('🔐 Session validated for user:', session.user, 'outlet:', session.outlet);
    
    // Verify session format
    if (!session.deviceId || !session.deviceId.includes('_user_' + session.user.toLowerCase())) {
      console.warn('⚠️ Session deviceId format issue detected');
    }
    
    // Test the system
    setTimeout(() => {
      testUnifiedSecurity();
    }, 1000);
    
    return true;
  }
  
  console.log('🔐 No valid session found on load');
  return false;
}

// ============================
// INITIALIZATION
// ============================

// Validate session when this script loads
document.addEventListener('DOMContentLoaded', function() {
  validateSessionOnLoad();
});

// If already loaded, validate immediately
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', validateSessionOnLoad);
} else {
  validateSessionOnLoad();
}

console.log('🔐 Unified Security System loaded');

</script>
