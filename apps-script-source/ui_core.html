<script>
  // Keyboard activation for elements promoted to role="button" (ARIA pattern for
  // clickable div/span that are not native <button>s). Enter/Space triggers click.
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') &&
        e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') {
      e.preventDefault();
      if (typeof e.target.click === 'function') e.target.click();
    }
  });

  // Global app state variables
  let lang = "id";
  let products = [];
  let productConfigurator = null;
  let purchasingProducts = [];
  let categories = [];
  let cart = [];
  let purchaseCart = [];
  let currentCategory = '';
  let currentSupplier = 'All';
  let suppliers = [];
  let activeTab = "orders";
  let currentTab = "orders";
  let deviceId = null;
  
  // Tab rendering control
  let tabRenderCounter = 0; // Incremented on each tab switch to invalidate old renders
  
  // Tab state management - content and state for each tab
  let tabStates = {
    orders: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    purchasing: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    deposits: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    expenses: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    profitLoss: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    usageReport: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    investments: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null },
    checklist: { loaded: false, content: null, data: null, loadTime: null, lastAccess: null }
  };
  
  // Performance tracking
  let tabLoadStartTimes = {};
  
  // Network status
  let isOnline = navigator.onLine;

  // Keeps track of which column is sorted and how
  let usageSortColumn = null; // e.g. 'amount'
  let usageSortAsc = false;   // false = descending

  // Category icons mapping
  const categoryIcons = {
    "Ayam": "🍗",
    "Ayam Sisa": "🍗",
    "AYAM_SISA": "🍗",
    "Nasi": "🍚",
    "Saus": "🥫",
    "Snack": "🍟",
    "Minuman": "🥤",
    "Soft Ice Cream": "🍦",
    "Sundaes": "🍨",
    "Bahan Baku": "🧅",
    "Sayuran": "🥦",
    "Daging": "🥩",
    "MISC": "✏️",
    "Local MISC Others": "✏️",
    "_default": "📦"
  };

  // Utility functions
  function getElem(id) {
    const el = document.getElementById(id);
    if (!el) {
      // Only show warning for unexpected missing elements
      // loadingProgress is expected to be missing when not loading
      if (id !== 'loadingProgress') {
        console.warn(`Element with id "${id}" not found!`);
      }
    }
    return el;
  }

  // Preferences management
  function savePreferences() {
    const preferences = {
      language: lang,
      lastTab: currentTab || activeTab || 'orders'
    };
    try {
      localStorage.setItem('userPreferences', JSON.stringify(preferences));
      console.log('Saved preferences:', preferences);
    } catch (error) {
      console.error('Error saving preferences:', error);
    }
  }

  function loadPreferences() {
    try {
      const saved = localStorage.getItem('userPreferences');
      console.log('Loading preferences from localStorage:', saved);
      if (saved) {
        const preferences = JSON.parse(saved);
        console.log('Parsed preferences:', preferences);
        // Update global variables
        lang = preferences.language || 'id';
        activeTab = preferences.lastTab || 'orders';
        currentTab = preferences.lastTab || 'orders';
        console.log('Updated global vars - lang:', lang, 'activeTab:', activeTab, 'currentTab:', currentTab);
        return {
          language: preferences.language || 'id',
          lastTab: preferences.lastTab || 'orders'
        };
      }
    } catch (error) {
      console.error('Error loading preferences:', error);
    }
    
    // Return defaults if loading fails and update globals
    console.log('Using default preferences');
    lang = 'id';
    activeTab = 'orders';
    currentTab = 'orders';
    return {
      language: 'id',
      lastTab: 'orders'
    };
  }

  // Initialize app (only for non-login scenarios)
  function initApp() {
    // Only initialize if not already logged in or in login process
    const loginModal = document.getElementById('loginModal');
    const appContent = document.getElementById('appContent');
    
    // Skip init if login modal is visible or app content is already shown
    if ((loginModal && loginModal.style.display === 'flex') || 
        (appContent && appContent.style.display === 'block')) {
      return;
    }
    
    // Skip if login system is handling session resumption (async server check)
    // The login system's showApp() will call switchTab after authentication completes
    if (!window.LoginState || !window.LoginState.isLoggedIn) {
      return;
    }
    
    const preferences = loadPreferences();
    if (getElem('langSel')) {
      getElem('langSel').value = preferences.language;
    }
    var languageSelect = document.getElementById('languageSelect');
    if (languageSelect) {
      languageSelect.value = preferences.language;
    }
    updateTabLabels();
    var resumeTab = preferences.lastTab;
    if (window.SnowbeeAccess && typeof window.SnowbeeAccess.hasTabAccess === 'function' &&
        !window.SnowbeeAccess.hasTabAccess(resumeTab)) {
      resumeTab = (typeof window.SnowbeeAccess.getAccessibleDefaultTab === 'function')
        ? window.SnowbeeAccess.getAccessibleDefaultTab()
        : 'tutorials';
    }
    switchTab(resumeTab, { silentDeny: true, fallback: true });
  }

  // Load app when DOM is ready (but let login UI handle the main flow)
  document.addEventListener('DOMContentLoaded', function() {
    // Add small delay to let login UI initialize first
    setTimeout(initApp, 50);
  });

  // Make core functions globally accessible
  window.getElem = getElem;
  window.savePreferences = savePreferences;
  window.loadPreferences = loadPreferences;
  
  // Helper function to check if a tab render is still valid
  window.isCurrentTabRender = function(expectedTab, renderCounter) {
    return currentTab === expectedTab && tabRenderCounter === renderCounter;
  };
  
  // Helper to get current render counter for a tab
  window.getCurrentRenderCounter = function() {
    return tabRenderCounter;
  };

  // Spinner and loading utilities
  window.showSpinner = function(message) {
    message = message || 'Loading...';
    
    // Check if spinner already exists
    let spinner = document.getElementById('globalSpinner');
    if (!spinner) {
      // Create spinner element
      spinner = document.createElement('div');
      spinner.id = 'globalSpinner';
      spinner.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        color: white;
        font-family: Arial, sans-serif;
      `;
      
      // Add spinner animation
      const spinnerIcon = document.createElement('div');
      spinnerIcon.style.cssText = `
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
      `;
      
      // Add CSS animation
      if (!document.getElementById('spinnerStyles')) {
        const style = document.createElement('style');
        style.id = 'spinnerStyles';
        style.textContent = `
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        `;
        document.head.appendChild(style);
      }
      
      const messageEl = document.createElement('div');
      messageEl.id = 'spinnerMessage';
      messageEl.style.cssText = 'text-align: center; font-size: 16px;';
      
      spinner.appendChild(spinnerIcon);
      spinner.appendChild(messageEl);
      document.body.appendChild(spinner);
    }
    
    // Update message
    const messageEl = document.getElementById('spinnerMessage');
    if (messageEl) {
      messageEl.textContent = message;
    }
    
    spinner.style.display = 'flex';
  };

  window.hideSpinner = function() {
    const spinner = document.getElementById('globalSpinner');
    if (spinner) {
      spinner.style.display = 'none';
    }
  };
  
  window.getTabState = function(tab) {
    const state = tabStates[tab] || { loaded: false, content: null, data: null };
    if (state.loaded) {
      state.lastAccess = Date.now();
    }
    return state;
  };
  
  window.startTabLoad = function(tab) {
    tabLoadStartTimes[tab] = Date.now();
  };
  
  window.getTabPerformanceStats = function() {
    return Object.keys(tabStates).map(tab => ({
      tab,
      loaded: tabStates[tab].loaded,
      loadTime: tabStates[tab].loadTime,
      lastAccess: tabStates[tab].lastAccess
    }));
  };
  
  window.clearTabState = function(tab) {
    if (tabStates[tab]) {
      tabStates[tab].loaded = false;
      tabStates[tab].content = null;
      tabStates[tab].data = null;
      console.log(`Cleared state for tab: ${tab}`);
    }
  };
  
  window.clearAllTabStates = function() {
    Object.keys(tabStates).forEach(tab => {
      tabStates[tab] = { loaded: false, content: null, data: null };
    });
    console.log('Cleared all tab states');
  };
  
  // Tab state management helpers
  window.saveTabState = function(tab, content, data) {
    if (tabStates[tab]) {
      const loadTime = tabLoadStartTimes[tab] ? Date.now() - tabLoadStartTimes[tab] : null;
      tabStates[tab].loaded = true;
      tabStates[tab].content = content;
      tabStates[tab].data = data;
      tabStates[tab].loadTime = loadTime;
      tabStates[tab].lastAccess = Date.now();
      
      // Clear progress indicator
      if (window._currentProgressInterval) {
        clearInterval(window._currentProgressInterval);
        window._currentProgressInterval = null;
        const progressBar = getElem('loadingProgress');
        if (progressBar) {
          progressBar.style.width = '100%';
        }
      }
      
      console.log(`Saved state for tab: ${tab} (loaded in ${loadTime}ms)`);
    }
  };
  
  window.getTabState = function(tab) {
    const state = tabStates[tab] || { loaded: false, content: null, data: null };
    if (state.loaded) {
      state.lastAccess = Date.now();
    }
    return state;
  };
  
  window.startTabLoad = function(tab) {
    tabLoadStartTimes[tab] = Date.now();
  };
  
  window.getTabPerformanceStats = function() {
    return Object.keys(tabStates).map(tab => ({
      tab,
      loaded: tabStates[tab].loaded,
      loadTime: tabStates[tab].loadTime,
      lastAccess: tabStates[tab].lastAccess
    }));
  };
  
  window.clearTabState = function(tab) {
    if (tabStates[tab]) {
      tabStates[tab].loaded = false;
      tabStates[tab].content = null;
      tabStates[tab].data = null;
      console.log(`Cleared state for tab: ${tab}`);
    }
  };
  
  window.clearAllTabStates = function() {
    Object.keys(tabStates).forEach(tab => {
      tabStates[tab] = { loaded: false, content: null, data: null };
    });
    console.log('Cleared all tab states');
  };
  
  // Network status monitoring (simplified)
  window.addEventListener('online', () => {
    isOnline = true;
    console.log('Connection restored');
  });
  
  window.addEventListener('offline', () => {
    isOnline = false;
    console.log('Connection lost');
  });
</script>
