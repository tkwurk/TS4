  <!-- Initial Loading Spinner -->
  <div id="initialLoading" style="display:flex;justify-content:center;align-items:center;height:100vh;">
    <div class="loading-spinner"></div>
  </div>

  <script>
    // --- Localization ---
    <?!= include('ui_locals.html'); ?>
    
    // Ensure showSalesSummary function is available - fallback definition
    window.ensureShowSalesSummary = function() {
      if (typeof window.showSalesSummary !== 'function') {
        console.log('Defining fallback showSalesSummary function');
        window.showSalesSummary = function(selectedDate) {
          console.log('Fallback showSalesSummary called');
          const main = document.getElementById('main');
          if (!main) {
            console.error('Main element not found');
            return;
          }
          
          // Show loading
          main.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div><p>Loading sales summary...</p></div>';
          
          // Get today's date if none provided
          const today = new Date();
          const dateStr = selectedDate || today.getFullYear() + '-' + 
            String(today.getMonth() + 1).padStart(2, '0') + '-' + 
            String(today.getDate()).padStart(2, '0');
          
          // Call backend
          google.script.run
            .withSuccessHandler(function(data) {
              try {
                console.log('Sales data received:', data);
                const parsedData = typeof data === 'string' ? JSON.parse(data) : data;
                
                // Simple rendering if renderSalesSummary is not available
                if (typeof window.renderSalesSummary === 'function') {
                  window.renderSalesSummary(parsedData, dateStr);
                } else {
                  // Fallback simple rendering
                  let html = '<div style="max-width:800px;margin:auto;padding:20px;">';
                  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">';
                  html += '<h2 style="margin:0;">📊 ' + (typeof t === 'function' ? t('salesSummary') : 'Sales Summary') + '</h2>';
                  html += '<div style="display:flex;align-items:center;gap:10px;">';
                  html += '<label for="salesDatePicker" style="font-weight:bold;">' + (typeof t === 'function' ? t('date') : 'Date') + ':</label>';
                  html += '<input type="date" id="salesDatePicker" value="' + dateStr + '" onchange="showSalesSummary(this.value)" style="padding:8px;border:1px solid #ddd;border-radius:4px;">';
                  html += '</div>';
                  html += '</div>';
                  
                  // Show summary totals
                  html += '<div style="background:#f8f9fa;padding:20px;border-radius:8px;margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;">';
                  html += '<div style="text-align:center;"><h3 style="margin:0;color:#28a745;">Rp ' + (parsedData.totalSales || 0).toLocaleString() + '</h3><p style="margin:0;color:#666;">💰 ' + (typeof t === 'function' ? t('totalSales') : 'Total Sales') + '</p></div>';
                  html += '<div style="text-align:center;"><h3 style="margin:0;color:#007bff;">' + (parsedData.ordersCount || 0) + '</h3><p style="margin:0;color:#666;">🛍️ ' + (typeof t === 'function' ? t('ordersCount') : 'Orders') + '</p></div>';
                  
                  // Always show cash and digital sales (even if 0) for better UX
                  html += '<div style="text-align:center;"><h3 style="margin:0;color:#6c757d;">Rp ' + (parsedData.totalSalesByCash || 0).toLocaleString() + '</h3><p style="margin:0;color:#666;">💵 ' + (typeof t === 'function' ? t('totalSalesCash') : 'Cash Sales') + '</p></div>';
                  html += '<div style="text-align:center;"><h3 style="margin:0;color:#17a2b8;">Rp ' + (parsedData.totalSalesByNonCash || 0).toLocaleString() + '</h3><p style="margin:0;color:#666;">📱 ' + (typeof t === 'function' ? t('totalSalesDana') : 'Digital Sales') + '</p></div>';
                  
                  // Show deposits if available
                  if (parsedData.totalDeposits !== undefined) {
                    html += '<div style="text-align:center;"><h3 style="margin:0;color:#20c997;">Rp ' + (parsedData.totalDeposits || 0).toLocaleString() + '</h3><p style="margin:0;color:#666;">🏦 ' + (typeof t === 'function' ? t('totalDeposits') : 'Total Deposits') + '</p></div>';
                    if (parsedData.totalDepositsByQris > 0) {
                      html += '<div style="text-align:center;"><h3 style="margin:0;color:#6f42c1;">Rp ' + (parsedData.totalDepositsByQris || 0).toLocaleString() + '</h3><p style="margin:0;color:#666;">📱💰 ' + (typeof t === 'function' ? t('danaDeposits') : 'Digital Deposits') + '</p></div>';
                    }
                  }
                  
                  html += '</div>';
                  
                  // Show detailed breakdown by category
                  if (parsedData.summary && Object.keys(parsedData.summary).length > 0) {
                    html += '<h3>' + (typeof t === 'function' ? t('salesBreakdown') : 'Sales Breakdown') + '</h3>';
                    
                    Object.keys(parsedData.summary).forEach(category => {
                      if (Object.keys(parsedData.summary[category]).length > 0) {
                        html += '<div style="margin:20px 0;">';
                        html += '<h4 style="background:#e9ecef;padding:10px;margin:0;border-radius:4px 4px 0 0;">' + category + '</h4>';
                        html += '<table style="width:100%;border-collapse:collapse;margin:0;">';
                        html += '<tr style="background:#f8f9fa;"><th style="padding:10px;border:1px solid #ddd;text-align:left;">' + (typeof t === 'function' ? t('item') : 'Item') + '</th><th style="padding:10px;border:1px solid #ddd;text-align:center;">' + (typeof t === 'function' ? t('qty') : 'Qty') + '</th><th style="padding:10px;border:1px solid #ddd;text-align:right;">' + (typeof t === 'function' ? t('sales') : 'Sales') + '</th></tr>';
                        
                        Object.keys(parsedData.summary[category]).forEach(productKey => {
                          const item = parsedData.summary[category][productKey];
                          html += '<tr>';
                          html += '<td style="padding:10px;border:1px solid #ddd;">' + (item.itemName || productKey) + '</td>';
                          html += '<td style="padding:10px;border:1px solid #ddd;text-align:center;">' + (item.qty || 0) + '</td>';
                          html += '<td style="padding:10px;border:1px solid #ddd;text-align:right;">Rp ' + (item.sales || 0).toLocaleString() + '</td>';
                          html += '</tr>';
                        });
                        
                        html += '</table>';
                        html += '</div>';
                      }
                    });
                  } else {
                    html += '<p style="text-align:center;color:#666;padding:40px;">' + (typeof t === 'function' ? t('noItems') : 'No sales data available for this date.') + '</p>';
                  }
                  
                  html += '<div style="text-align:center;margin-top:20px;">';
                  html += '<button onclick="switchTab(\'orders\')" style="padding:10px 20px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;">' + (typeof t === 'function' ? t('back') : 'Back to Orders') + '</button>';
                  html += '</div>';
                  html += '</div>';
                  
                  main.innerHTML = html;
                }
              } catch (error) {
                console.error('Error processing sales data:', error);
                main.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Error loading sales data: ' + error.message + '</div>';
              }
            })
            .withFailureHandler(function(error) {
              console.error('Error loading sales data:', error);
              main.innerHTML = '<div style="text-align:center;padding:40px;color:red;">Failed to load sales data: ' + error + '</div>';
            })
            .getSalesSummaryByDate(dateStr);
        };
      }
    };
    
    // Call the function to ensure it's available
    window.ensureShowSalesSummary();
    
    // Debug: Check if monthly sales report function is loaded
    setTimeout(() => {
      if (typeof window.showMonthlySalesReport === 'function') {
        console.log('✅ Monthly Sales Report function loaded successfully');
      } else {
        console.error('❌ Monthly Sales Report function NOT loaded');
      }
    }, 100);
  </script>
</body>
