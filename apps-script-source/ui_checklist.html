<style>
  .sidebar-tabs .cl-sidebar-title {
    font-size: 0.7em;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #99f6e4;
    padding: 8px 16px 10px;
    border-bottom: 1px solid #115e59;
    margin-bottom: 4px;
  }
  .sidebar-tabs .admin-sidebar-title {
    color: #94a3b8;
    border-bottom-color: #334155;
  }

  .cl-shell { display:flex; align-items:flex-start; min-height:80vh; gap:0; }
  .cl-sidebar {
    width:210px; flex-shrink:0; background:#0f766e; border-radius:12px 0 0 12px;
    display:flex; flex-direction:column; padding:16px 0; min-height:80vh;
  }
  .cl-sidebar-title {
    font-size:0.7em; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;
    color:#99f6e4; padding:0 16px 12px; border-bottom:1px solid #115e59; margin-bottom:8px;
  }
  .cl-nav-btn {
    display:flex; align-items:center; gap:10px; padding:10px 16px; background:none; border:none;
    color:#ccfbf1; font-size:0.88em; font-weight:600; cursor:pointer; text-align:left;
    width:100%; border-left:3px solid transparent; transition:background 0.15s, color 0.15s;
  }
  .cl-nav-btn:hover { background:#115e59; color:#fff; }
  .cl-nav-btn.active { background:#115e59; color:#fff; border-left-color:#5eead4; }
  .cl-content {
    flex:1; min-width:0; background:#fff; border:1px solid #e2e8f0; border-left:none;
    border-radius:0 12px 12px 0; padding:20px; min-height:80vh;
  }
  .cl-pane { display:none; }
  .cl-pane.active { display:block; }
  .cl-card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .cl-checklist-card {
    background:#f0fdfa; border:2px solid #99f6e4; border-radius:12px; padding:16px; cursor:pointer;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .cl-checklist-card:hover { transform:translateY(-2px); box-shadow:0 4px 14px rgba(15,118,110,0.15); }
  .cl-checklist-card.done { background:#ecfdf5; border-color:#86efac; }
  .cl-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .cl-badge-pending { background:#fef9c3; color:#ca8a04; }
  .cl-badge-done { background:#dcfce7; color:#15803d; }
  .cl-badge-review { background:#dbeafe; color:#1d4ed8; }
  @media (max-width:700px) {
    .cl-shell { flex-direction:column; }
    .cl-sidebar { width:100%; border-radius:12px 12px 0 0; flex-direction:row; flex-wrap:wrap; min-height:unset; padding:8px; gap:4px; }
    .cl-sidebar-title { display:none; }
    .cl-nav-btn { width:auto; border-left:none; border-bottom:3px solid transparent; padding:8px 12px; font-size:0.8em; }
    .cl-nav-btn.active { border-bottom-color:#5eead4; }
    .cl-content { border-left:1px solid #e2e8f0; border-radius:0 0 12px 12px; }
  }
</style>

<script>
(function() {
  var _definitions = [];
  var _questions = [];
  var _activeChecklistId = '';
  var _activeChecklistName = '';
  var _shiftId = '';
  var _shiftStatus = null;
  var _roleOptions = [];
  var _manageChecklistId = '';
  var _activePane = 'my';

  function clT(key) { return (typeof t === 'function') ? (t(key) || key) : key; }

  function _esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function _cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function _deviceUser() {
    return {
      deviceId: window.LoginState && window.LoginState.deviceId,
      username: window.LoginState && (window.LoginState.user || window.LoginState.currentusername)
    };
  }

  function _isChecklistAdmin() {
    var tabs = (window.LoginState && window.LoginState.allowedTabs) || [];
    if (tabs.indexOf('*') !== -1 || tabs.indexOf('adminOrders') !== -1) return true;
    return (window.LoginState && window.LoginState.role) === 'admin';
  }

  function _canReviewAny() {
    return _definitions.some(function(d) { return d.canReview; });
  }

  function _buildShiftId(checklistId) {
    var outlet = (window.LoginState && window.LoginState.outlet) || 'XX';
    var safe = outlet.replace(/\s+/g,'').toUpperCase().slice(0,6);
    var d = new Date().toISOString().slice(0,10).replace(/-/g,'');
    var cid = (checklistId || 'CL-DEFAULT').replace(/\s+/g,'').toUpperCase().slice(0,12);
    return safe + '-' + cid + '-' + d;
  }

  function buildChecklistSidebarHtml() {
    var html = '<div class="cl-sidebar-title">✅ ' + clT('clPanelTitle') + '</div>';
    html += '<button class="cl-nav-btn active" id="cl-nav-my" onclick="window._clSwitchPane(\'my\')">📋 ' + clT('clNavMy') + '</button>';
    if (_canReviewAny()) {
      html += '<button class="cl-nav-btn" id="cl-nav-review" onclick="window._clSwitchPane(\'review\')">🔍 ' + clT('clNavReview') + '</button>';
    }
    html += '<button class="cl-nav-btn" id="cl-nav-report" onclick="window._clSwitchPane(\'report\')">📊 ' + clT('clNavReport') + '</button>';
    html += '<div style="flex:1;"></div>';
    html += '<button onclick="checklistGoToSelling()" style="display:flex;align-items:center;gap:8px;margin:12px;padding:9px 14px;background:#14b8a6;color:#fff;border:none;border-radius:8px;font-size:0.85em;font-weight:700;cursor:pointer;width:calc(100% - 24px);">← ' + clT('clBackSelling') + '</button>';
    return html;
  }

  window.checklistGoToSelling = function() {
    if (typeof window.leavePanelToMainNav === 'function') {
      window.leavePanelToMainNav();
    }
  };

  window.showChecklistTab = function() {
    if (!window.SecurityWrapper || !window.SecurityWrapper.isUserAuthenticated()) {
      var m = getElem('main');
      if (m) m.innerHTML = '<div style="padding:40px;text-align:center;">' + clT('pleaseLogin') + '</div>';
      return;
    }

    var oqs = document.getElementById('orderQueueSidebar');
    if (oqs) oqs.style.display = 'none';
    var fc = document.getElementById('floatingCart');
    if (fc) fc.style.display = 'none';

    var sidebarNav = document.getElementById('sidebarNav');
    var hadCachedDefs = _definitions && _definitions.length > 0;

    if (hadCachedDefs) {
      if (sidebarNav && window.SnowbeeSidebarModes) {
        window.SnowbeeSidebarModes.setTabsHtml(buildChecklistSidebarHtml());
      } else if (sidebarNav) {
        if (!window._sellingNavHTML) window._sellingNavHTML = sidebarNav.innerHTML;
        sidebarNav.innerHTML = buildChecklistSidebarHtml();
      }
      _renderChecklistShell();
      window._clSwitchPane('my');
    }

    var main = getElem('main');
    if (!main) return;
    if (!hadCachedDefs) {
      main.innerHTML = '<div style="padding:40px;text-align:center;">⏳ ' + clT('loading') + '...</div>';
    }

    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(defs) {
        _definitions = defs || [];
        if (sidebarNav && window.SnowbeeSidebarModes) {
          window.SnowbeeSidebarModes.setTabsHtml(buildChecklistSidebarHtml());
        } else if (sidebarNav) {
          sidebarNav.innerHTML = buildChecklistSidebarHtml();
        }
        if (!hadCachedDefs) {
          _renderChecklistShell();
          window._clSwitchPane('my');
        } else if (_activePane === 'my') {
          _renderMyChecklistsPane();
        }
      })
      .withFailureHandler(function(err) {
        if (main) main.innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;">❌ ' + _esc(err) + '</div>';
      })
      .getChecklistDefinitions(du.deviceId, du.username);
  };

  function _renderChecklistShell() {
    var main = getElem('main');
    if (!main) return;
    main.innerHTML =
      '<div class="cl-shell">' +
        '<div class="cl-content">' +
          '<div class="cl-pane active" id="cl-pane-my"></div>' +
          '<div class="cl-pane" id="cl-pane-review"></div>' +
          '<div class="cl-pane" id="cl-pane-report"></div>' +
        '</div>' +
      '</div>';
  }

  window._clSwitchPane = function(pane) {
    _activePane = pane;
    ['my','review','report'].forEach(function(p) {
      var btn = getElem('cl-nav-' + p);
      var el = getElem('cl-pane-' + p);
      if (btn) btn.classList.remove('active');
      if (el) el.classList.remove('active');
    });
    var activeBtn = getElem('cl-nav-' + pane);
    var activeEl = getElem('cl-pane-' + pane);
    if (activeBtn) activeBtn.classList.add('active');
    if (activeEl) activeEl.classList.add('active');

    if (pane === 'my') _renderMyChecklistsPane();
    else if (pane === 'review') _renderReviewQueuePane();
    else if (pane === 'report') _renderReportPane();
  };

  // ─── MY CHECKLISTS ───────────────────────────────────────────
  function _renderMyChecklistsPane() {
    var pane = getElem('cl-pane-my');
    if (!pane) return;

    var fillable = _definitions.filter(function(d) { return d.canFill && d.status === 'Active'; });
    if (fillable.length === 0) {
      pane.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;">' + clT('clNoChecklistsAssigned') + '</div>';
      return;
    }

    var html = '<h3 style="margin:0 0 16px;color:#0f766e;">📋 ' + clT('clNavMy') + '</h3>';
    html += '<div class="cl-card-grid">';
    fillable.forEach(function(d) {
      html += '<div role="button" tabindex="0" class="cl-checklist-card" onclick="window._clOpenFill(\'' + _esc(d.id) + '\',\'' + _esc(d.name) + '\')">';
      html += '<div style="font-weight:700;font-size:1.05em;color:#134e4a;margin-bottom:6px;">' + _esc(d.name) + '</div>';
      html += '<div style="font-size:12px;color:#64748b;margin-bottom:10px;">' + _esc(d.description || '') + '</div>';
      html += '<span class="cl-badge cl-badge-pending">' + clT('clTapToFill') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div id="cl-fill-area" style="margin-top:24px;"></div>';
    pane.innerHTML = html;
  }

  window._clFillCache = window._clFillCache || {};

  function _clFillCacheKey(checklistId) {
    return (checklistId || '') + '|' + (_shiftId || '');
  }

  function _clInvalidateFillCache(checklistId) {
    if (!window._clFillCache) return;
    delete window._clFillCache[_clFillCacheKey(checklistId)];
  }

  window._clOpenFill = function(checklistId, name) {
    _activeChecklistId = checklistId;
    _activeChecklistName = name;
    _shiftId = _buildShiftId(checklistId);
    var area = getElem('cl-fill-area');
    if (!area) return;

    var cacheKey = _clFillCacheKey(checklistId);
    var cached = window._clFillCache[cacheKey];
    if (cached && (Date.now() - cached.at) < 120000) {
      _questions = cached.questions || [];
      _shiftStatus = cached.status || { submitted: false, responses: [] };
      _renderFillForm(area);
    } else {
      area.innerHTML = '<div style="padding:20px;color:#64748b;">⏳ ' + clT('loading') + '...</div>';
    }

    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(bundle) {
        bundle = bundle || {};
        _questions = bundle.questions || [];
        _shiftStatus = bundle.status || { submitted: false, responses: [] };
        window._clFillCache[cacheKey] = {
          questions: _questions,
          status: _shiftStatus,
          at: Date.now()
        };
        _renderFillForm(area);
      })
      .withFailureHandler(function(err) {
        if (area) area.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>';
      })
      .getChecklistFillBundle(
        du.deviceId,
        du.username,
        checklistId,
        _shiftId,
        window.LoginState && window.LoginState.outlet
      );
  };

  function _renderFillForm(container) {
    if (!container) return;
    var submitted = _shiftStatus && _shiftStatus.submitted;
    var responses = (_shiftStatus && _shiftStatus.responses) || [];
    var existing = {};
    responses.forEach(function(r) { existing[r.questionSn] = r; });

    if (_questions.length === 0) {
      container.innerHTML = '<div style="padding:20px;color:#64748b;">' + clT('clNoQuestions') + '</div>';
      return;
    }

    var grouped = {}, catOrder = [];
    _questions.forEach(function(q) {
      var cat = q.category || 'General';
      if (!grouped[cat]) { grouped[cat] = []; catOrder.push(cat); }
      grouped[cat].push(q);
    });
    catOrder = catOrder.filter(function(c,i,a) { return a.indexOf(c) === i; });

    var html = '<div style="background:#fff;border:2px solid #99f6e4;border-radius:12px;padding:20px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
    html += '<div><h4 style="margin:0;color:#0f766e;">' + _esc(_activeChecklistName) + '</h4>';
    html += '<div style="font-size:11px;color:#64748b;margin-top:4px;">Shift: ' + _esc(_shiftId) + '</div></div>';
    if (submitted) html += '<span class="cl-badge cl-badge-done">✅ ' + clT('clSubmitted') + '</span>';
    html += '</div>';

    if (submitted) {
      html += '<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px;margin-bottom:16px;color:#15803d;">' + clT('clSubmittedLocked') + '</div>';
    }

    html += '<form id="clFillForm" onsubmit="window._clSubmitFill(event)">';
    catOrder.forEach(function(cat) {
      html += '<h5 style="color:#115e59;border-bottom:2px solid #99f6e4;padding-bottom:6px;">📂 ' + _esc(cat) + '</h5>';
      grouped[cat].forEach(function(q) {
        var ex = existing[q.sn];
        var disabled = submitted ? 'disabled' : '';
        var value = ex ? _esc(ex.response) : '';
        var comments = ex ? _esc(ex.comments) : '';
        html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px;">';
        html += '<div style="font-weight:600;margin-bottom:8px;">' + (q.mandatory ? '<span style="color:#dc2626;">✱ </span>' : '') + _esc(q.question) + '</div>';
        html += _renderQuestionInput(q, value, disabled);
        html += '<input type="text" name="cl_cmt_' + _esc(q.sn) + '" value="' + comments + '" placeholder="' + clT('clCommentsOptional') + '" ' + disabled + ' style="width:100%;margin-top:8px;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;box-sizing:border-box;">';
        html += '</div>';
      });
    });
    if (!submitted) {
      html += '<div style="text-align:center;padding:16px 0;"><button type="submit" id="clSubmitBtn" class="pay-btn" style="padding:12px 40px;">✅ ' + clT('clSubmit') + '</button></div>';
    }
    html += '</form></div>';
    container.innerHTML = html;
  }

  function _renderQuestionInput(q, value, disabled) {
    var html = '';
    if (q.questionType === 'yesno') {
      html += '<div style="display:flex;gap:12px;">';
      ['Yes','No'].forEach(function(opt) {
        html += '<label><input type="radio" name="cl_resp_' + _esc(q.sn) + '" value="' + opt + '" ' + (value === opt ? 'checked' : '') + ' ' + disabled + '> ' + opt + '</label>';
      });
      html += '</div>';
    } else if (q.questionType === 'dropdown') {
      var opts = (q.dropdownValues || '').split(',').map(function(o){return o.trim();}).filter(Boolean);
      html += '<select name="cl_resp_' + _esc(q.sn) + '" ' + disabled + ' required style="width:100%;padding:8px;border-radius:6px;">';
      html += '<option value="">--</option>';
      opts.forEach(function(opt) { html += '<option value="' + _esc(opt) + '"' + (value === opt ? ' selected' : '') + '>' + _esc(opt) + '</option>'; });
      html += '</select>';
    } else if (q.questionType === 'rating') {
      html += '<div style="display:flex;gap:8px;">';
      for (var s = 1; s <= 5; s++) {
        html += '<label><input type="radio" name="cl_resp_' + _esc(q.sn) + '" value="' + s + '" ' + (value === String(s) ? 'checked' : '') + ' ' + disabled + '> ' + '⭐'.repeat(s) + '</label>';
      }
      html += '</div>';
    } else {
      html += '<input type="text" aria-label="Checklist response" name="cl_resp_' + _esc(q.sn) + '" value="' + value + '" ' + disabled + ' ' + (q.mandatory ? 'required' : '') + ' style="width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:8px;box-sizing:border-box;">';
    }
    return html;
  }

  window._clSubmitFill = function(event) {
    event.preventDefault();
    var form = document.getElementById('clFillForm');
    if (!form) return;
    var responsesArr = [];
    _questions.forEach(function(q) {
      var respEl = form.elements['cl_resp_' + q.sn];
      var cmtEl = form.elements['cl_cmt_' + q.sn];
      var response = '';
      if (respEl) {
        if (respEl.tagName === 'SELECT') response = respEl.value || '';
        else {
          var checked = form.querySelectorAll('[name="cl_resp_' + q.sn + '"]:checked');
          response = checked.length ? checked[0].value : (respEl.value || '');
        }
      }
      responsesArr.push({ questionSn: q.sn, response: response, comments: cmtEl ? cmtEl.value : '', attachmentLink: '' });
    });

    var missing = _questions.filter(function(q) {
      if (!q.mandatory) return false;
      var r = responsesArr.find(function(x) { return x.questionSn === q.sn; });
      return !r || !String(r.response).trim();
    });
    if (missing.length) {
      alert(clT('clMandatoryMissing') + '\n• ' + missing.map(function(q){return q.question;}).join('\n• '));
      return;
    }

    var btn = getElem('clSubmitBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function() {
        _clInvalidateFillCache(_activeChecklistId);
        _shiftStatus = { submitted: true, responses: responsesArr };
        if (window._clFillCache) {
          window._clFillCache[_clFillCacheKey(_activeChecklistId)] = {
            questions: _questions,
            status: _shiftStatus,
            at: Date.now()
          };
        }
        if (typeof showToast === 'function') showToast(clT('toastChecklistSubmitted'), 'success');
        _renderFillForm(getElem('cl-fill-area'));
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = '✅ ' + clT('clSubmit'); }
        alert(err);
      })
      .submitChecklistResponses(JSON.stringify({
        shiftId: _shiftId, checklistId: _activeChecklistId, responses: responsesArr, deviceInfo: navigator.userAgent
      }), du.deviceId, du.username);
  };

  // ─── REVIEW QUEUE ────────────────────────────────────────────
  function _renderReviewQueuePane() {
    var pane = getElem('cl-pane-review');
    if (!pane) return;
    pane.innerHTML = '<h3 style="color:#0f766e;">🔍 ' + clT('clNavReview') + '</h3><div id="cl-review-queue">⏳...</div>';
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(queue) { _renderReviewQueue(queue || []); })
      .withFailureHandler(function(err) {
        var el = getElem('cl-review-queue');
        if (el) el.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>';
      })
      .getPendingReviewQueue(du.deviceId, du.username);
  }

  function _renderReviewQueue(queue) {
    var el = getElem('cl-review-queue');
    if (!el) return;
    if (!queue.length) {
      el.innerHTML = '<div style="padding:30px;text-align:center;color:#64748b;">' + clT('clNoPendingReviews') + '</div>';
      return;
    }
    var html = '<div style="overflow-x:auto;">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#0f766e;color:#fff;"><th style="padding:10px;text-align:left;">' + clT('clChecklist') + '</th><th style="padding:10px;">Outlet</th><th style="padding:10px;">' + clT('clFilledBy') + '</th><th style="padding:10px;">Submitted</th><th style="padding:10px;"></th></tr></thead><tbody>';
    queue.forEach(function(item, i) {
      var bg = i % 2 ? '#f8fafc' : '#fff';
      html += '<tr style="background:' + bg + ';">';
      html += '<td style="padding:10px;font-weight:600;">' + _esc(item.checklistName) + '</td>';
      html += '<td style="padding:10px;">' + _esc(item.outlet) + '</td>';
      html += '<td style="padding:10px;">' + _esc(item.filledBy) + '</td>';
      html += '<td style="padding:10px;font-size:11px;">' + _esc((item.submittedAt||'').slice(0,16).replace('T',' ')) + '</td>';
      html += '<td style="padding:10px;"><button class="add-btn" onclick="window._clReviewItem(\'' + _esc(item.shiftId) + '\',\'' + _esc(item.outlet) + '\',\'' + _esc(item.checklistId) + '\',\'' + _esc(item.checklistName) + '\')">' + clT('clReview') + '</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div id="cl-review-detail" style="margin-top:20px;"></div>';
    el.innerHTML = html;
  }

  window._clReviewItem = function(shiftId, outlet, checklistId, name) {
    var detail = getElem('cl-review-detail');
    if (!detail) return;
    detail.innerHTML = '⏳...';
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(data) {
        _renderReviewDetail(detail, data, shiftId, outlet, checklistId, name);
      })
      .withFailureHandler(function(err) { detail.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>'; })
      .getShiftChecklistStatus(shiftId, outlet, du.deviceId, du.username, checklistId);
  };

  function _renderReviewDetail(container, data, shiftId, outlet, checklistId, name) {
    var responses = (data && data.responses) || [];
    if (!responses.length) {
      container.innerHTML = '<div style="color:#64748b;">No responses found.</div>';
      return;
    }
    var allReviewed = responses.every(function(r) { return r.status === 'Reviewed'; });
    var html = '<div style="border:2px solid #99f6e4;border-radius:12px;padding:16px;">';
    html += '<h4 style="margin:0 0 12px;color:#0f766e;">' + _esc(name) + ' — ' + _esc(shiftId) + '</h4>';
    html += '<table style="width:100%;font-size:13px;border-collapse:collapse;">';
    responses.forEach(function(r) {
      html += '<tr><td style="padding:6px;border-bottom:1px solid #f1f5f9;font-weight:600;">' + _esc(r.questionSn) + '</td>';
      html += '<td style="padding:6px;border-bottom:1px solid #f1f5f9;">' + _esc(r.response) + '</td>';
      html += '<td style="padding:6px;border-bottom:1px solid #f1f5f9;color:#64748b;">' + _esc(r.comments) + '</td></tr>';
    });
    html += '</table>';
    if (!allReviewed) {
      html += '<div style="text-align:center;margin-top:16px;"><button class="pay-btn" onclick="window._clMarkReviewed(\'' + _esc(shiftId) + '\',\'' + _esc(outlet) + '\',\'' + _esc(checklistId) + '\')">✅ ' + clT('clMarkReviewed') + '</button></div>';
    } else {
      html += '<div style="margin-top:12px;color:#15803d;font-weight:600;">✅ ' + clT('clAlreadyReviewed') + '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  window._clMarkReviewed = function(shiftId, outlet, checklistId) {
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function() {
        if (typeof showToast === 'function') showToast(clT('toastShiftReviewed'), 'success');
        _renderReviewQueuePane();
      })
      .withFailureHandler(function(err) { alert(err); })
      .reviewChecklistShift(JSON.stringify({ shiftId: shiftId, outlet: outlet, checklistId: checklistId }), du.deviceId, du.username);
  };

  // ─── REPORT ──────────────────────────────────────────────────
  function _renderReportPane() {
    var pane = getElem('cl-pane-report');
    if (!pane) return;
    var today = new Date().toISOString().slice(0,10);
    var weekAgo = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
    var checklistOpts = '<option value="">' + clT('clAllChecklists') + '</option>';
    _definitions.forEach(function(d) {
      checklistOpts += '<option value="' + _esc(d.id) + '">' + _esc(d.name) + '</option>';
    });
    pane.innerHTML =
      '<h3 style="color:#0f766e;">📊 ' + clT('clNavReport') + '</h3>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;background:#f0fdfa;padding:14px;border-radius:10px;">' +
        '<div><label style="font-size:12px;font-weight:600;">Start</label><input id="clRptStart" type="date" value="' + weekAgo + '" style="display:block;padding:8px;border-radius:6px;"></div>' +
        '<div><label style="font-size:12px;font-weight:600;">End</label><input id="clRptEnd" type="date" value="' + today + '" style="display:block;padding:8px;border-radius:6px;"></div>' +
        '<div><label style="font-size:12px;font-weight:600;">Outlet</label><input id="clRptOutlet" type="text" value="' + _esc((window.LoginState&&window.LoginState.outlet)||'') + '" style="display:block;padding:8px;border-radius:6px;"></div>' +
        '<div><label style="font-size:12px;font-weight:600;">' + clT('clChecklist') + '</label><select id="clRptChecklist" style="display:block;padding:8px;border-radius:6px;">' + checklistOpts + '</select></div>' +
        '<div style="align-self:flex-end;"><button class="add-btn" onclick="window._clLoadReport()">' + clT('clGenerateReport') + '</button></div>' +
      '</div><div id="clReportResults"></div>';
  }

  window._clLoadReport = function() {
    var results = getElem('clReportResults');
    if (!results) return;
    results.innerHTML = '⏳...';
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(rows) { _renderReportTable(rows || []); })
      .withFailureHandler(function(err) { results.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>'; })
      .getComplianceReport(JSON.stringify({
        startDate: (getElem('clRptStart')||{}).value,
        endDate: (getElem('clRptEnd')||{}).value,
        outlet: (getElem('clRptOutlet')||{}).value,
        checklistId: (getElem('clRptChecklist')||{}).value || null
      }), du.deviceId, du.username);
  };

  function _renderReportTable(rows) {
    var results = getElem('clReportResults');
    if (!results) return;
    if (!rows.length) {
      results.innerHTML = '<div style="padding:30px;text-align:center;color:#64748b;">' + clT('clNoData') + '</div>';
      return;
    }
    var html = '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#0f766e;color:#fff;">';
    ['Date', clT('clChecklist'), 'Outlet', clT('clFilledBy'), 'Completion', 'Status'].forEach(function(h) {
      html += '<th style="padding:10px;text-align:left;">' + h + '</th>';
    });
    html += '</tr></thead><tbody>';
    rows.forEach(function(r, i) {
      var bg = i % 2 ? '#f8fafc' : '#fff';
      var rev = r.fullyReviewed ? '<span class="cl-badge cl-badge-done">Reviewed</span>' : '<span class="cl-badge cl-badge-pending">Pending</span>';
      html += '<tr style="background:' + bg + ';">';
      html += '<td style="padding:10px;">' + _esc(r.date) + '</td>';
      html += '<td style="padding:10px;font-weight:600;">' + _esc(r.checklistName) + '</td>';
      html += '<td style="padding:10px;">' + _esc(r.outlet) + '</td>';
      html += '<td style="padding:10px;">' + _esc(r.filledBy) + '</td>';
      html += '<td style="padding:10px;">' + (r.completionPct||0) + '%</td>';
      html += '<td style="padding:10px;">' + rev + '</td></tr>';
    });
    html += '</tbody></table></div>';
    results.innerHTML = html;
  }

  // ─── DEFINITIONS (admin panel) ───────────────────────────────
  function _renderDefinitionsPane() {
    var pane = getElem('admin-pane-checklistdefs');
    if (!pane) return;
    pane.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
      '<h3 style="margin:0;color:#0f766e;">📁 ' + clT('clNavDefinitions') + '</h3>' +
      '<button class="add-btn" onclick="window._clShowDefForm(null)">+ ' + clT('clNewChecklist') + '</button></div>' +
      '<div id="cl-def-list"></div><div id="cl-def-form-wrap"></div>';
    _loadDefinitionsAdmin();
  }

  function _loadDefinitionsAdmin() {
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function(defs) {
        _definitions = defs || [];
        _renderDefList();
      })
      .withFailureHandler(function(err) {
        var el = getElem('cl-def-list');
        if (el) el.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>';
      })
      .getAllChecklistDefinitions(du.deviceId, du.username);
  }

  function _renderDefList() {
    var el = getElem('cl-def-list');
    if (!el) return;
    if (!_definitions.length) {
      el.innerHTML = '<div style="padding:30px;text-align:center;color:#64748b;">' + clT('clNoDefinitions') + '</div>';
      return;
    }
    var html = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#0f766e;color:#fff;"><th>ID</th><th>Name</th><th>Assigned</th><th>Reviewers</th><th>Status</th><th></th></tr></thead><tbody>';
    _definitions.forEach(function(d, i) {
      var bg = i % 2 ? '#f8fafc' : '#fff';
      html += '<tr style="background:' + bg + ';">';
      html += '<td style="padding:10px;font-size:11px;color:#6366f1;">' + _esc(d.id) + '</td>';
      html += '<td style="padding:10px;font-weight:600;">' + _esc(d.name) + '</td>';
      html += '<td style="padding:10px;font-size:12px;">' + _esc(d.assignedRoles) + '</td>';
      html += '<td style="padding:10px;font-size:12px;">' + _esc(d.reviewerRoles) + '</td>';
      html += '<td style="padding:10px;">' + _esc(d.status) + '</td>';
      html += '<td style="padding:10px;"><button onclick="window._clShowDefForm(' + _esc(JSON.stringify(JSON.stringify(d))) + ')">Edit</button> ';
      html += '<button onclick="window._clManageQuestionsFor(\'' + _esc(d.id) + '\',\'' + _esc(d.name) + '\')">' + clT('clNavQuestions') + '</button></td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  window._clManageQuestionsFor = function(id, name) {
    _manageChecklistId = id;
    window._clQuestionsTitleOverride = name || '';
    if (typeof window.switchAdminTab === 'function') {
      if ((window.currentTab || '') !== 'adminOrders' && typeof switchTab === 'function') {
        switchTab('adminOrders');
        setTimeout(function() { window.switchAdminTab('checklistquestions'); }, 400);
      } else {
        window.switchAdminTab('checklistquestions');
      }
    }
  };

  window._clShowDefForm = function(defJson) {
    var wrap = getElem('cl-def-form-wrap');
    if (!wrap) return;
    var d = defJson ? JSON.parse(defJson) : null;
    var du = _deviceUser();

    function renderForm(roles) {
      _roleOptions = roles || [];
      var roleChecks = function(selected, field) {
        var sel = _parseCsvList(selected);
        return _roleOptions.map(function(r) {
          var checked = sel.indexOf(r) !== -1 ? 'checked' : '';
          return '<label style="margin-right:12px;font-size:13px;"><input type="checkbox" name="' + field + '" value="' + r + '" ' + checked + '> ' + r + '</label>';
        }).join('');
      };
      wrap.innerHTML =
        '<div style="background:#f0fdfa;border:2px solid #99f6e4;border-radius:12px;padding:20px;margin-top:16px;">' +
        '<h4 style="margin:0 0 14px;color:#0f766e;">' + (d ? clT('clEditChecklist') : clT('clNewChecklist')) + '</h4>' +
        '<form id="clDefForm" onsubmit="window._clSaveDef(event)">' +
        '<input type="hidden" id="clDefId" value="' + (d ? _esc(d.id) : '') + '">' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">' + clT('clName') + ' *</label>' +
        '<input type="text" id="clDefName" required value="' + (d ? _esc(d.name) : '') + '" style="width:100%;padding:9px;border-radius:6px;box-sizing:border-box;"></div>' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">' + clT('clDescription') + '</label>' +
        '<textarea id="clDefDesc" rows="2" style="width:100%;padding:9px;border-radius:6px;box-sizing:border-box;">' + (d ? _esc(d.description) : '') + '</textarea></div>' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">' + clT('clAssignedRoles') + '</label><div>' + roleChecks(d && d.assignedRoles, 'clAssignedRole') + '</div></div>' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">' + clT('clReviewerRoles') + '</label><div>' + roleChecks(d && d.reviewerRoles, 'clReviewerRole') + '</div></div>' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">' + clT('clOutlets') + ' (' + clT('optional') + ')</label>' +
        '<input type="text" id="clDefOutlets" value="' + (d ? _esc(d.outlets) : '') + '" placeholder="OUTLET1, OUTLET2" style="width:100%;padding:9px;border-radius:6px;box-sizing:border-box;"></div>' +
        '<div style="margin-bottom:12px;"><label style="font-weight:600;">Status</label>' +
        '<select id="clDefStatus" style="padding:9px;border-radius:6px;"><option value="Active"' + (d && d.status === 'Active' ? ' selected' : '') + '>Active</option>' +
        '<option value="Inactive"' + (d && d.status === 'Inactive' ? ' selected' : '') + '>Inactive</option></select></div>' +
        '<button type="submit" class="pay-btn" id="clDefSaveBtn">💾 ' + clT('save') + '</button> ' +
        '<button type="button" onclick="document.getElementById(\'cl-def-form-wrap\').innerHTML=\'\'" class="remove-btn">' + clT('cancel') + '</button>' +
        '</form></div>';
    }

    if (_roleOptions.length) {
      renderForm(_roleOptions);
    } else {
      google.script.run
        .withSuccessHandler(renderForm)
        .withFailureHandler(function() { renderForm(['cashier','supervisor','manager','chef']); })
        .getChecklistRoleOptions(du.deviceId, du.username);
    }
  };

  function _parseCsvList(str) {
    if (!str) return [];
    return String(str).split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean);
  }

  function _collectRoleChecks(name) {
    var boxes = document.querySelectorAll('[name="' + name + '"]:checked');
    var roles = [];
    boxes.forEach(function(b) { roles.push(b.value); });
    return roles.join(',');
  }

  window._clSaveDef = function(event) {
    event.preventDefault();
    var btn = getElem('clDefSaveBtn');
    if (btn) { btn.disabled = true; }
    var id = (getElem('clDefId') || {}).value || '';
    var payload = {
      id: id || undefined,
      name: (getElem('clDefName') || {}).value || '',
      description: (getElem('clDefDesc') || {}).value || '',
      assignedRoles: _collectRoleChecks('clAssignedRole'),
      reviewerRoles: _collectRoleChecks('clReviewerRole'),
      outlets: (getElem('clDefOutlets') || {}).value || '',
      status: (getElem('clDefStatus') || {}).value || 'Active',
      sortOrder: 0
    };
    var du = _deviceUser();
    google.script.run
      .withSuccessHandler(function() {
        if (typeof showToast === 'function') showToast(clT('clDefSaved'), 'success');
        document.getElementById('cl-def-form-wrap').innerHTML = '';
        _loadDefinitionsAdmin();
        google.script.run.withSuccessHandler(function(defs) { _definitions = defs || []; }).getChecklistDefinitions(du.deviceId, du.username);
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        alert(err);
      })
      .saveChecklistDefinition(JSON.stringify(payload), du.deviceId, du.username);
  };

  // ─── QUESTIONS (admin panel) ─────────────────────────────────
  function _renderQuestionsPane() {
    var pane = getElem('admin-pane-checklistquestions');
    if (!pane) return;

    function renderQuestionsShell() {
      if (!_manageChecklistId && _definitions.length) {
        _manageChecklistId = _definitions[0].id;
      }
      var selOpts = _definitions.map(function(d) {
        return '<option value="' + _esc(d.id) + '"' + (d.id === _manageChecklistId ? ' selected' : '') + '>' + _esc(d.name) + '</option>';
      }).join('');
      var titleText = window._clQuestionsTitleOverride || clT('clNavQuestions');
      pane.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
        '<h3 style="margin:0;color:#0f766e;">❓ <span id="cl-questions-title">' + _esc(titleText) + '</span></h3>' +
        '<div style="display:flex;gap:8px;align-items:center;">' +
        '<select id="clQChecklistSelect" onchange="window._clChangeManageChecklist(this.value)" style="padding:8px;border-radius:6px;">' + selOpts + '</select>' +
        '<button class="add-btn" onclick="window._clShowQuestionForm(null)">+ ' + clT('clAddQuestion') + '</button></div></div>' +
        '<div id="clManageList"></div><div id="clQuestionFormWrapper" style="display:none;"></div>';
      window._clQuestionsTitleOverride = null;
      _clLoadAllQuestions();
    }

    if (!_definitions.length) {
      var du = _deviceUser();
      google.script.run
        .withSuccessHandler(function(defs) {
          _definitions = defs || [];
          renderQuestionsShell();
        })
        .withFailureHandler(function(err) {
          pane.innerHTML = '<div style="color:#dc2626;padding:20px;">' + _esc(err) + '</div>';
        })
        .getAllChecklistDefinitions(du.deviceId, du.username);
    } else {
      renderQuestionsShell();
    }
  }

  window._clChangeManageChecklist = function(id) {
    _manageChecklistId = id;
    _clLoadAllQuestions();
  };

  function _clLoadAllQuestions() {
    var du = _deviceUser();
    var cid = _manageChecklistId || 'CL-DEFAULT';
    google.script.run
      .withSuccessHandler(function(qs) { _clRenderManageList(qs || []); })
      .withFailureHandler(function(err) {
        var el = getElem('clManageList');
        if (el) el.innerHTML = '<div style="color:#dc2626;">' + _esc(err) + '</div>';
      })
      .getAllChecklistQuestions(du.deviceId, du.username, cid);
  }

  function _clRenderManageList(qs) {
    var el = getElem('clManageList');
    if (!el) return;
    if (!qs.length) {
      el.innerHTML = '<div style="padding:30px;text-align:center;color:#64748b;">' + clT('clNoQuestions') + '</div>';
      return;
    }
    var html = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#0f766e;color:#fff;"><th>#</th><th>Category</th><th>Question</th><th>Type</th><th>Mandatory</th><th>Status</th><th></th></tr></thead><tbody>';
    qs.forEach(function(q, i) {
      var bg = i % 2 ? '#f8fafc' : '#fff';
      html += '<tr style="background:' + bg + ';">';
      html += '<td style="padding:9px;">' + (q.order||'') + '</td>';
      html += '<td style="padding:9px;">' + _esc(q.category) + '</td>';
      html += '<td style="padding:9px;">' + _esc(q.question) + '</td>';
      html += '<td style="padding:9px;">' + _esc(q.questionType) + '</td>';
      html += '<td style="padding:9px;">' + (q.mandatory ? '✱' : '—') + '</td>';
      html += '<td style="padding:9px;">' + _esc(q.status) + '</td>';
      html += '<td style="padding:9px;"><button onclick="window._clShowQuestionForm(' + _esc(JSON.stringify(JSON.stringify(q))) + ')">Edit</button></td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  window._clShowQuestionForm = function(qJson) {
    var wrapper = getElem('clQuestionFormWrapper');
    if (!wrapper) return;
    wrapper.style.display = 'block';
    var q = qJson ? JSON.parse(qJson) : null;
    wrapper.innerHTML =
      '<div style="background:#f0fdfa;border:2px solid #99f6e4;border-radius:12px;padding:20px;margin-top:16px;">' +
      '<h4>' + (q ? 'Edit' : 'New') + ' Question</h4>' +
      '<form id="clQForm" onsubmit="window._clSaveQuestion(event)">' +
      '<input type="hidden" id="clQSn" value="' + (q ? _esc(q.sn) : '') + '">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
      '<div><label style="font-weight:600;">Question *</label><input type="text" id="clQQuestion" required value="' + (q ? _esc(q.question) : '') + '" style="width:100%;padding:8px;box-sizing:border-box;"></div>' +
      '<div><label style="font-weight:600;">Category</label><input type="text" id="clQCategory" value="' + (q ? _esc(q.category) : '') + '" style="width:100%;padding:8px;box-sizing:border-box;"></div>' +
      '<div><label style="font-weight:600;">Type</label><select id="clQType" style="width:100%;padding:8px;">' +
      ['text','yesno','dropdown','rating'].map(function(t){return '<option value="'+t+'"'+(q&&q.questionType===t?' selected':'')+'>'+t+'</option>';}).join('') + '</select></div>' +
      '<div><label style="font-weight:600;">Dropdown values</label><input type="text" id="clQDropdownValues" value="' + (q ? _esc(q.dropdownValues) : '') + '" style="width:100%;padding:8px;box-sizing:border-box;"></div>' +
      '<div><label style="font-weight:600;">Order</label><input type="number" id="clQOrder" value="' + (q ? q.order : 10) + '" style="width:100%;padding:8px;box-sizing:border-box;"></div>' +
      '<div><label style="font-weight:600;">Outlet (blank=all)</label><input type="text" id="clQOutlet" value="' + (q ? _esc(q.outlet) : '') + '" style="width:100%;padding:8px;box-sizing:border-box;"></div>' +
      '<div style="grid-column:1/-1;"><label><input type="checkbox" id="clQMandatory"' + (q && q.mandatory ? ' checked' : '') + '> Mandatory</label></div>' +
      '<div><label style="font-weight:600;">Status</label><select id="clQStatus" style="width:100%;padding:8px;"><option value="Active">Active</option><option value="Inactive"' + (q && q.status === 'Inactive' ? ' selected' : '') + '>Inactive</option></select></div>' +
      '</div>' +
      '<div style="margin-top:14px;"><button type="submit" class="pay-btn" id="clQSaveBtn">💾 Save</button> <button type="button" class="remove-btn" onclick="window._clHideQuestionForm()">Cancel</button></div>' +
      '</form></div>';
  };

  window._clHideQuestionForm = function() {
    var w = getElem('clQuestionFormWrapper');
    if (w) { w.style.display = 'none'; w.innerHTML = ''; }
  };

  window._clSaveQuestion = function(event) {
    event.preventDefault();
    var du = _deviceUser();
    var payload = {
      sn: (getElem('clQSn') || {}).value || null,
      checklistId: _manageChecklistId || 'CL-DEFAULT',
      question: (getElem('clQQuestion') || {}).value || '',
      questionType: (getElem('clQType') || {}).value || 'text',
      dropdownValues: (getElem('clQDropdownValues') || {}).value || '',
      status: (getElem('clQStatus') || {}).value || 'Active',
      outlet: (getElem('clQOutlet') || {}).value || '',
      category: (getElem('clQCategory') || {}).value || '',
      mandatory: !!(getElem('clQMandatory') || {}).checked,
      order: Number((getElem('clQOrder') || {}).value) || 10
    };
    if (!payload.sn) delete payload.sn;
    google.script.run
      .withSuccessHandler(function() {
        if (typeof showToast === 'function') showToast(clT('toastQuestionSaved'), 'success');
        window._clHideQuestionForm();
        _clLoadAllQuestions();
      })
      .withFailureHandler(function(err) { alert(err); })
      .saveChecklistQuestion(JSON.stringify(payload), du.deviceId, du.username);
  };

  window.loadAdminChecklistDefs = _renderDefinitionsPane;
  window.loadAdminChecklistQuestions = _renderQuestionsPane;

})();
</script>
