<script>
  // Cash management and deposits functionality
  
  // Cached account functions
  function getCachedDepositAccounts() {
    return new Promise((resolve) => {
      // Check if we have cached deposit accounts
      if (window._cachedDepositAccounts && Array.isArray(window._cachedDepositAccounts)) {
        console.log('Using cached deposit accounts');
        resolve(window._cachedDepositAccounts);
        return;
      }
      
      // Load and cache deposit accounts
      const deviceId = window.LoginState?.deviceId || null;
      const username = window.LoginState?.user || null;
      
      google.script.run
        .withSuccessHandler(function(accounts) {
          window._cachedDepositAccounts = ensureArray(accounts);
          console.log('Cached deposit accounts:', window._cachedDepositAccounts.length);
          resolve(window._cachedDepositAccounts);
        })
        .withFailureHandler(() => {
          console.warn('Failed to load deposit accounts');
          resolve([]);
        })
        .getDepositAccounts(deviceId, username);
    });
  }

  function getCachedInvestmentAccounts() {
    return new Promise((resolve) => {
      // Check if we have cached investment accounts
      if (window._cachedInvestmentAccounts && Array.isArray(window._cachedInvestmentAccounts)) {

      }
      
      // Load and cache investment accounts

        .getInvestmentAccounts(deviceId, username);

  }

    return new Promise((resolve) => {

      }
      
      // Load and cache expense accounts
      const deviceId = window.LoginState?.deviceId || null;

  function clearDepositAccountCache() {
    console.log('Clearing deposit account caches');
    delete window._cachedDepositAccounts;
    delete window._cachedInvestmentAccounts;
    delete window._cachedExpenseAccounts;
  }

  function showCashInHand() {
    const renderCounter = getCurrentRenderCounter();
    getCachedDepositAccounts().then(function(accounts) {
      // Check if this render is still valid
      if (!isCurrentTabRender('deposits', renderCounter)) {
        console.log('Ignoring stale deposits render');
        return;
      }
      renderCashInHand(accounts);
    });
  }

  function saveDeposit(event) {
    event.preventDefault();
    
    // Prevent multiple submissions
    if (window._savingDeposit) {
      return;
    }
    window._savingDeposit = true;
    
    const amt = getNumericValue(getElem('depositAmount').value, lang);
    const account = getElem('depositAccount').value.trim();
    const note = getElem('depositNote').value.trim();
    
    if (!amt || amt <= 0 || !account) {
      window.showErrorModal(t('amountAccountRequired') || 'Amount and Account are required');
      window._savingDeposit = false;
      return;
    }
    
    // Disable navigation and show loading state
    if (window.disableAllNavigationWithRefreshProtection) {
      window.disableAllNavigationWithRefreshProtection();
    }
    
    // Disable form and show loading state
    const submitButton = event.target.querySelector('button[type="submit"]');
    const form = getElem('depositForm');
    const originalButtonText = submitButton.innerHTML;
    
    // Disable all form inputs
    const formInputs = form.querySelectorAll('input, select, button');
    formInputs.forEach(input => {
      input.disabled = true;
      input.style.opacity = '0.6';
    });
    
    // Show loading state on submit button
    submitButton.innerHTML = `
      <span class="loading-spinner">⏳</span>
      ${t('saving') || 'Saving...'}
    `;
    
    const paymentMethod = (getElem('depositPaymentMethod') ? getElem('depositPaymentMethod').value.trim() : '') || 'Bank Transfer';
    const deposit = { 
      amount: amt, 
      account, 
      note,
      paymentMethod
    };
    
    // ✅ SECURITY: Use SecurityWrapper for authenticated server calls
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      console.log('Using SecurityWrapper for deposit submission');
      
      window.SecurityWrapper.secureServerCall('recordDepositSecure', deposit)
        .then(() => {
          window._savingDeposit = false;
          // Re-enable navigation
          if (window.enableAllNavigationAndAllowRefresh) {
            window.enableAllNavigationAndAllowRefresh();
          }
          showDepositConfirmation();
        })
        .catch((error) => {
          console.error('Deposit save failed via SecurityWrapper:', error);
          window._savingDeposit = false;
          
          // Re-enable navigation
          if (window.enableAllNavigationAndAllowRefresh) {
            window.enableAllNavigationAndAllowRefresh();
          }
          
          // Restore form state
          formInputs.forEach(input => {
            input.disabled = false;
            input.style.opacity = '1';
          });
          submitButton.innerHTML = originalButtonText;
          
          // Check if it's an authentication error
          if (error && error.toString().toLowerCase().includes('authentication')) {
            console.warn('Authentication error during deposit submission, redirecting to login');
            window.SecurityWrapper.forceLogout();
          } else {
            // Show error modal
            window.showErrorModal(t('depositSaveFailed') || `Failed to save deposit: ${error.message || error}`);
          }
        });
    } else {
      console.error('SecurityWrapper not available - deposit submission requires secure authentication');
      window._savingDeposit = false;
      
      // Re-enable navigation
      if (window.enableAllNavigationAndAllowRefresh) {
        window.enableAllNavigationAndAllowRefresh();
      }
      
      // Restore form state
      formInputs.forEach(input => {
        input.disabled = false;
        input.style.opacity = '1';
      });
      submitButton.innerHTML = originalButtonText;
      
      // Show error
      if (window.showErrorModal) {
        window.showErrorModal('Security system not available. Please refresh the page and try again.');
      } else {
        alert('Security system not available. Please refresh the page and try again.');
      }
    }
  }

    }
    
    // Force clear any existing content and styles

    main.className = '';
    
    let accountOptions = (accounts || []).map(acc =>
      `<option value="${acc}">${acc}</option>`).join('');
    main.innerHTML = `
      <div id="deposits-container">

          <button id="cashPositionTabBtn" class="sub-tab-btn active"

            <span class="tab-icon">💰</span>

          </button>
          <button id="makeDepositTabBtn" class="sub-tab-btn"

            <span class="tab-icon">📥</span>

          <button id="transactionHistoryTabBtn" class="sub-tab-btn"

            <span class="tab-icon">📋</span>

        </div>
        
        <!-- Cash Position Tab -->
        <div id="cash-position-content" style="display:block;">
          <div class="cash-position-section">
            <h3>
              <span class="section-icon">💰</span>

            <div id="cash-details" class="loading">
              <div class="loading-skeleton-container">
                <div class="loading-skeleton wide"></div>
                <div class="loading-skeleton"></div>
                <div class="loading-skeleton narrow"></div>
                <div class="loading-skeleton"></div>
                <div class="loading-skeleton narrow"></div>
                <div class="loading-skeleton wide"></div>
              </div>
            </div>
            <div class="cash-position-actions">
              <button class="secondary-btn" onclick="refreshCashPosition()">
                <span class="btn-icon">🔄</span>
                Refresh Position
              </button>
              <button class="secondary-btn" onclick="showDailyCashSummary()">
                <span class="btn-icon">📅</span>
                Daily Summary
              </button>
              <button class="primary-btn" onclick="activateDepositTab('makeDeposit')">
                <span class="btn-icon">📥</span>
                Make Deposit
              </button>
            </div>
          </div>
        </div>
        
        <!-- Make Deposit Tab -->
        <div id="make-deposit-content" style="display:none;">
          <div class="make-deposit-section">
            <!-- CIH / Remaining banner -->
            <div id="deposit-cih-banner" style="background:linear-gradient(135deg,#0062cc,#007bff);color:white;border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,98,204,0.25);">
              <div>
                <div style="font-size:0.7em;opacity:0.8;letter-spacing:0.6px;margin-bottom:3px;">💰 CASH IN HAND</div>
                <div id="deposit-cih-value" style="font-size:1.55em;font-weight:bold;">—</div>
              </div>

                <div style="font-size:0.7em;opacity:0.8;letter-spacing:0.6px;margin-bottom:3px;">📤 REMAINING AFTER</div>
                <div id="deposit-remaining-value" style="font-size:1.55em;font-weight:bold;">—</div>

            </div>
            <div class="deposit-form-container" style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px;">
              <h3 style="margin:0 0 18px 0;font-size:1em;color:#334155;font-weight:700;">📥 Make New Deposit</h3>

                <div class="form-field" style="margin-bottom:14px;">

                  <input type="text" id="depositAmount" required placeholder="0"

                  <select id="depositPaymentMethod" required

                    <option value="Bank Transfer">Bank Transfer</option>
                  </select>
                  <div class="field-hint" style="font-size:0.78em;color:#94a3b8;margin-top:4px;">How the deposit was made</div>
                </div>
                <div class="form-field" style="margin-bottom:14px;">
                  <label for="depositAccount" style="display:block;font-size:0.83em;font-weight:600;color:#475569;margin-bottom:5px;">${t('account')} <span style="color:#e53e3e;">*</span></label>
                  <select id="depositAccount" required
                          style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:0.95em;background:#fff;color:#1e293b;">
                    <option value="">— ${t('selectAccount') || 'Select Account'} —</option>
                    ${accountOptions}
                  </select>
                  <div class="field-hint" style="font-size:0.78em;color:#94a3b8;margin-top:4px;">Choose the destination account</div>
                </div>
                <div class="form-field" style="margin-bottom:20px;">
                  <label for="depositNote" style="display:block;font-size:0.83em;font-weight:600;color:#475569;margin-bottom:5px;">${t('note')}</label>
                  <input type="text" id="depositNote" placeholder="Optional note..."
                         style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:0.95em;color:#1e293b;outline:none;">
                  <div class="field-hint" style="font-size:0.78em;color:#94a3b8;margin-top:4px;">Optional description for this deposit</div>
                </div>
                <div class="form-actions" style="display:flex;gap:10px;">
                  <button type="button" class="secondary-btn" onclick="resetDepositForm()" style="flex:1;">
                    <span class="btn-icon">🔄</span> Reset
                  </button>
                  <button class="primary-btn submit-btn" type="submit" style="flex:2;">

                    <span class="btn-text">Submit Deposit</span>
                  </button>
                </div>
              </form>

          </div>
        </div>
        
        <!-- Transaction History Tab -->
        <div id="transaction-history-content" style="display:none;">
          <div class="transaction-history-section">
            <h3>
              <span class="section-icon">📋</span>
              Deposit Transaction History
            </h3>
            <div class="history-controls">
              <button class="secondary-btn" onclick="refreshTransactionHistory()">
                <span class="btn-icon">🔄</span>
                Refresh History
              </button>
              <button class="secondary-btn" onclick="exportTransactionHistory()">
                <span class="btn-icon">📊</span>

    // Load cash summary for the cash position tab (default)
    const renderCounter = getCurrentRenderCounter();
    
    // Get clean login session data for backend call
    const deviceId = window.LoginState?.deviceId || null;
    const username = window.LoginState?.user || null;
    
    console.log('Deposits: Using session data - DeviceId:', deviceId ? 'Present' : 'Missing', 'Username:', username || 'Missing');
    
    google.script.run.withSuccessHandler(function(data) {
      // Check if this render is still valid
      if (!isCurrentTabRender('deposits', renderCounter)) {
        console.log('Ignoring stale cash summary render');
        return;
      }
      const parsed = JSON.parse(data);
      window._cashSummaryData = parsed;
      renderCashDetails(parsed);
    }).withFailureHandler(function(error) {
      console.error('Error loading cash summary:', error);
      const cashDetailsDiv = getElem('cash-details');
      if (cashDetailsDiv) {
        cashDetailsDiv.innerHTML = `<div class="error">Error loading cash data: ${error.message || error}</div>`;
      }
    }).getCashSummary(deviceId, username);
  }

  function updateDepositRemaining() {
    var cih = window._cashSummaryData ? window._cashSummaryData.cashInHand : null;
    var cihEl = document.getElementById('deposit-cih-value');
    var remEl = document.getElementById('deposit-remaining-value');
    var banner = document.getElementById('deposit-cih-banner');
    if (!cihEl || !remEl) return;
    if (cih == null) { cihEl.textContent = '\u2014'; remEl.textContent = '\u2014'; return; }
    cihEl.textContent = formatCurrency(cih);
    var amtInput = document.getElementById('depositAmount');
    var amt = getNumericValue((amtInput ? amtInput.value : ''), lang) || 0;
    var remaining = cih - amt;
    remEl.textContent = formatCurrency(remaining);
    if (banner) {
      banner.style.background = remaining < 0
        ? 'linear-gradient(135deg,#c82333,#dc3545)'
        : 'linear-gradient(135deg,#0062cc,#007bff)';
    }
  }
  window.updateDepositRemaining = updateDepositRemaining;

  function initializeFormEnhancements() {
    // Auto-focus on amount field
    const amountField = getElem('depositAmount');
    if (amountField) {
      setTimeout(() => {
        amountField.focus();
      }, 100);
      
      // Format currency as user types with cursor position management
      amountField.addEventListener('input', function(e) {
        // Store cursor position
        const cursorStart = e.target.selectionStart;
        const cursorEnd = e.target.selectionEnd;
        const oldValue = e.target.value;
        
        // Format the input
        formatAmountInput(e.target);
        
        // Restore cursor position if possible
        const newValue = e.target.value;
        if (oldValue !== newValue) {
          // Try to maintain cursor position relative to the end of the input
          const newCursorPosition = Math.min(cursorStart, newValue.length);
          setTimeout(() => {
            e.target.setSelectionRange(newCursorPosition, newCursorPosition);
          }, 0);
        }
      });
      
      // Handle backspace and delete keys specifically
      amountField.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' || e.key === 'Delete') {
          // Let the default behavior happen first
          setTimeout(() => {
            formatAmountInput(e.target);
          }, 0);
        }
      });
      
      // Handle paste events
      amountField.addEventListener('paste', function(e) {
        setTimeout(() => {
          formatAmountInput(e.target);
        }, 0);
      });
      
      // Real-time validation
      amountField.addEventListener('blur', function() {
        validateAmountField(this);
      });
    }
    
    // Account field validation
    const accountField = getElem('depositAccount');
    if (accountField) {
      accountField.addEventListener('change', function() {
        validateAccountField(this);
      });
    }
    
    // Form keyboard navigation
    const form = getElem('depositForm');
    if (form) {
      form.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
          e.preventDefault();
          const inputs = Array.from(form.querySelectorAll('input, select'));
          const currentIndex = inputs.indexOf(e.target);
          const nextInput = inputs[currentIndex + 1];
          if (nextInput) {
            nextInput.focus();
          } else {
            form.querySelector('button[type="submit"]').click();
          }
        }
      });
    }
    
    // Set placeholder with example format
    if (lang === 'id') {
      amountField.placeholder = 'Contoh: 50.000,75';
    } else {
      amountField.placeholder = 'Example: 50,000.75';
    }

    // Show CIH on the banner immediately
    updateDepositRemaining();

    // Populate payment method dropdown from cached methods
    var pmSel = getElem('depositPaymentMethod');
    if (pmSel && window.getCachedPaymentMethods) {
      getCachedPaymentMethods().then(function(methods) {
        var pmEl = getElem('depositPaymentMethod');
        if (!pmEl || !methods || !methods.length) return;
        var eligible = methods.filter(function(m) { return m.name.toLowerCase() !== 'partial'; });
        if (eligible.length > 0) {
          pmEl.innerHTML = eligible.map(function(m) {
            return '<option value="' + m.name + '">' + m.name + '</option>';
          }).join('');
          var bankOpt = eligible.find(function(m) { return /transfer|bank/i.test(m.name); });
          if (bankOpt) { pmEl.value = bankOpt.name; }
        }
      });
    }
  }

  function formatAmountInput(input) {
    // Get the current value
    let value = input.value;
    
    // Remove all formatting first
    let cleanValue;
    if (lang === 'id') {
      // For Indonesian: remove dots (thousand separator) and handle comma as decimal
      cleanValue = value.replace(/\./g, '').replace(',', '.');
    } else {
      // For English: remove commas (thousand separator)
      cleanValue = value.replace(/,/g, '');
    }
    
    // Parse as float
    let numericValue = parseFloat(cleanValue);
    
    // If not a valid number, clear the input
    if (isNaN(numericValue)) {
      input.value = '';
      return;
    }
    
    // Format with appropriate separators
    let formattedValue;
    if (lang === 'id') {
      // Indonesian format: 20.000,50 (dot for thousands, comma for decimal)
      formattedValue = numericValue.toLocaleString('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    } else {
      // English format: 20,000.50 (comma for thousands, dot for decimal)
      formattedValue = numericValue.toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }
    
    input.value = formattedValue;
  }

  // Helper function to get numeric value from formatted input
  function getNumericValue(formattedValue, lang) {
    if (!formattedValue) return 0;
    
    // Convert string to ensure we have a string
    const strValue = formattedValue.toString();
    
    if (lang === 'id') {
      // Indonesian format: remove dots (thousand separator) and replace comma with dot for decimal
      const cleanValue = strValue.replace(/\./g, '').replace(',', '.');
      return parseFloat(cleanValue) || 0;
    } else {
      // English format: remove commas (thousand separator)
      const cleanValue = strValue.replace(/,/g, '');
      return parseFloat(cleanValue) || 0;
    }
  }

  function validateAmountField(input) {
    const value = parseFloat(input.value);
    const fieldContainer = input.closest('.form-field');
    
    // Remove existing validation classes
    fieldContainer.classList.remove('field-valid', 'field-error');
    
    if (value && value > 0) {
      fieldContainer.classList.add('field-valid');
      showFieldSuccess(input, '✓ Valid amount');
    } else if (input.value) {
      fieldContainer.classList.add('field-error');
      showFieldError(input, 'Amount must be greater than 0');
    }
  }

  function validateAccountField(select) {
    const fieldContainer = select.closest('.form-field');
    
    // Remove existing validation classes
    fieldContainer.classList.remove('field-valid', 'field-error');
    
    if (select.value) {
      fieldContainer.classList.add('field-valid');
      showFieldSuccess(select, '✓ Account selected');
    } else {
      fieldContainer.classList.add('field-error');
      showFieldError(select, 'Please select an account');
    }
  }

  function showFieldSuccess(field, message) {
    removeFieldMessage(field);
    const hint = field.parentNode.querySelector('.field-hint');
    if (hint) {
      hint.innerHTML = `<span style="color: #38a169;">${message}</span>`;
    }
  }

  function showFieldError(field, message) {
    removeFieldMessage(field);
    const hint = field.parentNode.querySelector('.field-hint');
    if (hint) {
      hint.innerHTML = `<span style="color: #e53e3e;">${message}</span>`;
    }
  }

  function removeFieldMessage(field) {
    const hint = field.parentNode.querySelector('.field-hint');
    if (hint) {
      // Restore original hint text
      const fieldName = field.getAttribute('id');
      if (fieldName === 'depositAmount') {
        hint.innerHTML = 'Enter the amount to deposit';
      } else if (fieldName === 'depositAccount') {
        hint.innerHTML = 'Choose the target account';
      } else if (fieldName === 'depositNote') {
        hint.innerHTML = 'Optional description for this deposit';
      }
    }
  }

  function activateDepositTab(tab) {
    const cashPositionTabBtn = getElem('cashPositionTabBtn');
    const makeDepositTabBtn = getElem('makeDepositTabBtn');
    const transactionHistoryTabBtn = getElem('transactionHistoryTabBtn');
    
    const cashPositionContent = getElem('cash-position-content');
    const makeDepositContent = getElem('make-deposit-content');
    const transactionHistoryContent = getElem('transaction-history-content');

    // Remove active classes from all tabs
    if (cashPositionTabBtn) cashPositionTabBtn.classList.remove('active');
    if (makeDepositTabBtn) makeDepositTabBtn.classList.remove('active');
    if (transactionHistoryTabBtn) transactionHistoryTabBtn.classList.remove('active');
    
    // Hide all content sections
    if (cashPositionContent) cashPositionContent.style.display = 'none';
    if (makeDepositContent) makeDepositContent.style.display = 'none';
    if (transactionHistoryContent) transactionHistoryContent.style.display = 'none';

    // Activate the selected tab
    switch (tab) {
      case 'cashPosition':
        if (cashPositionTabBtn) cashPositionTabBtn.classList.add('active');
        if (cashPositionContent) cashPositionContent.style.display = 'block';
        // Cash position data is already loaded
        break;
        
      case 'makeDeposit':
        if (makeDepositTabBtn) makeDepositTabBtn.classList.add('active');
        if (makeDepositContent) makeDepositContent.style.display = 'block';
        // Initialize form enhancements
        initializeFormEnhancements();
        break;
        
      case 'transactionHistory':
        if (transactionHistoryTabBtn) transactionHistoryTabBtn.classList.add('active');
        if (transactionHistoryContent) transactionHistoryContent.style.display = 'block';
        // Load transaction history
        loadDepositHistory();
        break;
        
      default:

          console.log('Ignoring stale deposit history render');
          return;
        }
        
        console.log("Backend returned rows:", rowsD);
        renderDepositHistory(rowsD);
      })
      .withFailureHandler(function(error) {

        if (!isCurrentTabRender('deposits', renderCounter)) {

  // Deposit history sort state
  let depositSortColumn = 'date';
  let depositSortDirection = 'desc';
  let _depositHistoryData = [];
  let _depositFilterMonth = '';
  let _depositFilterAccount = '';
  let _depositFilterPayment = '';

  // Parse dd-MMM-yyyy format for sorting
  function parseDDMMMYYYY(str) {
    if (!str) return new Date('1970-01-01');
    const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const parts = str.split('-');
    if (parts.length === 3 && months[parts[1]] !== undefined) {
      return new Date(parseInt(parts[2]), months[parts[1]], parseInt(parts[0]));
    }
    return new Date(str);
  }

  function sortDepositHistory(column) {
    if (depositSortColumn === column) {
      depositSortDirection = depositSortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      depositSortColumn = column;
      depositSortDirection = (column === 'date' || column === 'amount') ? 'desc' : 'asc';
    }
    renderDepositHistoryTable();
  }
  window.sortDepositHistory = sortDepositHistory;

  function applyDepositFilters() {
    var mSel = document.getElementById('filterDepMonth');
    var aSel = document.getElementById('filterDepAccount');
    var pSel = document.getElementById('filterDepPayment');
    _depositFilterMonth = mSel ? mSel.value : '';
    _depositFilterAccount = aSel ? aSel.value : '';
    _depositFilterPayment = pSel ? pSel.value : '';
    renderDepositHistoryTable();
  }
  window.applyDepositFilters = applyDepositFilters;

  function renderDepositHistory(rowsDeposit) {
    const el = getElem('deposit-history');
    if (!el) { console.log('No #deposit-history element found!'); return; }
    if (!rowsDeposit || rowsDeposit.length === 0) {
      el.innerHTML = '<div class="no-data">No deposits recorded.</div>';
      return;
    }
    _depositHistoryData = rowsDeposit;
    _depositFilterMonth = '';
    _depositFilterAccount = '';
    _depositFilterPayment = '';
    depositSortColumn = 'date';
    depositSortDirection = 'desc';
    renderDepositHistoryTable();
  }

  function getMonthKeyFromDate(dateStr) {
    if (!dateStr) return '';
    var d = parseDDMMMYYYY(dateStr);
    if (!d || isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  function formatMonthKey(mk) {
    if (!mk) return mk;
    var parts = mk.split('-');
    if (parts.length !== 2) return mk;
    var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return monthNames[parseInt(parts[1]) - 1] + ' ' + parts[0];
  }

  function renderDepositHistoryTable() {
    const el = getElem('deposit-history');
    if (!el || !_depositHistoryData.length) return;

    // Build unique filter options from all data
    var allMonths = [], allAccounts = [], allPayments = [];
    _depositHistoryData.forEach(function(row) {
      var mk = getMonthKeyFromDate(row.date);
      if (mk && allMonths.indexOf(mk) === -1) allMonths.push(mk);
      if (row.account && allAccounts.indexOf(row.account) === -1) allAccounts.push(row.account);
      var pm = row.paymentMethod || '';
      if (pm && allPayments.indexOf(pm) === -1) allPayments.push(pm);
    });
    allMonths.sort().reverse();
    allAccounts.sort();
    allPayments.sort();

    // Apply filters
    var data = _depositHistoryData.filter(function(row) {
      if (_depositFilterMonth && getMonthKeyFromDate(row.date) !== _depositFilterMonth) return false;
      if (_depositFilterAccount && row.account !== _depositFilterAccount) return false;
      if (_depositFilterPayment && (row.paymentMethod || '') !== _depositFilterPayment) return false;
      return true;
    });

    // Sort
    data.sort(function(a, b) {
      var aVal, bVal;
      if (depositSortColumn === 'date') {
        aVal = parseDDMMMYYYY(a.date); bVal = parseDDMMMYYYY(b.date);
      } else if (depositSortColumn === 'amount') {
        aVal = parseFloat(a.amount) || 0; bVal = parseFloat(b.amount) || 0;
      } else {
        aVal = (a[depositSortColumn] || '').toString().toLowerCase();
        bVal = (b[depositSortColumn] || '').toString().toLowerCase();
      }
      if (aVal < bVal) return depositSortDirection === 'asc' ? -1 : 1;
      if (aVal > bVal) return depositSortDirection === 'asc' ? 1 : -1;
      return 0;
    });

    // Group by month
    var grouped = {}, groupOrder = [];
    data.forEach(function(row) {
      var mk = getMonthKeyFromDate(row.date) || 'Unknown';
      if (!grouped[mk]) { grouped[mk] = []; groupOrder.push(mk); }
      grouped[mk].push(row);
    });

    function sortArrow(col) {
      if (depositSortColumn !== col) return ' <span style="opacity:0.35;">\u21d5</span>';
      return depositSortDirection === 'asc' ? ' \u2191' : ' \u2193';
    }

    // Filter bar
    var html = '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">';
    html += '<select id="filterDepMonth" onchange="applyDepositFilters()" style="padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:0.88em;background:#fff;color:#334155;">';
    html += '<option value="">\ud83d\udcc5 All Months</option>';
    allMonths.forEach(function(m) {
      html += '<option value="' + m + '"' + (m === _depositFilterMonth ? ' selected' : '') + '>' + formatMonthKey(m) + '</option>';
    });
    html += '</select>';
    html += '<select id="filterDepAccount" onchange="applyDepositFilters()" style="padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:0.88em;background:#fff;color:#334155;">';
    html += '<option value="">\ud83c\udfe6 All Accounts</option>';
    allAccounts.forEach(function(a) {
      html += '<option value="' + a + '"' + (a === _depositFilterAccount ? ' selected' : '') + '>' + a + '</option>';
    });
    html += '</select>';
    if (allPayments.length > 0) {
      html += '<select id="filterDepPayment" onchange="applyDepositFilters()" style="padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:0.88em;background:#fff;color:#334155;">';
      html += '<option value="">\ud83d\udcb3 All Payments</option>';
      allPayments.forEach(function(p) {
        html += '<option value="' + p + '"' + (p === _depositFilterPayment ? ' selected' : '') + '>' + p + '</option>';
      });
      html += '</select>';
    }
    html += '<span style="font-size:0.82em;color:#64748b;">' + data.length + ' record' + (data.length !== 1 ? 's' : '') + '</span>';
    html += '</div>';

    // Grouped monthly tables
    var totalDeposited = 0;
    if (groupOrder.length === 0) {
      html += '<div class="no-data">No records match the selected filters.</div>';
    } else {
      groupOrder.forEach(function(mk) {
        var rows = grouped[mk];
        var monthTotal = rows.reduce(function(s, r) { return s + (parseFloat(r.amount) || 0); }, 0);
        totalDeposited += monthTotal;

        // Per-payment-method subtotals for this month
        var pmTotals = {};
        rows.forEach(function(r) {
          var pm = r.paymentMethod || 'Other';
          pmTotals[pm] = (pmTotals[pm] || 0) + (parseFloat(r.amount) || 0);
        });
        var pmBadges = Object.keys(pmTotals).map(function(pm) {
          return '<span style="background:#dbeafe;color:#1d4ed8;border-radius:5px;padding:2px 8px;font-size:0.76em;font-weight:600;white-space:nowrap;">' + pm + ': ' + formatCurrency(pmTotals[pm]) + '</span>';
        }).join(' ');

        html += '<div style="margin-bottom:14px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;">';
        html += '<details open>';
        html += '<summary style="background:linear-gradient(135deg,#f1f5f9,#e2e8f0);padding:10px 14px;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">';
        html += '<span style="font-weight:700;color:#334155;font-size:0.93em;margin-right:2px;">\ud83d\udcc5 ' + formatMonthKey(mk) + '</span>';
        html += pmBadges;
        html += '<span style="margin-left:auto;font-weight:700;color:#0369a1;font-size:0.95em;">' + formatCurrency(monthTotal) + '</span>';
        html += '</summary>';
        html += '<table style="width:100%;border-collapse:collapse;background:#fff;">';
        html += '<thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">';
        html += '<th onclick="sortDepositHistory(\'date\')" style="text-align:left;padding:7px 12px;font-size:0.82em;color:#475569;cursor:pointer;font-weight:600;white-space:nowrap;">Date' + sortArrow('date') + '</th>';
        html += '<th onclick="sortDepositHistory(\'amount\')" style="text-align:right;padding:7px 12px;font-size:0.82em;color:#475569;cursor:pointer;font-weight:600;white-space:nowrap;">Amount' + sortArrow('amount') + '</th>';
        html += '<th onclick="sortDepositHistory(\'account\')" style="text-align:left;padding:7px 12px;font-size:0.82em;color:#475569;cursor:pointer;font-weight:600;">Account' + sortArrow('account') + '</th>';
        html += '<th style="text-align:left;padding:7px 12px;font-size:0.82em;color:#475569;font-weight:600;">Payment</th>';
        html += '<th style="text-align:left;padding:7px 12px;font-size:0.82em;color:#475569;font-weight:600;">Note</th>';
        html += '</tr></thead><tbody>';
        rows.forEach(function(row, idx) {
          var amount = parseFloat(row.amount) || 0;
          var bg = idx % 2 === 0 ? '#fff' : '#f8fafc';
          html += '<tr style="background:' + bg + ';border-bottom:1px solid #f1f5f9;" onmouseover="this.style.background=\'#e0f2fe\'" onmouseout="this.style.background=\'' + bg + '\'">';
          html += '<td style="padding:8px 12px;white-space:nowrap;font-size:0.88em;">' + (row.date || '') + '</td>';
          html += '<td style="padding:8px 12px;text-align:right;font-weight:600;color:#0369a1;white-space:nowrap;">' + formatCurrency(amount) + '</td>';
          html += '<td style="padding:8px 12px;font-size:0.9em;">' + (row.account || '') + '</td>';
          html += '<td style="padding:8px 12px;font-size:0.88em;color:#64748b;">' + (row.paymentMethod || '\u2014') + '</td>';
          html += '<td style="padding:8px 12px;font-size:0.88em;color:#64748b;">' + (row.note || '\u2014') + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></details></div>';
      });
      html += '<div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">';
      html += '<span style="font-weight:700;color:#166534;">Total (' + data.length + ' deposits)</span>';
      html += '<span style="font-weight:700;color:#166534;font-size:1.05em;">' + formatCurrency(totalDeposited) + '</span>';
      html += '</div>';
    }

    el.innerHTML = html;

    // Suppress default <details> marker arrow
    if (!document.getElementById('deposit-table-styles')) {
      var style = document.createElement('style');
      style.id = 'deposit-table-styles';
      style.textContent = '#deposit-history details > summary { list-style:none; } #deposit-history details > summary::-webkit-details-marker { display:none; } #deposit-history details > summary::marker { display:none; }';
      document.head.appendChild(style);
    }
  }

  function renderCashDetails(data) {
    const cashDetailsDiv = getElem('cash-details');
    if (!cashDetailsDiv) {
      console.error('Cash details div not found');
      return;
    }

    if (!data || typeof data !== 'object') {
      cashDetailsDiv.innerHTML = `<div class="error">No cash data available</div>`;
      return;
    }

    // Values
    const totalSales = data.totalSales || 0;
    const salesByNonCash = data.totalSalesByNonCash || 0;
    const salesByCash = data.totalSalesByCash || (totalSales - salesByNonCash);
    const totalDeposited = data.totalDeposits || 0;
    const totalDepositedQris = data.totalDepositsQris || 0;
    const totalDepositedTransfer = data.totalDepositsTransfer || 0;
    const expensesByCash = data.totalCashExpenses || 0;
    const deductibleExpenses = data.totalDeductibleExpenses != null ? data.totalDeductibleExpenses : expensesByCash;
    const purchasesByCash = data.totalCashPurchases || 0;
    const cashInHand = data.cashInHand != null ? data.cashInHand : (totalSales - deductibleExpenses - purchasesByCash - totalDeposited);
    const currentMonthCashInHand = data.currentMonthCashInHand != null ? data.currentMonthCashInHand : null;

    // Payment method breakdowns
    const _salesByMethod = data.salesByPaymentMethod || {};
    const _salesMethodKeys = Object.keys(_salesByMethod).sort();
    const _depositsByMethod = data.depositsByPaymentMethod || {};
    const _depositMethodKeys = Object.keys(_depositsByMethod).sort();
    const _expensesByMethod = data.expensesByPaymentMethod || {};
    const _expenseMethodKeys = Object.keys(_expensesByMethod).sort();
    const _purchasesByMethod = data.purchasesByPaymentMethod || {};
    const _purchaseMethodKeys = Object.keys(_purchasesByMethod).sort();

    // ── helpers ──
    function detailRow(label, amtStr, color, hasBorder) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 16px;' +
        (hasBorder ? 'border-bottom:1px solid #f0f0f0;' : '') + '">' +
        '<span style="color:#495057;">' + label + '</span>' +
        '<span style="color:' + color + ';font-family:monospace;font-weight:600;">' + amtStr + '</span>' +
        '</div>';
    }
    function card(headerBg, headerBorder, titleColor, title, total, bodyHtml) {
      return '<div style="background:white;border:1px solid ' + headerBorder + ';border-radius:10px;margin-bottom:10px;overflow:hidden;">' +
        '<div style="background:' + headerBg + ';padding:10px 16px;display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-weight:bold;color:' + titleColor + ';">' + title + '</span>' +
        '<span style="font-weight:bold;color:' + titleColor + ';">' + total + '</span>' +
        '</div>' + bodyHtml + '</div>';
    }

    // Sales rows
    let salesBody = '';
    if (_salesMethodKeys.length > 0) {
      _salesMethodKeys.forEach(function(key, i) {
        salesBody += detailRow(key, '+' + formatCurrency(_salesByMethod[key] || 0), '#28a745', i < _salesMethodKeys.length - 1);
      });
    } else {
      salesBody += detailRow(t('cash') || 'Cash', '+' + formatCurrency(salesByCash), '#28a745', true);
      salesBody += detailRow(t('digitalSales') || 'Non-Cash', '+' + formatCurrency(salesByNonCash), '#28a745', false);
    }

    // Deposit rows
    let depositBody = '';
    if (totalDeposited > 0) {
      if (_depositMethodKeys.length > 0) {
        _depositMethodKeys.forEach(function(key, i) {
          depositBody += detailRow(key, '−' + formatCurrency(_depositsByMethod[key] || 0), '#fd7e14', i < _depositMethodKeys.length - 1);
        });
      } else {
        depositBody += detailRow('QRIS', '−' + formatCurrency(totalDepositedQris), '#fd7e14', true);
        depositBody += detailRow('Transfer', '−' + formatCurrency(totalDepositedTransfer), '#fd7e14', false);
      }
    } else {
      depositBody = '<div style="padding:10px 16px;color:#aaa;font-style:italic;font-size:0.9em;">No deposits recorded</div>';
    }

    // CIH colours
    const cihColor = cashInHand >= 0 ? '#0056b3' : '#dc3545';
    const cihBg    = cashInHand >= 0 ? 'linear-gradient(135deg,#0062cc,#007bff)' : 'linear-gradient(135deg,#c82333,#dc3545)';
    const monthColor = (currentMonthCashInHand !== null && currentMonthCashInHand >= 0) ? '#155724' : '#721c24';
    const monthBg    = (currentMonthCashInHand !== null && currentMonthCashInHand >= 0) ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';

    let html = '<div style="font-family:inherit;">';

    // ── Hero ──
    html += '<div style="background:' + cihBg + ';color:white;border-radius:12px;padding:20px 16px;margin-bottom:14px;text-align:center;">';
    html += '<div style="font-size:0.78em;opacity:0.85;letter-spacing:0.5px;margin-bottom:4px;">💰 CASH IN HAND (ALL TIME)</div>';
    html += '<div style="font-size:2em;font-weight:bold;">' + formatCurrency(cashInHand) + '</div>';
    if (currentMonthCashInHand !== null) {
      html += '<div style="margin-top:12px;background:' + monthBg + ';border-radius:8px;padding:8px 16px;display:inline-block;">';
      html += '<div style="font-size:0.72em;opacity:0.85;">📅 THIS MONTH</div>';
      html += '<div style="font-size:1.3em;font-weight:bold;">' + formatCurrency(currentMonthCashInHand) + '</div>';
      html += '</div>';
    }
    html += '</div>';

    // ── Sales card ──
    html += card('#d4edda', '#c3e6cb', '#155724',
      '📊 Sales by Payment Method', '+' + formatCurrency(totalSales), salesBody);

    // ── Deposits card ──
    html += card('#fff3cd', '#ffd08a', '#856404',
      '🏦 Deposits by Payment Method', '−' + formatCurrency(totalDeposited), depositBody);

    // ── Cash Outflows card ──
    const _totalExpenses = _expenseMethodKeys.length > 0
      ? _expenseMethodKeys.reduce(function(s, k) { return s + (_expensesByMethod[k] || 0); }, 0)
      : expensesByCash;
    const _totalPurchases = _purchaseMethodKeys.length > 0
      ? _purchaseMethodKeys.reduce(function(s, k) { return s + (_purchasesByMethod[k] || 0); }, 0)
      : purchasesByCash;
    let outflowBody = '';
    // Expenses sub-section
    if (_totalExpenses > 0) {
      outflowBody += '<div style="padding:6px 16px 2px;font-size:0.78em;font-weight:600;color:#a94442;background:#fff5f5;border-bottom:1px solid #f5c6cb;">🧾 Expenses</div>';
      if (_expenseMethodKeys.length > 0) {
        _expenseMethodKeys.forEach(function(key, i) {
          outflowBody += detailRow(key, '−' + formatCurrency(_expensesByMethod[key] || 0), '#dc3545', i < _expenseMethodKeys.length - 1);
        });
      } else {
        outflowBody += detailRow(t('cash') || 'Cash', '−' + formatCurrency(expensesByCash), '#dc3545', false);
      }
    }
    // Purchases sub-section
    if (_totalPurchases > 0) {
      outflowBody += '<div style="padding:6px 16px 2px;font-size:0.78em;font-weight:600;color:#a94442;background:#fff5f5;' +
        (_totalExpenses > 0 ? 'border-top:1px solid #f5c6cb;' : '') + 'border-bottom:1px solid #f5c6cb;">🛒 Purchases</div>';
      if (_purchaseMethodKeys.length > 0) {
        _purchaseMethodKeys.forEach(function(key, i) {
          outflowBody += detailRow(key, '−' + formatCurrency(_purchasesByMethod[key] || 0), '#dc3545', i < _purchaseMethodKeys.length - 1);
        });
      } else {
        outflowBody += detailRow(t('cash') || 'Cash', '−' + formatCurrency(purchasesByCash), '#dc3545', false);
      }
    }
    if (!outflowBody) {
      outflowBody = '<div style="padding:10px 16px;color:#aaa;font-style:italic;font-size:0.9em;">No outflows recorded</div>';
    }
    html += card('#f8d7da', '#f5c6cb', '#721c24',
      '💸 Outflows by Payment Method', '−' + formatCurrency(_totalExpenses + _totalPurchases), outflowBody);

    // ── Formula ──
    html += '<div style="background:#f8f9fa;border:1px solid #dee2e6;border-radius:10px;padding:12px 16px;font-size:0.82em;color:#6c757d;text-align:center;line-height:2;">';
    html += '<div style="font-weight:bold;color:#495057;margin-bottom:2px;">🔢 How Cash In Hand is calculated</div>';
    html += '<span style="color:#28a745;font-weight:600;">All Sales&nbsp;(' + formatCurrency(totalSales) + ')</span>';
    html += '&nbsp;−&nbsp;<span style="color:#fd7e14;">Deposits&nbsp;(' + formatCurrency(totalDeposited) + ')</span>';
    html += '&nbsp;−&nbsp;<span style="color:#dc3545;">Expenses&nbsp;(Cash/Partial/QRIS)&nbsp;(' + formatCurrency(deductibleExpenses) + ')</span>';
    html += '&nbsp;−&nbsp;<span style="color:#dc3545;">Cash Purchases&nbsp;(' + formatCurrency(purchasesByCash) + ')</span>';
    html += '&nbsp;=&nbsp;<span style="color:' + cihColor + ';font-weight:bold;">' + formatCurrency(cashInHand) + '</span>';
    html += '</div>';

    html += '</div>';

    cashDetailsDiv.innerHTML = html;
  }

      cashDetailsDiv.innerHTML = `

          <div class="loading-skeleton narrow"></div>
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton narrow"></div>
          <div class="loading-skeleton wide"></div>
        </div>
      `;
    }
    
    const renderCounter = getCurrentRenderCounter();
    
    // Get clean login session data for backend call
    const deviceId = window.LoginState?.deviceId || null;
    const username = window.LoginState?.user || null;
    
    console.log('Refresh Cash Position: Using session data - DeviceId:', deviceId ? 'Present' : 'Missing', 'Username:', username || 'Missing');
    
    google.script.run.withSuccessHandler(function(data) {
      // Check if this render is still valid
      if (!isCurrentTabRender('deposits', renderCounter)) {
        console.log('Ignoring stale cash position refresh');
        return;
      }
      renderCashDetails(JSON.parse(data));
    }).withFailureHandler(function(error) {
      console.error('Error refreshing cash position:', error);
      const cashDetailsDiv = getElem('cash-details');
      if (cashDetailsDiv) {
        cashDetailsDiv.innerHTML = `<div class="error">Error refreshing cash data: ${error.message || error}</div>`;
      }
    }).getCashSummary(deviceId, username);

  // ====== Daily Cash Summary ======
  function showDailyCashSummary() {
    var cashDetailsDiv = getElem('cash-details');
    if (!cashDetailsDiv) return;

    cashDetailsDiv.innerHTML = '<div class="loading">Loading daily summary...</div>';

    var deviceId = window.LoginState?.deviceId || null;
    var username = window.LoginState?.user || null;

    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || result.error) {
          cashDetailsDiv.innerHTML = '<div class="error">Error: ' + (result ? result.error : 'No data') + '</div>';
          return;
        }
        window._dailyCashData = result;
        window._dailyCashViewState = { selectedMonth: 'all', groupByMonth: true, showExtra: false };
        renderDailyCashTable(result, cashDetailsDiv);
      })
      .withFailureHandler(function(error) {
        cashDetailsDiv.innerHTML = '<div class="error">Error: ' + (error.message || error) + '</div>';
      })
      .getDailyCashSummary(deviceId, username);

  function applyDailyCashFilter() {
    var sel = document.getElementById('cih-month-filter');
    var grp = document.getElementById('cih-group-btn');
    var ext = document.getElementById('cih-extra-btn');
    if (!window._dailyCashViewState) window._dailyCashViewState = { selectedMonth: 'all', groupByMonth: true, showExtra: false };
    if (sel) window._dailyCashViewState.selectedMonth = sel.value;
    if (grp) window._dailyCashViewState.groupByMonth = grp.dataset.active === '1';
    if (ext) window._dailyCashViewState.showExtra = ext.dataset.active === '1';
    var cashDetailsDiv = getElem('cash-details');
    if (cashDetailsDiv && window._dailyCashData) {
      renderDailyCashTable(window._dailyCashData, cashDetailsDiv);
    }
  }

  function toggleDailyGrouping() {
    if (!window._dailyCashViewState) window._dailyCashViewState = { selectedMonth: 'all', groupByMonth: true, showExtra: false };
    window._dailyCashViewState.groupByMonth = !window._dailyCashViewState.groupByMonth;
    var cashDetailsDiv = getElem('cash-details');
    if (cashDetailsDiv && window._dailyCashData) {
      renderDailyCashTable(window._dailyCashData, cashDetailsDiv);
    }
  }

  function toggleDailyExtraColumns() {
    if (!window._dailyCashViewState) window._dailyCashViewState = { selectedMonth: 'all', groupByMonth: true, showExtra: false };
    window._dailyCashViewState.showExtra = !window._dailyCashViewState.showExtra;
    var cashDetailsDiv = getElem('cash-details');
    if (cashDetailsDiv && window._dailyCashData) {
      renderDailyCashTable(window._dailyCashData, cashDetailsDiv);
    }
  }

  function renderDailyCashTable(days, container) {
    var state = window._dailyCashViewState || { selectedMonth: 'all', groupByMonth: true, showExtra: false };
    var showExtra = !!state.showExtra;
    var groupActive = !!state.groupByMonth;
    var useIdLocale = typeof lang !== 'undefined' && lang === 'id';

    // Number formatter — no currency symbol, locale-aware thousands separator
    function fmtN(val) { return Number(Math.abs(val || 0)).toLocaleString(useIdLocale ? 'id-ID' : 'en-US'); }
    function posCell(val) { return val ? '<span style="color:#16a34a;">' + fmtN(val) + '</span>' : '<span style="color:#9ca3af;">—</span>'; }
    function negCell(val) { return val ? '<span style="color:#dc2626;">' + fmtN(val) + '</span>' : '<span style="color:#9ca3af;">—</span>'; }
    function netCell(val) {
      if (!val) return '<span style="color:#9ca3af;">0</span>';
      return '<span style="color:' + (val > 0 ? '#15803d' : '#b91c1c') + ';font-weight:600;">' + (val > 0 ? '+' : '−') + fmtN(val) + '</span>';
    }
    function cihCell(val) {
      return '<span style="color:' + (val >= 0 ? '#15803d' : '#b91c1c') + ';font-weight:700;">' + (val < 0 ? '−' : '') + fmtN(val) + '</span>';
    }

    // Collect unique months
    var monthsSeen = [];
    days.forEach(function(d) { if (monthsSeen.indexOf(d.month) === -1) monthsSeen.push(d.month); });

    // Collect unique payment method keys (for extra view)
    var allSalesMethods = [];
    days.forEach(function(d) {
      Object.keys(d.salesByPaymentMethod || {}).forEach(function(k) { if (allSalesMethods.indexOf(k) === -1) allSalesMethods.push(k); });
    });
    allSalesMethods.sort();

    var allPayMethods = [];
    days.forEach(function(d) {
      Object.keys(d.depositsByPaymentMethod || {}).forEach(function(k) { if (allPayMethods.indexOf(k) === -1) allPayMethods.push(k); });
    });
    allPayMethods.sort();

    // Filter
    var filteredDays = state.selectedMonth === 'all' ? days : days.filter(function(d) { return d.month === state.selectedMonth; });

    // Month dropdown
    var monthOptionsHtml = '<option value="all">All Months</option>';
    monthsSeen.forEach(function(mk) {
      var lbl = days.find(function(d) { return d.month === mk; }).monthDisplayName;
      monthOptionsHtml += '<option value="' + mk + '"' + (state.selectedMonth === mk ? ' selected' : '') + '>' + lbl + '</option>';
    });

    var groupBtnStyle = groupActive
      ? 'background:#2563eb;color:#fff;border-color:#1d4ed8;'
      : 'background:#fff;color:#374151;border-color:#d1d5db;';
    var extraBtnStyle = showExtra
      ? 'background:#7c3aed;color:#fff;border-color:#6d28d9;'
      : 'background:#fff;color:#374151;border-color:#d1d5db;';

    var html = '';
    // Scoped styles for this table
    html += '<style>'
      + '.cih-daily-table{width:100%;border-collapse:collapse;font-size:13px;}'
      + '.cih-daily-table th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;padding:10px 12px;background:#f0f4ff;color:#1e3a5f;border-bottom:2px solid #3b82f6;}'
      + '.cih-daily-table td{padding:8px 12px;border-bottom:1px solid #e5e7eb;font-variant-numeric:tabular-nums;vertical-align:middle;}'
      + '.cih-daily-table tbody tr:hover td{background:#eff6ff!important;transition:background 0.1s;}'
      + '.cih-daily-table .row-sub td{background:#dbeafe;border-top:2px solid #3b82f6;border-bottom:1px solid #bfdbfe;font-weight:700;}'
      + '.cih-daily-table .row-total td{background:#eff6ff;border-top:2px solid #3b82f6;font-weight:700;}'
      + '.cih-today td{background:#f0fdf4!important;}'
      + '</style>';

    // Controls
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #e5e7eb;">';
    html += '<button class="secondary-btn" onclick="refreshCashPosition()" style="font-size:12px;padding:5px 11px;">◀ Back</button>';
    html += '<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.4px;">Month</span>';
    html += '<select id="cih-month-filter" onchange="applyDailyCashFilter()" style="padding:5px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;color:#111827;background:#fff;">' + monthOptionsHtml + '</select></div>';
    html += '<button id="cih-group-btn" data-active="' + (groupActive ? '1' : '0') + '" onclick="toggleDailyGrouping()" style="padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;' + groupBtnStyle + '">⊞ Group: ' + (groupActive ? 'Month' : 'Off') + '</button>';
    html += '<button id="cih-extra-btn" data-active="' + (showExtra ? '1' : '0') + '" onclick="toggleDailyExtraColumns()" style="padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;' + extraBtnStyle + '">' + (showExtra ? '✕ Less' : '⊕ More Columns') + '</button>';
    html += '</div>';

    // Aggregate helper
    function aggregate(arr) {
      var s = { totalSales:0, cashSales:0, cashExpenses:0, deductibleExpenses:0, cashPurchases:0, deposits:0,
                depositsQris:0, depositsTransfer:0, salesByPaymentMethod:{}, depositsByPaymentMethod:{} };
      arr.forEach(function(d) {
        s.totalSales += d.totalSales; s.cashSales += d.cashSales;
        s.cashExpenses += d.cashExpenses || 0;
        s.deductibleExpenses += d.deductibleExpenses; s.cashPurchases += d.cashPurchases;
        s.deposits += d.deposits; s.depositsQris += d.depositsQris || 0; s.depositsTransfer += d.depositsTransfer || 0;
        allSalesMethods.forEach(function(k) { s.salesByPaymentMethod[k] = (s.salesByPaymentMethod[k]||0) + ((d.salesByPaymentMethod||{})[k]||0); });
        allPayMethods.forEach(function(k) { s.depositsByPaymentMethod[k] = (s.depositsByPaymentMethod[k]||0) + ((d.depositsByPaymentMethod||{})[k]||0); });
      });
      return s;
    }

    // Data cells builder (reused for daily rows, subtotals, and grand total)
    function buildCells(d) {
      var cells = '';
      if (showExtra) {
        if (allSalesMethods.length > 0) {
          allSalesMethods.forEach(function(k) { cells += '<td style="text-align:right;">' + posCell((d.salesByPaymentMethod||{})[k]||0) + '</td>'; });
          cells += '<td style="text-align:right;">' + posCell(d.totalSales) + '</td>';
        } else {
          cells += '<td style="text-align:right;">' + posCell(d.totalSales) + '</td>';
        }
        cells += '<td style="text-align:right;">' + negCell(d.deductibleExpenses) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.cashExpenses || 0) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.cashPurchases) + '</td>';
        if (allPayMethods.length > 0) {
          allPayMethods.forEach(function(k) { cells += '<td style="text-align:right;">' + negCell((d.depositsByPaymentMethod||{})[k]||0) + '</td>'; });
        } else {
          cells += '<td style="text-align:right;">' + negCell(d.depositsQris||0) + '</td>';
          cells += '<td style="text-align:right;">' + negCell(d.depositsTransfer||0) + '</td>';
        }
      } else {
        cells += '<td style="text-align:right;">' + posCell(d.cashSales) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.deductibleExpenses) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.cashExpenses || 0) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.cashPurchases) + '</td>';
        cells += '<td style="text-align:right;">' + negCell(d.depositsTransfer||0) + '</td>';
      }
      return cells;
    }

    // Table header
    html += '<table class="cih-daily-table"><thead><tr>';
    html += '<th style="text-align:left;">Date</th>';
    if (showExtra) {
      if (allSalesMethods.length > 0) {
        allSalesMethods.forEach(function(k) { html += '<th style="text-align:right;">' + k + '</th>'; });
        html += '<th style="text-align:right;">Total Sales</th>';
      } else {
        html += '<th style="text-align:right;">Total Sales</th>';
      }
      html += '<th style="text-align:right;">All Exp.</th>';
      html += '<th style="text-align:right;">Cash Only Exp.</th>';
      html += '<th style="text-align:right;">Cash Purch.</th>';
      if (allPayMethods.length > 0) {
        allPayMethods.forEach(function(k) { html += '<th style="text-align:right;">' + k + ' Dep.</th>'; });
      } else {
        html += '<th style="text-align:right;">QRIS Dep.</th>';
        html += '<th style="text-align:right;">Transfer Dep.</th>';
      }
    } else {
      html += '<th style="text-align:right;">Cash Sales</th>';
      html += '<th style="text-align:right;">All Exp.</th>';
      html += '<th style="text-align:right;">Cash Only Exp.</th>';
      html += '<th style="text-align:right;">Cash Purch.</th>';
      html += '<th style="text-align:right;">Transfer Dep.</th>';
    }
    html += '<th style="text-align:right;">Daily Net</th>';
    html += '<th style="text-align:right;">Cash in Hand</th>';
    html += '</tr></thead><tbody>';

    var todayKey = (function() {
      var n = new Date();
      return n.getFullYear() + '-' + ('0'+(n.getMonth()+1)).slice(-2) + '-' + ('0'+n.getDate()).slice(-2);
    })();

    if (groupActive && state.selectedMonth === 'all') {
      var grouped = {}, groupOrder = [];
      filteredDays.forEach(function(d) {
        if (!grouped[d.month]) { grouped[d.month] = []; groupOrder.push(d.month); }
        grouped[d.month].push(d);
      });

      groupOrder.forEach(function(mk) {
        var mDays = grouped[mk];
        var sub = aggregate(mDays);
        var mNet = sub.totalSales - sub.deductibleExpenses - sub.cashPurchases - sub.deposits;
        var mCIH = mDays[0].cashInHand;

        // Month subtotal row
        html += '<tr class="row-sub">';
        html += '<td style="text-align:left;border-left:4px solid #3b82f6;color:#1e40af;font-size:13px;">📅 ' + mDays[0].monthDisplayName + '</td>';
        html += buildCells(sub);
        html += '<td style="text-align:right;">' + netCell(mNet) + '</td>';
        html += '<td style="text-align:right;">' + cihCell(mCIH) + '</td>';
        html += '</tr>';

        mDays.forEach(function(d, idx) {
          var isToday = d.date === todayKey;
          var rowClass = isToday ? ' class="cih-today"' : '';
          var rowBg = !isToday ? (idx % 2 === 0 ? 'background:#fff;' : 'background:#f9fafb;') : '';
          var dailyNet = d.totalSales - d.deductibleExpenses - d.cashPurchases - d.deposits;
          html += '<tr' + rowClass + (rowBg ? ' style="' + rowBg + '"' : '') + '>';
          html += '<td style="color:' + (isToday ? '#15803d;font-weight:600;' : '#374151;') + 'white-space:nowrap;padding-left:20px;">'
                + d.displayDate
                + (isToday ? ' <span style="background:#bbf7d0;color:#15803d;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;">TODAY</span>' : '')
                + '</td>';
          html += buildCells(d);
          html += '<td style="text-align:right;">' + netCell(dailyNet) + '</td>';
          html += '<td style="text-align:right;">' + cihCell(d.cashInHand) + '</td>';
          html += '</tr>';
        });
      });
    } else {
      filteredDays.forEach(function(d, idx) {
        var isToday = d.date === todayKey;
        var rowClass = isToday ? ' class="cih-today"' : '';
        var rowBg = !isToday ? (idx % 2 === 0 ? 'background:#fff;' : 'background:#f9fafb;') : '';
        var dailyNet = d.totalSales - d.deductibleExpenses - d.cashPurchases - d.deposits;
        html += '<tr' + rowClass + (rowBg ? ' style="' + rowBg + '"' : '') + '>';
        html += '<td style="color:' + (isToday ? '#15803d;font-weight:600;' : '#374151;') + 'white-space:nowrap;">'
              + d.displayDate
              + (isToday ? ' <span style="background:#bbf7d0;color:#15803d;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;">TODAY</span>' : '')
              + '</td>';
        html += buildCells(d);
        html += '<td style="text-align:right;">' + netCell(dailyNet) + '</td>';
        html += '<td style="text-align:right;">' + cihCell(d.cashInHand) + '</td>';
        html += '</tr>';
      });
    }

    // Grand total row
    if (filteredDays.length > 0) {
      var grand = aggregate(filteredDays);
      var gNet = grand.totalSales - grand.deductibleExpenses - grand.cashPurchases - grand.deposits;
      var gCIH = filteredDays[0].cashInHand;
      var totalLabel = state.selectedMonth === 'all' ? 'All-Time Total' : filteredDays[0].monthDisplayName + ' Total';
      html += '<tr class="row-total">';
      html += '<td style="text-align:left;font-size:13px;">' + totalLabel + '</td>';
      html += buildCells(grand);
      html += '<td style="text-align:right;">' + netCell(gNet) + '</td>';
      html += '<td style="text-align:right;">' + cihCell(gCIH) + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table>';
    container.innerHTML = html;
  }


  function renderMonthlyCashTable(months, container) {
    var grandCashSales = 0, grandDeductExp = 0, grandCashPur = 0, grandDepQris = 0, grandDepTransfer = 0, grandTotalSalesAll = 0;
    
    // Collect unique payment method keys across all months (sales)
    var allSalesMethods = [];
    months.forEach(function(m) {
      Object.keys(m.salesByPaymentMethod || {}).forEach(function(key) {
        if (allSalesMethods.indexOf(key) === -1) allSalesMethods.push(key);
      });
    });
    allSalesMethods.sort();
    
    // Collect unique payment method keys across all months (deposits)
    var allPayMethods = [];
    months.forEach(function(m) {
      Object.keys(m.depositsByPaymentMethod || {}).forEach(function(key) {
        if (allPayMethods.indexOf(key) === -1) allPayMethods.push(key);
      });
    });
    allPayMethods.sort();
    
    function signed(val, positive) {
      var prefix = positive ? '+' : '-';
      var color = positive ? '#28a745' : '#dc3545';
      return '<span style="color:' + color + ';">' + prefix + formatCurrency(Math.abs(val)) + '</span>';
    }
    function cihFormatted(val) {
      var prefix = val >= 0 ? '+' : '-';
      var color = val >= 0 ? '#28a745' : '#dc3545';
      return '<span style="color:' + color + ';font-weight:bold;">' + prefix + formatCurrency(Math.abs(val)) + '</span>';
    }
    
    var html = '<div style="margin-bottom:8px;"><button class="secondary-btn" onclick="refreshCashPosition()" style="font-size:12px;padding:4px 10px;"><span class="btn-icon">◀</span> Back to Current</button></div>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<tr style="background:#f8f9fa;border-bottom:2px solid #dee2e6;">';
    html += '<th style="text-align:left;padding:8px;">Month</th>';
    if (allSalesMethods.length > 0) {
      allSalesMethods.forEach(function(key) {
        html += '<th style="text-align:right;padding:8px;">' + key + '</th>';
      });
      html += '<th style="text-align:right;padding:8px;">Total Sales</th>';
    } else {
      html += '<th style="text-align:right;padding:8px;">Total Sales</th>';
    }
    html += '<th style="text-align:right;padding:8px;">Exp. (Cash/Partial/QRIS)</th>';
    html += '<th style="text-align:right;padding:8px;">Cash Purchases</th>';
    if (allPayMethods.length > 0) {
      allPayMethods.forEach(function(key) {
        html += '<th style="text-align:right;padding:8px;">' + key + ' Dep.</th>';
      });
    } else {
      html += '<th style="text-align:right;padding:8px;">' + (t('depositedByQris') || 'QRIS Dep.') + '</th>';
      html += '<th style="text-align:right;padding:8px;">' + (t('depositedByTransfer') || 'Transfer Dep.') + '</th>';
    }
    html += '<th style="text-align:right;padding:8px;">Monthly Net</th>';
    html += '<th style="text-align:right;padding:8px;">Cash In Hand</th>';
    html += '</tr>';
    
    var nowKey = (new Date()).getFullYear() + '-' + ('0' + ((new Date()).getMonth() + 1)).slice(-2);
    
    months.forEach(function(m, idx) {
      grandCashSales += m.cashSales;
      var deductExp = m.deductibleExpenses != null ? m.deductibleExpenses : m.cashExpenses;
      var totalSalesM = m.totalSales != null ? m.totalSales : m.cashSales;
      grandDeductExp += deductExp;
      grandTotalSalesAll += totalSalesM;
      grandCashPur += m.cashPurchases;
      grandDepQris += (m.depositsQris || 0);
      grandDepTransfer += (m.depositsTransfer || 0);
      
      var isCurrentMonth = m.month === nowKey;
      var monthlyNet = totalSalesM - deductExp - m.cashPurchases - m.deposits;
      var bg = isCurrentMonth ? '#d4edda' : (idx % 2 === 0 ? '#f9f9f9' : 'white');
      var borderStyle = isCurrentMonth ? 'border-top:2px solid #28a745;border-bottom:2px solid #28a745;' : 'border-bottom:1px solid #eee;';
      var labelSuffix = isCurrentMonth ? ' 📅' : '';
      
      html += '<tr style="background:' + bg + ';' + borderStyle + '">';
      html += '<td style="padding:8px;font-weight:bold;">' + m.displayName + labelSuffix + '</td>';
      if (allSalesMethods.length > 0) {
        var monthTotalSales = 0;
        allSalesMethods.forEach(function(key) {
          var amt = (m.salesByPaymentMethod || {})[key] || 0;
          monthTotalSales += amt;
          html += '<td style="text-align:right;padding:8px;">' + signed(amt, true) + '</td>';
        });
        html += '<td style="text-align:right;padding:8px;font-weight:bold;">' + signed(monthTotalSales, true) + '</td>';
      } else {
        html += '<td style="text-align:right;padding:8px;">' + signed(totalSalesM, true) + '</td>';
      }
      html += '<td style="text-align:right;padding:8px;">' + signed(deductExp, false) + '</td>';
      html += '<td style="text-align:right;padding:8px;">' + signed(m.cashPurchases, false) + '</td>';
      if (allPayMethods.length > 0) {
        allPayMethods.forEach(function(key) {
          var amt = (m.depositsByPaymentMethod || {})[key] || 0;
          html += '<td style="text-align:right;padding:8px;">' + signed(amt, false) + '</td>';
        });
      } else {
        html += '<td style="text-align:right;padding:8px;">' + signed(m.depositsQris || 0, false) + '</td>';
        html += '<td style="text-align:right;padding:8px;">' + signed(m.depositsTransfer || 0, false) + '</td>';
      }
      html += '<td style="text-align:right;padding:8px;">' + cihFormatted(monthlyNet) + '</td>';
      html += '<td style="text-align:right;padding:8px;">' + cihFormatted(m.cashInHand) + '</td>';
      html += '</tr>';
    });
    
    // Grand total CIH = cumulative value from newest month (first element)
    var grandCIH = months.length > 0 ? months[0].cashInHand : 0;
    html += '<tr style="background:#d1edff;border-top:3px solid #007bff;font-weight:bold;">';
    html += '<td style="padding:10px 8px;">TOTAL (All Time)</td>';
    if (allSalesMethods.length > 0) {
      var grandTotalSales = 0;
      allSalesMethods.forEach(function(key) {
        var grandKeyAmt = 0;
        months.forEach(function(mm) { grandKeyAmt += (mm.salesByPaymentMethod || {})[key] || 0; });
        grandTotalSales += grandKeyAmt;
        html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandKeyAmt, true) + '</td>';
      });
      html += '<td style="text-align:right;padding:10px 8px;font-weight:bold;">' + signed(grandTotalSales, true) + '</td>';
    } else {
      html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandTotalSalesAll, true) + '</td>';
    }
    html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandDeductExp, false) + '</td>';
    html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandCashPur, false) + '</td>';
    if (allPayMethods.length > 0) {
      allPayMethods.forEach(function(key) {
        var grandKeyAmt = 0;
        months.forEach(function(mm) { grandKeyAmt += (mm.depositsByPaymentMethod || {})[key] || 0; });
        html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandKeyAmt, false) + '</td>';
      });
    } else {
      html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandDepQris, false) + '</td>';
      html += '<td style="text-align:right;padding:10px 8px;">' + signed(grandDepTransfer, false) + '</td>';
    }
    html += '<td style="text-align:right;padding:10px 8px;">-</td>';
    html += '<td style="text-align:right;padding:10px 8px;">' + cihFormatted(grandCIH) + '</td>';
    html += '</tr></table>';
    
    container.innerHTML = html;
  }
</script>
