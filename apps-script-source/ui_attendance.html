<script>
  // ===== ATTENDANCE UI MODULE =====

  let attendanceEmployees = [];
  let attendanceTodayRecords = [];

  function showAttendanceTab() {
    const renderCounter = getCurrentRenderCounter();
    console.log('Loading attendance tab...');

    const main = getElem('main');
    if (!main) return;
    main.innerHTML = `<div class="loading">${t('loadingAttendance') || 'Loading attendance...'}</div>`;

    google.script.run
      .withSuccessHandler(function(employees) {
        if (!isCurrentTabRender('attendance', renderCounter)) return;
        attendanceEmployees = employees || [];
        renderAttendanceUI();
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load employees:', error);
        main.innerHTML = `<div class="error">${t('errorLoadingAttendance') || 'Error loading attendance data.'}</div>`;
      })
      .getEmployeeList();
  }

  function renderAttendanceUI() {
    const main = getElem('main');
    if (!main) return;

    const todayStr = new Date().toISOString().slice(0, 10);

    main.innerHTML = `
      <div id="attendance-container">
        <div class="sub-tab-bar">
          <button id="attMorningTabBtn" class="sub-tab-btn active"
                  onclick="activateAttendanceSubTab('morning')">
            🌅 ${t('morningEntry') || 'Morning (Start)'}
          </button>
          <button id="attEveningTabBtn" class="sub-tab-btn"
                  onclick="activateAttendanceSubTab('evening')">
            🌇 ${t('eveningEntry') || 'Evening (Finish)'}
          </button>
          <button id="attSummaryTabBtn" class="sub-tab-btn"
                  onclick="activateAttendanceSubTab('summary')">
            📊 ${t('attendanceSummary') || 'Summary'}
          </button>
        </div>

        <div id="att-morning-content" style="display:block;"></div>
        <div id="att-evening-content" style="display:none;"></div>
        <div id="att-summary-content" style="display:none;"></div>
      </div>
    `;

    activateAttendanceSubTab('morning');
  }

  function activateAttendanceSubTab(tab) {
    ['morning', 'evening', 'summary'].forEach(function(t) {
      var btn = getElem('att' + t.charAt(0).toUpperCase() + t.slice(1) + 'TabBtn');
      var content = getElem('att-' + t + '-content');
      if (btn) btn.classList.remove('active');
      if (content) content.style.display = 'none';
    });

    var activeBtn = getElem('att' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'TabBtn');
    var activeContent = getElem('att-' + tab + '-content');
    if (activeBtn) activeBtn.classList.add('active');
    if (activeContent) activeContent.style.display = 'block';

    if (tab === 'morning') renderMorningForm();
    else if (tab === 'evening') renderEveningForm();
    else if (tab === 'summary') renderAttendanceSummaryView();
  }

  // ===== MORNING FORM =====
  let morningExistingRecords = {};

  function renderMorningForm() {
    const container = getElem('att-morning-content');
    if (!container) return;

    const todayStr = new Date().toISOString().slice(0, 10);

    container.innerHTML = `
      <div class="info-banner" style="background:#f0f9ff;border:1px solid #0ea5e9;border-radius:8px;padding:12px;margin-bottom:16px;color:#0369a1;">
        <strong>🌅 ${t('morningEntryTitle') || 'Morning Attendance'}:</strong>
        ${t('morningEntryDesc') || 'Record start time for each employee.'}
      </div>

      <div style="margin-bottom:16px;">
        <label style="font-weight:600;margin-right:8px;">${t('dateCol') || 'Date'}:</label>
        <input type="date" id="attMorningDate" value="${todayStr}"
               onchange="loadMorningExisting()"
               style="padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:1em;">
        <button onclick="setAllMorningTimes()" class="add-btn"
                style="margin-left:12px;padding:8px 16px;border-radius:8px;">
          ⏰ ${t('setAllTime') || 'Set All Same Time'}
        </button>
      </div>

      <div id="att-morning-table-area">
        <div class="loading">${t('loadingAttendance') || 'Loading...'}</div>
      </div>

      <div style="margin-bottom:12px;margin-top:8px;">
        <label style="font-weight:600;margin-right:8px;">${t('notes') || 'Notes'}:</label>
        <textarea id="attMorningNotes" rows="2" placeholder="${t('attendanceNotesPlaceholder') || 'Optional remarks...'}"
                  style="width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:1em;box-sizing:border-box;resize:vertical;"></textarea>
      </div>

      <div>
        <button class="pay-btn" id="morningSubmitBtn" onclick="submitMorningAttendance()"
                style="width:100%;box-sizing:border-box;">
          ✅ ${t('submitMorningAttendance') || 'Submit Morning Attendance'}
        </button>
      </div>
    `;

    loadMorningExisting();
  }

  function loadMorningExisting() {
    var date = getElem('attMorningDate').value;
    if (!date) return;

    var tableArea = getElem('att-morning-table-area');
    if (tableArea) tableArea.innerHTML = `<div class="loading">${t('loadingAttendance') || 'Loading...'}</div>`;

    google.script.run
      .withSuccessHandler(function(records) {
        morningExistingRecords = {};
        (records || []).forEach(function(r) {
          morningExistingRecords[r.employee_id] = r;
        });
        renderMorningTable();
      })
      .withFailureHandler(function() {
        morningExistingRecords = {};
        renderMorningTable();
      })
      .getAttendanceForDate(date);
  }

  function renderMorningTable() {
    var tableArea = getElem('att-morning-table-area');
    if (!tableArea) return;

    var employeeRows = attendanceEmployees.map(function(emp) {
      var existing = morningExistingRecords[emp.employee_id];
      if (existing) {
        // Already recorded — show read-only row
        return `
          <tr data-emp-id="${emp.employee_id}" style="opacity:0.55;background:#f0fdf4;">
            <td style="padding:10px 12px;font-weight:500;">
              ${emp.name}
              <div style="font-size:0.8em;color:#888;">${emp.department || ''} ${emp.position ? '- ' + emp.position : ''}</div>
            </td>
            <td style="padding:10px 12px;text-align:center;color:#16a34a;font-weight:600;">
              ✅ ${existing.start_time || existing.status}
            </td>
            <td style="padding:10px 12px;text-align:center;color:#16a34a;font-size:0.85em;">
              ${t('alreadyRecorded') || 'Already recorded'}
            </td>
          </tr>`;
      }
      return `
        <tr data-emp-id="${emp.employee_id}">
          <td style="padding:10px 12px;font-weight:500;">
            ${emp.name}
            <div style="font-size:0.8em;color:#888;">${emp.department || ''} ${emp.position ? '- ' + emp.position : ''}</div>
          </td>
          <td style="padding:10px 12px;text-align:center;">
            <input type="time" class="att-start-time" data-emp-id="${emp.employee_id}"
                   style="padding:8px;border:2px solid #ddd;border-radius:8px;font-size:1em;width:120px;">
          </td>
          <td style="padding:10px 12px;text-align:center;">
            <select class="att-status" data-emp-id="${emp.employee_id}"
                    style="padding:8px;border:2px solid #ddd;border-radius:8px;font-size:0.95em;"
                    onchange="handleAttStatusChange(this)">
              <option value="Present">${t('attPresent') || 'Present'}</option>
              <option value="Absent">${t('attAbsent') || 'Absent'}</option>
              <option value="Leave">${t('attLeave') || 'Leave'}</option>
              <option value="Holiday">${t('attHoliday') || 'Holiday'}</option>
            </select>
          </td>
        </tr>`;
    }).join('');

    var allRecorded = attendanceEmployees.every(function(emp) {
      return !!morningExistingRecords[emp.employee_id];
    });

    tableArea.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
          <thead>
            <tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;">
              <th style="text-align:left;padding:10px 12px;font-weight:600;color:#475569;">${t('employeeName') || 'Employee'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;">${t('startTime') || 'Start Time'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;">${t('attStatusCol') || 'Status'}</th>
            </tr>
          </thead>
          <tbody>
            ${employeeRows}
          </tbody>
        </table>
      </div>
    `;

    // Disable submit button if all employees already recorded
    var btn = getElem('morningSubmitBtn');
    if (btn && allRecorded) {
      btn.disabled = true;
      btn.textContent = '✅ ' + (t('allAlreadyRecorded') || 'All employees already recorded');
    } else if (btn) {
      btn.disabled = false;
      btn.textContent = '✅ ' + (t('submitMorningAttendance') || 'Submit Morning Attendance');
    }
  }

  function setAllMorningTimes() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var timeStr = hh + ':' + mm;

    document.querySelectorAll('.att-start-time').forEach(function(input) {
      if (!input.value && !input.disabled) input.value = timeStr;
    });
  }

  function handleAttStatusChange(select) {
    var empId = select.getAttribute('data-emp-id');
    var row = select.closest('tr');
    var timeInput = row.querySelector('.att-start-time, .att-end-time');
    if (select.value === 'Absent' || select.value === 'Leave' || select.value === 'Holiday') {
      if (timeInput) { timeInput.value = ''; timeInput.disabled = true; }
    } else {
      if (timeInput) { timeInput.disabled = false; }
    }
  }

  function submitMorningAttendance() {
    if (window._submittingMorningAtt) return;
    window._submittingMorningAtt = true;

    var date = getElem('attMorningDate').value;
    if (!date) {
      alert(t('selectDate') || 'Please select a date.');
      window._submittingMorningAtt = false;
      return;
    }

    var entries = [];
    document.querySelectorAll('.att-start-time').forEach(function(input) {
      var empId = input.getAttribute('data-emp-id');
      var row = input.closest('tr');
      var statusSel = row.querySelector('.att-status');
      var status = statusSel ? statusSel.value : 'Present';
      var startTime = input.value || '';

      if (status === 'Present' && !startTime) return; // skip if present but no time
      entries.push({
        employee_id: empId,
        start_time: startTime,
        status: status
      });
    });

    if (entries.length === 0) {
      alert(t('noAttendanceEntries') || 'Please fill in at least one employee entry.');
      window._submittingMorningAtt = false;
      return;
    }

    var payload = { date: date, entries: entries };

    var btn = document.querySelector('.pay-btn');
    if (btn) { btn.disabled = true; btn.textContent = t('processing') || 'Processing...'; }

    google.script.run
      .withSuccessHandler(function(result) {
        window._submittingMorningAtt = false;
        alert((t('morningAttendanceSaved') || 'Morning attendance saved!') + ' (' + result.recorded + ' ' + (t('records') || 'records') + ')');
        if (btn) { btn.disabled = false; btn.textContent = '✅ ' + (t('submitMorningAttendance') || 'Submit Morning Attendance'); }
        renderMorningForm();
      })
      .withFailureHandler(function(error) {
        window._submittingMorningAtt = false;
        alert((t('error') || 'Error') + ': ' + error);
        if (btn) { btn.disabled = false; btn.textContent = '✅ ' + (t('submitMorningAttendance') || 'Submit Morning Attendance'); }
      })
      .recordMorningAttendance(JSON.stringify(payload));
  }

  // ===== EVENING FORM =====
  function renderEveningForm() {
    const container = getElem('att-evening-content');
    if (!container) return;

    const todayStr = new Date().toISOString().slice(0, 10);
    container.innerHTML = `
      <div class="info-banner" style="background:#fefce8;border:1px solid #eab308;border-radius:8px;padding:12px;margin-bottom:16px;color:#854d0e;">
        <strong>🌇 ${t('eveningEntryTitle') || 'Evening Attendance'}:</strong>
        ${t('eveningEntryDesc') || 'Record finish time for employees who started this morning.'}
      </div>
      <div style="margin-bottom:16px;">
        <label style="font-weight:600;margin-right:8px;">${t('dateCol') || 'Date'}:</label>
        <input type="date" id="attEveningDate" value="${todayStr}"
               style="padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:1em;">
        <button onclick="loadEveningAttendance()" class="add-btn"
                style="margin-left:12px;padding:8px 16px;border-radius:8px;">
          🔄 ${t('loadRecords') || 'Load Records'}
        </button>
      </div>
      <div id="att-evening-list">
        <div style="text-align:center;color:#888;padding:20px;">${t('clickLoadRecords') || 'Click "Load Records" to see employees who checked in this morning.'}</div>
      </div>
    `;

    // Auto-load for today
    loadEveningAttendance();
  }

  function loadEveningAttendance() {
    var date = getElem('attEveningDate').value;
    if (!date) return;

    var listEl = getElem('att-evening-list');
    if (listEl) listEl.innerHTML = `<div class="loading">${t('loadingAttendance') || 'Loading...'}</div>`;

    google.script.run
      .withSuccessHandler(function(records) {
        attendanceTodayRecords = records || [];
        renderEveningList(records, date);
      })
      .withFailureHandler(function(error) {
        if (listEl) listEl.innerHTML = `<div class="error">${error}</div>`;
      })
      .getAttendanceForDate(date);
  }

  function renderEveningList(records, date) {
    var listEl = getElem('att-evening-list');
    if (!listEl) return;

    // Filter: only show records that have start_time but no end_time
    var pendingRecords = records.filter(function(r) {
      return r.start_time && !r.end_time && r.status === 'Present';
    });

    if (pendingRecords.length === 0) {
      listEl.innerHTML = `<div style="text-align:center;color:#888;padding:20px;">
        ${t('noMorningRecords') || 'No pending morning records found for this date.'}
      </div>`;
      return;
    }

    // Map employee_id to name
    var empMap = {};
    attendanceEmployees.forEach(function(emp) { empMap[emp.employee_id] = emp; });

    var now = new Date();
    var defaultTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var rows = pendingRecords.map(function(rec) {
      var emp = empMap[rec.employee_id] || {};
      return `
        <tr data-emp-id="${rec.employee_id}">
          <td style="padding:10px 12px;font-weight:500;">
            ${emp.name || rec.employee_id}
            <div style="font-size:0.8em;color:#888;">${emp.department || ''}</div>
          </td>
          <td style="padding:10px 12px;text-align:center;color:#16a34a;font-weight:600;">${rec.start_time}</td>
          <td style="padding:10px 12px;text-align:center;">
            <input type="time" class="att-end-time" data-emp-id="${rec.employee_id}" value="${defaultTime}"
                   style="padding:8px;border:2px solid #ddd;border-radius:8px;font-size:1em;width:120px;">
          </td>
        </tr>`;
    }).join('');

    listEl.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
          <thead>
            <tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;">
              <th style="text-align:left;padding:10px 12px;font-weight:600;color:#475569;">${t('employeeName') || 'Employee'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;">${t('startTime') || 'Start Time'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;">${t('finishTime') || 'Finish Time'}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:12px;">
        <button class="pay-btn" onclick="submitEveningAttendance()"
                style="width:100%;box-sizing:border-box;">
          ✅ ${t('submitEveningAttendance') || 'Submit Evening Attendance'}
        </button>
      </div>
    `;
  }

  function submitEveningAttendance() {
    if (window._submittingEveningAtt) return;
    window._submittingEveningAtt = true;

    var date = getElem('attEveningDate').value;
    if (!date) { window._submittingEveningAtt = false; return; }

    var entries = [];
    document.querySelectorAll('.att-end-time').forEach(function(input) {
      var empId = input.getAttribute('data-emp-id');
      var endTime = input.value;
      if (endTime) {
        entries.push({ employee_id: empId, end_time: endTime });
      }
    });

    if (entries.length === 0) {
      alert(t('noAttendanceEntries') || 'Please fill in at least one entry.');
      window._submittingEveningAtt = false;
      return;
    }

    var payload = { date: date, entries: entries };

    google.script.run
      .withSuccessHandler(function(result) {
        window._submittingEveningAtt = false;
        alert((t('eveningAttendanceSaved') || 'Evening attendance saved!') + ' (' + result.updated + ' ' + (t('records') || 'records') + ')');
        loadEveningAttendance();
      })
      .withFailureHandler(function(error) {
        window._submittingEveningAtt = false;
        alert((t('error') || 'Error') + ': ' + error);
      })
      .recordEveningAttendance(JSON.stringify(payload));
  }

  // ===== SUMMARY VIEW =====
  function renderAttendanceSummaryView() {
    var container = getElem('att-summary-content');
    if (!container) return;

    var todayStr = new Date().toISOString().slice(0, 10);
    var firstOfMonth = todayStr.slice(0, 8) + '01';

    container.innerHTML = `
      <div class="info-banner" style="background:#f0fdf4;border:1px solid #22c55e;border-radius:8px;padding:12px;margin-bottom:16px;color:#166534;">
        <strong>📊 ${t('attendanceSummary') || 'Attendance Summary'}</strong>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:end;">
        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px;">${t('startDate') || 'Start Date'}</label>
          <input type="date" id="attSummaryStart" value="${firstOfMonth}"
                 style="padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:1em;">
        </div>
        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px;">${t('endDate') || 'End Date'}</label>
          <input type="date" id="attSummaryEnd" value="${todayStr}"
                 style="padding:8px 12px;border:2px solid #ddd;border-radius:8px;font-size:1em;">
        </div>
        <div>
          <button onclick="loadAttendanceSummary()" class="add-btn"
                  style="padding:8px 16px;border-radius:8px;">
            🔍 ${t('loadSummary') || 'Load'}
          </button>
        </div>
      </div>
      <div id="att-summary-data">
        <div style="text-align:center;color:#888;padding:20px;">${t('selectDateRange') || 'Select a date range and click Load.'}</div>
      </div>
    `;

    loadAttendanceSummary();
  }

  function loadAttendanceSummary() {
    var startDate = getElem('attSummaryStart').value;
    var endDate = getElem('attSummaryEnd').value;
    if (!startDate || !endDate) return;

    var dataEl = getElem('att-summary-data');
    if (dataEl) dataEl.innerHTML = `<div class="loading">${t('loadingAttendance') || 'Loading...'}</div>`;

    google.script.run
      .withSuccessHandler(function(records) {
        renderAttendanceSummaryTable(records);
      })
      .withFailureHandler(function(error) {
        if (dataEl) dataEl.innerHTML = `<div class="error">${error}</div>`;
      })
      .getAttendanceSummary(startDate, endDate);
  }

  function renderAttendanceSummaryTable(records) {
    var dataEl = getElem('att-summary-data');
    if (!dataEl) return;

    if (!records || records.length === 0) {
      dataEl.innerHTML = `<div style="text-align:center;color:#888;padding:20px;">${t('noAttendanceRecords') || 'No attendance records found.'}</div>`;
      return;
    }

    // Map employee_id to name
    var empMap = {};
    attendanceEmployees.forEach(function(emp) { empMap[emp.employee_id] = emp; });

    // Group by employee
    var byEmployee = {};
    records.forEach(function(r) {
      if (!byEmployee[r.employee_id]) {
        byEmployee[r.employee_id] = { present: 0, absent: 0, leave: 0, holiday: 0, totalHours: 0, records: [] };
      }
      var stat = byEmployee[r.employee_id];
      var s = (r.status || '').toLowerCase();
      if (s === 'present') stat.present++;
      else if (s === 'absent') stat.absent++;
      else if (s === 'leave') stat.leave++;
      else if (s === 'holiday') stat.holiday++;
      stat.totalHours += parseFloat(r.work_hours) || 0;
      stat.records.push(r);
    });

    var rows = Object.keys(byEmployee).map(function(empId) {
      var emp = empMap[empId] || {};
      var stat = byEmployee[empId];
      return `
        <tr>
          <td style="padding:10px 12px;font-weight:500;">${emp.name || empId}</td>
          <td style="padding:10px 12px;">${emp.department || ''}</td>
          <td style="padding:10px 12px;text-align:center;color:#16a34a;font-weight:600;">${stat.present}</td>
          <td style="padding:10px 12px;text-align:center;color:#dc2626;font-weight:600;">${stat.absent}</td>
          <td style="padding:10px 12px;text-align:center;color:#eab308;font-weight:600;">${stat.leave}</td>
          <td style="padding:10px 12px;text-align:center;color:#6366f1;font-weight:600;">${stat.holiday}</td>
          <td style="padding:10px 12px;text-align:center;font-weight:600;">${stat.totalHours.toFixed(1)}</td>
        </tr>`;
    }).join('');

    dataEl.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
          <thead>
            <tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;">
              <th style="text-align:left;padding:10px 12px;font-weight:600;color:#475569;">${t('employeeName') || 'Employee'}</th>
              <th style="text-align:left;padding:10px 12px;font-weight:600;color:#475569;">${t('department') || 'Department'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#16a34a;">✅ ${t('attPresent') || 'Present'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#dc2626;">❌ ${t('attAbsent') || 'Absent'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#eab308;">📋 ${t('attLeave') || 'Leave'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#6366f1;">🏖️ ${t('attHoliday') || 'Holiday'}</th>
              <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;">⏱️ ${t('totalHours') || 'Total Hours'}</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // Make functions globally accessible
  window.showAttendanceTab = showAttendanceTab;
  window.activateAttendanceSubTab = activateAttendanceSubTab;
  window.setAllMorningTimes = setAllMorningTimes;
  window.handleAttStatusChange = handleAttStatusChange;
  window.submitMorningAttendance = submitMorningAttendance;
  window.loadMorningExisting = loadMorningExisting;
  window.loadEveningAttendance = loadEveningAttendance;
  window.submitEveningAttendance = submitEveningAttendance;
  window.loadAttendanceSummary = loadAttendanceSummary;
</script>
