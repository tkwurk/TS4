<script>
  // App initialization helpers
  
  // Focus login field after page load
  setTimeout(() => {
    const loginUser = getElem('loginUser');
    if (loginUser) loginUser.focus();
  }, 100);

  // Clear error messages on input
  const loginUserInput = getElem('loginUser');
  if (loginUserInput) {
    loginUserInput.addEventListener('input', () => {
      const loginError = getElem('loginError');
      if (loginError) loginError.style.display = 'none';
    });
  }

  const loginCodeInput = getElem('loginCode');
  if (loginCodeInput) {
    loginCodeInput.addEventListener('input', () => {
      const loginError = getElem('loginError');
      if (loginError) loginError.style.display = 'none';
    });
  }

  // Make functions globally accessible (login error handler is in ui_loginUI.js.html)
</script>
