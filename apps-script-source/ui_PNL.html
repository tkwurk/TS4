<script>
const pnlStyles = `
<style>
/* ===== SORT STYLES ===== */
.pnl-table th.pnl-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.pnl-table th.pnl-sortable:hover { background: linear-gradient(135deg, #3d4f61, #2a3142); }
.pnl-sort-icon { font-size: 10px; opacity: 0.35; margin-left: 3px; vertical-align: middle; }
.pnl-sort-icon.active { opacity: 1; color: #68d391; }
/* ===== SUMMARY CARDS ===== */
.pnl-summary-cards { display:flex; gap:14px; margin:0 auto 10px; max-width:900px; flex-wrap:wrap; padding:0 10px; }
.pnl-summary-card { flex:1; min-width:150px; border-radius:14px; padding:14px 18px; box-shadow:0 4px 16px rgba(0,0,0,0.09); display:flex; flex-direction:column; gap:4px; }
.pnl-summary-card-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.75; }
.pnl-summary-card-value { font-size:20px; font-weight:800; line-height:1.1; }
.pnl-card-sales { background: linear-gradient(135deg,#ebf8ff,#bee3f8); color:#2b6cb0; }
.pnl-card-purchases { background: linear-gradient(135deg,#faf5ff,#e9d8fd); color:#553c9a; }
.pnl-card-profit-pos { background: linear-gradient(135deg,#f0fff4,#c6f6d5); color:#276749; }
.pnl-card-profit-neg { background: linear-gradient(135deg,#fff5f5,#fed7d7); color:#9b2335; }
.pnl-table-container {
  margin: 20px auto;
  border-radius: 15px;
  background: white;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
  max-width: 900px;
}
.pnl-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  font-size: 15px;
  border-radius: 15px;
  overflow: hidden;
}
.pnl-table th {
  background: linear-gradient(135deg, #2d3748, #1a202c);
  color: #4299e1;
  padding: 18px 15px;
  text-align: left;
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border: none;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.pnl-table td {
  padding: 15px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 14px;
  transition: background-color 0.2s ease;
}
.pnl-grand-totals-row {
  background: linear-gradient(135deg, #2d3748, #4a5568) !important;
  color: white !important;
  font-weight: 700;
  font-size: 17px;
  border-top: 4px solid #667eea !important;
}
.pnl-grand-totals-row td {
  border-bottom: none !important;
  color: white !important;
}
.pnl-no-data {
  text-align: center;
  color: #718096;
  font-size: 16px;
  font-weight: 500;
  padding: 40px;
  background: white;
  border-radius: 15px;
  margin: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.05);
}
.pnl-toggle-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 15px auto;
  max-width: 900px;
  flex-wrap: wrap;
}
.pnl-toggle-btn {
  padding: 10px 24px;
  border: 2px solid #4299e1;
  background: white;
  color: #4299e1;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.pnl-toggle-btn:first-of-type {
  border-radius: 20px 0 0 20px;
}
.pnl-toggle-btn:nth-of-type(2) {
  border-left: none;
}
.pnl-toggle-btn:nth-of-type(3) {
  border-left: none;
}
.pnl-toggle-btn:nth-of-type(4) {
  border-radius: 0 20px 20px 0;
  border-left: none;
}
.pnl-toggle-btn.active {
  background: linear-gradient(135deg, #4299e1, #3182ce);
  color: white;
}
.pnl-year-selector {
  padding: 8px 14px;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  color: #2d3748;
  background: white;
  cursor: pointer;
  margin-left: 10px;
}
.pnl-future-row {
  opacity: 0.4;
}
.pnl-partial-row td:first-child::after {
  content: ' *';
  color: #ed8936;
  font-weight: 700;
}
.pnl-category-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px auto;
  max-width: 900px;
  padding: 0 10px;
  align-items: center;
}
.pnl-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid #4299e1;
  background: linear-gradient(135deg, #4299e1, #3182ce);
  color: white;
  user-select: none;
}
.pnl-chip.deselected {
  background: white;
  color: #a0aec0;
  border-color: #e2e8f0;
}
.pnl-chip-actions {
  font-size: 12px;
  color: #4299e1;
  cursor: pointer;
  font-weight: 600;
  text-decoration: underline;
  margin-left: 4px;
}
.pnl-rank-badge {
  display: inline-block;
  width: 26px;
  height: 26px;
  line-height: 26px;
  border-radius: 50%;
  text-align: center;
  font-weight: 700;
  font-size: 12px;
  margin-right: 6px;
}
.pnl-rank-1 { background: #ffd700; color: #744210; }
.pnl-rank-2 { background: #c0c0c0; color: #2d3748; }
.pnl-rank-3 { background: #cd7f32; color: white; }
.pnl-rank-default { background: #e2e8f0; color: #4a5568; }
.pnl-profit-bar {
  height: 8px;
  border-radius: 4px;
  margin-top: 4px;
  transition: width 0.3s ease;
}
.pnl-month-row {
  cursor: pointer;
}
.pnl-month-row:hover {
  background: #f7fafc;
}
.pnl-month-row td:first-child::before {
  content: '▶ ';
  font-size: 10px;
  color: #a0aec0;
  transition: transform 0.2s;
}
.pnl-month-row.expanded td:first-child::before {
  content: '▼ ';
  color: #4299e1;
}
.pnl-drilldown-row td {
  padding: 0 !important;
  border-bottom: none !important;
}
.pnl-drilldown-container {
  background: #f7fafc;
  padding: 12px 20px 16px;
  border-bottom: 2px solid #e2e8f0;
}
.pnl-drilldown-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.pnl-drilldown-table th {
  background: #edf2f7;
  color: #4a5568;
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border: none;
}
.pnl-drilldown-table td {
  padding: 8px 12px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 13px;
}
.pnl-drilldown-loading {
  text-align: center;
  padding: 20px;
  color: #a0aec0;
  font-size: 13px;
}
.pnl-supplier-row {
  cursor: pointer;
}
.pnl-supplier-row:hover {
  background: #f7fafc;
}
.pnl-supplier-row td:nth-child(2)::before {
  content: '▶ ';
  font-size: 10px;
  color: #a0aec0;
  transition: transform 0.2s;
}
.pnl-supplier-row.expanded td:nth-child(2)::before {
  content: '▼ ';
  color: #4299e1;
}
.pnl-supplier-codes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 4px 0;
}
.pnl-supplier-code {
  padding: 6px 10px;
  border-radius: 999px;
  background: #edf2f7;
  color: #2d3748;
  font-size: 12px;
  font-weight: 600;
}
.pnl-supplier-hint {
  font-size: 12px;
  color: #718096;
  margin-bottom: 8px;
}
</style>
`;
if (!document.querySelector('#pnl-styles')) {
  const styleEl = document.createElement('div');
  styleEl.id = 'pnl-styles';
  styleEl.innerHTML = pnlStyles;
  document.head.appendChild(styleEl);
}

var pnlViewMode = 'weekly';
var pnlSelectedYear = new Date().getFullYear();
var pnlLoadRequestId = 0;
var pnlBundle = null;
var pnlBundleYear = null;
var pnlExpandedSupplier = null;
var pnlSortState = {
  weekly:   {col:null, asc:false},
  monthly:  {col:null, asc:false},
  category: {col:null, asc:false},
  supplier: {col:null, asc:false}
};

function showProfitLoss() {
  const main = getElem('main');
  if (!main) return;
  main.innerHTML = '';
  main.className = '';
  main.style.cssText = 'flex:1;display:flex;flex-direction:column;padding:20px;';
  
  // Build year options (current year and 2 years back)
  var currentYear = new Date().getFullYear();
  var yearOptions = '';
  for (var y = currentYear; y >= currentYear - 2; y--) {
    yearOptions += '<option value="' + y + '"' + (y === pnlSelectedYear ? ' selected' : '') + '>' + y + '</option>';
  }
  
  main.innerHTML = `
    <div class="pnl-toggle-container">
      <button id="pnlBtnWeekly" class="pnl-toggle-btn ${pnlViewMode === 'weekly' ? 'active' : ''}" onclick="switchPnLView('weekly')">📅 Weekly</button>
      <button id="pnlBtnMonthly" class="pnl-toggle-btn ${pnlViewMode === 'monthly' ? 'active' : ''}" onclick="switchPnLView('monthly')">🗓️ Monthly</button>
      <button id="pnlBtnCategory" class="pnl-toggle-btn ${pnlViewMode === 'category' ? 'active' : ''}" onclick="switchPnLView('category')">🏷️ By Category</button>
      <button id="pnlBtnSupplier" class="pnl-toggle-btn ${pnlViewMode === 'supplier' ? 'active' : ''}" onclick="switchPnLView('supplier')">🚚 By Supplier</button>
      <select class="pnl-year-selector" id="pnlYearSelect" onchange="onPnLYearChange(this.value)">
        ${yearOptions}
      </select>
      <button class="pnl-toggle-btn" onclick="exportPnLCsv()" style="margin-left:8px;">📥 CSV</button>
    </div>
    <div class="pnl-content-wrapper" style="flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,0.95);border-radius:20px;overflow:hidden;">
      <div id="profit-loss-report" class="pnl-no-data">Loading...</div>
    </div>
  `;
  loadPnLData();
}

function exportPnLCsv() {
  if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) return;
  window.SecurityWrapper.secureServerCall('exportPnLCsvSecure', { year: pnlSelectedYear })
    .then(function(res) {
      if (window.SnowbeeI18n && window.SnowbeeI18n.downloadCsv) {
        window.SnowbeeI18n.downloadCsv(res, 'pnl.csv');
      }
    })
    .catch(function(err) {
      alert('CSV export failed: ' + (err.message || err));
    });
}

function switchPnLView(mode) {
  pnlViewMode = mode;
  var btnWeekly   = getElem('pnlBtnWeekly');
  var btnMonthly  = getElem('pnlBtnMonthly');
  var btnCategory = getElem('pnlBtnCategory');
  var btnSupplier = getElem('pnlBtnSupplier');
  if (btnWeekly)   btnWeekly.className   = 'pnl-toggle-btn' + (mode === 'weekly'   ? ' active' : '');
  if (btnMonthly)  btnMonthly.className  = 'pnl-toggle-btn' + (mode === 'monthly'  ? ' active' : '');
  if (btnCategory) btnCategory.className = 'pnl-toggle-btn' + (mode === 'category' ? ' active' : '');
  if (btnSupplier) btnSupplier.className = 'pnl-toggle-btn' + (mode === 'supplier' ? ' active' : '');
  loadPnLData();
}

function onPnLYearChange(year) {
  pnlSelectedYear = parseInt(year, 10);
  pnlBundle = null;
  pnlBundleYear = null;
  loadPnLData();
}

function renderPnLFromBundle(bundle) {
  if (pnlViewMode === 'category') {
    var catData = bundle.category || {};
    var cats = catData.categories || [];
    window._categoryRawData = cats;
    window._categoryTotalExpenses = catData.totalExpenses || 0;
    window._categorySelected = {};
    cats.forEach(function(c) { window._categorySelected[c.category] = true; });
    renderPnLCategory(cats);
  } else if (pnlViewMode === 'monthly') {
    renderPnLMonthly(bundle.monthly || []);
  } else {
    renderPnLWeekly(bundle.daily || []);
  }
}

function loadPnLData() {
  var loadId = ++pnlLoadRequestId;
  var el = getElem('profit-loss-report');
  var deviceId = window.LoginState && window.LoginState.deviceId ? window.LoginState.deviceId : null;
  var username = window.LoginState && window.LoginState.user ? window.LoginState.user : null;

  if (pnlViewMode === 'supplier') {
    if (el) {
      el.className = 'pnl-no-data';
      el.innerHTML = 'Loading...';
    }
    google.script.run
      .withSuccessHandler(function(data) {
        if (loadId !== pnlLoadRequestId) return;
        window._supplierRawData = data && data.suppliers ? data.suppliers : [];
        window._supplierTotalPurchases = data && data.totalPurchases ? data.totalPurchases : 0;
        window._supplierTotalSales = data && data.totalSales ? data.totalSales : 0;
        window._supplierSelected = {};
        if (window._supplierRawData) window._supplierRawData.forEach(function(s) { window._supplierSelected[s.supplier] = true; });
        renderPnLSupplier(window._supplierRawData);
      })
      .withFailureHandler(function(error) {
        if (loadId !== pnlLoadRequestId) return;
        if (el) { el.className = 'pnl-no-data'; el.innerHTML = '<div>Error loading data: ' + (error.message || error) + '</div>'; }
      })
      .getSupplierPnLBreakdown(deviceId, username, pnlSelectedYear);
    return;
  }

  if (pnlBundle && pnlBundleYear === pnlSelectedYear) {
    renderPnLFromBundle(pnlBundle);
    return;
  }

  if (el) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'Loading...';
  }

  if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
    window.SecurityWrapper.secureServerCall('getPnLBundleSecure', { year: pnlSelectedYear })
      .then(function(bundle) {
        if (loadId !== pnlLoadRequestId) return;
        pnlBundle = bundle;
        pnlBundleYear = pnlSelectedYear;
        renderPnLFromBundle(bundle);
      })
      .catch(function(error) {
        if (loadId !== pnlLoadRequestId) return;
        if (el) { el.className = 'pnl-no-data'; el.innerHTML = '<div>Error loading data: ' + (error.message || error) + '</div>'; }
      });
    return;
  }

  google.script.run
    .withSuccessHandler(function(bundle) {
      if (loadId !== pnlLoadRequestId) return;
      pnlBundle = bundle;
      pnlBundleYear = pnlSelectedYear;
      renderPnLFromBundle(bundle);
    })
    .withFailureHandler(function(error) {
      if (loadId !== pnlLoadRequestId) return;
      if (el) { el.className = 'pnl-no-data'; el.innerHTML = '<div>Error loading data: ' + (error.message || error) + '</div>'; }
    })
    .getPnLBundle(deviceId, username, pnlSelectedYear);
}

function renderPnLWeekly(data) {
  var el = getElem('profit-loss-report');
  if (!el) return;
  if (!data || !Array.isArray(data) || data.length === 0) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'No transaction data found.';
    return;
  }

  var today = new Date();
  var currentYearMonth = today.getFullYear() + '-' + ('0'+(today.getMonth()+1)).slice(-2);
  var filtered = data.filter(function(d) {
    if (!d.date || !d.date.startsWith(pnlSelectedYear + '-')) return false;
    return d.date.substring(0, 7) <= currentYearMonth; // exclude future months, keep current+past
  });
  if (filtered.length === 0) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'No data for ' + pnlSelectedYear + '.';
    return;
  }

  window._weeklyRawData = data; // cache for re-sort
  var weeks = groupDaysIntoWeeks(filtered);
  weeks.reverse();

  var sort = pnlSortState.weekly;
  if (sort.col) weeks = pnlApplySort(weeks, sort.col, sort.asc);

  var totals = {sales:0,purchases:0,expenses:0,profit:0};
  weeks.forEach(function(week) {
    totals.sales     += week.sales;
    totals.purchases += week.purchases;
    totals.expenses  += week.expenses;
    totals.profit    += week.profit;
  });

  var html = pnlSummaryCardsHtml(totals.sales, totals.purchases, totals.profit);
  html += '<div class="pnl-table-container"><table class="pnl-table"><thead><tr>';
  html += '<th>Week</th>';
  html += pnlSortTh('weekly', 'sales',     'Total Sales',     true);
  html += pnlSortTh('weekly', 'purchases', 'Total Purchases', true);
  html += pnlSortTh('weekly', 'profit',    'Profit',          true);
  html += '</tr></thead><tbody>';

  weeks.forEach(function(week) {
    html += '<tr>';
    html += '<td>' + week.label + '</td>';
    html += '<td style="text-align:right">' + formatCurrency(week.sales) + '</td>';
    html += '<td style="text-align:right">' + formatCurrency(week.purchases) + '</td>';
    html += '<td style="text-align:right;color:' + (week.profit >= 0 ? '#38b638' : '#d32f2f') + ';">' + formatCurrency(week.profit) + '</td>';
    html += '</tr>';
  });

  html += '<tr class="pnl-grand-totals-row">';
  html += '<td style="text-align:right;"><strong>Grand Total</strong></td>';
  html += '<td style="text-align:right;"><strong>' + formatCurrency(totals.sales) + '</strong></td>';
  html += '<td style="text-align:right;"><strong>' + formatCurrency(totals.purchases) + '</strong></td>';
  html += '<td style="text-align:right;color:' + (totals.profit >= 0 ? '#38b638' : '#d32f2f') + ';"><strong>' + formatCurrency(totals.profit) + '</strong></td>';
  html += '</tr></tbody></table></div>';

  el.className = '';
  el.innerHTML = html;
}

var pnlExpandedMonth = null;
var pnlMonthlyData = null;

function renderPnLMonthly(data) {
  pnlMonthlyData = data;
  var el = getElem('profit-loss-report');
  if (!el) return;
  if (!data || !Array.isArray(data) || data.length === 0) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'No data for ' + pnlSelectedYear + '.';
    return;
  }

  var hasData = data.filter(function(m) { return m.sales > 0 || m.purchases > 0 || m.expenses > 0; });
  if (hasData.length === 0) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'No data for ' + pnlSelectedYear + '.';
    return;
  }

  // Tag each row with original month number before any sort
  var rows = data.map(function(m, idx) { return Object.assign({}, m, {_monthNum: idx + 1}); });

  var sort = pnlSortState.monthly;
  if (sort.col) rows = pnlApplySort(rows, sort.col, sort.asc);

  var totals = {sales:0,purchases:0,expenses:0,profit:0};
  data.forEach(function(m) {
    if (!m.isFuture) {
      totals.sales     += m.sales;
      totals.purchases += m.purchases;
      totals.expenses  += m.expenses;
      totals.profit    += m.profit;
    }
  });

  var html = pnlSummaryCardsHtml(totals.sales, totals.purchases, totals.profit);
  html += '<div class="pnl-table-container"><table class="pnl-table"><thead><tr>';
  html += '<th>Month</th>';
  html += pnlSortTh('monthly', 'sales',     'Total Sales',     true);
  html += pnlSortTh('monthly', 'purchases', 'Total Purchases', true);
  html += pnlSortTh('monthly', 'profit',    'Profit',          true);
  html += '</tr></thead><tbody>';

  rows.forEach(function(m) {
    var monthNum   = m._monthNum;
    var isFuture   = m.isFuture;
    var isExpanded = pnlExpandedMonth === monthNum;
    var hasActivity = m.sales > 0 || m.purchases > 0 || m.expenses > 0;
    var rowClasses = [];
    if (isFuture) rowClasses.push('pnl-future-row');
    else if (m.isPartial) rowClasses.push('pnl-partial-row');
    if (hasActivity && !isFuture) rowClasses.push('pnl-month-row');
    if (isExpanded) rowClasses.push('expanded');
    var classAttr = rowClasses.length > 0 ? ' class="' + rowClasses.join(' ') + '"' : '';
    var clickAttr = (hasActivity && !isFuture) ? ' onclick="pnlDrillDownMonth(' + monthNum + ')"' : '';

    html += '<tr' + classAttr + clickAttr + '>';
    html += '<td>' + m.label + '</td>';
    html += '<td style="text-align:right">' + formatCurrency(m.sales) + '</td>';
    html += '<td style="text-align:right">' + formatCurrency(m.purchases) + '</td>';
    html += '<td style="text-align:right;color:' + (m.profit >= 0 ? '#38b638' : '#d32f2f') + ';">' + formatCurrency(m.profit) + '</td>';
    html += '</tr>';

    html += '<tr class="pnl-drilldown-row" id="pnl-drilldown-' + monthNum + '" style="display:' + (isExpanded ? 'table-row' : 'none') + ';">';
    html += '<td colspan="4"><div class="pnl-drilldown-container" id="pnl-drilldown-content-' + monthNum + '">';
    if (isExpanded) html += '<div class="pnl-drilldown-loading">Loading categories...</div>';
    html += '</div></td></tr>';
  });

  html += '<tr class="pnl-grand-totals-row">';
  html += '<td style="text-align:right;"><strong>Grand Total</strong></td>';
  html += '<td style="text-align:right;"><strong>' + formatCurrency(totals.sales) + '</strong></td>';
  html += '<td style="text-align:right;"><strong>' + formatCurrency(totals.purchases) + '</strong></td>';
  html += '<td style="text-align:right;color:' + (totals.profit >= 0 ? '#38b638' : '#d32f2f') + ';"><strong>' + formatCurrency(totals.profit) + '</strong></td>';
  html += '</tr></tbody></table></div>';

  el.className = '';
  el.innerHTML = html;

  if (pnlExpandedMonth) fetchDrillDownData(pnlExpandedMonth);
}

function pnlDrillDownMonth(monthNum) {
  if (pnlExpandedMonth === monthNum) {
    pnlExpandedMonth = null;
  } else {
    pnlExpandedMonth = monthNum;
  }
  renderPnLMonthly(pnlMonthlyData);
}

function fetchDrillDownData(monthNum) {
  var container = getElem('pnl-drilldown-content-' + monthNum);
  if (!container) return;

  var ym = pnlSelectedYear + '-' + ('0' + monthNum).slice(-2);
  if (pnlBundle && pnlBundleYear === pnlSelectedYear && pnlBundle.monthlyCategory && pnlBundle.monthlyCategory[ym]) {
    renderDrillDown(monthNum, pnlBundle.monthlyCategory[ym]);
    return;
  }

  container.innerHTML = '<div class="pnl-drilldown-loading">Loading categories...</div>';
  
  var deviceId = window.LoginState?.deviceId || null;
  var username = window.LoginState?.user || null;
  
  google.script.run
    .withSuccessHandler(function(result) {
      renderDrillDown(monthNum, result);
    })
    .withFailureHandler(function(error) {
      if (container) container.innerHTML = '<div class="pnl-drilldown-loading">Error: ' + (error.message || error) + '</div>';
    })

}

    html += '<td style="text-align:right">' + formatCurrency(c.sales) + '</td>';
    html += '<td style="text-align:right;color:#718096;">' + (c.salesPct || 0) + '%</td>';
    html += '<td style="text-align:right">' + formatCurrency(c.purchases) + '</td>';
    html += '<td style="text-align:right;color:' + (c.profit >= 0 ? '#38b638' : '#d32f2f') + ';font-weight:700;">' + formatCurrency(c.profit) + '</td>';

// Utility: Groups daily data into weeks (Sun-Sat)
function groupDaysIntoWeeks(days) {
  if (!days || days.length === 0) return [];
  days.sort(function(a, b) { return a.date.localeCompare(b.date); });
  var weeks = [];
  var weekStart = null, weekEnd = null, weekLabel = '', weekData = [], weekNumber = 1;
  for (var i = 0; i < days.length; i++) {
    var day = days[i];
    var date = new Date(day.date);
    var dayOfWeek = date.getDay(); // 0 = Sunday
    if (weekStart === null) {
      weekStart = new Date(date);
      weekEnd = new Date(date);
      weekLabel = 'Week ' + weekNumber + ' (' + date.toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
      weekData = [day];
    } else {
      weekEnd = new Date(date);
      weekData.push(day);
    }
    var isLast = (i === days.length - 1);
    if (dayOfWeek === 6 || isLast) {
      weekLabel += ' - ' + weekEnd.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) + ')';
      var totals = weekData.reduce(function(sum, d) {
        sum.sales += d.sales || 0;
        sum.purchases += d.purchases || 0;
        sum.expenses += d.expenses || 0;
        sum.profit += d.profit || 0;
        return sum;
      }, {sales:0,purchases:0,expenses:0,profit:0});
      weeks.push({
        label: weekLabel,
        sales: totals.sales,
        purchases: totals.purchases,
        expenses: totals.expenses,
        profit: totals.profit
      });
      weekStart = null;
      weekEnd = null;
      weekLabel = '';
      weekData = [];
      weekNumber++;
    }
  }
  return weeks;
}

function formatCurrency(val) {
  return val != null ? val.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0}) : '-';
}
function getElem(id) {

}

// ===== SORT HELPERS =====
function pnlSortBy(view, col) {
  var s = pnlSortState[view];
  if (s.col === col) { s.asc = !s.asc; } else { s.col = col; s.asc = false; }
  if (view === 'weekly')   renderPnLWeekly(window._weeklyRawData || []);
  if (view === 'monthly')  renderPnLMonthly(pnlMonthlyData);
  if (view === 'category') renderPnLCategory(window._categoryRawData);
  if (view === 'supplier') renderPnLSupplier(window._supplierRawData);
}

function pnlApplySort(arr, col, asc) {
  return arr.slice().sort(function(a, b) {
    var va = a[col]; var vb = b[col];
    if (va == null) va = 0; if (vb == null) vb = 0;
    if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return asc ? va - vb : vb - va;
  });
}

function pnlSortTh(view, col, label, alignRight) {
  var s = pnlSortState[view];
  var isActive = s.col === col;
  var icon = isActive ? (s.asc ? '▲' : '▼') : '⇅';
  var iconClass = 'pnl-sort-icon' + (isActive ? ' active' : '');
  var align = alignRight ? 'text-align:right;' : '';
  return '<th class="pnl-sortable" style="' + align + '" onclick="pnlSortBy(\'' + view + '\',\'' + col + '\')">'
    + label + ' <span class="' + iconClass + '">' + icon + '</span></th>';
}

function pnlSummaryCardsHtml(sales, purchases, profit) {
  var html = '<div class="pnl-summary-cards">';
  if (sales != null) {
    html += '<div class="pnl-summary-card pnl-card-sales">'
      + '<span class="pnl-summary-card-label">Total Sales</span>'
      + '<span class="pnl-summary-card-value">' + formatCurrency(sales) + '</span></div>';
  }
  if (purchases != null) {
    html += '<div class="pnl-summary-card pnl-card-purchases">'
      + '<span class="pnl-summary-card-label">Total Purchases</span>'
      + '<span class="pnl-summary-card-value">' + formatCurrency(purchases) + '</span></div>';
  }
  if (profit != null) {
    var cls = profit >= 0 ? 'pnl-card-profit-pos' : 'pnl-card-profit-neg';
    html += '<div class="pnl-summary-card ' + cls + '">'
      + '<span class="pnl-summary-card-label">Net Profit</span>'
      + '<span class="pnl-summary-card-value">' + formatCurrency(profit) + '</span></div>';
  }
  html += '</div>';
  return html;
}

// ===== SUPPLIER VIEW =====
function renderPnLSupplier(data) {
  var el = getElem('profit-loss-report');
  if (!el) return;
  if (!data || !Array.isArray(data) || data.length === 0) {
    el.className = 'pnl-no-data';
    el.innerHTML = 'No supplier data for ' + pnlSelectedYear + '.';
    return;
  }

  var selected = window._supplierSelected || {};
  var filtered = data.filter(function(s) { return selected[s.supplier]; });

  var sort = pnlSortState.supplier;
  if (sort.col) filtered = pnlApplySort(filtered, sort.col, sort.asc);

  var totalPurchases = window._supplierTotalPurchases || 0;
  var totalSales = window._supplierTotalSales || 0;
  if (pnlExpandedSupplier && !filtered.some(function(s) { return s.supplier === pnlExpandedSupplier; })) {
    pnlExpandedSupplier = null;
  }

  // Supplier chips
  var chipsHtml = '<div class="pnl-category-chips">';
  chipsHtml += '<span role="button" tabindex="0" class="pnl-chip-actions" onclick="pnlSupplierSelectAll()">Select All</span> ';
  chipsHtml += '<span role="button" tabindex="0" class="pnl-chip-actions" onclick="pnlSupplierDeselectAll()">Deselect All</span> ';
  data.forEach(function(s) {
    var isOn = selected[s.supplier];
    chipsHtml += '<span role="button" tabindex="0" class="pnl-chip' + (isOn ? '' : ' deselected') + '" onclick="pnlToggleSupplier(\'' + s.supplier.replace(/'/g, "\\'") + '\')">' + s.supplier + '</span>';
  });
  chipsHtml += '</div>';

  var filteredTotalPurchases = 0;
  var filteredTotalSales = 0;
  filtered.forEach(function(s) { filteredTotalPurchases += s.purchases; filteredTotalSales += s.sales || 0; });
  var filteredProfit = filteredTotalSales - filteredTotalPurchases;

  var html = chipsHtml;
  html += pnlSummaryCardsHtml(filteredTotalSales, filteredTotalPurchases, filteredProfit);
  html += '<div class="pnl-table-container"><table class="pnl-table"><thead><tr>';
  html += '<th>#</th>';
  html += pnlSortTh('supplier', 'supplier',  'Supplier',        false);
  html += pnlSortTh('supplier', 'sales',     'Total Sales',     true);
  html += pnlSortTh('supplier', 'purchases', 'Total Purchases', true);
  html += pnlSortTh('supplier', 'profit',    'Net Profit',      true);
  html += pnlSortTh('supplier', 'count',     '# Sales',         true);
  html += '</tr></thead><tbody>';

  filtered.forEach(function(s, idx) {
    var rank = idx + 1;
    var rankClass = rank <= 3 ? 'pnl-rank-' + rank : 'pnl-rank-default';
    var hasCodes = s.productCodes && s.productCodes.length > 0;
    var isExpanded = pnlExpandedSupplier === s.supplier;
    var rowClass = hasCodes ? ' class="pnl-supplier-row' + (isExpanded ? ' expanded' : '') + '"' : '';
    var clickAttr = hasCodes ? ' onclick="pnlToggleSupplierCodes(\'' + s.supplier.replace(/'/g, "\\'") + '\')"' : '';
    var profit = (s.sales || 0) - (s.purchases || 0);
    var profitColor = profit >= 0 ? '#38a169' : '#e53e3e';
    html += '<tr' + rowClass + clickAttr + '>';
    html += '<td><span class="pnl-rank-badge ' + rankClass + '">' + rank + '</span></td>';
    html += '<td><strong>' + s.supplier + '</strong></td>';
    html += '<td style="text-align:right;color:#38a169">' + formatCurrency(s.sales || 0) + '</td>';
    html += '<td style="text-align:right">' + formatCurrency(s.purchases) + '</td>';
    html += '<td style="text-align:right;color:' + profitColor + ';font-weight:600">' + formatCurrency(profit) + '</td>';
    html += '<td style="text-align:right">' + (s.count || 0) + '</td>';
    html += '</tr>';
    if (hasCodes) {
      html += '<tr class="pnl-drilldown-row" style="display:' + (isExpanded ? 'table-row' : 'none') + ';">';
      html += '<td colspan="6"><div class="pnl-drilldown-container">';
      html += '<div class="pnl-supplier-hint">Product codes under <strong>' + s.supplier + '</strong></div>';
      html += '<div class="pnl-supplier-codes">';
      s.productCodes.forEach(function(code) {
        html += '<span class="pnl-supplier-code">' + code + '</span>';
      });
      html += '</div></div></td></tr>';
    }
  });

  html += '<tr class="pnl-grand-totals-row">';
  html += '<td></td><td style="text-align:right"><strong>Total</strong></td>';
  html += '<td style="text-align:right"><strong>' + formatCurrency(filteredTotalSales) + '</strong></td>';
  html += '<td style="text-align:right"><strong>' + formatCurrency(filteredTotalPurchases) + '</strong></td>';
  var grandProfitColor = filteredProfit >= 0 ? '#38a169' : '#e53e3e';
  html += '<td style="text-align:right;color:' + grandProfitColor + '"><strong>' + formatCurrency(filteredProfit) + '</strong></td>';
  var totalCount = 0; filtered.forEach(function(s) { totalCount += s.count || 0; });
  html += '<td style="text-align:right"><strong>' + totalCount + '</strong></td>';
  html += '</tr></tbody></table></div>';

  el.className = '';
  el.innerHTML = html;
}

    window._supplierSelected[supplier] = !window._supplierSelected[supplier];
