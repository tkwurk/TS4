<script>
  // Purchasing Local functionality - for products with categories starting with "Local"
  
  // Global variables for purchasing local
  let purchasingLocalProducts = [];
  let currentLocalCategory = '';
  let purchaseLocalCart = [];

  function renderPurchasingLocalUI(accounts) {
    const main = getElem('main');
    if (!main) {
      console.error('Main element not found in renderPurchasingLocalUI');
      return;
    }
    
    // Force clear any existing content and styles
    main.innerHTML = '';
    main.className = '';
    
    let accountOptions = (accounts || []).map(acc =>
      `<option value="${acc}">${acc}</option>`).join('');
    main.innerHTML = `
      <div id="purchasing-local-container">
        <div class="sub-tab-bar">
          <button id="purchaseLocalTabBtn" class="sub-tab-btn active" 
                  onclick="activatePurchasingLocalTab('purchase')">
            ${t('expenseEntry') || 'Expense Entry'}
          </button>
          <button id="summaryLocalTabBtn" class="sub-tab-btn" 
                  onclick="activatePurchasingLocalTab('summary')">
            ${t('expenseSummary') || 'Summary'}
          </button>
        </div>
        <div id="purchase-local-form" style="display:block;">
          <div class="info-banner" style="background: #f0f9ff; border: 1px solid #0ea5e9; border-radius: 8px; padding: 12px; margin-bottom: 16px; color: #0369a1;">
            <strong>🏪 ${t('expenseInfoTitle') || 'Expenses'}:</strong> ${t('expenseInfoDesc') || 'Record your daily operational expenses here'}
          </div>
          <div id="categories-local" class="categories"></div>
          <div class="item-search-bar">
            <div class="item-search-wrap">
              <span class="item-search-icon">🔍</span>
              <input id="purchasing-local-search" type="text" class="item-search-input"
                     placeholder="${t('searchExpenses') || 'Search expenses...'}"
                     oninput="handlePurchasingLocalSearch(this.value)"
                     autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
              <button class="item-search-clear" id="purchasing-local-search-clear" onclick="clearPurchasingLocalSearch()" title="Clear">✕</button>
            </div>
          </div>
          <div id="purchasing-local-list" class="menu-list"></div>
          <div class="summary">
            <h3>${t('purchaseSummary')}</h3>
            <div id="purchase-local-summary"></div>
            <div class="purchase-form">
              <div>
                <label for="purchaseLocalAccount"><b>${t('account')}</b></label>
                <select id="purchaseLocalAccount" required style="width:100%;box-sizing:border-box;">
                  <option value="">${t('selectAccountPlaceholder') || '--Select Account--'}</option>
                  ${accountOptions}
                </select>
              </div>
              <button class="pay-btn" onclick="proceedToPurchaseLocalCheckout()" style="margin-top:12px;width:100%;box-sizing:border-box;">
                ${t('proceedToCheckout')}
              </button>
            </div>
          </div>
        </div>
        <div id="summary-local-content" style="display:none;">
          <!-- Summary content will be loaded here -->
        </div>
      </div>
    `;
    loadPurchasingLocalProducts();
  }

  function activatePurchasingLocalTab(tab, accountOptions) {
    const purchaseLocalTabBtn = getElem('purchaseLocalTabBtn');
    const summaryLocalTabBtn = getElem('summaryLocalTabBtn');
    const purchaseLocalForm = getElem('purchase-local-form');
    const summaryLocalContent = getElem('summary-local-content');

    // Remove active classes safely
    if (purchaseLocalTabBtn) purchaseLocalTabBtn.classList.remove('active');
    if (summaryLocalTabBtn) summaryLocalTabBtn.classList.remove('active');
    
    // Hide all content safely
    if (purchaseLocalForm) purchaseLocalForm.style.display = 'none';
    if (summaryLocalContent) summaryLocalContent.style.display = 'none';

    if (tab === 'purchase') {
      if (purchaseLocalTabBtn) purchaseLocalTabBtn.classList.add('active');
      if (purchaseLocalForm) purchaseLocalForm.style.display = 'block';
      loadPurchasingLocalProducts();
    } else {
      if (summaryLocalTabBtn) summaryLocalTabBtn.classList.add('active');
      if (summaryLocalContent) summaryLocalContent.style.display = 'block';
      renderPurchaseLocalSummaryTab();
    }
  }

  // Global function for showing purchasing local tab - called by navigation
  function showPurchasingLocalTab() {
    const renderCounter = getCurrentRenderCounter();
    console.log('🚀 showPurchasingLocalTab starting with cached expense accounts...');
    fetchExpenseAccountsWithCacheLocal(renderCounter);
  }

  // ✅ CLEAN CACHE IMPLEMENTATION FOR LOCAL BUY PRODUCTS
  window.buyLocalProductsCache = {
    data: null,
    timestamp: null,
    outlet: null,
    ttl: 5 * 60 * 1000 // 5 minutes in milliseconds
  };

  // ✅ CACHE UTILITIES FOR LOCAL BUY PRODUCTS
  window.clearBuyLocalProductsCache = function() {
    console.log('🧹 Clearing Buy Local products cache...');
    window.buyLocalProductsCache.data = null;
    window.buyLocalProductsCache.timestamp = null;
    window.buyLocalProductsCache.outlet = null;
    console.log('✅ Buy Local products cache cleared');
  };

  window.checkBuyLocalProductsCache = function() {
    const cache = window.buyLocalProductsCache;
    const now = Date.now();
    const age = cache.timestamp ? now - cache.timestamp : null;
    const currentOutlet = window.LoginState?.outlet || window.currentOutlet || 'default';
    const isValid = cache.data && cache.timestamp && age < cache.ttl && cache.outlet === currentOutlet;
    
    console.log('🔍 BUY LOCAL PRODUCTS CACHE STATUS:');
    console.log('  - Has data:', !!cache.data);
    console.log('  - Has timestamp:', !!cache.timestamp);
    console.log('  - Cache outlet:', cache.outlet);
    console.log('  - Current outlet:', currentOutlet);
    console.log('  - Age (ms):', age);
    console.log('  - TTL (ms):', cache.ttl);
    console.log('  - Is valid:', isValid);
    console.log('  - Products count:', cache.data ? cache.data.length : 0);
    
    return {
      hasData: !!cache.data,
      hasTimestamp: !!cache.timestamp,
      cacheOutlet: cache.outlet,
      currentOutlet: currentOutlet,
      age: age,
      ttl: cache.ttl,
      isValid: isValid,
      productsCount: cache.data ? cache.data.length : 0
    };
  };

  function fetchExpenseAccountsWithCacheLocal(renderCounter) {
    const cache = window.expenseAccountsCache;
    const now = Date.now();
    
    // Check if we have valid cached data
    if (cache.data && cache.timestamp && (now - cache.timestamp) < cache.ttl) {
      console.log('🎯 Cache HIT for Expense Accounts (age: ' + Math.round((now - cache.timestamp) / 1000) + 's)');
      
      // Check if this render is still valid
      if (!isCurrentTabRender('purchasingLocal', renderCounter)) {
        console.log('Ignoring stale purchasing local render (cached accounts)');
        return;
      }
      
      // Use cached data
      console.log('✅ Using cached Expense Accounts:', cache.data.length, 'accounts');
      renderPurchasingLocalUI(cache.data);
      return;
    }
    
    // Cache miss - fetch from server
    console.log('🚀 Cache MISS for Expense Accounts - fetching from server...');
    
    google.script.run
      .withSuccessHandler(function(accounts) {
        // Check if this render is still valid
        if (!isCurrentTabRender('purchasingLocal', renderCounter)) {
          console.log('Ignoring stale purchasing local render');
          return;
        }
        
        // ✅ CACHE THE RESULTS
        window.expenseAccountsCache.data = accounts;
        window.expenseAccountsCache.timestamp = Date.now();
        console.log('✅ Cached Expense Accounts successfully:', accounts ? accounts.length : 0, 'accounts');
        
        console.log("Loaded accounts for local:", accounts);
        renderPurchasingLocalUI(accounts);
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load expense accounts for local:', error);
        // Fallback to empty accounts if cache fails
        renderPurchasingLocalUI([]);
      })
      .getExpenseAccounts();
  }

  function fetchBuyLocalProductsWithCache(renderCounter) {
    const cache = window.buyLocalProductsCache;
    const now = Date.now();
    const currentOutlet = window.LoginState?.outlet || window.currentOutlet || 'default';
    
    // Check if we have valid cached data for this outlet
    if (cache.data && cache.timestamp && (now - cache.timestamp) < cache.ttl && cache.outlet === currentOutlet) {
      console.log('🎯 Cache HIT for Buy Local products (outlet: ' + currentOutlet + ', age: ' + Math.round((now - cache.timestamp) / 1000) + 's)');
      
      // Check if this render is still valid
      if (!isCurrentTabRender('purchasingLocal', renderCounter)) {
        console.log('Ignoring stale purchasing local products render (cached)');
        return;
      }
      
      // Use cached data
      purchasingLocalProducts = cache.data;
      console.log('✅ Using cached Buy Local products for outlet:', currentOutlet, purchasingLocalProducts.length, 'items');
      
      if (purchasingLocalProducts.length === 0) {
        showNoLocalProductsMessage();
      } else {
        renderPurchasingLocalCategories(purchasingLocalProducts);
        if (!currentLocalCategory && purchasingLocalProducts.length > 0) {
          currentLocalCategory = (purchasingLocalProducts[0].NAVCATEGORY || '').toString().trim() || purchasingLocalProducts[0].CATEGORY;
        }
        showPurchasingLocalProducts(currentLocalCategory);
      }
      return;
    }
    
    // Cache miss - fetch from server
    console.log('🚀 Cache MISS for Buy Local products (outlet: ' + currentOutlet + ') - fetching from server...');
    
    google.script.run
      .withSuccessHandler(data => {
        // Check if this render is still valid
        if (!isCurrentTabRender('purchasingLocal', renderCounter)) {
          console.log('Ignoring stale purchasing local products render');
          return;
        }
        
        try {
          const products = typeof data === 'string' ? JSON.parse(data) : data;
          if (!Array.isArray(products)) {
            throw new Error('Invalid product data format');
          }
          
          // ✅ CACHE THE RESULTS WITH OUTLET INFORMATION
          window.buyLocalProductsCache.data = products;
          window.buyLocalProductsCache.timestamp = Date.now();
          window.buyLocalProductsCache.outlet = currentOutlet;
          console.log('✅ Cached Buy Local products successfully for outlet:', currentOutlet, products.length, 'items');
          
          purchasingLocalProducts = products;
          console.log('Loaded', purchasingLocalProducts.length, 'Buy Local products with caching and outlet filtering');
          
          if (purchasingLocalProducts.length === 0) {
            showNoLocalProductsMessage();
          } else {
            renderPurchasingLocalCategories(purchasingLocalProducts);
            if (!currentLocalCategory && purchasingLocalProducts.length > 0) {
              currentLocalCategory = (purchasingLocalProducts[0].NAVCATEGORY || '').toString().trim() || purchasingLocalProducts[0].CATEGORY;
            }
            showPurchasingLocalProducts(currentLocalCategory);
          }
        } catch (error) {
          console.error('Error processing Buy Local products:', error);
          showLocalErrorState();
        }
      })
      .withFailureHandler(error => {
        console.error('Failed to load Buy Local products:', error);
        showLocalErrorState();
      })
      .getProductsByMode('Buy', 'L,LO', window.LoginState?.deviceId, window.LoginState?.currentusername || window.LoginState?.user || window.currentUser);
  }

  function loadPurchasingLocalProducts() {
    // Reset search state on reload
    _purchasingLocalSearchQuery = '';
    const si = getElem('purchasing-local-search');
    if (si) si.value = '';
    const cb = getElem('purchasing-local-search-clear');
    if (cb) cb.classList.remove('visible');
    const cat = getElem('categories-local');
    if (cat) cat.style.display = '';

    const list = getElem('purchasing-local-list');
    if (list) list.innerHTML = '<div class="loading">' + (t('loadingExpenses') || 'Loading expenses...') + '</div>';
    
    const renderCounter = getCurrentRenderCounter();
    
    console.log('🚀 loadPurchasingLocalProducts starting with cache system...');
    fetchBuyLocalProductsWithCache(renderCounter);
  }

  const LOCAL_MISC_OTHERS_CATEGORY = 'Local_Others';
  const LOCAL_MISC_OTHERS_CODE = 'LOCAL_MISC__OTHERS';
  const LOCAL_PREFIX = 'Local_';

  // Helper: strip Local_ prefix for display
  function stripLocalPrefix(cat) {
    if (cat && cat.startsWith(LOCAL_PREFIX)) {
      return cat.substring(LOCAL_PREFIX.length);
    }
    return cat;
  }

  const LOCAL_TAB_KEY = '__LOCAL__';

  var _purchasingLocalSearchQuery = '';

  function handlePurchasingLocalSearch(value) {
    _purchasingLocalSearchQuery = value.trim().toLowerCase();
    const clearBtn = getElem('purchasing-local-search-clear');
    if (clearBtn) clearBtn.classList.toggle('visible', _purchasingLocalSearchQuery.length > 0);
    const catContainer = getElem('categories-local');
    if (_purchasingLocalSearchQuery) {
      if (catContainer) catContainer.style.display = 'none';
      showPurchasingLocalProducts('__search__');
    } else {
      if (catContainer) catContainer.style.display = '';
      renderPurchasingLocalCategories(purchasingLocalProducts);
      showPurchasingLocalProducts(currentLocalCategory);
    }
  }

  function clearPurchasingLocalSearch() {
    const input = getElem('purchasing-local-search');
    if (input) { input.value = ''; input.focus(); }
    handlePurchasingLocalSearch('');
  }

  function renderPurchasingLocalCategories(products) {
    const container = getElem('categories-local');
    if (!container) return;
    container.innerHTML = '';

    // Collect categories from L and LO mode products
    const lProducts = products.filter(p => { const m = (p.MODE || '').toString().trim().toUpperCase(); return m === 'L' || m === 'LO'; });
    const categorySet = new Set();
    lProducts.forEach(p => { const _cat = (p.NAVCATEGORY || '').toString().trim() || p.CATEGORY; if (_cat) categorySet.add(_cat); });
    const categories = [...categorySet].sort();

    // Render a tile per real category
    categories.forEach(cat => {
      const catBtn = document.createElement('button');
      catBtn.className = `cat-tile${currentLocalCategory === cat ? ' active' : ''}`;
      catBtn.innerHTML = `
        <span class="cat-icon">🏪</span>
        <span class="cat-label">${stripLocalPrefix(cat)}</span>
      `;
      catBtn.onclick = function () {
        document.querySelectorAll('.cat-tile').forEach(b => b.classList.remove('active'));
        catBtn.classList.add('active');
        currentLocalCategory = cat;
        showPurchasingLocalProducts(cat);
      };
      container.appendChild(catBtn);
    });

    // "Others" tab — shows LO-mode products + custom item form
    const othersBtn = document.createElement('button');
    othersBtn.id = 'localMiscOthersBtn';
    othersBtn.className = `cat-tile${currentLocalCategory === LOCAL_MISC_OTHERS_CATEGORY ? ' active' : ''}`;
    othersBtn.style.cssText = 'border: 2px dashed #f59e0b; background: #fffbeb;';
    othersBtn.innerHTML = `
      <span class="cat-icon">✏️</span>
      <span class="cat-label">${t('othersTab') || 'Others'}</span>
    `;
    othersBtn.onclick = function () {
      document.querySelectorAll('.cat-tile').forEach(b => b.classList.remove('active'));
      othersBtn.classList.add('active');
      currentLocalCategory = LOCAL_MISC_OTHERS_CATEGORY;
      showPurchasingLocalProducts(LOCAL_MISC_OTHERS_CATEGORY);
    };
    container.appendChild(othersBtn);

    // Default to first real category if no category selected
    if (!currentLocalCategory || (currentLocalCategory !== LOCAL_MISC_OTHERS_CATEGORY && !categorySet.has(currentLocalCategory))) {
      currentLocalCategory = categories.length > 0 ? categories[0] : LOCAL_MISC_OTHERS_CATEGORY;
    }
  }

  function showPurchasingLocalProducts(category) {
    const list = getElem('purchasing-local-list');
    if (!list) return;

    console.log('🔍 showLocalProducts called with category:', category);
    console.log('🔍 Total purchasingLocalProducts available:', purchasingLocalProducts.length);

    list.innerHTML = '';

    // Handle Others tab: show LO mode products + custom item form
    if (category === LOCAL_MISC_OTHERS_CATEGORY) {
      renderLocalOthersTab(list);
      return;
    }

    // Handle search: filter by name across all L/LO products
    let filteredProducts;
    if (category === '__search__') {
      const sq = _purchasingLocalSearchQuery;
      filteredProducts = purchasingLocalProducts.filter(p => {
        const m = (p.MODE || '').toString().trim().toUpperCase();
        return (m === 'L' || m === 'LO') && (p.NAME || '').toString().toLowerCase().includes(sq);
      });
    } else {
      // Local tab: show L and LO mode products for the selected category
      filteredProducts = purchasingLocalProducts.filter(p => {
        const m = (p.MODE || '').toString().trim().toUpperCase();
        return (m === 'L' || m === 'LO') && ((p.NAVCATEGORY || '').toString().trim() || p.CATEGORY) === category;
      });
    }
    
    console.log('🔍 Filtered local products for category \'' + category + '\':', filteredProducts.length, 'out of', purchasingLocalProducts.length);

    if (filteredProducts.length === 0) {
      // Log available categories to help debug
      const availableCategories = [...new Set(purchasingLocalProducts.map(p => p.CATEGORY))];
      console.log('🔍 Available local categories:', availableCategories);
      list.innerHTML = `<div class="no-products">${t('noExpenseProducts') || 'No expense products in this category'}</div>`;
      return;
    }

    let html = `
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
        <thead>
          <tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;">
            <th style="text-align:left;padding:10px 12px;font-weight:600;color:#475569;font-size:0.9em;">${t('productCol') || 'Product'}</th>
            <th style="text-align:right;padding:10px 12px;font-weight:600;color:#0ea5e9;font-size:0.9em;">${t('total') || 'Total'}</th>
            <th style="text-align:right;padding:10px 12px;font-weight:600;color:#475569;font-size:0.9em;">${t('unitPrice') || 'Unit Price'}</th>
            <th style="text-align:center;padding:10px 12px;font-weight:600;color:#475569;font-size:0.9em;">${t('quantity') || 'Quantity'}</th>
          </tr>
        </thead>
        <tbody>`;

    let grandTotal = 0;

    filteredProducts.forEach(product => {
      const cartItem = purchaseLocalCart.find(item => item.name === product.NAME);
      const qty = cartItem ? cartItem.qty : 0;
      const isVariableQuantity = product.QUANTITYVARIABLE && product.QUANTITYVARIABLE.toString().toLowerCase() === 'yes';
      const price = parseFloat(product.BUYPRICE) || 0;

      if (isVariableQuantity) {
        const existingVar = purchaseLocalCart.find(item => item.name === product.NAME && item.category === product.CATEGORY && item.isVariableQuantity);
        const currentQty = existingVar ? existingVar.qty : 0;
        const currentPrice = existingVar ? existingVar.price : price;
        const rowAmount = currentQty * currentPrice;
        grandTotal += rowAmount;
        const isVoucher = isVoucherProduct(product.NAME);

        html += `
          <tr style="border-bottom:1px solid #f1f5f9;${isVoucher ? 'background:#fff5f5;' : ''}">
            <td style="padding:10px 12px;font-weight:500;">${product.NAME}${isVoucher ? ' <span style="font-size:0.75em;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;margin-left:4px;">DEDUCTION</span>' : ''}</td>
            <td style="padding:10px 8px;text-align:center;">
              <input type="number" style="width:100px;height:36px;text-align:center;font-weight:600;border:2px solid #0ea5e9;border-radius:6px;padding:2px;color:#0369a1;"
                     id="purchase-local-var-total-input-${product.NAME}-${product.CATEGORY}"
                     value="${rowAmount !== 0 ? Math.abs(rowAmount) : ''}" min="0" step="1000"
                     placeholder="${t('enterTotal') || 'Enter Total'}"
                     onchange="handlePurchaseLocalVariableTotalInputChange('${product.NAME}', '${product.CATEGORY}', this.value)"
                     onkeypress="handlePurchaseLocalVariableTotalKeypress(event, this, '${product.NAME}', '${product.CATEGORY}')">
            </td>
            <td style="padding:10px 4px;">
              <div style="display:flex;align-items:center;gap:6px;justify-content:center;">
                <button aria-label="Adjust purchase local variable price" class="remove-btn" onclick="adjustPurchaseLocalVariablePrice('${product.NAME}', '${product.CATEGORY}', -1000)"
                        ${Math.abs(currentPrice || 0) <= 0 ? 'disabled' : ''} style="padding:6px 10px;min-width:36px;min-height:36px;">-</button>
                <input type="number" style="width:85px;height:36px;text-align:center;font-weight:600;border:2px solid #ddd;border-radius:6px;padding:2px;"
                       id="purchase-local-var-price-input-${product.NAME}-${product.CATEGORY}"
                       value="${isVoucher ? Math.abs(currentPrice || 0) : (currentPrice || 0)}" min="0" step="1000"
                       onchange="handlePurchaseLocalVariablePriceInputChange('${product.NAME}', '${product.CATEGORY}', this.value)"
                       onkeypress="handlePurchaseLocalVariablePriceKeypress(event, this, '${product.NAME}', '${product.CATEGORY}')">
                <button aria-label="Adjust purchase local variable price" class="add-btn" onclick="adjustPurchaseLocalVariablePrice('${product.NAME}', '${product.CATEGORY}', 1000)"
                        style="padding:6px 10px;min-width:36px;min-height:36px;">+</button>
              </div>
            </td>
            <td style="padding:10px 4px;">
              <div style="display:flex;align-items:center;gap:6px;justify-content:center;">
                <button aria-label="Adjust purchase local variable quantity" class="remove-btn" onclick="adjustPurchaseLocalVariableQuantity('${product.NAME}', '${product.CATEGORY}', -0.1)"
                        ${currentQty <= 0 ? 'disabled' : ''} style="padding:6px 10px;min-width:36px;min-height:36px;">-</button>
                <input type="number" style="width:65px;height:36px;text-align:center;font-weight:600;border:2px solid #ddd;border-radius:6px;padding:2px;"
                       id="purchase-local-var-qty-input-${product.NAME}-${product.CATEGORY}"
                       value="${currentQty || 0}" min="0" step="0.1"
                       onchange="handlePurchaseLocalVariableQuantityInputChange('${product.NAME}', '${product.CATEGORY}', this.value)"
                       onkeypress="handlePurchaseLocalVariableQuantityKeypress(event, this, '${product.NAME}', '${product.CATEGORY}')">
                <button aria-label="Adjust purchase local variable quantity" class="add-btn" onclick="adjustPurchaseLocalVariableQuantity('${product.NAME}', '${product.CATEGORY}', 0.1)"
                        style="padding:6px 10px;min-width:36px;min-height:36px;">+</button>
              </div>
            </td>
          </tr>`;
      } else {
        const rowAmount = isVoucherProduct(product.NAME) ? -(qty * price) : (qty * price);
        grandTotal += rowAmount;

        html += `
          <tr style="border-bottom:1px solid #f1f5f9;${isVoucherProduct(product.NAME) ? 'background:#fff5f5;' : ''}">
            <td style="padding:10px 12px;font-weight:500;">${product.NAME}${isVoucherProduct(product.NAME) ? ' <span style="font-size:0.75em;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;margin-left:4px;">DEDUCTION</span>' : ''}</td>
            <td style="padding:10px 12px;text-align:right;font-weight:600;white-space:nowrap;${rowAmount < 0 ? 'color:#dc2626;' : 'color:#1e293b;'}">${rowAmount !== 0 ? formatCurrency(rowAmount) : '-'}</td>
            <td style="padding:10px 12px;text-align:right;color:#555;white-space:nowrap;">${formatCurrency(price)}</td>
            <td style="padding:10px 12px;text-align:center;">
              <div style="display:flex;align-items:center;gap:4px;justify-content:center;">
                <button aria-label="Update purchase local cart" class="remove-btn" ${qty === 0 ? 'disabled' : ''}
                  data-name="${escapeString(product.NAME)}"
                  data-price="${price}"
                  data-category="${escapeString(product.CATEGORY)}"
                  data-change="-1"
                  onclick="updatePurchaseLocalCart(this)"
                  style="padding:6px 10px;min-width:36px;min-height:36px;">-</button>
                <input type="number" aria-label="Quantity" class="qty-input" value="${qty}" min="0" step="1"
                  data-name="${escapeString(product.NAME)}"
                  data-price="${price}"
                  data-category="${escapeString(product.CATEGORY)}"
                  onchange="updatePurchaseLocalCartDirectly(this)"
                  onblur="updatePurchaseLocalCartDirectly(this)"
                  style="width:55px;height:36px;text-align:center;border:2px solid #ddd;border-radius:6px;padding:2px;font-weight:600;">
                <button aria-label="Update purchase local cart" class="add-btn"
                  data-name="${escapeString(product.NAME)}"
                  data-price="${price}"
                  data-category="${escapeString(product.CATEGORY)}"
                  data-change="1"
                  onclick="updatePurchaseLocalCart(this)"
                  style="padding:6px 10px;min-width:36px;min-height:36px;">+</button>
              </div>
            </td>
          </tr>`;
      }
    });

    // Total row at the bottom
    html += `
        </tbody>
        <tfoot>
          <tr style="background:#f8fafc;border-top:2px solid #e2e8f0;">
            <td style="padding:12px;text-align:right;font-weight:700;color:#1e293b;font-size:1.05em;">${t('totalCol') || 'Total'}</td>

  function updatePurchaseLocalCart(button) {
    // Prevent multiple rapid clicks
    if (button.disabled) {
      return;
    }
    
    // Temporarily disable the button
    button.disabled = true;
    button.style.opacity = '0.6';
    
    const name = button.getAttribute('data-name');
    const price = parseFloat(button.getAttribute('data-price'));
    const category = button.getAttribute('data-category');
    const change = parseInt(button.getAttribute('data-change'), 10);

    // Check if this product has variable quantity enabled
    const product = purchasingLocalProducts.find(p => p.NAME === name);
    const isVariableQuantity = product && product.QUANTITYVARIABLE && 
                              product.QUANTITYVARIABLE.toString().toLowerCase() === 'yes';
    
    if (isVariableQuantity) {
      console.log('Product has variable quantity enabled, use variable controls instead');
      alert(t('useVariableControls') || 'This product supports variable quantity. Please use the variable controls to set quantity and price.');
      
      // Re-enable button
      button.disabled = false;
      button.style.opacity = '1';
      return;
    }

    const productCode = product && product['PRODUCTCODE'] ? product['PRODUCTCODE'] : "";
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product['BUYUNITSIZE'] ? product['BUYUNITSIZE'] : "";

    const item = purchaseLocalCart.find(i => i.name === name);
    if (item) {
      item.qty += change;
      if (item.qty <= 0) {
        purchaseLocalCart = purchaseLocalCart.filter(i => i.name !== name);
      }
    } else if (change > 0) {
      purchaseLocalCart.push({
        name,
        price: isVoucherProduct(name) ? -Math.abs(price) : price,
        qty: 1,
        category,
        productName: name,
        code: productCode,
        supplier: supplier,
        buyUnit: buyUnit,
        buyUnitSize: buyUnitSize,
        expiryDate: '',
        mode: product ? (product.MODE || 'L') : 'L'
      });
    }
    
    renderPurchaseLocalSummary();
    showPurchasingLocalProducts(currentLocalCategory);
    
    // Re-enable button after a short delay
    setTimeout(() => {
      button.disabled = false;
      button.style.opacity = '1';
    }, 300);
  }

  function updatePurchaseLocalCartDirectly(input) {
    // Prevent multiple rapid updates
    if (window._updatingPurchaseLocalCartDirectly) {
      return;
    }
    window._updatingPurchaseLocalCartDirectly = true;
    
    const name = input.getAttribute('data-name');
    const price = parseFloat(input.getAttribute('data-price'));
    const category = input.getAttribute('data-category');
    const newQty = parseInt(input.value, 10);
    
    // Validate input
    if (isNaN(newQty) || newQty < 0) {
      input.value = 0;
      input.focus();
      input.select();
      window._updatingPurchaseLocalCartDirectly = false;
      return;
    }
    
    // Find the full product object
    const product = purchasingLocalProducts.find(p => p.NAME === name);
    
    // Check if this product has variable quantity enabled
    const isVariableQuantity = product && product.QUANTITYVARIABLE && 
                              product.QUANTITYVARIABLE.toString().toLowerCase() === 'yes';
    
    if (isVariableQuantity) {
      console.log('Product has variable quantity enabled, use variable controls instead');
      alert(t('useVariableControls') || 'This product supports variable quantity. Please use the variable controls to set quantity and price.');
      
      // Reset input to current cart value
      const existingItem = purchaseLocalCart.find(i => i.name === name);
      input.value = existingItem ? existingItem.qty : 0;
      
      window._updatingPurchaseLocalCartDirectly = false;
      return;
    }
    
    const productCode = product && product['PRODUCTCODE'] ? product['PRODUCTCODE'] : "";
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product['BUYUNITSIZE'] ? product['BUYUNITSIZE'] : "";
    
    // Find existing item in cart
    const existingItemIndex = purchaseLocalCart.findIndex(i => i.name === name);
    
    if (newQty === 0) {
      // Remove item from cart if quantity is 0
      if (existingItemIndex >= 0) {
        purchaseLocalCart.splice(existingItemIndex, 1);
      }
    } else {
      // Update or add item
      if (existingItemIndex >= 0) {
        // Update existing item
        purchaseLocalCart[existingItemIndex].qty = newQty;
      } else {
        // Add new item
        purchaseLocalCart.push({
          name,
          price: isVoucherProduct(name) ? -Math.abs(price) : price,
          qty: newQty,
          category,
          productName: name,
          code: productCode,
          supplier: supplier,
          buyUnit: buyUnit,
          buyUnitSize: buyUnitSize,
          expiryDate: '',
          mode: product ? (product.MODE || 'L') : 'L'
        });
      }
    }
    
    // Update the display
    renderPurchaseLocalSummary();
    showPurchasingLocalProducts(currentLocalCategory);
    
    // Reset the flag after a short delay
    setTimeout(() => {
      window._updatingPurchaseLocalCartDirectly = false;
    }, 100);
  }

  function proceedToPurchaseLocalCheckout() {
    // Prevent multiple checkout attempts
    if (window._processingPurchaseLocalCheckout) {
      return;
    }
    window._processingPurchaseLocalCheckout = true;
    
    const account = getElem('purchaseLocalAccount').value.trim();
    if (!account) {
      alert(t('selectAccount') || 'Please select an account');
      window._processingPurchaseLocalCheckout = false;
      return;
    }
    if (purchaseLocalCart.length === 0) {
      alert(t('pleaseAddItems'));
      window._processingPurchaseLocalCheckout = false;
      return;
    }
    
    // Disable the checkout button
    const checkoutBtn = document.querySelector('.pay-btn');
    if (checkoutBtn) {
      checkoutBtn.disabled = true;
      checkoutBtn.style.opacity = '0.6';
      checkoutBtn.innerHTML = t('processing') || 'Processing...';
    }
    
    // Sync expiry dates from DOM inputs before building purchase
    purchaseLocalCart.forEach((item, idx) => {
      const dateInput = document.querySelector(`input[type="date"][onchange*="setPurchaseLocalItemExpiryDate(${idx}"]`);
      if (dateInput && dateInput.value) {
        item.expiryDate = dateInput.value;
      }
    });
    
    // Generate unique purchase ID
    const purchaseId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    // Deep copy items to ensure all properties survive GAS serialization
    const cleanItems = purchaseLocalCart.map(item => ({
      name: item.name || '',
      price: item.price || 0,
      qty: item.qty || 0,
      category: item.category || '',
      productName: item.productName || '',
      code: item.code || '',
      supplier: item.supplier || '',
      buyUnit: item.buyUnit || '',
      buyUnitSize: item.buyUnitSize || '',
      expiryDate: item.expiryDate || '',
      mode: item.mode || 'L'
    }));
    
    const purchase = {
      id: purchaseId,
      items: cleanItems,
      account: account,
      total: purchaseLocalCart.reduce((sum, item) => sum + (item.price * item.qty), 0),
      timestamp: formatDateForBackend(new Date()),
      payment: null // Will be set when user selects payment method
    };
    
    showPurchaseLocalPaymentSelection(purchase);
    
    // Reset the flag after showing payment selection
    setTimeout(() => {
      window._processingPurchaseLocalCheckout = false;
    }, 500);
  }

  function submitPurchaseLocalWithPayment(purchase) {
    console.log("purchaseLocal:Total purchase amount:", purchase.total);
    
    // Prevent duplicate submissions
    if (window._submittingPurchaseLocal) {
      console.log("Purchase Local submission already in progress, ignoring duplicate request");
      return;
    }
    
    // Set submission flag and show loading state
    window._submittingPurchaseLocal = true;
    showPurchaseLocalSubmittingState();
    
    // ✅ SECURITY: Use SecurityWrapper for authenticated server calls
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      console.log('Using SecurityWrapper for purchase local submission');
      
      window.SecurityWrapper.secureServerCall('recordPurchaseSecure', purchase)
        .then((result) => {
          // Clear all submission flags
          window._submittingPurchaseLocal = false;
          window._selectingLocalPayment = false;
          window._pendingPurchaseLocal = null;
          
          console.log('Purchase Local recorded successfully via SecurityWrapper:', result);
          showPurchaseLocalSuccessConfirmation(purchase);
          purchaseLocalCart = [];
          renderPurchaseLocalSummary();
        })
        .catch((error) => {
          // Clear submission flags on error
          window._submittingPurchaseLocal = false;
          window._selectingLocalPayment = false;
          
          console.error('Failed to record purchase local via SecurityWrapper:', error);
          
          // Check if it's an authentication error
          if (error && error.toString().toLowerCase().includes('authentication')) {
            console.warn('Authentication error during purchase local submission, redirecting to login');
            window.SecurityWrapper.forceLogout();
          } else {
            if (window.showErrorModal) {
              window.showErrorModal('Failed to save purchase: ' + (error.message || error));
            } else {
              alert(`Error submitting purchase: ${error.message || error}`);
            }
            // Return to payment selection screen
            showPurchaseLocalPaymentSelection(purchase);
          }
        });
    } else {
      console.error('SecurityWrapper not available - purchase local submission requires secure authentication');
      
      // Clear submission flags
      window._submittingPurchaseLocal = false;
      window._selectingLocalPayment = false;
      
      if (window.showErrorModal) {
        window.showErrorModal('Security system not available. Please refresh the page and try again.');
      } else {
        alert('Security system not available. Please refresh the page and try again.');
      }
      
      // Return to payment selection screen
      showPurchaseLocalPaymentSelection(purchase);
    }
  }

  function adjustPurchaseLocalVariableQuantity(name, category, delta) {
    // Find existing variable item in purchase local cart
    let existingVar = purchaseLocalCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    
    let newQty = 0;
    let currentPrice = 0;
    
    if (existingVar) {
      newQty = Math.max(0, parseFloat((existingVar.qty + delta).toFixed(1)));
      currentPrice = existingVar.price;
    } else {
      // Find the product to get default price (BuyPrice for purchasing)
      const product = purchasingLocalProducts.find(p => p.NAME === name && p.CATEGORY === category);
      newQty = Math.max(0, parseFloat(delta.toFixed(1)));
      currentPrice = product ? (parseFloat(product.BUYPRICE) || 0) : 0;
    }
    
    // Update the display immediately
    updatePurchaseLocalVariableDisplay(name, category, newQty, currentPrice);
    
    // Update cart if quantity > 0, otherwise remove item
    if (newQty > 0) {
      addPurchaseLocalVariableQuantityDirectly(name, category, newQty, currentPrice);
    } else {
      // Remove item from cart
      purchaseLocalCart = purchaseLocalCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseLocalSummary();
      showPurchasingLocalProducts(currentLocalCategory);
    }
  }
  
  function adjustPurchaseLocalVariablePrice(name, category, delta) {
    // Find existing variable item in purchase local cart
    let existingVar = purchaseLocalCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    
    let currentQty = 0;
    let newPrice = 0;
    const isVoucher = isVoucherProduct(name);
    
    if (existingVar) {
      currentQty = existingVar.qty;
      if (isVoucher) {
        // For vouchers, adjust the absolute value and keep negative
        const newAbs = Math.max(0, Math.abs(existingVar.price) + delta);
        newPrice = -newAbs;
      } else {
        newPrice = Math.max(0, existingVar.price + delta);
      }
    } else {
      // Find the product to get default values (BuyPrice for purchasing)
      const product = purchasingLocalProducts.find(p => p.NAME === name && p.CATEGORY === category);
      currentQty = 0;
      const basePrice = product ? (parseFloat(product.BUYPRICE) || 0) : 0;
      if (isVoucher) {
        newPrice = -(Math.max(0, basePrice + delta));
      } else {
        newPrice = Math.max(0, basePrice + delta);
      }
    }
    
    // Update the display immediately
    updatePurchaseLocalVariableDisplay(name, category, currentQty, newPrice);
    
    // Update cart only if quantity > 0
    if (currentQty > 0) {
      addPurchaseLocalVariableQuantityDirectly(name, category, currentQty, newPrice);
    } else {
      // Remove item from cart if quantity is 0
      purchaseLocalCart = purchaseLocalCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseLocalSummary();
      showPurchasingLocalProducts(currentLocalCategory);
    }
  }
  
  function updatePurchaseLocalVariableDisplay(name, category, qty, price) {
    // Update input fields for purchasing local (using purchase-local-specific IDs)
    const qtyInput = document.getElementById(`purchase-local-var-qty-input-${name}-${category}`);
    const priceInput = document.getElementById(`purchase-local-var-price-input-${name}-${category}`);
    
    if (qtyInput) {
      qtyInput.value = qty || 0;
    }
    
    if (priceInput) {
      // For vouchers, display as absolute (positive) value so user doesn't enter negative
      priceInput.value = isVoucherProduct(name) ? Math.abs(price || 0) : (price || 0);
    }

    // Also sync the total input
    const totalInput = document.getElementById(`purchase-local-var-total-input-${name}-${category}`);
    if (totalInput) {
      totalInput.value = (qty > 0 && price !== 0) ? Math.abs(qty * price) : '';
    }
    
    // Update button states for purchasing local
    const qtyMinusBtn = document.querySelector(`button[onclick="adjustPurchaseLocalVariableQuantity('${name}', '${category}', -0.1)"]`);
    const priceMinusBtn = document.querySelector(`button[onclick="adjustPurchaseLocalVariablePrice('${name}', '${category}', -1000)"]`);
    
    if (qtyMinusBtn) {
      qtyMinusBtn.disabled = qty <= 0;
    }
    
    if (priceMinusBtn) {
      priceMinusBtn.disabled = Math.abs(price || 0) <= 0;
    }
  }

  function addPurchaseLocalVariableQuantityDirectly(name, category, quantity, price) {
    console.log('Adding purchase local variable quantity item directly:', { name, category, quantity, price });
    
    // For voucher products, always store price as negative (deduction)
    const storedPrice = isVoucherProduct(name) ? -Math.abs(price) : price;
    
    // Find the product to get additional details
    const product = purchasingLocalProducts.find(p => p.NAME === name && p.CATEGORY === category);
    const productCode = product && product['PRODUCTCODE'] ? product['PRODUCTCODE'] : "";
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product['BUYUNITSIZE'] ? product['BUYUNITSIZE'] : "";
    
    // Remove any existing items of the same product (both regular and variable)
    purchaseLocalCart = purchaseLocalCart.filter(item => !(item.name === name && item.category === category));
    
    // Add new item with custom quantity and price
    const newItem = {
      name,
      price: storedPrice,
      qty: quantity,
      category,
      productName: name,
      code: productCode,
      supplier: supplier,
      buyUnit: buyUnit,
      buyUnitSize: buyUnitSize,
      isVariableQuantity: true,
      originalPrice: product ? (parseFloat(product.BUYPRICE) || 0) : 0,
      expiryDate: '',
      mode: product ? (product.MODE || 'L') : 'L'
    };
    
    purchaseLocalCart.push(newItem);
    console.log('Added purchase local variable quantity item to cart:', newItem);
    
    renderPurchaseLocalSummary();
    showPurchasingLocalProducts(currentLocalCategory);
  }

  // Input handler functions for purchase local variable quantity
  function handlePurchaseLocalVariableQuantityInputChange(name, category, value) {
    const newQty = parseFloat(value) || 0;
    const isVoucher = isVoucherProduct(name);
    
    if (newQty < 0) {
      updatePurchaseLocalVariableDisplay(name, category, 0, getCurrentPurchaseLocalVariablePrice(name, category));
      return;
    }
    
    // If a total has been entered, recalculate unit price from total / qty
    const totalInput = document.getElementById(`purchase-local-var-total-input-${name}-${category}`);
    const enteredTotal = totalInput ? parseFloat(totalInput.value) : 0;
    let currentPrice;
    if (enteredTotal > 0 && newQty > 0) {
      const absPrice = enteredTotal / newQty;
      currentPrice = isVoucher ? -absPrice : absPrice;
      const priceInput = document.getElementById(`purchase-local-var-price-input-${name}-${category}`);
      if (priceInput) priceInput.value = Math.round(absPrice);
    } else {
      currentPrice = getCurrentPurchaseLocalVariablePrice(name, category);
    }
    
    if (newQty > 0) {
      addPurchaseLocalVariableQuantityDirectly(name, category, newQty, currentPrice);
    } else {
      // Remove from cart if quantity is 0
      purchaseLocalCart = purchaseLocalCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseLocalSummary();
      showPurchasingLocalProducts(currentLocalCategory);
    }
  }

  function handlePurchaseLocalVariablePriceInputChange(name, category, value) {
    const absValue = Math.abs(parseFloat(value) || 0);
    const isVoucher = isVoucherProduct(name);
    // For vouchers: user enters positive amount, we store as negative
    const newPrice = isVoucher ? -absValue : absValue;
    
    if (absValue < 0) {
      updatePurchaseLocalVariableDisplay(name, category, getCurrentPurchaseLocalVariableQty(name, category), 0);
      return;
    }
    
    const currentQty = getCurrentPurchaseLocalVariableQty(name, category);
    
    if (currentQty > 0) {
      addPurchaseLocalVariableQuantityDirectly(name, category, currentQty, newPrice);
    } else {
      // Just update display if no quantity
      updatePurchaseLocalVariableDisplay(name, category, 0, newPrice);
    }
  }

  function handlePurchaseLocalVariableTotalInputChange(name, category, value) {
    const total = parseFloat(value) || 0;
    const currentQty = getCurrentPurchaseLocalVariableQty(name, category);
    const isVoucher = isVoucherProduct(name);

    if (total <= 0) {
      purchaseLocalCart = purchaseLocalCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseLocalSummary();
      showPurchasingLocalProducts(currentLocalCategory);
      return;
    }

    if (currentQty > 0) {
      const absPrice = total / currentQty;
      const newPrice = isVoucher ? -absPrice : absPrice;
      const priceInput = document.getElementById(`purchase-local-var-price-input-${name}-${category}`);
      if (priceInput) priceInput.value = Math.round(absPrice);
      addPurchaseLocalVariableQuantityDirectly(name, category, currentQty, newPrice);
    }
    // If qty is 0, just keep the total displayed; price will be calculated when qty is set
  }

  // Helper: detect voucher products (name contains "VOUCHER", case-insensitive)
  function isVoucherProduct(name) {
    return name && name.toString().toUpperCase().includes('VOUCHER');
  }

  // Helper functions to get current values for purchase local
  function getCurrentPurchaseLocalVariableQty(name, category) {
    const existingVar = purchaseLocalCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    return existingVar ? existingVar.qty : 0;
  }

  function getCurrentPurchaseLocalVariablePrice(name, category) {
    const existingVar = purchaseLocalCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    if (existingVar) {
      return existingVar.price;
    }
    // Get default price from product
    const product = purchasingLocalProducts.find(p => p.NAME === name && p.CATEGORY === category);
    return product ? (parseFloat(product.BUYPRICE) || 0) : 0;
  }

  function addLocalMiscItemToCart() {
    const categorySelect = getElem('localMiscCategorySelect');
    const nameInput = getElem('localMiscProductName');
    const qtyInput = getElem('localMiscQty');
    const priceInput = getElem('localMiscPrice');
    const buyUnitInput = getElem('localMiscBuyUnit');

    const selectedCategory = categorySelect ? categorySelect.value.trim() : '';
    const productName = nameInput ? nameInput.value.trim() : '';
    const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
    const price = parseFloat(priceInput ? priceInput.value : 0) || 0;
    const buyUnit = buyUnitInput ? buyUnitInput.value.trim() : '';

    // Validate required fields
    if (!selectedCategory) {
      alert(t('selectCategoryError') || 'Please select a product category.');
      if (categorySelect) categorySelect.focus();
      return;
    }
    if (!productName) {
      alert(t('enterProductNameError') || 'Please enter a product name or description.');
      if (nameInput) nameInput.focus();
      return;
    }
    if (qty <= 0) {
      alert(t('enterValidQtyError') || 'Please enter a valid quantity.');
      if (qtyInput) qtyInput.focus();
      return;
    }
    if (price <= 0) {
      alert(t('enterValidPriceError') || 'Please enter a valid price.');
      if (priceInput) priceInput.focus();
      return;
    }

    // Generate product code: LOCAL_MISC__OTHERS
    const productCode = LOCAL_MISC_OTHERS_CODE;

    // Category is stored without Local_ prefix
    const recordCategory = selectedCategory;

    // Add to cart
    purchaseLocalCart.push({
      name: productName,
      price: price,
      qty: qty,
      category: recordCategory,
      productName: productName,
      code: productCode,
      supplier: '',
      buyUnit: buyUnit,
      buyUnitSize: '',
      expiryDate: '',
      isCustomMiscItem: true,
      mode: 'LO'
    });

    console.log('Added LOCAL_MISC__OTHERS item to cart:', productName, 'category:', selectedCategory, 'qty:', qty, 'price:', price);

    // Clear the form inputs
    if (nameInput) nameInput.value = '';
    if (qtyInput) qtyInput.value = '1';
    if (priceInput) priceInput.value = '0';
    if (buyUnitInput) buyUnitInput.value = '';

    // Re-render the form (to show added items) and summary
    renderPurchaseLocalSummary();
    showPurchasingLocalProducts(LOCAL_MISC_OTHERS_CATEGORY);
  }

  function removeLocalMiscItem(cartIndex) {
    // Find the actual index in purchaseLocalCart for custom misc items
    const customItems = purchaseLocalCart.filter(item => item.code === LOCAL_MISC_OTHERS_CODE);
    if (cartIndex >= 0 && cartIndex < customItems.length) {
      const itemToRemove = customItems[cartIndex];
      const actualIndex = purchaseLocalCart.indexOf(itemToRemove);
      if (actualIndex >= 0) {
        purchaseLocalCart.splice(actualIndex, 1);
        renderPurchaseLocalSummary();
        showPurchasingLocalProducts(LOCAL_MISC_OTHERS_CATEGORY);
      }
    }
  }

  function updatePurchaseLocalFilters() {
    const groupBy = getElem('purchaseLocalGroupBySelect')?.value || 'none';
    const monthFilter = getElem('purchaseLocalMonthFilter')?.value || '';
    const productFilter = getElem('purchaseLocalProductFilter')?.value || '';
    
    // Create filter options object
    const filterOptions = {
      groupBy: groupBy,
      month: monthFilter,
      product: productFilter,
      outlet: '', // Local purchasing is already outlet-filtered
      mode: 'L,LO' // Only show local purchases
    };
    
    const renderCounter = getCurrentRenderCounter();
    google.script.run
      .withSuccessHandler(function(response) {
        if (!isCurrentTabRender('purchasingLocal', renderCounter)) {
          console.log('Ignoring stale purchase local filter update');
          return;
        }
        renderPurchaseLocalSummaryData(response);
      })
      .withFailureHandler(function(error) {
        const contentEl = getElem('purchase-local-summary-content');
        if (contentEl) {
          contentEl.innerHTML = `<div class="error">${t('errorLoadingExpenseSummary') || 'Error updating filters'}: ${error}</div>`;
        }
      })
      .getPurchaseSummaryData(JSON.stringify(filterOptions), window.LoginState?.deviceId, window.LoginState?.currentusername || window.LoginState?.user || window.currentUser);
  }

  function resetPurchaseLocalFilters() {
    // Reset all filter controls
    const groupBySelect = getElem('purchaseLocalGroupBySelect');
    const monthFilter = getElem('purchaseLocalMonthFilter');
    const productFilter = getElem('purchaseLocalProductFilter');
    
    if (groupBySelect) groupBySelect.value = 'none';
    if (monthFilter) monthFilter.value = '';
    if (productFilter) productFilter.value = '';
    
    // Reload data
    updatePurchaseLocalFilters();
  }

  function initializePurchaseLocalFilters(response) {
    // Initialize month and product filter options
    let allMonths = new Set();
    let allProducts = new Set();
    
    try {
      let data = [];
      if (typeof response === 'string') {
        const parsed = JSON.parse(response);
        data = parsed.data || parsed;
      } else if (Array.isArray(response)) {
        data = response;
      } else if (response && response.data) {
        data = response.data;
      }
      
      data.forEach(item => {
        if (item.month) allMonths.add(item.month);
        if (item.product) allProducts.add(item.product);
        
        // If it's grouped data, also check items
        if (item.items && Array.isArray(item.items)) {
          item.items.forEach(subItem => {
            if (subItem.date) {
              const month = new Date(subItem.date).toISOString().slice(0, 7);
              allMonths.add(month);
            }
            if (subItem.product) allProducts.add(subItem.product);
          });
        } else if (item.date) {
          const month = new Date(item.date).toISOString().slice(0, 7);
          allMonths.add(month);
        }
      });
    } catch (error) {
      console.error('Error processing local filter data:', error);
    }
    
    // Populate month filter
    const monthFilter = getElem('purchaseLocalMonthFilter');
    if (monthFilter) {
      const sortedMonths = Array.from(allMonths).sort().reverse();
      sortedMonths.forEach(month => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = formatPurchaseLocalMonthLabel(month);
        monthFilter.appendChild(option);
      });
    }
    
    // Populate product filter
    const productFilter = getElem('purchaseLocalProductFilter');
    if (productFilter) {
      const sortedProducts = Array.from(allProducts).sort();
      sortedProducts.forEach(product => {
        const option = document.createElement('option');
        option.value = product;
        option.textContent = product;
        productFilter.appendChild(option);
      });
    }
  }

  function renderPurchaseLocalSummaryData(response) {
    const contentEl = getElem('purchase-local-summary-content');
    if (!contentEl) return;

    // Remove loading class
    contentEl.classList.remove('loading');

    console.log('Purchase local summary response:', response);

    // Handle response format
    let data = [];
    let groupBy = 'none';
    let totalAmount = 0;
    
    try {
      if (typeof response === 'string') {
        const parsed = JSON.parse(response);
        data = parsed.data || [];
        groupBy = parsed.groupBy || 'none';
        totalAmount = parsed.totalAmount || 0;
      } else if (response && response.success !== undefined) {
        // Handle backend response format
        data = response.data || [];
        groupBy = response.groupBy || 'none';
        totalAmount = response.totalAmount || 0;
      } else if (Array.isArray(response)) {
        data = response;
        totalAmount = data.reduce((sum, item) => sum + (Number(item.total) || 0), 0);
      } else if (response && response.data) {
        data = response.data;
        groupBy = response.groupBy || 'none';
        totalAmount = response.totalAmount || 0;
      }
    } catch (error) {
      console.error('Error parsing purchase local summary:', error);
      data = [];
    }

    // Data is already filtered by mode (L,LO) on the backend
    const localData = data;

    console.log('Local data count:', localData.length);

    console.log('Processed local data:', localData);
    console.log('GroupBy:', groupBy);
    console.log('Total amount (local only):', totalAmount);

    // Store data globally
    window._purchaseLocalSummaryData = localData;
    window._purchaseLocalGroupBy = groupBy;

    // Show message if no data
    if (!Array.isArray(localData) || localData.length === 0) {
      contentEl.innerHTML = `
        <div class="no-data">
          <div class="no-data-icon">📭</div>
          <div class="no-data-text">${t('noExpenseRecords') || 'No expense records found for the selected criteria'}</div>
          <div class="no-data-debug" style="font-size: 12px; color: #666; margin-top: 10px;">
            Response type: ${typeof response}<br>
            Local data length: ${Array.isArray(localData) ? localData.length : 'N/A'}<br>
            GroupBy: ${groupBy}
          </div>
        </div>
      `;
      return;
    }

    // Render based on grouping
    if (groupBy === 'none') {
      renderPurchaseLocalTable(localData, totalAmount);
    } else {
      renderPurchaseLocalGroups(localData, groupBy, totalAmount);
    }
  }

  function renderPurchaseLocalTable(data, totalAmount) {
    const contentEl = getElem('purchase-local-summary-content');
    
    // Sort data based on current sort settings
    const sortedData = [...data].sort((a, b) => {
      let aVal = a[purchaseLocalSortColumn];
      let bVal = b[purchaseLocalSortColumn];
      
      // Handle different data types
      if (purchaseLocalSortColumn === 'total' || purchaseLocalSortColumn === 'unitPrice' || purchaseLocalSortColumn === 'qty') {
        aVal = parseFloat(aVal) || 0;
        bVal = parseFloat(bVal) || 0;
      } else if (purchaseLocalSortColumn === 'date') {
        aVal = new Date(aVal || 0);
        bVal = new Date(bVal || 0);
      } else {
        aVal = (aVal || '').toString().toLowerCase();
        bVal = (bVal || '').toString().toLowerCase();
      }
      
      if (aVal < bVal) return purchaseLocalSortDirection === 'asc' ? -1 : 1;
      if (aVal > bVal) return purchaseLocalSortDirection === 'asc' ? 1 : -1;
      return 0;
    });

    // Build table with summary
    let html = `
      <div class="purchase-summary">
        <div class="summary-item">
          <span class="summary-label">${t('localRecords') || 'Local Records'}:</span>
          <span class="summary-value">${sortedData.length}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">${t('localAmount') || 'Local Amount'}:</span>
          <span class="summary-value">${formatCurrency(totalAmount || 0)}</span>
        </div>
      </div>
      
      <div class="table-container">
        <table class="purchase-table">
          <thead>
            <tr>
              <th class="sortable ${purchaseLocalSortColumn === 'date' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('date')">${t('dateCol') || 'Date'} <span class="sort-arrow">${purchaseLocalSortColumn === 'date' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="sortable ${purchaseLocalSortColumn === 'outlet' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('outlet')">${t('outletCol') || 'Outlet'} <span class="sort-arrow">${purchaseLocalSortColumn === 'outlet' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="sortable ${purchaseLocalSortColumn === 'product' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('product')">${t('productCol') || 'Product'} <span class="sort-arrow">${purchaseLocalSortColumn === 'product' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="sortable ${purchaseLocalSortColumn === 'category' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('category')">${t('categoryCol') || 'Category'} <span class="sort-arrow">${purchaseLocalSortColumn === 'category' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="sortable ${purchaseLocalSortColumn === 'supplier' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('supplier')">${t('supplierCol') || 'Supplier'} <span class="sort-arrow">${purchaseLocalSortColumn === 'supplier' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="right sortable ${purchaseLocalSortColumn === 'qty' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('qty')">${t('qtyCol') || 'Qty'} <span class="sort-arrow">${purchaseLocalSortColumn === 'qty' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th>${t('unitCol') || 'Unit'}</th>
              <th class="right sortable ${purchaseLocalSortColumn === 'unitPrice' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('unitPrice')">${t('pricePerUnitCol') || 'Price/Unit'} <span class="sort-arrow">${purchaseLocalSortColumn === 'unitPrice' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="right sortable ${purchaseLocalSortColumn === 'total' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('total')">${t('totalCol') || 'Total'} <span class="sort-arrow">${purchaseLocalSortColumn === 'total' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
              <th class="sortable ${purchaseLocalSortColumn === 'expiryDate' ? 'sorted-' + purchaseLocalSortDirection : ''}" onclick="sortPurchaseLocalTable('expiryDate')">${t('expiryCol') || 'Expiry'} <span class="sort-arrow">${purchaseLocalSortColumn === 'expiryDate' ? (purchaseLocalSortDirection === 'asc' ? '↑' : '↓') : '↕'}</span></th>
            </tr>
          </thead>
          <tbody>
    `;

    // Map through sorted data array
    sortedData.forEach((row, index) => {
      const date = (typeof formatDateDDMMMYYYY !== 'undefined') ? formatDateDDMMMYYYY(row.date) : (row.date ? new Date(row.date).toLocaleDateString() : '');
      const total = Number(row.total) || 0;
      html += `
        <tr class="purchase-row ${index % 2 === 0 ? 'even' : 'odd'}">
          <td class="purchase-date">${date}</td>
          <td class="purchase-outlet">${row.outlet || ''}</td>
          <td class="purchase-product">${row.product || ''}</td>
          <td class="purchase-category">${row.category || ''}</td>
          <td class="purchase-supplier">${row.supplier || ''}</td>
          <td class="purchase-qty right">${row.qty || 0}</td>
          <td class="purchase-unit">${row.buyUnit || ''}</td>
          <td class="purchase-unit-price right">${formatCurrency(row.unitPrice || 0)}</td>
          <td class="purchase-total right">${formatCurrency(total)}</td>
          <td class="purchase-expiry">${row.expiryDate || '-'}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
    
    contentEl.innerHTML = html;
  }

  function renderPurchaseLocalGroups(data, groupBy, totalAmount) {
    const contentEl = getElem('purchase-local-summary-content');
    
    let html = `
      <div class="purchase-summary">
        <div class="summary-item">
          <span class="summary-label">${t('localGroups') || 'Local Groups'}:</span>
          <span class="summary-value">${data.length}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">${t('localAmount') || 'Local Amount'}:</span>
          <span class="summary-value">${formatCurrency(totalAmount || 0)}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">${t('groupedByLabel') || 'Grouped By'}:</span>
          <span class="summary-value">${getPurchaseLocalGroupByLabel(groupBy)}</span>
        </div>
      </div>
      
      <div class="purchase-groups">
    `;

    // Render each group
    data.forEach((group, groupIndex) => {
      let groupTitle = '';
      if (groupBy === 'month') {
        groupTitle = formatPurchaseLocalMonthLabel(group.month);
      } else if (groupBy === 'product') {
        groupTitle = group.product || (t('unknownProduct') || 'Unknown Product');
      } else if (groupBy === 'both') {
        groupTitle = `${formatPurchaseLocalMonthLabel(group.month)} - ${group.product || (t('unknownProduct') || 'Unknown Product')}`;
      }

      html += `
        <div class="purchase-group">
          <div role="button" tabindex="0" class="group-header" onclick="togglePurchaseLocalGroup(${groupIndex})">
            <div class="group-title">
              <span class="group-icon">🏪</span>
              ${groupTitle}
            </div>
            <div class="group-summary">
              <span class="group-count">${group.count} ${t('localRecords') || 'local records'}</span>
              <span class="group-amount">${formatCurrency(group.totalAmount)}</span>
              <span class="group-toggle" id="purchase-local-group-toggle-${groupIndex}">▼</span>
            </div>
          </div>
          
          <div class="group-content" id="purchase-local-group-content-${groupIndex}" style="display: none;">
            <div class="group-table-container">
              <table class="purchase-table">
                <thead>
                  <tr>
                    <th>${t('dateCol') || 'Date'}</th>
                    <th>${t('outletCol') || 'Outlet'}</th>
                    <th>${t('productCol') || 'Product'}</th>
                    <th>${t('categoryCol') || 'Category'}</th>
                    <th>${t('supplierCol') || 'Supplier'}</th>
                    <th class="right">${t('qtyCol') || 'Qty'}</th>
                    <th>${t('unitCol') || 'Unit'}</th>
                    <th class="right">${t('pricePerUnitCol') || 'Price/Unit'}</th>
                    <th class="right">${t('totalCol') || 'Total'}</th>
                  </tr>
                </thead>
                <tbody>
      `;

      // Render items in the group
      (group.items || []).forEach((item, itemIndex) => {
        const date = (typeof formatDateDDMMMYYYY !== 'undefined') ? formatDateDDMMMYYYY(item.date) : (item.date ? new Date(item.date).toLocaleDateString() : '');
        const total = Number(item.total) || 0;
        html += `
          <tr class="purchase-row ${itemIndex % 2 === 0 ? 'even' : 'odd'}">
            <td class="purchase-date">${date}</td>
            <td class="purchase-outlet">${item.outlet || ''}</td>
            <td class="purchase-product">${item.product || ''}</td>
            <td class="purchase-category">${item.category || ''}</td>
            <td class="purchase-supplier">${item.supplier || ''}</td>
            <td class="purchase-qty right">${item.qty || 0}</td>
            <td class="purchase-unit">${item.buyUnit || ''}</td>
            <td class="purchase-unit-price right">${formatCurrency(item.unitPrice || 0)}</td>
            <td class="purchase-total right">${formatCurrency(total)}</td>
          </tr>
        `;
      });
  // Make sure the universal date formatter is available in this file
  if (typeof formatDateDDMMMYYYY === 'undefined') {
    // Try to load from parent window if possible
    window.formatDateDDMMMYYYY = function(dateValue) {
      if (!dateValue) return "";
      let date;
      if (dateValue instanceof Date) {
        date = dateValue;
      } else if (typeof dateValue === 'number') {
        date = new Date(Math.round((dateValue - 25569) * 86400 * 1000));
      } else {
        date = new Date(dateValue);
      }
      if (isNaN(date)) return "";
      const day = String(date.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[date.getMonth()];
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    };
  }

      html += `
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    contentEl.innerHTML = html;
  }

  // Helper functions for purchase local summary
  function sortPurchaseLocalTable(column) {
    if (purchaseLocalSortColumn === column) {
      purchaseLocalSortDirection = purchaseLocalSortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      purchaseLocalSortColumn = column;
      purchaseLocalSortDirection = 'asc';
    }
    
    // Re-render with new sort
    if (window._purchaseLocalSummaryData) {
      if (window._purchaseLocalGroupBy === 'none') {
        renderPurchaseLocalTable(window._purchaseLocalSummaryData, 
          window._purchaseLocalSummaryData.reduce((sum, item) => sum + (Number(item.total) || 0), 0));
      } else {
        renderPurchaseLocalGroups(window._purchaseLocalSummaryData, window._purchaseLocalGroupBy,
          window._purchaseLocalSummaryData.reduce((sum, group) => sum + (Number(group.totalAmount) || 0), 0));
      }
    }
  }

  function togglePurchaseLocalGroup(groupIndex) {
    const content = getElem(`purchase-local-group-content-${groupIndex}`);
    const toggle = getElem(`purchase-local-group-toggle-${groupIndex}`);
    
    if (content && toggle) {
      if (content.style.display === 'none') {
        content.style.display = 'block';
        toggle.textContent = '▲';
      } else {
        content.style.display = 'none';
        toggle.textContent = '▼';
      }
    }
  }

  function getPurchaseLocalGroupByLabel(groupBy) {
    switch (groupBy) {
      case 'month': return t('byMonth') || 'Month';
      case 'product': return t('byProduct') || 'Product';
      case 'both': return t('byMonthProduct') || 'Month & Product';
      default: return t('noGrouping') || 'None';
    }
  }

  function formatPurchaseLocalMonthLabel(monthStr) {
    if (!monthStr) return '';
    try {
      const date = new Date(monthStr + '-01');
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
    } catch (error) {
      return monthStr;
    }
  }

  // Make purchase local summary functions globally accessible
  window.updatePurchaseLocalFilters = updatePurchaseLocalFilters;
  window.resetPurchaseLocalFilters = resetPurchaseLocalFilters;
  window.initializePurchaseLocalFilters = initializePurchaseLocalFilters;
  window.renderPurchaseLocalSummaryData = renderPurchaseLocalSummaryData;
  window.sortPurchaseLocalTable = sortPurchaseLocalTable;
  window.togglePurchaseLocalGroup = togglePurchaseLocalGroup;

</script>
