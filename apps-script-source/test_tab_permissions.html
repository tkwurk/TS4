<!DOCTYPE html>
<html>
<head>
    <title>Tab Permissions Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .test-button:hover { background: #0056b3; }
        .status { padding: 10px; margin: 10px 0; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔐 Tab Permissions Test System</h1>
    
    <div class="test-section">
        <h3>Current Status</h3>
        <div id="currentStatus" class="status info">
            Loading current authentication status...
        </div>
    </div>
    
    <div class="test-section">
        <h3>Simulate Different User Roles</h3>
        <button class="test-button" onclick="simulateBasicUser()">👤 Basic User</button>
        <button class="test-button" onclick="simulateAdvancedUser()">👨‍💼 Advanced User</button>
        <button class="test-button" onclick="simulateAdminUser()">👑 Admin User</button>
        <button class="test-button" onclick="simulateLogout()">🚪 Logout</button>
    </div>
    
    <div class="test-section">
        <h3>Debug Functions</h3>
        <button class="test-button" onclick="debugPermissions()">🔍 Debug Permissions</button>
        <button class="test-button" onclick="refreshPermissions()">🔄 Refresh Permissions</button>
        <button class="test-button" onclick="testTabAccess()">🧪 Test Tab Access</button>
    </div>
    
    <div class="test-section">
        <h3>Test Results</h3>
        <div id="testResults"></div>
    </div>

    <script>
        // Simulate different user permission levels
        function simulateBasicUser() {
            console.log('Simulating Basic User permissions...');
            
            // Set up basic user context
            window.LoginState = {
                isLoggedIn: true,
                currentusername: 'basic_user',
                outlet: 'Store1',
                allowedTabs: ['orders', 'deposits', 'expenses', 'inventoryConsumption'],
                deviceId: 'test_device_basic',
                loginTime: Date.now()
            };
            
            // Also set global variables for compatibility
            window.currentUser = 'basic_user';
            window.currentOutlet = 'Store1';
            window.allowedTabs = ['orders', 'deposits', 'expenses', 'inventoryConsumption'];
            window.isLoggedIn = true;
            
            updateStatus('Basic User - Limited access to core features');
            
            // Trigger tab visibility update if available
            if (window.updateTabVisibility) {
                window.updateTabVisibility();
            }
            
            // Fire authentication event
            window.dispatchEvent(new CustomEvent('authenticationChanged', {
                detail: { username: 'basic_user', outlet: 'Store1', allowedTabs: window.allowedTabs }
            }));
        }
        
        function simulateAdvancedUser() {
            console.log('Simulating Advanced User permissions...');
            
            window.LoginState = {
                isLoggedIn: true,
                currentusername: 'advanced_user',
                outlet: 'Store1',
                allowedTabs: ['orders', 'deposits', 'expenses', 'inventoryConsumption', 'purchasing', 'purchasingLocal', 'profitLoss', 'usageReport', 'monthlySalesReport'],
                deviceId: 'test_device_advanced',
                loginTime: Date.now()
            };
            
            window.currentUser = 'advanced_user';
            window.currentOutlet = 'Store1';
            window.allowedTabs = ['orders', 'deposits', 'expenses', 'inventoryConsumption', 'purchasing', 'purchasingLocal', 'profitLoss', 'usageReport', 'monthlySalesReport'];
            window.isLoggedIn = true;
            
            updateStatus('Advanced User - Access to business features');
            
            if (window.updateTabVisibility) {
                window.updateTabVisibility();
            }
            
            window.dispatchEvent(new CustomEvent('authenticationChanged', {
                detail: { username: 'advanced_user', outlet: 'Store1', allowedTabs: window.allowedTabs }
            }));
        }
        
        function simulateAdminUser() {
            console.log('Simulating Admin User permissions...');
            
            window.LoginState = {
                isLoggedIn: true,
                currentusername: 'admin_user',
                outlet: 'Store1',
                allowedTabs: ['orders', 'deposits', 'expenses', 'inventoryConsumption', 'purchasing', 'purchasingLocal', 'profitLoss', 'usageReport', 'monthlySalesReport', 'investments', 'adminOrders'],
                deviceId: 'test_device_admin',
                loginTime: Date.now()
            };
            
            window.currentUser = 'admin_user';
            window.currentOutlet = 'Store1';
            window.allowedTabs = ['orders', 'deposits', 'expenses', 'inventoryConsumption', 'purchasing', 'purchasingLocal', 'profitLoss', 'usageReport', 'monthlySalesReport', 'investments', 'adminOrders'];
            window.isLoggedIn = true;
            
            updateStatus('Admin User - Full access to all features');
            
            if (window.updateTabVisibility) {
                window.updateTabVisibility();
            }
            
            window.dispatchEvent(new CustomEvent('authenticationChanged', {
                detail: { username: 'admin_user', outlet: 'Store1', allowedTabs: window.allowedTabs }
            }));
        }
        
        function simulateLogout() {
            console.log('Simulating logout...');
            
            // Clear authentication state
            window.LoginState = {
                isLoggedIn: false,
                currentusername: null,
                outlet: null,
                allowedTabs: [],
                deviceId: null,
                loginTime: null
            };
            
            window.currentUser = null;
            window.currentOutlet = null;
            window.allowedTabs = [];
            window.isLoggedIn = false;
            
            updateStatus('Logged out - No access to restricted features');
            
            // Fire logout event
            window.dispatchEvent(new CustomEvent('logout'));
        }
        
        function debugPermissions() {
            console.log('Running debug permissions...');
            
            if (window.debugTabPermissions) {
                const result = window.debugTabPermissions();
                displayTestResults('Debug Permissions', result);
            } else {
                displayTestResults('Debug Permissions', 'debugTabPermissions function not available');
            }
        }
        
        function refreshPermissions() {
            console.log('Refreshing permissions...');
            
            if (window.refreshTabPermissions) {
                window.refreshTabPermissions();
                updateStatus('Permissions refreshed');
            } else {
                updateStatus('refreshTabPermissions function not available');
            }
        }
        
        function testTabAccess() {
            console.log('Testing tab access...');
            
            const testTabs = ['orders', 'purchasing', 'adminOrders', 'profitLoss', 'tutorials'];
            const results = {};
            
            testTabs.forEach(tab => {
                if (window.hasTabAccess) {
                    results[tab] = window.hasTabAccess(tab);
                } else {
                    results[tab] = 'hasTabAccess function not available';
                }
            });
            
            displayTestResults('Tab Access Test', results);
        }
        
        function updateStatus(message) {
            const statusEl = document.getElementById('currentStatus');
            if (statusEl) {
                statusEl.innerHTML = `
                    <strong>Status:</strong> ${message}<br>
                    <strong>User:</strong> ${window.currentUser || 'None'}<br>
                    <strong>Allowed Tabs:</strong> ${(window.allowedTabs || []).join(', ') || 'None'}
                `;
            }
        }
        
        function displayTestResults(testName, results) {
            const resultsEl = document.getElementById('testResults');
            const timestamp = new Date().toLocaleTimeString();
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'status info';
            resultDiv.innerHTML = `
                <strong>${testName} (${timestamp}):</strong><br>
                <pre>${JSON.stringify(results, null, 2)}</pre>
            `;
            
            resultsEl.appendChild(resultDiv);
        }
        
        // Initialize
        window.addEventListener('load', function() {
            updateStatus('Test system loaded - Select a user role to test');
            
            // Show current state if any
            if (window.currentUser) {
                updateStatus(`Currently logged in as: ${window.currentUser}`);
            }
        });
        
        // Mock toast function if not available
        if (!window.showToast) {
            window.showToast = function(message, type) {
                console.log(`TOAST [${type}]: ${message}`);
            };
        }
    </script>
</body>
</html>
