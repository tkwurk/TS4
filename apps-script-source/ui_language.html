<script>
  // Translation helper
  function t(key) { 
    return texts[lang][key] || key; 
  }

  // Language handling
  function changeLang() {
    const newLang = getElem('langSel').value;
    console.log('Changing language from', lang, 'to', newLang);
    lang = newLang;

    if (typeof savePreferences === 'function') savePreferences();
    if (typeof clearAllTabStates === 'function') clearAllTabStates();

    updateTabLabels();
    if (typeof updateTabVisibility === 'function') updateTabVisibility();

    var tab = window.currentTab || activeTab || 'orders';
    if (typeof switchTab === 'function') {
      switchTab(tab, { skipSecurity: true, languageRefresh: true });
    }

    setTimeout(function() {
      try {
        updateDynamicTranslations();
        if ((window.currentTab || activeTab) === 'adminOrders' && typeof window.refreshAdminPanelI18n === 'function') {
          window.refreshAdminPanelI18n();
        }
      } catch (error) {
        console.error('Error updating dynamic translations:', error);
      }
    }, 100);

    console.log('Language change complete');
  }

  // Function for new navigation structure
  function switchLanguage() {
    const languageSelect = document.getElementById('languageSelect');
    if (!languageSelect) return;
    const newLang = languageSelect.value;
    console.log('Switching language from', lang, 'to', newLang);
    lang = newLang;

    if (typeof savePreferences === 'function') {
      savePreferences();
    }

    if (typeof clearAllTabStates === 'function') {
      clearAllTabStates();
    }

    updateTabLabels();
    if (typeof updateTabVisibility === 'function') updateTabVisibility();
    if (window.SnowbeeI18n && typeof window.SnowbeeI18n.applyLoginI18n === 'function') {
      window.SnowbeeI18n.applyLoginI18n();
    }

    var tab = window.currentTab || activeTab || 'orders';
    if (typeof switchTab === 'function') {
      switchTab(tab, { skipSecurity: true, languageRefresh: true });
    }

    setTimeout(function() {
      try {
        updateDynamicTranslations();
        if ((window.currentTab || activeTab) === 'adminOrders' && typeof window.refreshAdminPanelI18n === 'function') {
          window.refreshAdminPanelI18n();
        }
      } catch (error) {
        console.error('Error updating dynamic translations:', error);
      }
    }, 100);

    console.log('Language switch complete');
  }

  // Make switchLanguage globally accessible
  window.switchLanguage = switchLanguage;

  function updateTabLabels() {
    const ordersTab = getElem('ordersTab');
    const salesSummaryTab = getElem('salesSummaryTab');
    const purchasingTab = getElem('purchasingTab');
    const purchasingLocalTab = getElem('purchasingLocalTab');
    const depositsTab = getElem('depositsTab');
    const expensesTab = getElem('expensesTab');
    const profitLossTab = getElem('profitLossTab');
    const usageReportTab = getElem('usageReportTab');
    const investmentsTab = getElem('investmentsTab');
    const inventoryConsumptionTab = getElem('inventoryConsumptionTab');
    const monthlySalesReportTab = getElem('monthlySalesReportTab');
    const stockReportTab = getElem('stockReportTab');
    const tutorialsTab = getElem('tutorialsTab');
    const adminOrdersTab = getElem('adminOrdersTab');
    const attendanceTab = getElem('attendanceTab');
    
    // Update text content for buttons with new structure (using .nav-text spans)
    if (ordersTab) {
      const textSpan = ordersTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('orders');
      else ordersTab.textContent = t('orders');
    }
    if (salesSummaryTab) {
      const textSpan = salesSummaryTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('salesSummaryBtn');
      else salesSummaryTab.textContent = t('salesSummaryBtn');
    }
    if (purchasingTab) {
      const textSpan = purchasingTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('purchasing');
      else purchasingTab.textContent = t('purchasing');
    }
    if (purchasingLocalTab) {
      const textSpan = purchasingLocalTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('purchasingLocal');
      else purchasingLocalTab.textContent = t('purchasingLocal');
    }
    if (depositsTab) {
      const textSpan = depositsTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('deposits');
      else depositsTab.textContent = t('deposits');
    }
    if (expensesTab) {
      const textSpan = expensesTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('expenses');
      else expensesTab.textContent = t('expenses');
    }
    if (profitLossTab) {
      const textSpan = profitLossTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('profitLoss');
      else profitLossTab.textContent = t('profitLoss');
    }
    if (usageReportTab) {
      const textSpan = usageReportTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('usageReport');
      else usageReportTab.textContent = t('usageReport');
    }
    if (investmentsTab) {
      const textSpan = investmentsTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('investments');
      else investmentsTab.textContent = t('investments');
    }
    if (inventoryConsumptionTab) {
      const textSpan = inventoryConsumptionTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('dailyClosing');
      else inventoryConsumptionTab.textContent = t('dailyClosing');
    }
    if (monthlySalesReportTab) {
      const textSpan = monthlySalesReportTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('monthly_sales_report_btn');
      else monthlySalesReportTab.textContent = t('monthly_sales_report_btn');
    }
    if (tutorialsTab) {
      const textSpan = tutorialsTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('tutorials');
      else tutorialsTab.textContent = t('tutorials');
    }
    if (stockReportTab) {
      const textSpan = stockReportTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('stockReport');
      else stockReportTab.textContent = t('stockReport');
    }
    if (adminOrdersTab) {
      const textSpan = adminOrdersTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('adminOrders');
      else adminOrdersTab.textContent = t('adminOrders');
    }
    if (attendanceTab) {
      const textSpan = attendanceTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('attendance');
      else attendanceTab.textContent = t('attendance');
    }
    const purchasingReceiveTab = getElem('purchasingReceiveTab');
    if (purchasingReceiveTab) {
      const textSpan = purchasingReceiveTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('purchasingReceive');
    }
    const checklistTab = getElem('checklistTab');
    if (checklistTab) {
      const textSpan = checklistTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('checklist');
    }
    const kitchenCookingTab = getElem('kitchenCookingTab');
    if (kitchenCookingTab) {
      const textSpan = kitchenCookingTab.querySelector('.nav-text');
      if (textSpan) textSpan.textContent = t('kitchenCooking');
    }
    
    // Update user label
    const userText = getElem('userText') || document.querySelector('.user-label');
    if (userText) {
      userText.textContent = t('user') + ':';
    }

    var userDisplay = getElem('userDisplay') || document.getElementById('userDisplay');
    if (userDisplay && window.LoginState && window.LoginState.user) {
      var role = (window.LoginState.role || window.currentRole || 'cashier');
      var roleLabel = t('role_' + role) || role;
      userDisplay.textContent = window.LoginState.user + ' · ' + roleLabel;
    }
    
    // Update logout button text
    const logoutBtn = getElem('logoutBtn');
    if (logoutBtn) {
      const logoutTextSpan = logoutBtn.querySelector('.logout-text');
      if (logoutTextSpan) {
        logoutTextSpan.textContent = t('logout') || 'Logout';
      }
    }
  }

  // Update dynamic translatable elements in the current tab
  function updateDynamicTranslations() {
    console.log('Updating dynamic translations for current tab');
    
    // Update sales summary button if it exists
    const salesSummaryBtn = getElem('salesSummaryBtn');
    if (salesSummaryBtn) {
      salesSummaryBtn.textContent = t('salesSummaryBtn');
      console.log('Updated sales summary button text');
    }
    
    // Update clear cart button if it exists
    const clearCartBtn = getElem('clearCartBtn');
    if (clearCartBtn) {
      clearCartBtn.innerHTML = `🗑️ ${t('clearCart') || 'Clear Cart'}`;
    }
    
    // Update checkout button if it exists
    const checkoutBtns = document.querySelectorAll('.pay-btn');
    checkoutBtns.forEach(btn => {
      if (btn.onclick && btn.onclick.toString().includes('proceedToCheckout')) {
        btn.textContent = t('proceedToCheckout');
      }
    });
    
    // Update summary heading if it exists  
    const summaryHeading = document.querySelector('.summary h3');
    if (summaryHeading) {
      summaryHeading.textContent = t('orderSummary');
    }
    
    // Update menu title if it exists (look for h2 that contains menu-related content)
    const menuTitle = document.querySelector('h2[style*="text-align:center"]');
    if (menuTitle) {
      menuTitle.textContent = t('menuTitle');
    }
    
    // Update any "New Order" buttons
    const newOrderButtons = document.querySelectorAll('.neworder-btn');
    newOrderButtons.forEach(btn => {
      if (btn.onclick && (btn.onclick.toString().includes('startNewOrder') || btn.onclick.toString().includes('switchTab'))) {
        // Check the content to determine the correct translation
        if (btn.textContent.includes('New') || btn.textContent.includes('Baru') || btn.textContent.includes('Order')) {
          btn.textContent = t('newOrder');
        }
      }
    });
    
    // Update "Back" buttons
    const backButtons = document.querySelectorAll('.remove-btn');
    backButtons.forEach(btn => {
      if (btn.textContent.trim() === 'Back' || btn.textContent.trim() === 'Kembali') {
        btn.textContent = t('back');
      }
    });
    
    // Update common payment buttons
    const payButtons = document.querySelectorAll('.pay-btn');
    payButtons.forEach(btn => {
      const text = btn.textContent.trim();
      if (text === 'Cash' || text === 'Tunai') {
        btn.textContent = t('cash');
      } else if (text === 'Dana') {
        btn.textContent = t('dana');  
      }
    });
    
    // Update table headers if they exist
    const tableHeaders = document.querySelectorAll('th');
    tableHeaders.forEach(th => {
      const text = th.textContent.trim();
      if (text === 'Item' || text === 'Barang') {
        th.textContent = t('item');
      } else if (text === 'Qty' || text === 'Jumlah') {
        th.textContent = t('qty');
      } else if (text === 'Amount' || text === 'Harga') {
        th.textContent = t('amount');
      }
    });
  }

  // Make updateDynamicTranslations globally accessible
  window.updateDynamicTranslations = updateDynamicTranslations;
</script>
