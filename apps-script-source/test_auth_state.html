<!DOCTYPE html>
<html>
<head>
    <title>Authentication State Test</title>
</head>
<body>
    <h1>Authentication State Debug</h1>
    <div id="output"></div>
    
    <script>
        function checkAuthState() {
            const output = document.getElementById('output');
            const state = {
                timestamp: new Date().toISOString(),
                loginState: window.LoginState,
                isUserAuthenticated: typeof window.isUserAuthenticated === 'function' ? window.isUserAuthenticated() : 'function not found',
                isSessionValid: typeof window.isSessionValid === 'function' ? window.isSessionValid() : 'function not found',
                securityWrapper: typeof window.SecurityWrapper !== 'undefined',
                globalVars: {
                    isLoggedIn: window.isLoggedIn,
                    currentUser: window.currentUser,
                    currentOutlet: window.currentOutlet,
                    allowedTabs: window.allowedTabs
                }
            };
            
            output.innerHTML = '<pre>' + JSON.stringify(state, null, 2) + '</pre>';
        }
        
        // Check state every second
        setInterval(checkAuthState, 1000);
        checkAuthState();
    </script>
</body>
</html>
