<script>
  // Utility functions
  function formatCurrency(amount) {
    if (isNaN(amount)) amount = 0;
    return "Rp " + Number(amount).toLocaleString(lang === "id" ? "id-ID" : "en-US");
  }

  function getNumberLocale_() {
    return (typeof lang !== 'undefined' && lang === 'id') ? 'id-ID' : 'en-US';
  }

  /**
   * Parse user-entered numbers using the CURRENT locale's separators so it
   * round-trips with formatDecimal. id-ID: '.' = thousands, ',' = decimal.
   * en-US: ',' = thousands, '.' = decimal.
   */
  function parseLocaleNumber(str) {
    if (str === null || str === undefined || str === '' || str === '-') return 0;
    if (typeof str === 'number') return isNaN(str) ? 0 : str;
    var s = str.toString().trim();
    if (!s) return 0;
    if (getNumberLocale_() === 'id-ID') {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
    return parseFloat(s) || 0;
  }

  /**
   * Manual locale-aware number formatting. Does NOT rely on toLocaleString's
   * locale argument, which is silently ignored in the Apps Script HtmlService
   * webview (id-ID falls back to en-US, showing "1.5" instead of "1,5").
   */
  function formatNumberManual_(num, minFrac, maxFrac, locale) {
    var isId = locale === 'id-ID';
    var groupSep = isId ? '.' : ',';
    var decSep = isId ? ',' : '.';
    var neg = num < 0;
    var abs = Math.abs(num);
    var fixed = abs.toFixed(maxFrac);
    var parts = fixed.split('.');
    var intPart = parts[0];
    var fracPart = parts.length > 1 ? parts[1] : '';
    // Trim trailing zeros down to minFrac, then pad up to minFrac.
    while (fracPart.length > minFrac && fracPart.charAt(fracPart.length - 1) === '0') {
      fracPart = fracPart.slice(0, -1);
    }
    while (fracPart.length < minFrac) {
      fracPart += '0';
    }
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, groupSep);
    var result = intPart + (fracPart.length > 0 ? decSep + fracPart : '');
    return (neg && result !== '0' ? '-' : '') + result;
  }

  /** Locale-aware quantity/decimal display for Daily Closing and reports. */
  function formatDecimal(value, options) {
    options = options || {};
    if (value === null || value === undefined || value === '' || value === '-') {
      return options.empty != null ? options.empty : '-';
    }
    var num = typeof value === 'number' ? value : parseLocaleNumber(value);
    if (isNaN(num)) return String(value);
    var minFrac = options.minFractionDigits != null ? options.minFractionDigits : 0;
    var maxFrac = options.maxFractionDigits != null ? options.maxFractionDigits : 3;
    return formatNumberManual_(num, minFrac, maxFrac, getNumberLocale_());
  }

  function formatQty(value) {
    return formatDecimal(value, { maxFractionDigits: 3, minFractionDigits: 0 });
  }

  /** Show a ratio as fraction text (e.g. 5/25) instead of a decimal. */
  function formatRatioFraction(numerator, denominator, options) {
    options = options || {};
    var n = Number(numerator);
    var d = Number(denominator);
    if (!n || !d || isNaN(n) || isNaN(d)) return '-';
    var nDisplay = formatQty(n);
    var dDisplay = formatQty(d);
    if (options.simplify) {
      var scale = 10000;
      var na = Math.round(n * scale);
      var da = Math.round(d * scale);
      var g = gcdInt_(Math.abs(na), Math.abs(da));
      if (g > 1) {
        na /= g;
        da /= g;
        nDisplay = String(na / scale);
        dDisplay = String(da / scale);
        if (nDisplay.indexOf('.') >= 0) nDisplay = formatQty(na / scale);
        if (dDisplay.indexOf('.') >= 0) dDisplay = formatQty(da / scale);
      }
    }
    return nDisplay + '/' + dDisplay;
  }

  function gcdInt_(a, b) {
    while (b) {
      var t = a % b;
      a = b;
      b = t;
    }
    return a || 1;
  }

  /** App/spreadsheet timezone (Jakarta); not the browser's local zone. */
  function getAppTimeZone() {
    return (typeof window !== 'undefined' && window.APP_TIMEZONE)
      ? window.APP_TIMEZONE
      : 'Asia/Jakarta';
  }

  /** yyyy-MM-dd in app timezone. Optional offsetDays shifts the instant first. */
  function getAppDateKey(date, offsetDays) {
    var d = date instanceof Date ? date : new Date();
    if (offsetDays) d = new Date(d.getTime() + Number(offsetDays) * 86400000);
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: getAppTimeZone() }).format(d);
    } catch (e) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
  }

  /** Value for HTML datetime-local in app timezone. */
  function getAppDatetimeLocalValue(date) {
    var d = date instanceof Date ? date : new Date();
    var parts = {};
    try {
      new Intl.DateTimeFormat('en-GB', {
        timeZone: getAppTimeZone(),
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(d).forEach(function(p) {
        if (p.type !== 'literal') parts[p.type] = p.value;
      });
      return parts.year + '-' + parts.month + '-' + parts.day + 'T' + parts.hour + ':' + parts.minute;
    } catch (e) {
      return getAppDateKey(d) + 'T00:00';
    }
  }

  function shiftAppDateKey(dateKey, deltaDays) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateKey || '').trim());
    if (!m) return getAppDateKey(new Date());
    var utc = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + (Number(deltaDays) || 0), 12);
    return getAppDateKey(new Date(utc));
  }

  function formatAppDateTime(value) {
    if (value == null || value === '') return '';
    var d = value instanceof Date ? value : new Date(value);
    if (isNaN(d.getTime())) return String(value);
    try {
      return new Intl.DateTimeFormat(getNumberLocale_(), {
        timeZone: getAppTimeZone(),
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(d);
    } catch (e) {
      return String(value).slice(0, 16).replace('T', ' ');
    }
  }

  function formatAppTimeZoneLabel() {
    return getAppTimeZone().replace(/_/g, ' ');
  }

  /** Prefer BOM fraction strings; otherwise show sold/consumption as n/d (e.g. 5/25). */
  function formatConsumptionRatioDisplay(qtyPerServing, suggestedQuantity, soldUnitsToday) {
    var per = qtyPerServing != null ? String(qtyPerServing).trim() : '';
    if (per && (per.indexOf('/') >= 0 || /g\s*×|grams/i.test(per))) {
      return per;
    }
    var sold = Number(soldUnitsToday) || 0;
    var sug = Number(suggestedQuantity) || 0;
    if (sold > 0 && sug > 0) {
      if (!per) {
        return formatRatioFraction(sold, sug);
      }
      var asNum = parseLocaleNumber(per);
      if (!isNaN(asNum) && Math.abs(asNum - Math.round(asNum)) > 0.0001) {
        return formatRatioFraction(sold, sug);
      }
    }
    if (per) return per;
    return '-';
  }

  window.parseLocaleNumber = parseLocaleNumber;
  window.formatDecimal = formatDecimal;
  window.formatQty = formatQty;
  window.formatRatioFraction = formatRatioFraction;
  window.formatConsumptionRatioDisplay = formatConsumptionRatioDisplay;

  function escapeString(str) {
    return str.replace(/'/g, "\\'");
  }

  // Decode HTML entities back to original characters
  function decodeString(str) {
    if (!str) return '';
    return str.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&#92;/g, '\\');
  }

  // Device ID management - global function with session-specific ID
  window.getDeviceId = function(usernameForLogin) {
    if (deviceId) {
      return deviceId;
    }
    
    // Get current username for device ID generation
    let username = usernameForLogin; // First priority: username passed as parameter (for login)
    
    if (!username) {
      // Fallback to current user methods
      if (window.getCurrentUser && typeof window.getCurrentUser === 'function') {
        username = window.getCurrentUser();
      }
      if (!username && window.currentUser) {
        username = window.currentUser;
      }
      if (!username && typeof currentUser !== 'undefined') {
        username = currentUser;
      }
    }
    
    // Username should never be null - if it is, user needs to log in again
    // BUT allow device ID generation during login process when username is provided as parameter
    if (!username || username.trim() === '') {
      console.error('getDeviceId called without valid username - forcing login');
      
      // Clear any existing session data
      if (window.clearDeviceId && typeof window.clearDeviceId === 'function') {
        window.clearDeviceId();
      }
      
      // Force user to log in again
      if (window.showErrorModal && typeof window.showErrorModal === 'function') {
        window.showErrorModal('Your session has expired. Please log in again.');
      } else {
        alert('Your session has expired. Please log in again.');
      }
      
      // Trigger logout/login process
      if (window.doLogout && typeof window.doLogout === 'function') {
        setTimeout(() => {
          window.doLogout();
        }, 1000);
      } else {
        // Fallback: reload the page to force login
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      }
      
      return null; // Return null to indicate failure
    }
    
    // Generate a unique session-specific device ID that includes current user context
    // This prevents multiple users sharing the same device ID across browser tabs
    const baseDeviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    // Add session identifier to make it unique per tab/session
    const sessionId = sessionStorage.getItem('sessionId') || 'session_' + Math.random().toString(36).substr(2, 9);
    if (!sessionStorage.getItem('sessionId')) {
      sessionStorage.setItem('sessionId', sessionId);
    }
    
    // Always append username to device ID for additional uniqueness
    // Sanitize username for use in device ID (remove spaces and special characters)
    const sanitizedUsername = username.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    const deviceIdWithUser = baseDeviceId + '_' + sessionId + '_user_' + sanitizedUsername;
    
    deviceId = deviceIdWithUser;
    console.log('Generated device ID:', deviceId, 'for user:', username);
    return deviceId;
  };

  // Function to clear session-specific device ID when user logs out
  window.clearDeviceId = function() {
    deviceId = null;
    sessionStorage.removeItem('sessionId');
    console.log('Device ID and session ID cleared');
  };

  // Generic error handlers
  function handleServerError(error, context) {
    console.error(`Error in ${context}:`, error);
    alert(`${context} failed: ${error.message || error}`);
  }

  // Loading states
  function showLoading(elementId, message = 'Loading...') {
    const element = getElem(elementId);
    if (element) {
      element.innerHTML = `<div class="loading">${message}</div>`;
    }
  }

  function showError(elementId, message) {
    const element = getElem(elementId);
    if (element) {
      element.innerHTML = `<div class="error">${message}</div>`;
    }
  }

  function showNoData(elementId, message = 'No data available') {
    const element = getElem(elementId);
    if (element) {
      element.innerHTML = `<div class="no-data">${message}</div>`;
    }
  }

  // Date formatting
  function formatDate(date) {
    if (!date) return '';
    if (typeof date === 'string') {
      date = new Date(date);
    }
    return date.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US');
  }

  // Number validation
  function validateNumber(value, min = 0) {
    const num = parseFloat(value);
    return !isNaN(num) && num >= min;
  }

  // Retry mechanism for failed operations
  function retryOperation(operation, maxRetries = 3, delay = 1000) {
    return new Promise((resolve, reject) => {
      let retries = 0;
      
      const attempt = () => {
        operation()
          .then(resolve)
          .catch(error => {
            retries++;
            if (retries >= maxRetries) {
              reject(error);
            } else {
              setTimeout(attempt, delay * retries);
            }
          });
      };
      
      attempt();
    });
  }

  // Array validation utility
  function ensureArray(data) {
    if (Array.isArray(data)) return data;
    try {
      const parsed = JSON.parse(data);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e) {
      return [];
    }
  }

  // Cash details rendering utility
  function renderCashDetails(data) {
    // data = { cashInHand, totalDeposited, totalSales, totalExpenses }
    const el = getElem('cash-details');

    if (!el) return;
   
    // Remove loading class to stop spinner
    el.classList.remove('loading');
    
    // Add cash-details class for styling
    el.classList.add('cash-details');

    el.innerHTML = `
      <table class="cash-summary-table">
        <tr class="headers-row">
          <th class="amount">${t('cashInHandLabel')}</th>
          <th class="amount">${t('totalDeposited')}</th>
          <th class="amount">${t('totalSalesCash')}</th>
          <th class="amount">${t('totalExpenses')}</th>
        </tr>
        <tr class="values-row">
          <td class="amount cash-amount">${formatCurrency(data.cashInHand)}</td>
          <td class="amount cash-amount">${formatCurrency(data.totalDeposits)}</td>
          <td class="amount cash-amount">${formatCurrency(data.totalSales)}</td>
          <td class="amount cash-amount">${formatCurrency(data.totalCashExpenses)}</td>
        </tr>
      </table>
    `;
  }

  // Professional modal dialog functions - Global utilities
  window.showConfirmationModal = function(message, onConfirm, onCancel) {
    // Remove any existing modals
    removeExistingModals();
    
    const modal = document.createElement('div');
    modal.className = 'professional-modal-overlay';
    modal.innerHTML = `
      <div class="professional-modal">
        <div class="modal-header">
          <h3>${t('confirmation') || 'Confirmation'}</h3>
        </div>
        <div class="modal-body">
          <div class="modal-icon">❓</div>
          <p>${message}</p>
        </div>
        <div class="modal-footer">
          <button class="modal-btn modal-btn-cancel" onclick="closeConfirmationModal(false)">
            ${t('cancel') || 'Cancel'}
          </button>
          <button class="modal-btn modal-btn-confirm" onclick="closeConfirmationModal(true)">
            ${t('confirm') || 'Confirm'}
          </button>
        </div>
      </div>
    `;
    
    // Store callbacks for modal close
    window._modalCallbacks = { onConfirm, onCancel };
    
    // Add to DOM
    document.body.appendChild(modal);
    
    // Add event listener for overlay click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeConfirmationModal(false);
      }
    });
    
    // Add escape key listener
    const escapeHandler = (e) => {
      if (e.key === 'Escape') {
        closeConfirmationModal(false);
        document.removeEventListener('keydown', escapeHandler);
      }
    };
    document.addEventListener('keydown', escapeHandler);
    
    // Focus the confirm button
    setTimeout(() => {
      const confirmBtn = modal.querySelector('.modal-btn-confirm');
      if (confirmBtn) confirmBtn.focus();
    }, 100);
  };

  window.showErrorModal = function(message) {
    // Remove any existing modals
    removeExistingModals();
    
    const modal = document.createElement('div');
    modal.className = 'professional-modal-overlay';
    modal.innerHTML = `
      <div class="professional-modal error-modal">
        <div class="modal-header error-header">
          <h3>${t('error') || 'Error'}</h3>
        </div>
        <div class="modal-body">
          <div class="modal-icon error-icon">⚠️</div>
          <p>${message}</p>
        </div>
        <div class="modal-footer">
          <button class="modal-btn modal-btn-confirm" onclick="closeErrorModal()">
            ${t('ok') || 'OK'}
          </button>
        </div>
      </div>
    `;
    
    // Add to DOM
    document.body.appendChild(modal);
    
    // Add event listener for overlay click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeErrorModal();
      }
    });
    
    // Add escape key listener
    const escapeHandler = (e) => {
      if (e.key === 'Escape') {
        closeErrorModal();
        document.removeEventListener('keydown', escapeHandler);
      }
    };
    document.addEventListener('keydown', escapeHandler);
    
    // Focus the OK button
    setTimeout(() => {
      const okBtn = modal.querySelector('.modal-btn-confirm');
      if (okBtn) okBtn.focus();
    }, 100);
  };

  window.closeConfirmationModal = function(confirmed) {
    const modal = document.querySelector('.professional-modal-overlay');
    if (modal) {
      modal.remove();
    }
    
    // Execute callbacks
    if (window._modalCallbacks) {
      if (confirmed && window._modalCallbacks.onConfirm) {
        window._modalCallbacks.onConfirm();
      } else if (!confirmed && window._modalCallbacks.onCancel) {
        window._modalCallbacks.onCancel();
      }
      window._modalCallbacks = null;
    }
  };

  window.closeErrorModal = function() {
    const modal = document.querySelector('.professional-modal-overlay');
    if (modal) {
      modal.remove();
    }
  };

  function removeExistingModals() {
    const existingModals = document.querySelectorAll('.professional-modal-overlay');
    existingModals.forEach(modal => modal.remove());
  }

  // Global navigation control functions for processing states
  window.disableAllNavigation = function() {
    // Disable all navigation tabs
    const navButtons = document.querySelectorAll('.nav-btn');
    navButtons.forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';
      btn.setAttribute('data-was-disabled-by-processing', 'true');
    });
    
    // Disable back buttons
    const backButtons = document.querySelectorAll('.remove-btn, .back-btn');
    backButtons.forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';
      btn.setAttribute('data-was-disabled-by-processing', 'true');
    });
  };

  window.enableAllNavigation = function() {
    // Re-enable all navigation tabs that were disabled by processing
    const navButtons = document.querySelectorAll('.nav-btn[data-was-disabled-by-processing="true"]');
    navButtons.forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      btn.removeAttribute('data-was-disabled-by-processing');
    });
    
    // Re-enable back buttons that were disabled by processing
    const backButtons = document.querySelectorAll('.remove-btn[data-was-disabled-by-processing="true"], .back-btn[data-was-disabled-by-processing="true"]');
    backButtons.forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      btn.removeAttribute('data-was-disabled-by-processing');
    });
  };

  // Page refresh/navigation protection during critical operations
  window.protectPageFromRefresh = function() {
    // Set a flag to indicate critical operation is in progress
    window._criticalOperationInProgress = true;
    
    // Add beforeunload event listener to warn user about refresh/navigation
    window.addEventListener('beforeunload', window._beforeUnloadHandler = function(e) {
      if (window._criticalOperationInProgress) {
        const message = t('warningPageRefresh') || 'Order processing in progress. Leaving this page may cause data loss. Are you sure?';
        e.preventDefault();
        e.returnValue = message; // For older browsers
        return message;
      }
    });
  };

  window.allowPageRefresh = function() {
    // Clear the critical operation flag
    window._criticalOperationInProgress = false;
    
    // Remove the beforeunload event listener
    if (window._beforeUnloadHandler) {
      window.removeEventListener('beforeunload', window._beforeUnloadHandler);
      window._beforeUnloadHandler = null;
    }
  };

  // Enhanced navigation control with refresh protection
  window.disableAllNavigationWithRefreshProtection = function() {
    // Disable navigation as before
    window.disableAllNavigation();
    
    // Add refresh protection
    window.protectPageFromRefresh();
  };

  window.enableAllNavigationAndAllowRefresh = function() {
    // Enable navigation as before
    window.enableAllNavigation();
    
    // Remove refresh protection
    window.allowPageRefresh();
  };

  // Mobile-friendly print: overlay in same window (popups blocked on phones / GAS iframe)
  window.cloneElementHtmlForPrint = function(elementOrId) {
    var el = typeof elementOrId === 'string' ? document.getElementById(elementOrId) : elementOrId;
    if (!el) return '';
    var clone = el.cloneNode(true);
    var origFields = el.querySelectorAll('input, select, textarea');
    var cloneFields = clone.querySelectorAll('input, select, textarea');
    for (var i = 0; i < origFields.length; i++) {
      var o = origFields[i];
      var c = cloneFields[i];
      if (!c) continue;
      if (o.tagName === 'SELECT') {
        c.value = o.value;
        Array.prototype.forEach.call(c.options, function(opt) {
          opt.selected = (opt.value === o.value);
        });
      } else if (o.type === 'checkbox' || o.type === 'radio') {
        c.checked = o.checked;
      } else {
        c.setAttribute('value', o.value);
        c.value = o.value;
      }
    }
    return clone.innerHTML;
  };

  window.closePrintReportOverlay = function() {
    var overlay = document.getElementById('printReportOverlay');
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    var style = document.getElementById('printReportStyle');
    if (style && style.parentNode) style.parentNode.removeChild(style);
  };

  window.doPrintReportOverlay = function() {
    if (typeof window.print !== 'function') {
      var msg = (typeof t === 'function' ? t('printFailed') : 'Print is not available on this device.');
      if (typeof showToast === 'function') showToast(msg, 'error');
      else alert(msg);
      return;
    }
    try {
      window.print();
    } catch (e) {
      console.error('Print failed:', e);
      var errMsg = (typeof t === 'function' ? t('printFailed') : 'Print failed.');
      if (typeof showToast === 'function') showToast(errMsg, 'error');
    }
  };

  window.printHtmlReport = function(title, contentHtml, options) {
    options = options || {};
    if (!contentHtml) return;

    window.closePrintReportOverlay();

    var overlayId = 'printReportOverlay';
    var styleId = 'printReportStyle';
    var extraStyles = options.extraStyles || '';
    var printLabel = (typeof t === 'function' ? t('stockPrint') : 'Print');
    var closeLabel = (typeof t === 'function' ? t('cancel') : 'Close');

    var printStyle = document.createElement('style');
    printStyle.id = styleId;
    printStyle.textContent =
      '@media print {' +
      '  body > *:not(#' + overlayId + ') { display: none !important; }' +
      '  #' + overlayId + ' { position: static !important; overflow: visible !important; padding: 0 !important; background: #fff !important; }' +
      '  #' + overlayId + ' .no-print { display: none !important; }' +
      '  @page { size: auto; margin: 10mm; }' +
      '}' +
      '#printReportBody table { width: 100%; border-collapse: collapse; font-size: 13px; }' +
      '#printReportBody th, #printReportBody td { padding: 8px 10px; border: 1px solid #ccc; }' +
      '#printReportBody th { background: #1e293b; color: #fff; font-weight: 600; }' +
      '#printReportBody tr:nth-child(even) { background: #f8fafc; }' +
      '#printReportBody input { border: none; background: transparent; width: auto; text-align: inherit; }' +
      extraStyles;

    var overlay = document.createElement('div');
    overlay.id = overlayId;
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;';

    overlay.innerHTML =
      '<div class="no-print" style="text-align:center;padding:12px 0;margin-bottom:12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1;">' +
      '<button type="button" onclick="window.doPrintReportOverlay()" style="font-size:1rem;padding:12px 24px;background:#059669;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-right:8px;">🖨️ ' + printLabel + '</button>' +
      '<button type="button" onclick="window.closePrintReportOverlay()" style="font-size:1rem;padding:12px 24px;background:#6c757d;color:#fff;border:none;border-radius:8px;cursor:pointer;">✕ ' + closeLabel + '</button>' +
      '</div>' +
      '<div id="printReportBody" style="max-width:100%;margin:0 auto;">' +
      '<h2 style="margin:0 0 16px;font-size:1.25rem;">' + title + '</h2>' +
      contentHtml +
      '</div>';

    document.head.appendChild(printStyle);
    document.body.appendChild(overlay);

    var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      (window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
    if (options.autoPrint !== false && !isMobile) {
      setTimeout(function() { window.doPrintReportOverlay(); }, 350);
    }
  };

  window.isProductActiveClient = function(p) {
    if (!p) return true;
    var v = p.ACTIVE;
    if (v === undefined || v === null || v === '') v = p.active;
    if (v === undefined || v === null || v === '') v = 'Y';
    v = v.toString().trim().toUpperCase();
    return v !== 'N' && v !== 'NO' && v !== 'FALSE' && v !== '0';
  };

  window.filterActiveProductsClient = function(list) {
    if (!list || !Array.isArray(list)) return [];
    return list.filter(window.isProductActiveClient);
  };

  window.invalidateProductCaches = function(options) {
    options = options || {};
    if (typeof window.clearSellProductsCache === 'function') {
      window.clearSellProductsCache();
    } else if (window.sellProductsCache) {
      window.sellProductsCache = { data: null, timestamp: 0, ttl: 5 * 60 * 1000 };
    }
    if (window.AppCache && typeof window.AppCache.invalidate === 'function') {
      window.AppCache.invalidate('products');
    }
    if (options.clearTabState !== false && typeof clearTabState === 'function') {
      clearTabState('orders');
      clearTabState('purchasing');
      clearTabState('purchasingLocal');
    }
    if (options.refetchOrders && typeof currentTab !== 'undefined' && currentTab === 'orders' && typeof fetchProducts === 'function') {
      fetchProducts();
    }
  };
</script>
