  function removeFromCart(name, category, productCodeHint) {
    // Prevent rapid successive calls
    if (window._removingFromCart) {
      return;
    }
    window._removingFromCart = true;

    var product = products.find(function(p) { return p.NAME === name && p.CATEGORY === category; });
    var baseConfig = getConfiguratorBaseConfig(product || null, productCodeHint);
    if (baseConfig && removeOneFromConfiguratorBase_(baseConfig.productCode)) {
      recalculateVanillaFlavor();
      window.dispatchEvent(new CustomEvent('cartUpdated', {
        detail: { cart: cart, action: 'remove', item: name }
      }));
      renderSummary();
      refreshProductGrid();
      if (currentCategory === 'MISC' && typeof updateCustomItemsPreview === 'function') {
        updateCustomItemsPreview();
      }
      updateOrdersTabState();
      setTimeout(function() { window._removingFromCart = false; }, 300);
      return;
    }

    // Block manual modification of auto-managed vanilla flavor (match by isAutoVanilla flag)
    var _removeItem = cart.find(function(item) { return item.name === name && item.category === category; });
    if (_removeItem && _removeItem.isAutoVanilla) {
      window._removingFromCart = false;
      return;
    }

    // Try to find leftover item first, then regular item
    let idx = cart.findIndex(item => 
      item.name === name && 
      item.category === category && 
      item.isLeftover === true
    );
    
    if (idx < 0) {
      // No leftover item found, look for regular item
      idx = cart.findIndex(item => 
        item.name === name && 
        item.category === category && 
        !item.isLeftover
      );
    }
    
    if (idx >= 0) {
      if (cart[idx].qty > 1) {
        cart[idx].qty -= 1;
      } else {
        cart.splice(idx, 1);
      }
      
      // Recalculate auto vanilla flavor
      recalculateVanillaFlavor();

      // Fire cart update event
      window.dispatchEvent(new CustomEvent('cartUpdated', { 
        detail: { cart: cart, action: 'remove', item: name } 
      }));
      
      renderSummary();
      refreshProductGrid();
      
      // Update custom items preview if we're on MISC category
      if (currentCategory === 'MISC' && typeof updateCustomItemsPreview === 'function') {
        updateCustomItemsPreview();
      }
      
      // Update state immediately
      updateOrdersTabState();
    }
    
    // Reset the flag after a short delay
    setTimeout(() => {
      window._removingFromCart = false;
    }, 300);
  }

  // Cash drawer: ESC p m t1 t2 — m=0 pin 2, m=1 pin 5 (RJ11 wiring varies by drawer).
  // Per-outlet setting: Admin → Printers, or localStorage outletDrawerPin_<outlet>.
  function getDrawerPinMode_() {
    var outlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    if (outlet) {
      var perOutlet = localStorage.getItem('outletDrawerPin_' + outlet);
      if (perOutlet) return perOutlet.toLowerCase();
    }
    if (window._outletDrawerPin) return String(window._outletDrawerPin).toLowerCase();
    return (localStorage.getItem('snowbeeDrawerPin') || 'both').toLowerCase();
  }

  // openCashDrawer on order is set at checkout from PaymentMethod sheet "Open Drawer" column.
  function shouldOpenCashDrawer(order) {
    if (!order) return false;
    var total = Number(order.total) || 0;
    if (total <= 0) return false;
    if (order.openCashDrawer === true) return true;
    if (order.openCashDrawer === false) return false;
    if (typeof window.resolveOrderOpenCashDrawer === 'function') {
      return window.resolveOrderOpenCashDrawer(order);
    }
    return false;
  }

  function appendCashDrawerKick(r, E) {
    var pinMode = getDrawerPinMode_();
    var pins = pinMode === '0' ? [0] : pinMode === '1' ? [1] : [0, 1];
    // 0x32 / 0xFF → ~100 ms pulse (many solenoid drawers need longer than 50 ms)
    for (var p = 0; p < pins.length; p++) {
      r.push(E + 'p' + String.fromCharCode(pins[p]) + '\x32\xFF');
    }
  }

  function buildCashDrawerKickEscPos_() {
    var E = '\x1b';
    var parts = [];
    appendCashDrawerKick(parts, E);
    return parts.join('');
  }

  function resolveOutletPrinterName_() {
    var outlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    var printerName = window._outletPrinterName || localStorage.getItem('outletPrinter_' + outlet) || '';
    if (printerName) return printerName;
    if (window.AndroidPrint && typeof window.AndroidPrint.getPairedPrinters === 'function') {
      try {
        var paired = JSON.parse(window.AndroidPrint.getPairedPrinters());
        if (paired.length === 1) return paired[0];
      } catch (e) { /* ignore */ }
    }
    return '';
  }

  function escPosToBase64_(escData) {
    var bytes = [];
    for (var i = 0; i < escData.length; i++) { bytes.push(escData.charCodeAt(i) & 0xFF); }
    return btoa(String.fromCharCode.apply(null, bytes));
  }

  /** Send drawer kick on cash payment — independent of auto-print / receipt. */
  function kickCashDrawerIfNeeded(order) {
    if (!shouldOpenCashDrawer(order)) return false;
    if (localStorage.getItem('snowbeeAutoKickDrawer') === '0') return false;
    if (!window.AndroidPrint || typeof window.AndroidPrint.isAvailable !== 'function' || !window.AndroidPrint.isAvailable()) {
      console.warn('Cash drawer: AndroidPrint bridge not available');
      return false;
    }
    if (typeof window.AndroidPrint.printEscPos !== 'function') return false;

    var printerName = resolveOutletPrinterName_();
    if (!printerName) {
      console.warn('Cash drawer: no Bluetooth printer configured');
      return false;
    }

    try {
      var base64 = escPosToBase64_(buildCashDrawerKickEscPos_());
      var result = window.AndroidPrint.printEscPos(printerName, base64);
      if (result === 'ok') {
        console.log('Cash drawer kick sent to ' + printerName);
        return true;
      }
      console.warn('Cash drawer kick failed:', result);
    } catch (e) {
      console.warn('Cash drawer kick error:', e);
    }
    return false;
  }

  window.kickCashDrawerIfNeeded = kickCashDrawerIfNeeded;
  window.shouldOpenCashDrawer = shouldOpenCashDrawer;

  // Manual cash drawer open (single-use PIN; admin activates 5-min window)

  function refreshDrawerUnlockStatus_() {
    if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) {
      return Promise.resolve({ pinWindowActive: false, pendingForYou: false });
    }
    var outlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    return SecurityWrapper.secureServerCall('getDrawerUnlockStatusSecure', { outlet: outlet })
      .then(function(res) { return res || {}; })
      .catch(function() { return {}; });
  }

    var submit = function() {
      var pin = (inp && inp.value || '').trim();
      close();
      if (pin && typeof onSubmit === 'function') onSubmit(pin);
    };
    document.getElementById('drawerPinModalOk').onclick = submit;
    if (inp) {
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      });
      setTimeout(function() { inp.focus(); }, 80);
    }
  }

  function generateDrawerOpenEscPos_() {
    var E = '\x1b', G = '\x1d';
    var now = new Date();
    var ds = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0') + '/' + now.getFullYear();
    var ts = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    var user = (window.LoginState && window.LoginState.username) || '';
    function ascii(s) { return String(s).replace(/[^\x20-\x7E]/g, ''); }
    var r = [];
    r.push(E + '@');
    r.push(E + 'a\x01');
    r.push(E + 'E\x01');
    r.push('CASH DRAWER OPEN\n');
    r.push(E + 'E\x00');
    r.push(ds + ' ' + ts + '\n');
    r.push('By: ' + ascii(user) + '\n');
    r.push('--------------------------------\n');
    r.push(E + 'a\x01');
    r.push('MANUAL OPEN\n');
    r.push('\n\n');
    appendCashDrawerKick(r, E);
    r.push('\n\n\n');
    r.push(G + 'V\x00');
    return r.join('');
  }

  function executeCashDrawerOpen_() {
    if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) {
      if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('securityUnavailable') : 'Security system not available.');
      return;
    }
    var outlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
    SecurityWrapper.secureServerCall('authorizeCashDrawerOpenSecure', { outlet: outlet })
      .then(function(auth) {
        if (!auth || !auth.success) {
          if (window.showErrorModal) window.showErrorModal((auth && auth.error) || (typeof t === 'function' ? t('drawerPinUnauthorized') : 'Not authorized.'));
          return;
        }

        var printerName = resolveOutletPrinterName_();
        var printResult = 'no_printer';
        if (printerName && window.AndroidPrint && typeof window.AndroidPrint.isAvailable === 'function' && window.AndroidPrint.isAvailable() &&
            typeof window.AndroidPrint.printEscPos === 'function') {
          try {
            var base64 = escPosToBase64_(generateDrawerOpenEscPos_());
            var result = window.AndroidPrint.printEscPos(printerName, base64);
            printResult = result === 'ok' ? 'ok' : String(result || 'failed');
          } catch (e) {
            printResult = 'error:' + (e.message || e);
          }
        } else if (!printerName) {
          if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('drawerNoPrinter') : 'No Bluetooth printer configured.');
        }

        SecurityWrapper.secureServerCall('logCashDrawerOpenSecure', {
          outlet: outlet,
          printerName: printerName,
          result: printResult,
          clientAt: new Date().toISOString()
        }).catch(function() { /* audit best-effort */ });
      })
      .catch(function(err) {
        if (window.showErrorModal) window.showErrorModal(err && err.message ? err.message : (typeof t === 'function' ? t('drawerPinUnauthorized') : 'Not authorized.'));
      });
  }

  function promptCashDrawerOpen() {
    refreshDrawerUnlockStatus_().then(function(status) {
      if (!status.pinConfigured) {
        if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('drawerPinNotConfigured') : 'Drawer PIN is not configured. Ask admin.');
        return;
      }
      if (status.pendingOpen && !status.pendingForYou) {
        if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('drawerPinPendingOther') : 'Drawer open already in progress at this outlet.');
        return;
      }
      if (status.pendingForYou) {
        executeCashDrawerOpen_();
        return;
      }
      if (!status.pinWindowActive) {
        if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('drawerPinNotActive') : 'Drawer PIN is not active. Ask admin to activate it.');
        return;
      }
      showDrawerPinModal_(function(pin) {
        if (!/^\d{4,8}$/.test(pin)) {
          if (window.showErrorModal) window.showErrorModal(typeof t === 'function' ? t('drawerPinInvalid') : 'Invalid PIN format.');
          return;
        }
        var outlet = (window.LoginState && window.LoginState.outlet) || window.currentOutlet || '';
        SecurityWrapper.secureServerCall('validateDrawerUnlockPinSecure', { outlet: outlet, pin: pin })
          .then(function(res) {
            if (res && res.success) {
              executeCashDrawerOpen_();
            } else if (window.showErrorModal) {
              window.showErrorModal((res && res.error) || (typeof t === 'function' ? t('drawerPinWrong') : 'Invalid PIN.'));
            }
          })
          .catch(function(err) {
            if (window.showErrorModal) window.showErrorModal(err && err.message ? err.message : (typeof t === 'function' ? t('drawerPinWrong') : 'Invalid PIN.'));
          });
      });
    });
  }

  // ============================================================
  // ESC/POS Receipt Generator (for thermal printers via Android bridge)
  // ============================================================
  function generateEscPos(order) {
    var bon = (order.orderNumber || 'N/A').replace(/-\d{3}$/, '');
    var now = new Date();
    // ASCII-safe date/time (no Unicode from toLocaleString)
    var ds = String(now.getDate()).padStart(2,'0') + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear();
    var ts = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    var cp = lang === 'id' ? 'Rp ' : 'IDR ';
    var E = '\x1b', G = '\x1d';

    // ASCII-safe number formatter (dots as thousands separator)
    function fmtNum(n) { var s = String(Math.round(n)); return s.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
    // Strip any non-ASCII characters to protect ESC/POS stream
    function ascii(s) { return String(s).replace(/[^\x20-\x7E]/g, ''); }

    function padR(s, l) { s = String(s); while (s.length < l) s += ' '; return s.substring(0, l); }
    function padL(s, l) { s = String(s); while (s.length < l) s = ' ' + s; return s.substring(s.length - l); }

    var r = [];
    r.push(E + '@');                     // Init
    r.push(E + 'a\x01');                 // Center
    r.push(E + 'E\x01');                 // Bold on
    r.push('POS RECEIPT\n');
    r.push(E + 'E\x00');                 // Bold off
    r.push('Base Order: ' + bon + '\n');
    r.push(ds + ' ' + ts + '\n');
    r.push(E + 'a\x00');                 // Left align
    r.push('--------------------------------\n');

    for (var i = 0; i < order.items.length; i++) {
      var it = order.items[i];
      var nm = ascii(it.name.length > 16 ? it.name.substring(0, 13) + '...' : it.name);
      var qs = it.qty + 'x';
      var ps = fmtNum(it.price * it.qty);
      var inum = String(i + 1).padStart(3, '0');
      r.push(padR(nm, 16) + padR(qs, 4) + padL(ps, 12) + '\n');
      r.push('  #' + bon + '-' + inum + '\n');
    }

    r.push('--------------------------------\n');
    r.push(E + 'E\x01');
    r.push(padR('TOTAL', 20) + padL(cp + fmtNum(order.total), 12) + '\n');
    r.push(E + 'E\x00');

    if (order.payment && order.payment.toLowerCase() === 'cash' && order.cashTendered) {
      r.push(padR('Payment:', 20) + padL('CASH', 12) + '\n');
      r.push(padR('Paid:', 20) + padL(cp + fmtNum(order.cashTendered), 12) + '\n');
      r.push(E + 'E\x01');
      r.push(padR('Change:', 20) + padL(cp + fmtNum(order.changeAmount), 12) + '\n');
      r.push(E + 'E\x00');
    } else if (order.paymentDetails && (order.paymentDetails.cash || order.paymentDetails.dana || order.paymentDetails.nonCash)) {
      r.push(padR('Payment:', 20) + padL('PARTIAL', 12) + '\n');
      r.push(padR('  Dana:', 20) + padL(cp + fmtNum(order.paymentDetails.dana || 0), 12) + '\n');
      r.push(padR('  Cash:', 20) + padL(cp + fmtNum(order.paymentDetails.cash || 0), 12) + '\n');
      if (order.cashTendered) {
        r.push(padR('Paid:', 20) + padL(cp + fmtNum(order.cashTendered), 12) + '\n');
        r.push(E + 'E\x01');
        r.push(padR('Change:', 20) + padL(cp + fmtNum(order.changeAmount), 12) + '\n');
        r.push(E + 'E\x00');
      }
    } else if (order.payment) {
      r.push(padR('Payment:', 20) + padL(order.payment.toUpperCase(), 12) + '\n');
    }

    r.push('--------------------------------\n');
    r.push(E + 'a\x01');
    r.push('Thank you!\n');
    r.push('Please come again\n');
    r.push('\n\n\n');
    r.push(G + 'V\x00');   // Cut paper
    return r.join('');
  }

  // ============================================================
  // Smart Print — uses Android native bridge if available,
  // otherwise falls back to browser window.print()
  // ============================================================
  function smartPrintReceipt() {
    var order = window._lastReceiptOrder;
    if (!order) { console.warn('No receipt to print'); return; }

    var statusEl = document.getElementById('printStatus');
    var btn = document.getElementById('printReceiptBtn');

    function showStatus(msg, type) {
      if (!statusEl) return;
      statusEl.style.display = 'block';
      statusEl.style.background = type === 'error' ? '#f8d7da' : type === 'success' ? '#d4edda' : '#cce5ff';
      statusEl.style.color = type === 'error' ? '#721c24' : type === 'success' ? '#155724' : '#004085';
      statusEl.textContent = msg;
      if (type === 'success') setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
    }

    // Check for Android native bridge
    if (window.AndroidPrint && typeof window.AndroidPrint.isAvailable === 'function' && window.AndroidPrint.isAvailable()) {
      var printerName = resolveOutletPrinterName_();

      if (!printerName) {
        // No configured printer — try to auto-detect from paired list
        try {
          var paired = JSON.parse(window.AndroidPrint.getPairedPrinters());
          if (paired.length === 1) {
            printerName = paired[0]; // Only one printer paired — use it
          } else if (paired.length > 1) {
            showStatus('Multiple printers paired. Set printer name in Admin → Printers.', 'error');
            return;
          } else {
            showStatus('No Bluetooth printer paired. Pair in Android Settings → Bluetooth.', 'error');
            return;
          }
        } catch (e) {
          showStatus('Could not detect printers: ' + e, 'error');
          return;
        }
      }

      // Disable button, show sending
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Printing...'; }
      showStatus('Sending to ' + printerName + '...', 'info');

      // Generate ESC/POS, Base64-encode it, and send via native Bluetooth
      var escData = generateEscPos(order);
      var base64;
      try {
        base64 = escPosToBase64_(escData);
      } catch (encErr) {
        showStatus('Encoding error: ' + encErr.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '🖨️ ' + (window.t ? t('printReceipt') : 'Print Receipt'); }
        return;
      }
      console.log('ESC/POS length: ' + escData.length + ', Base64 length: ' + base64.length);
      var result = window.AndroidPrint.printEscPos(printerName, base64);

      if (result === 'ok') {
        showStatus('✅ Receipt printed!', 'success');
      } else {
        showStatus(result.replace('error:', ''), 'error');
      }
      if (btn) { btn.disabled = false; btn.textContent = '🖨️ ' + (window.t ? t('printReceipt') : 'Print Receipt'); }
      return;
    }

    // Fallback: browser print dialog (works with RawBT on Android too)
    printReceiptInline();
  }
  window.smartPrintReceipt = smartPrintReceipt;

    const loadingOverlay = document.querySelector('.loading-overlay');

      loadingOverlay.remove();

    const smartLoading = document.querySelector('.smart-loading');
    if (smartLoading) {

    }
    
    // Clear progress intervals
    if (window._currentProgressInterval) {
      clearInterval(window._currentProgressInterval);

      issues.push('Fixed: Cleared progress interval');
      fixed++;
    }
    
    // Reset blocking states

  // Function to handle removing items from cart summary with button protection
  function removeFromCartSummary(button) {
    const name = button.dataset.productName;
    const category = button.dataset.productCategory || '';

    // Block manual modification of auto-managed vanilla flavor (match by isAutoVanilla flag)
    var _summaryItem = cart.find(function(item) { return item.name === name && item.category === category; });
    if (_summaryItem && _summaryItem.isAutoVanilla) {
      return;
    }

    // Prevent rapid successive calls
    if (window._removingFromCart) {
      return;
    }
    window._removingFromCart = true;
    
    // Temporarily disable the button
    button.disabled = true;
    button.style.opacity = '0.6';
    
    const idx = cart.findIndex(item => item.name === name && item.category === category);
    if (idx >= 0) {
      if (cart[idx].qty > 1) {
        cart[idx].qty -= 1;
      } else {
        cart.splice(idx, 1);
      }
      
      // Recalculate auto vanilla flavor
      recalculateVanillaFlavor();

      // Fire cart update event
      window.dispatchEvent(new CustomEvent('cartUpdated', { 
        detail: { cart: cart, action: 'remove', item: name } 
      }));
      
      renderSummary();
      refreshProductGrid();
      
      // Update state immediately
      updateOrdersTabState();
    }
    
    // Re-enable button after a short delay
    setTimeout(() => {
      button.disabled = false;
      button.style.opacity = '1';
    }, 300);
    
    // Reset the flag after a short delay
    setTimeout(() => {
      window._removingFromCart = false;
    }, 300);
  }

  // Global function to verify and fix navigation state - for debugging and emergency fixes
  window.verifyAndFixNavigationState = function() {
    console.log('=== NAVIGATION STATE VERIFICATION ===');
    
    const issues = [];
    const fixes = [];
    
    // Check app content visibility
    const appContent = document.getElementById('appContent');
    if (!appContent) {
      issues.push('App content element not found');
    } else if (appContent.style.display === 'none') {
      issues.push('App content is hidden');
      appContent.style.display = 'block';
      fixes.push('Restored app content visibility');
    } else {
      console.log('✓ App content is visible');
    }
    
    // Check navigation bar visibility
    const navBar = document.getElementById('navBar');
    if (!navBar) {
      issues.push('Navigation bar not found');
    } else if (navBar.style.display === 'none' || navBar.style.display === '') {
      issues.push('Navigation bar is hidden');
      navBar.style.display = 'flex';
      fixes.push('Restored navigation bar visibility');
    } else {
      console.log('✓ Navigation bar is visible');
    }
    
    // Check active tab state
    const allTabs = document.querySelectorAll('.nav-btn');
    const activeTabs = document.querySelectorAll('.nav-btn.active');
    
    console.log(`Found ${allTabs.length} navigation tabs, ${activeTabs.length} active`);
    
    if (activeTabs.length === 0) {
      issues.push('No active navigation tab found');
      const ordersTab = getElem('ordersTab');
      if (ordersTab) {
        ordersTab.classList.add('active');
        fixes.push('Activated orders tab');
      }
    } else if (activeTabs.length > 1) {
      issues.push(`Multiple active tabs found (${activeTabs.length})`);
      // Deactivate all except orders
      allTabs.forEach(tab => tab.classList.remove('active'));
      const ordersTab = getElem('ordersTab');
      if (ordersTab) {
        ordersTab.classList.add('active');
        fixes.push('Fixed multiple active tabs, activated orders tab');
      }
    } else {
      console.log('✓ Exactly one active tab found');
    }
    
    // Check for loading overlays that might be stuck
    const loadingOverlay = document.querySelector('.loading-overlay');
    if (loadingOverlay) {
      issues.push('Loading overlay still present');
      loadingOverlay.remove();
      fixes.push('Removed stuck loading overlay');
    }
    
    const smartLoading = document.querySelector('.smart-loading');
    if (smartLoading) {
      issues.push('Smart loading indicator still present');
      smartLoading.remove();
      fixes.push('Removed stuck smart loading indicator');
    }
    
    // Check main content
    const main = getElem('main');
    if (!main) {
      issues.push('Main content area not found');
    } else if (!main.innerHTML || main.innerHTML.trim() === '') {
      issues.push('Main content area is empty');
      if (typeof renderAppUI === 'function') {
        renderAppUI();
        fixes.push('Triggered renderAppUI to populate main content');
      }
    } else {
      console.log('✓ Main content area has content');
    }
    
    // Check for global function availability
    const criticalFunctions = ['startNewOrder', 'switchTab', 'renderAppUI', 'fetchProducts'];
    criticalFunctions.forEach(funcName => {
      if (typeof window[funcName] !== 'function') {
        issues.push(`Critical function ${funcName} not available`);
      } else {
        console.log(`✓ Function ${funcName} is available`);
      }
    });
    
    // Report results
    console.log('=== VERIFICATION COMPLETE ===');
    if (issues.length === 0) {
      console.log('✅ No navigation issues found');
    } else {
      console.log('⚠️ Issues found:', issues);
    }
    
    if (fixes.length > 0) {
      console.log('🔧 Fixes applied:', fixes);
    }
    
    return {
      issues: issues,
      fixes: fixes,
      isHealthy: issues.length === 0
    };
  };

  document.addEventListener('keydown', function(e) {
    if (!window.LoginState || !window.LoginState.isLoggedIn) return;
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') {
      if (e.key !== 'F2' && e.key !== 'F4' && e.key !== 'F5' && e.key !== 'F6') return;
    }
    if (e.key === 'F2') {
      e.preventDefault();
      if (typeof switchTab === 'function') switchTab('orders');
      setTimeout(function() { window.focusOrderSearch(); }, 200);
    } else if (e.key === 'F4' && cart && cart.length > 0) {
      e.preventDefault();
      if (typeof proceedToCheckout === 'function') proceedToCheckout();
    } else if (e.key === 'F5') {
      e.preventDefault();
      if (typeof startNewOrder === 'function') startNewOrder();
    } else if (e.key === 'F6') {
      e.preventDefault();
      if (typeof parkCurrentOrder === 'function') parkCurrentOrder();
    }
  });
