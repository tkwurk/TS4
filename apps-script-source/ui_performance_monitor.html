<!DOCTYPE html>
<html>
<head>
    <title>Performance Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .perf-box {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #4285f4;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-name {
            font-weight: bold;
        }
        .metric-value {
            color: #666;
        }
        .fast { color: #4caf50; }
        .medium { color: #ff9800; }
        .slow { color: #f44336; }
        .cache-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .cache-item {
            background: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #3367d6; }
        .clear-btn { background: #f44336; }
        .clear-btn:hover { background: #d32f2f; }
        .refresh-btn { background: #4caf50; }
        .refresh-btn:hover { background: #388e3c; }
    </style>
</head>
<body>
    <h1>🚀 Performance Monitor</h1>
    
    <div class="perf-box">
        <h3>Cache Statistics</h3>
        <div class="cache-stats" id="cacheStats">
            <!-- Cache stats will be populated here -->
        </div>
        <div style="margin-top: 15px;">
            <button class="refresh-btn" onclick="refreshStats()">🔄 Refresh</button>
            <button class="clear-btn" onclick="clearCache()">🗑️ Clear Cache</button>
            <button onclick="preloadData()">⚡ Preload Data</button>
        </div>
    </div>
    
    <div class="perf-box">
        <h3>Performance Metrics</h3>
        <div id="performanceMetrics">
            <!-- Performance metrics will be populated here -->
        </div>
    </div>
    
    <div class="perf-box">
        <h3>Server Call Statistics</h3>
        <div id="serverStats">
            <!-- Server call stats will be populated here -->
        </div>
    </div>
    
    <div class="perf-box">
        <h3>Performance Actions</h3>
        <button onclick="runPerformanceTest()">🧪 Run Performance Test</button>
        <button onclick="analyzeBottlenecks()">🔍 Analyze Bottlenecks</button>
        <button onclick="exportMetrics()">📊 Export Metrics</button>
    </div>
    
    <div class="perf-box">
        <h3>Real-time Monitoring</h3>
        <div id="realTimeStats">
            <p>Monitoring active server calls and cache performance...</p>
        </div>
    </div>

    <script>
        // Performance monitor functions
        function refreshStats() {
            updateCacheStats();
            updatePerformanceMetrics();
            updateServerStats();
        }
        
        function updateCacheStats() {
            const cacheStats = document.getElementById('cacheStats');
            let html = '';
            
            if (window.AppCache && window.AppCache.data) {
                const cacheData = window.AppCache.data;
                const timestamps = window.AppCache.timestamps;
                const ttls = window.AppCache.TTL;
                
                for (const key in cacheData) {
                    const age = Date.now() - (timestamps[key] || 0);
                    const ttl = ttls[key] || 300000; // 5 min default
                    const agePercent = Math.min((age / ttl) * 100, 100);
                    
                    let status = 'fast';
                    if (agePercent > 80) status = 'slow';
                    else if (agePercent > 50) status = 'medium';
                    
                    html += `
                        <div class="cache-item">
                            <div class="metric">
                                <span class="metric-name">${key}</span>
                                <span class="metric-value ${status}">${Math.round(age/1000)}s ago</span>
                            </div>
                            <div style="background: #eee; height: 4px; border-radius: 2px; margin-top: 5px;">
                                <div style="background: ${status === 'fast' ? '#4caf50' : status === 'medium' ? '#ff9800' : '#f44336'}; height: 100%; width: ${agePercent}%; border-radius: 2px;"></div>
                            </div>
                        </div>
                    `;
                }
                
                if (html === '') {
                    html = '<div class="cache-item">No cached data</div>';
                }
            } else {
                html = '<div class="cache-item">Cache system not available</div>';
            }
            
            cacheStats.innerHTML = html;
        }
        
        function updatePerformanceMetrics() {
            const metricsDiv = document.getElementById('performanceMetrics');
            let html = '';
            
            if (window.PerformanceMonitor && window.PerformanceMonitor.metrics) {
                const metrics = window.PerformanceMonitor.getMetrics();
                
                for (const name in metrics) {
                    const metric = metrics[name];
                    if (metric.duration) {
                        const duration = metric.duration;
                        let status = 'fast';
                        if (duration > 2000) status = 'slow';
                        else if (duration > 1000) status = 'medium';
                        
                        html += `
                            <div class="metric">
                                <span class="metric-name">${name}</span>
                                <span class="metric-value ${status}">${duration}ms</span>
                            </div>
                        `;
                    }
                }
                
                if (html === '') {
                    html = '<div class="metric">No performance data yet</div>';
                }
            } else {
                html = '<div class="metric">Performance monitoring not available</div>';
            }
            
            metricsDiv.innerHTML = html;
        }
        
        function updateServerStats() {
            // This would track server call frequency and timing
            const serverStats = document.getElementById('serverStats');
            serverStats.innerHTML = '<div class="metric">Server statistics will be available after app usage</div>';
        }
        
        function clearCache() {
            if (window.AppCache) {
                window.AppCache.clear();
                alert('Cache cleared successfully!');
                refreshStats();
            } else {
                alert('Cache system not available');
            }
        }
        
        function preloadData() {
            if (window.preloadCommonData) {
                window.preloadCommonData();
                alert('Data preloading initiated!');
                setTimeout(refreshStats, 2000);
            } else {
                alert('Preload function not available');
            }
        }
        
        function runPerformanceTest() {
            alert('Running performance test...');
            
            // Test cache performance
            const testStart = Date.now();
            
            if (window.AppCache) {
                // Set test data
                window.AppCache.set('test_item', 'test_data');
                
                // Get test data
                const retrieved = window.AppCache.get('test_item');
                
                // Clean up
                window.AppCache.invalidate('test_item');
                
                const testDuration = Date.now() - testStart;
                alert(`Cache test completed in ${testDuration}ms`);
            }
        }
        
        function analyzeBottlenecks() {
            let analysis = 'Performance Analysis:\\n\\n';
            
            if (window.PerformanceMonitor && window.PerformanceMonitor.metrics) {
                const metrics = window.PerformanceMonitor.getMetrics();
                const slowOperations = [];
                
                for (const name in metrics) {
                    const metric = metrics[name];
                    if (metric.duration && metric.duration > 1000) {
                        slowOperations.push(`${name}: ${metric.duration}ms`);
                    }
                }
                
                if (slowOperations.length > 0) {
                    analysis += 'Slow operations detected:\\n' + slowOperations.join('\\n');
                } else {
                    analysis += 'No performance bottlenecks detected.';
                }
            } else {
                analysis += 'No performance data available for analysis.';
            }
            
            alert(analysis);
        }
        
        function exportMetrics() {
            const metrics = {
                cache: window.AppCache ? {
                    data: Object.keys(window.AppCache.data),
                    timestamps: window.AppCache.timestamps,
                    ttls: window.AppCache.TTL
                } : null,
                performance: window.PerformanceMonitor ? window.PerformanceMonitor.getMetrics() : null,
                timestamp: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(metrics, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'performance_metrics_' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Auto-refresh every 5 seconds
        setInterval(refreshStats, 5000);
        
        // Initial load
        document.addEventListener('DOMContentLoaded', function() {
            refreshStats();
        });
    </script>
</body>
</html>
