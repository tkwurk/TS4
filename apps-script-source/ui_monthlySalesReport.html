let monthlySalesData = []; // Holds the current report data
let filteredSalesData = []; // Holds the filtered data
let currentSort = { column: 'date', direction: 'desc' }; // Initial sort state
let currentReportDate = new Date(); // To track the currently viewed month
let monthSummaryData = {}; // To store the overall summary
let filteredSummaryData = {}; // To store filtered summary
let dateFilter = { startDate: null, endDate: null, isActive: false }; // Date filter state
let openingCashInHand = 0; // Cash in hand carried over from before this month

 */

  // 1. Set up the basic HTML structure for the report
  main.innerHTML = `
    <div class="report-container">

          <button id="filterToggleBtn" class="btn btn-outline-secondary btn-sm topbar-btn" onclick="toggleCompactFilter()">📅 Filter</button>

      <!-- Compact filter panel (hidden by default, shown after data loads) -->

          <button class="preset-chip" onclick="applyDatePreset('firstWeek')">W1</button>
          <button class="preset-chip" onclick="applyDatePreset('secondWeek')">W2</button>
          <button class="preset-chip" onclick="applyDatePreset('thirdWeek')">W3</button>
          <button class="preset-chip" onclick="applyDatePreset('fourthWeek')">W4</button>
          <button class="preset-chip" onclick="applyDatePreset('lastWeek')">Last Wk</button>
          <button class="preset-chip" onclick="applyDatePreset('firstHalf')">1st Half</button>
          <button class="preset-chip" onclick="applyDatePreset('secondHalf')">2nd Half</button>

        <button id="retryReportBtn" class="btn btn-primary mt-2" style="display: none;">Retry Loading Report</button>

      <div id="monthlySalesNoData" class="no-data-container" style="display: none;">

              </div>
              <div class="summary-card warning">
                <h5 data-translate="cash_purchases">Cash Purchases*</h5>
                <div class="summary-value" id="summaryCashPurchases">Rp 0</div>
              </div>

  `;

  // Add event listeners for navigation and sorting
  document.getElementById('prevMonthBtn').addEventListener('click', () => {
    currentReportDate.setMonth(currentReportDate.getMonth() - 1);
    loadSalesReportForDate(currentReportDate);
  });

  document.getElementById('nextMonthBtn').addEventListener('click', () => {
    currentReportDate.setMonth(currentReportDate.getMonth() + 1);
    loadSalesReportForDate(currentReportDate);
  });

  document.querySelectorAll('#monthlySalesTableContainer th.sortable').forEach(header => {
    header.addEventListener('click', () => {
      const column = header.getAttribute('data-sort');
      sortSalesTable(column);
    });
  });

  // Add debug button event listener
  document.getElementById('debugReportBtn').addEventListener('click', () => {
    testMonthlySalesConnection();
  });

/**
 * Test function to diagnose monthly sales report connection issues
 */
function testMonthlySalesConnection() {
  console.log('=== MONTHLY SALES REPORT DEBUG TEST ===');
  
  const debugInfo = {
    googleScriptAvailable: !!(window.google && window.google.script && window.google.script.run),
    loginState: window.LoginState,
    currentUser: window.currentUser,
    getDeviceIdFunction: !!(window.getDeviceId),
    currentDate: new Date().toISOString(),
    currentReportDate: currentReportDate.toISOString()
  };
  
  console.log('Debug Info:', debugInfo);
  
  // Try to get device ID and username
  const deviceId = window.LoginState?.deviceId || null;
  const username = window.LoginState?.currentusername || window.LoginState?.user || window.currentUser;
  
  console.log('Attempting to call getMonthlySalesReport with:', {
    year: currentReportDate.getFullYear(),
    month: currentReportDate.getMonth() + 1,
    deviceId: deviceId,
    username: username,
    fullLoginState: window.LoginState
  });
  
  // Try to make a test call
  if (window.google && window.google.script && window.google.script.run) {
    google.script.run
      .withSuccessHandler((result) => {
        console.log('TEST SUCCESS: Monthly sales report returned:', result);
        alert('Test successful! Check browser console for details.');
        // Retry the actual load
        loadSalesReportForDate(currentReportDate);
      })
      .withFailureHandler((error) => {
        console.error('TEST FAILED: Monthly sales report error:', error);
        alert('Test failed: ' + (error.message || error));
        
        // Show retry button
        const retryBtn = document.getElementById('retryReportBtn');
        if (retryBtn) {
          retryBtn.style.display = 'inline-block';
        }
      })
      .getMonthlySalesReport(currentReportDate.getFullYear(), currentReportDate.getMonth() + 1, deviceId, username);
  } else {
    alert('Google Apps Script runtime not available. This might be a connection issue.');
  }
}

/**
 * Fetches and displays the sales report for a specific month.
 * @param {Date} date - The date indicating the month and year to load.
 */
function loadSalesReportForDate(date) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1; // Month is 1-based

  // Update UI elements
  const monthDisplay = document.getElementById('currentMonthDisplay');
  const nextMonthBtn = document.getElementById('nextMonthBtn');
  const loadingEl = document.getElementById('monthlySalesLoading');
  const tableContainerEl = document.getElementById('monthlySalesTableContainer');
  const noDataEl = document.getElementById('monthlySalesNoData');
  const errorEl = document.getElementById('monthlySalesError');

  // Check if we're still on the monthly sales report tab
  if (!monthDisplay || !nextMonthBtn || !loadingEl || !tableContainerEl || !noDataEl || !errorEl) {
    console.log('Monthly Sales Report elements not found - user may have switched tabs');
    return;
  }

  // Display month name and year
  monthDisplay.textContent = date.toLocaleString('default', { month: 'long', year: 'numeric' });

  // Disable 'Next' button if viewing the current month or a future month
  const now = new Date();
  nextMonthBtn.disabled = date.getFullYear() >= now.getFullYear() && date.getMonth() >= now.getMonth();

  // Show loading state
  loadingEl.style.display = 'block';
  tableContainerEl.style.display = 'none';
  noDataEl.style.display = 'none';
  errorEl.style.display = 'none';

  console.log(`Fetching report for ${year}-${month}`);
  
  // Get current user and device info
  const deviceId = window.LoginState?.deviceId || null;
  const username = window.LoginState?.currentusername || window.LoginState?.user || window.currentUser;
  
  console.log('Monthly Sales Report - deviceId:', deviceId, 'username:', username);
  console.log('LoginState:', window.LoginState);
  
  google.script.run
    .withSuccessHandler(handleSalesReportSuccess)
    .withFailureHandler(handleSalesReportFailure)
    .getMonthlySalesReport(year, month, deviceId, username);
}

/**
 * Handles the successful response from the server.
 * @param {string} jsonResult - The JSON string returned from the server.
 */
function handleSalesReportSuccess(jsonResult) {
  const loadingEl = document.getElementById('monthlySalesLoading');
  const errorEl = document.getElementById('monthlySalesError');
  const noDataEl = document.getElementById('monthlySalesNoData');
  const tableContainerEl = document.getElementById('monthlySalesTableContainer');
  const summaryContainerEl = document.getElementById('monthSummaryContainer');

  // Check if we're still on the monthly sales report tab
  if (!loadingEl || !errorEl || !noDataEl || !tableContainerEl || !summaryContainerEl) {
    console.log('Monthly Sales Report elements not found - user may have switched tabs');
    return;
  }

  loadingEl.style.display = 'none'; // Hide loading indicator

  try {
    const result = JSON.parse(jsonResult);

    if (!result.success) {
      throw new Error(result.error || "The server returned an error.");
    }

    if (!result.data || result.data.length === 0) {
      noDataEl.style.display = 'block';
      summaryContainerEl.style.display = 'none'; // Hide summary if no data
      return;
    }

    // Data is valid, so let's render it
    tableContainerEl.style.display = 'block';
    summaryContainerEl.style.display = 'block'; // Show summary in sidebar
    document.getElementById('dateFilterContainer').style.display = 'none'; // hidden until filter button pressed
    const expenseNote = document.getElementById('expenseNote');
    if (expenseNote) expenseNote.style.display = 'block';
    monthlySalesData = result.data; // Store data globally
    monthSummaryData = result.summary || {}; // Store summary data
    openingCashInHand = result.openingCashInHand || 0; // Carry-over from previous months

    // Initialize date filter bounds
    initializeDateFilter();

    // Apply current filter if active
    if (dateFilter.isActive) {
      applyCurrentDateFilter();
    } else {
      filteredSalesData = [...monthlySalesData];
      filteredSummaryData = {...monthSummaryData};
    }

    // Populate summary cards
    document.getElementById('summaryCashSales').textContent = formatCurrency(filteredSummaryData.cashSales);
    document.getElementById('summaryOtherSales').textContent = formatCurrency(filteredSummaryData.otherSales);
    document.getElementById('summaryCashExpenses').textContent = formatCurrency(filteredSummaryData.cashExpenses);
    document.getElementById('summaryOtherExpenses').textContent = formatCurrency(filteredSummaryData.otherExpenses);
    document.getElementById('summaryTotalDeposits').textContent = formatCurrency(filteredSummaryData.totalDeposits);
    
    // Fetch total cash in hand separately (across all time)
    const deviceId = window.LoginState?.deviceId || null;
    const username = window.LoginState?.currentusername || window.LoginState?.user || window.currentUser;
    
    console.log('getTotalCashInHand - deviceId:', deviceId, 'username:', username);
    
    google.script.run
      .withSuccessHandler(handleTotalCashInHandSuccess)
      .withFailureHandler(handleTotalCashInHandFailure)
      .getTotalCashInHand(deviceId, username);


    // Initial sort and render - add small delay to ensure DOM is ready
    setTimeout(() => {
      sortSalesTable(currentSort.column, currentSort.direction);
    }, 100);

  } catch (e) {
    console.error("Error processing sales report data:", e);
    handleSalesReportFailure(e);
  }
}

/**
 * Handles the successful response for total cash in hand.
 * @param {string} jsonResult - The JSON string returned from the server.
 */
function handleTotalCashInHandSuccess(jsonResult) {
  try {
    const result = JSON.parse(jsonResult);
    
    if (result.success) {
      const cashInHandEl = document.getElementById('summaryCashInHand');
      
      // Check if we're still on the monthly sales report tab
      if (!cashInHandEl) {
        console.log('Cash In Hand element not found - user may have switched tabs');
        return;
      }
      
      const cashInHandParent = cashInHandEl.parentElement;
      
      cashInHandEl.textContent = formatCurrency(result.totalCashInHand);
      
      if (result.totalCashInHand < 0) {
        cashInHandParent.classList.remove('cash-in-hand');
        cashInHandParent.classList.add('cash-in-hand', 'negative');
      } else {
        cashInHandParent.classList.remove('negative');
      }
      
      console.log('Total Cash In Hand updated:', result.totalCashInHand);
    } else {
      console.error('Error fetching total cash in hand:', result.error);
      // Fallback to monthly cash in hand if total fails
      handleTotalCashInHandFailure(result.error);
    }
  } catch (e) {
    console.error('Error parsing total cash in hand response:', e);
    // Fallback to monthly cash in hand if parsing fails
    handleTotalCashInHandFailure(e);
  }
}

/**
 * Handles failures when fetching total cash in hand.
 * @param {Error} error - The error object.
 */
function handleTotalCashInHandFailure(error) {
  console.error('Failed to fetch total cash in hand, using monthly value as fallback:', error);
  
  // Fallback to monthly cash in hand value
  const cashInHandEl = document.getElementById('summaryCashInHand');
  
  // Check if we're still on the monthly sales report tab
  if (!cashInHandEl) {
    console.log('Cash In Hand element not found - user may have switched tabs');
    return;
  }
  
  const cashInHandParent = cashInHandEl.parentElement;
  
  cashInHandEl.textContent = formatCurrency(monthSummaryData.cashInHand || 0);
  
  if ((monthSummaryData.cashInHand || 0) < 0) {
    cashInHandParent.classList.remove('cash-in-hand');
    cashInHandParent.classList.add('cash-in-hand', 'negative');
  } else {
    cashInHandParent.classList.remove('negative');
  }
}

/**
 * Sorts the sales data and re-renders the table.
 * @param {string} column - The column to sort by ('date', 'totalSales', 'totalOrders').
 * @param {string} [direction] - Optional. The direction to sort ('asc' or 'desc'). Toggles if not provided.
 */
function sortSalesTable(column, direction) {
  // Check if we have data to sort - use filtered data
  if (!filteredSalesData || !Array.isArray(filteredSalesData)) {
    console.warn('sortSalesTable: No filtered data available to sort');
    return;
  }
  
  if (!direction) {
    // If sorting the same column, reverse direction. Otherwise, default to 'desc'.
    currentSort.direction = (currentSort.column === column && currentSort.direction === 'desc') ? 'asc' : 'desc';
  } else {
    currentSort.direction = direction;
  }
  currentSort.column = column;

  // Sort the data - use filtered data
  filteredSalesData.sort((a, b) => {
    let valA, valB;

    if (column === 'date') {
      valA = a.date;
      valB = b.date;
    } else {
      valA = a.dailySummary ? (a.dailySummary[column] || 0) : 0;
      valB = b.dailySummary ? (b.dailySummary[column] || 0) : 0;
    }

    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
    return 0;
  });

  renderSalesTable();
  updateSortIndicators();
}

/**
 * Renders the table with the current data.
 */
function renderSalesTable() {
  // First check if the table container is visible
  const tableContainer = document.getElementById('monthlySalesTableContainer');
  if (!tableContainer || tableContainer.style.display === 'none') {
    console.warn('renderSalesTable: Table container not visible, skipping render');
    return;
  }
  
  const tableBody = document.getElementById('monthlySalesTableBody');
  const tableFoot = document.getElementById('monthlySalesTableFoot');
  
  // Check if required elements exist before proceeding
  if (!tableBody) {
    console.error('renderSalesTable: monthlySalesTableBody element not found');
    return;
  }
  
  if (!tableFoot) {
    console.error('renderSalesTable: monthlySalesTableFoot element not found');
    return;
  }
  
  tableBody.innerHTML = ''; // Clear previous content
  tableFoot.innerHTML = ''; // Clear previous footer

  // Check if filteredSalesData exists and is an array
  if (!filteredSalesData || !Array.isArray(filteredSalesData)) {
    console.error('renderSalesTable: filteredSalesData is not available or not an array');
    return;
  }

  // Pre-compute cumulative cash in hand in chronological order (oldest→newest)
  // regardless of the current display sort order
  const chronological = [...filteredSalesData].sort((a, b) => a.date.localeCompare(b.date));
  let running = openingCashInHand;
  const cumulativeByDate = {};
  chronological.forEach(day => {
    running += (day.dailySummary || {}).cashInHand || 0;
    cumulativeByDate[day.date] = running;
  });

  filteredSalesData.forEach(day => {
    const summary = day.dailySummary || {};
    const row = tableBody.insertRow();

    // Date Cell
    const dateCell = row.insertCell();
    dateCell.textContent = day.displayDate || day.date;

    // Cash Sales Cell
    const cashSalesCell = row.insertCell();
    cashSalesCell.textContent = formatCurrency(summary.cashSales || 0);
    cashSalesCell.style.textAlign = 'right';

    // Other Sales Cell
    const otherSalesCell = row.insertCell();
    otherSalesCell.textContent = formatCurrency(summary.otherSales || 0);
    otherSalesCell.style.textAlign = 'right';

    // Cash Expenses Cell
    const cashExpensesCell = row.insertCell();
    cashExpensesCell.textContent = formatCurrency(summary.cashExpenses || 0);
    cashExpensesCell.style.textAlign = 'right';

    // Other Expenses Cell
    const otherExpensesCell = row.insertCell();
    otherExpensesCell.textContent = formatCurrency(summary.otherExpenses || 0);
    otherExpensesCell.style.textAlign = 'right';

    // Cash Purchases Cell
    const cashPurchasesCell = row.insertCell();
    cashPurchasesCell.textContent = formatCurrency(summary.cashPurchases || 0);
    cashPurchasesCell.style.textAlign = 'right';

    // Total Deposits Cell
    const depositsCell = row.insertCell();
    depositsCell.textContent = formatCurrency(summary.totalDeposits || 0);
    depositsCell.style.textAlign = 'right';

    // Cash In Hand Cell
    const cashInHandCell = row.insertCell();
    const cashInHandValue = summary.cashInHand || 0;
    cashInHandCell.textContent = formatCurrency(cashInHandValue);
    cashInHandCell.style.textAlign = 'right';
    cashInHandCell.style.color = cashInHandValue < 0 ? '#dc3545' : '#28a745';

    // Cumulative Cash In Hand Cell
    const cumulativeVal = cumulativeByDate[day.date] || 0;
    const cumulativeCell = row.insertCell();
    cumulativeCell.textContent = formatCurrency(cumulativeVal);
    cumulativeCell.style.textAlign = 'right';
    cumulativeCell.style.fontWeight = 'bold';
    cumulativeCell.style.color = cumulativeVal < 0 ? '#dc3545' : '#0056b3';
  });

  // Render the totals footer if there is data
  if (filteredSalesData.length > 0) {
    const footerRow = tableFoot.insertRow();
    footerRow.style.fontWeight = 'bold';
    footerRow.style.borderTop = '2px solid #dee2e6';

    const totalLabelCell = footerRow.insertCell();
    totalLabelCell.textContent = dateFilter.isActive ? 'Filtered Total' : 'Total';
    totalLabelCell.setAttribute('data-translate', dateFilter.isActive ? 'filtered_total' : 'total');

    const totalCashSalesCell = footerRow.insertCell();
    totalCashSalesCell.textContent = formatCurrency(filteredSummaryData.cashSales);
    totalCashSalesCell.style.textAlign = 'right';

    const totalOtherSalesCell = footerRow.insertCell();
    totalOtherSalesCell.textContent = formatCurrency(filteredSummaryData.otherSales);
    totalOtherSalesCell.style.textAlign = 'right';

    const totalCashExpensesCell = footerRow.insertCell();
    totalCashExpensesCell.textContent = formatCurrency(filteredSummaryData.cashExpenses);
    totalCashExpensesCell.style.textAlign = 'right';

    const totalOtherExpensesCell = footerRow.insertCell();
    totalOtherExpensesCell.textContent = formatCurrency(filteredSummaryData.otherExpenses);
    totalOtherExpensesCell.style.textAlign = 'right';

    const totalCashPurchasesCell = footerRow.insertCell();
    totalCashPurchasesCell.textContent = formatCurrency(filteredSummaryData.cashPurchases || 0);
    totalCashPurchasesCell.style.textAlign = 'right';

    const totalDepositsCell = footerRow.insertCell();
    totalDepositsCell.textContent = formatCurrency(filteredSummaryData.totalDeposits);
    totalDepositsCell.style.textAlign = 'right';

    const totalCashInHandCell = footerRow.insertCell();
    totalCashInHandCell.textContent = formatCurrency(filteredSummaryData.cashInHand);
    totalCashInHandCell.style.textAlign = 'right';
    totalCashInHandCell.style.color = filteredSummaryData.cashInHand < 0 ? '#dc3545' : '#28a745';

    const totalCumulativeCell = footerRow.insertCell();
    const finalCumulative = chronological.length > 0 ? cumulativeByDate[chronological[chronological.length - 1].date] : openingCashInHand;
    totalCumulativeCell.textContent = formatCurrency(finalCumulative);
    totalCumulativeCell.style.textAlign = 'right';
    totalCumulativeCell.style.fontWeight = 'bold';
    totalCumulativeCell.style.color = finalCumulative < 0 ? '#dc3545' : '#0056b3';
  }
}

/**
 * Updates the sort indicators (arrows) in the table headers.
 */
function updateSortIndicators() {
  document.querySelectorAll('#monthlySalesTableContainer th.sortable').forEach(header => {
    const indicator = header.querySelector('.sort-indicator');
    if (header.getAttribute('data-sort') === currentSort.column) {
      indicator.textContent = currentSort.direction === 'desc' ? ' ▼' : ' ▲';
    } else {
      indicator.textContent = '';
    }
  });
}

/**
 * Handles failures when fetching data from the server.
 * @param {Error} error - The error object.
 */
function handleSalesReportFailure(error) {
  console.error('Monthly Sales Report Error:', error);
  
  const loadingEl = document.getElementById('monthlySalesLoading');
  const errorEl = document.getElementById('monthlySalesError');
  const errorDetailsEl = document.getElementById('monthlySalesErrorDetails');

  // Check if we're still on the monthly sales report tab
  if (!loadingEl || !errorEl || !errorDetailsEl) {
    console.log('Monthly Sales Report elements not found - user may have switched tabs');
    return;
  }

  loadingEl.style.display = 'none';
  errorEl.style.display = 'block';
  
  // More detailed error information
  let errorMessage = 'Unknown error occurred';
  if (typeof error === 'string') {
    errorMessage = error;
  } else if (error && error.message) {
    errorMessage = error.message;
  } else if (error && error.toString) {
    errorMessage = error.toString();
  }
  
  errorDetailsEl.innerHTML = `
    <strong>Error Details:</strong><br>
    ${errorMessage}<br><br>
    <strong>Debug Info:</strong><br>
    - Google Script available: ${!!(window.google && window.google.script && window.google.script.run)}<br>
    - Current user: ${window.LoginState?.currentusername || window.currentUser || 'Not logged in'}<br>
    - Device ID available: ${!!(window.getDeviceId)}<br>
    - Time: ${new Date().toLocaleString()}
  `;
}

/**
 * Initialize date filter with current month bounds
 */
function initializeDateFilter() {
  if (!monthlySalesData || monthlySalesData.length === 0) return;
  
  // Set date input bounds based on available data
  const dates = monthlySalesData.map(day => new Date(day.date)).sort((a, b) => a - b);
  const minDate = dates[0];
  const maxDate = dates[dates.length - 1];
  
  const startInput = document.getElementById('startDateInput');
  const endInput = document.getElementById('endDateInput');
  
  if (startInput && endInput) {
    startInput.min = formatDateForInput(minDate);
    startInput.max = formatDateForInput(maxDate);
    endInput.min = formatDateForInput(minDate);
    endInput.max = formatDateForInput(maxDate);
    
    // Reset to full range if no filter is active
    if (!dateFilter.isActive) {
      startInput.value = '';
      endInput.value = '';
    }
  }
}

/**
 * Toggle compact filter panel open/closed
 */
function toggleCompactFilter() {
  const panel = document.getElementById('dateFilterContainer');
  if (!panel) return;
  const isVisible = panel.style.display !== 'none';
  panel.style.display = isVisible ? 'none' : 'block';
  if (isVisible) {
    // Closing filter panel also clears the filter
    clearDateFilter();
  }
}

/**
 * Toggle date filter on/off (legacy - kept for compatibility)
 */
function toggleDateFilter() {
  toggleCompactFilter();
}

/**
 * Apply date preset (week selections, etc.)
 */
function applyDatePreset(preset) {
  if (!monthlySalesData || monthlySalesData.length === 0) return;
  
  const dates = monthlySalesData.map(day => new Date(day.date)).sort((a, b) => a - b);
  const minDate = dates[0];
  const maxDate = dates[dates.length - 1];
  const year = minDate.getFullYear();
  const month = minDate.getMonth();
  
  let startDate, endDate;
  
  switch (preset) {
    case 'firstWeek':
      startDate = new Date(year, month, 1);
      endDate = new Date(year, month, 7);
      break;
    case 'secondWeek':
      startDate = new Date(year, month, 8);
      endDate = new Date(year, month, 14);
      break;
    case 'thirdWeek':
      startDate = new Date(year, month, 15);
      endDate = new Date(year, month, 21);
      break;
    case 'fourthWeek':
      startDate = new Date(year, month, 22);
      endDate = new Date(year, month, 28);
      break;
    case 'lastWeek':
      // Last 7 days of available data
      const lastSevenDays = 7;
      startDate = new Date(maxDate.getTime() - (lastSevenDays - 1) * 24 * 60 * 60 * 1000);
      endDate = maxDate;
      break;
    case 'firstHalf':
      startDate = new Date(year, month, 1);
      endDate = new Date(year, month, 15);
      break;
    case 'secondHalf':
      startDate = new Date(year, month, 16);
      endDate = maxDate;
      break;
    default:
      return;
  }
  
  // Ensure dates are within available data range
  if (startDate < minDate) startDate = minDate;
  if (endDate > maxDate) endDate = maxDate;
  
  // Update input fields
  const startInput = document.getElementById('startDateInput');
  const endInput = document.getElementById('endDateInput');
  
  if (startInput && endInput) {
    startInput.value = formatDateForInput(startDate);
    endInput.value = formatDateForInput(endDate);
  }
  
  // Apply filter
  dateFilter.startDate = startDate;
  dateFilter.endDate = endDate;
  dateFilter.isActive = true;
  
  applyCurrentDateFilter();
}

/**
 * Update custom date range when inputs change
 */
function updateCustomDateRange() {
  const startInput = document.getElementById('startDateInput');
  const endInput = document.getElementById('endDateInput');
  
  if (!startInput || !endInput) return;
  
  // Update end date minimum to start date
  if (startInput.value) {
    endInput.min = startInput.value;
  }
  
  // Update start date maximum to end date
  if (endInput.value) {
    startInput.max = endInput.value;
  }
}

/**
 * Apply custom date filter
 */
function applyCustomDateFilter() {
  const startInput = document.getElementById('startDateInput');
  const endInput = document.getElementById('endDateInput');
  
  if (!startInput || !endInput) return;
  
  if (!startInput.value || !endInput.value) {
    alert('Please select both start and end dates');
    return;
  }
  
  const startDate = new Date(startInput.value);
  const endDate = new Date(endInput.value);
  
  if (startDate > endDate) {
    alert('Start date must be before or equal to end date');
    return;
  }
  
  dateFilter.startDate = startDate;
  dateFilter.endDate = endDate;
  dateFilter.isActive = true;
  
  applyCurrentDateFilter();
}

/**
 * Apply the current date filter to the data
 */
function applyCurrentDateFilter() {
  if (!dateFilter.isActive || !dateFilter.startDate || !dateFilter.endDate) {
    filteredSalesData = [...monthlySalesData];
    filteredSummaryData = {...monthSummaryData};
    updateFilterStatus();
    renderSalesTable();
    updateSummaryCards();
    return;
  }
  
  // Filter data by date range
  filteredSalesData = monthlySalesData.filter(day => {
    const dayDate = new Date(day.date);
    return dayDate >= dateFilter.startDate && dayDate <= dateFilter.endDate;
  });
  
  // Recalculate summary for filtered data
  filteredSummaryData = calculateFilteredSummary(filteredSalesData);
  
  updateFilterStatus();
  renderSalesTable();
  updateSummaryCards();
  
  console.log(`Date filter applied: ${filteredSalesData.length} of ${monthlySalesData.length} days shown`);
}

/**
 * Calculate summary totals for filtered data
 */
function calculateFilteredSummary(data) {
  const summary = {
    cashSales: 0,
    otherSales: 0,
    cashExpenses: 0,
    otherExpenses: 0,
    cashPurchases: 0,
    otherPurchases: 0,
    totalDeposits: 0,
    cashInHand: 0
  };
  
  data.forEach(day => {
    const dailySummary = day.dailySummary || {};
    summary.cashSales += dailySummary.cashSales || 0;
    summary.otherSales += dailySummary.otherSales || 0;
    summary.cashExpenses += dailySummary.cashExpenses || 0;
    summary.otherExpenses += dailySummary.otherExpenses || 0;
    summary.cashPurchases += dailySummary.cashPurchases || 0;
    summary.otherPurchases += dailySummary.otherPurchases || 0;
    summary.totalDeposits += dailySummary.totalDeposits || 0;
    summary.cashInHand += dailySummary.cashInHand || 0;
  });
  
  return summary;
}

/**
 * Update summary cards with current data (filtered or unfiltered)
 */
function updateSummaryCards() {
  document.getElementById('summaryCashSales').textContent = formatCurrency(filteredSummaryData.cashSales);
  document.getElementById('summaryOtherSales').textContent = formatCurrency(filteredSummaryData.otherSales);
  document.getElementById('summaryCashExpenses').textContent = formatCurrency(filteredSummaryData.cashExpenses);
  document.getElementById('summaryOtherExpenses').textContent = formatCurrency(filteredSummaryData.otherExpenses);
  document.getElementById('summaryCashPurchases').textContent = formatCurrency(filteredSummaryData.cashPurchases || 0);
  document.getElementById('summaryTotalDeposits').textContent = formatCurrency(filteredSummaryData.totalDeposits);
}

/**
 * Clear date filter
 */
function clearDateFilter() {
  dateFilter.isActive = false;
  dateFilter.startDate = null;
  dateFilter.endDate = null;
  
  // Reset input fields
  const startInput = document.getElementById('startDateInput');
  const endInput = document.getElementById('endDateInput');
  if (startInput) startInput.value = '';
  if (endInput) endInput.value = '';
  
  // Reset to original data
  filteredSalesData = [...monthlySalesData];
  filteredSummaryData = {...monthSummaryData};
  
  updateFilterStatus();
  renderSalesTable();
  updateSummaryCards();
  
  console.log('Date filter cleared - showing all data');
}

/**
 * Update filter status display
 */
function updateFilterStatus() {
  const statusDiv = document.getElementById('filterStatus');
  const statusText = document.getElementById('filterStatusText');
  
  if (!statusDiv || !statusText) return;
  
  if (dateFilter.isActive && dateFilter.startDate && dateFilter.endDate) {
    const startStr = formatDateForDisplay(dateFilter.startDate);
    const endStr = formatDateForDisplay(dateFilter.endDate);
    statusText.textContent = `Showing ${filteredSalesData.length} days: ${startStr} to ${endStr}`;
    statusDiv.style.display = 'flex';
  } else {
    statusDiv.style.display = 'none';
  }
}

/**
 * Format date for HTML input (YYYY-MM-DD)
 */
function formatDateForInput(date) {
  return date.toISOString().split('T')[0];
}

/**
 * Format date for display
 */
function formatDateForDisplay(date) {
  return date.toLocaleDateString('id-ID', { 
    day: 'numeric', 
    month: 'short', 
    year: 'numeric' 
  });
}

/**
 * Toggle the summary sidebar open/closed.
 */
function toggleSummarySidebar() {
  const sidebar = document.getElementById('summarySidebar');
  if (!sidebar) return;
  const isOpen = sidebar.classList.contains('summary-sidebar-open');
  if (isOpen) {
    sidebar.classList.remove('summary-sidebar-open');
    sidebar.classList.add('summary-sidebar-collapsed');
  } else {
    sidebar.classList.remove('summary-sidebar-collapsed');
    sidebar.classList.add('summary-sidebar-open');
  }
}

/**
 * Simple utility to format a number as Indonesian Rupiah (IDR).
 * @param {number} amount - The amount to format.
 * @returns {string} - The formatted currency string.
 */
function formatCurrency(amount) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: 0
  }).format(amount || 0);
}

// Make the main function globally accessible for the navigation tab to call
window.showMonthlySalesReport = showMonthlySalesReport;

console.log("Monthly Sales Report module loaded.");
</script>
