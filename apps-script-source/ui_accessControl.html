<script>
/**
 * Central tab access control (Snowbee B1.5 / G3.2).
 * Single source for updateTabVisibility + hasTabAccess.
 */
(function() {
  var TAB_PERMISSIONS = {
    orders: 'orders',
    salesSummary: 'salesSummary',
    stockReport: 'stockReport',
    purchasing: 'purchasing',
    purchasingReceive: 'purchasingReceive',
    purchasingLocal: 'purchasingLocal',
    deposits: 'deposits',
    inventoryConsumption: 'inventoryConsumption',
    kitchenCooking: 'kitchenCooking',
    profitLoss: 'profitLoss',
    usageReport: 'usageReport',
    monthlySalesReport: 'monthlySalesReport',
    investments: 'investments',
    agentConsole: 'adminOrders',
    adminOrders: 'adminOrders',
    attendance: 'attendance',
    checklist: 'checklist',
    tutorials: 'tutorials'
  };

  var ALWAYS_VISIBLE = ['tutorials'];

  function normalizeAllowedTabs(allowed, role) {
    var list = Array.isArray(allowed) ? allowed.slice() : [];
    var r = (role || getRole() || '').toString().trim().toLowerCase();
    if (r === 'admin' || list.indexOf('*') >= 0 || list.indexOf('admin') >= 0) {
      return ['*'];
    }
    return list;
  }

  function getAllowedTabs() {
    var allowed = [];
    if (window.LoginState && window.LoginState.allowedTabs && window.LoginState.allowedTabs.length) {
      allowed = window.LoginState.allowedTabs;
    } else if (window.allowedTabs && window.allowedTabs.length) {
      allowed = window.allowedTabs;
    }
    return normalizeAllowedTabs(allowed, getRole());
  }

  function getRole() {
    return (window.LoginState && window.LoginState.role) ||
      window.currentRole || 'cashier';
  }

  function normalizedRole() {
    return (getRole() || '').toString().trim().toLowerCase();
  }

  var PANEL_TABS = ['adminOrders', 'checklist'];

  var RETURN_TAB_ORDER = [
    'orders', 'salesSummary', 'stockReport', 'purchasing', 'purchasingReceive',
    'purchasingLocal', 'deposits', 'expenses', 'profitLoss', 'usageReport',
    'monthlySalesReport', 'inventoryConsumption', 'investments', 'attendance',
    'kitchenCooking', 'tutorials'
  ];

  function getReturnTabFromPanel() {
    var last = window._lastSellingTab;
    if (last && PANEL_TABS.indexOf(last) < 0 && hasTabAccess(last)) {
      return last;
    }
    var order = (window.SnowbeeRoleNav && window.SnowbeeRoleNav.TAB_ORDER) || RETURN_TAB_ORDER;
    for (var i = 0; i < order.length; i++) {
      if (PANEL_TABS.indexOf(order[i]) >= 0) continue;
      if (hasTabAccess(order[i])) return order[i];
    }
    return 'tutorials';
  }

  function getAccessibleDefaultTab() {
    var role = normalizedRole();
    var roleDefaults = (window.SnowbeeRoleNav && window.SnowbeeRoleNav.ROLE_DEFAULT_TAB) || { cashier: 'orders' };
    var preferred = roleDefaults[role] || roleDefaults.cashier || 'orders';
    if (hasTabAccess(preferred)) return preferred;
    var order = (window.SnowbeeRoleNav && window.SnowbeeRoleNav.TAB_ORDER) || RETURN_TAB_ORDER;
    for (var i = 0; i < order.length; i++) {
      if (hasTabAccess(order[i])) return order[i];
    }
    return 'tutorials';
  }

  function hasTabAccess(tabName) {
    if (!window.LoginState || !window.LoginState.isLoggedIn) {
      return ALWAYS_VISIBLE.indexOf(tabName) >= 0;
    }
    if (normalizedRole() === 'admin') return true;
    var allowed = getAllowedTabs();
    if (allowed.indexOf('*') >= 0) return true;
    var perm = TAB_PERMISSIONS[tabName] || tabName;
    if (ALWAYS_VISIBLE.indexOf(tabName) >= 0) return true;
    return allowed.indexOf(perm) >= 0 || allowed.indexOf(tabName) >= 0;
  }

  function updateTabVisibility() {
    var allowed = getAllowedTabs();
    var role = getRole();
    var fullAccess = normalizedRole() === 'admin' || allowed.indexOf('*') >= 0;
    Object.keys(TAB_PERMISSIONS).forEach(function(tabName) {
      var btn = document.getElementById(tabName + 'Tab');
      if (!btn) return;
      var show = fullAccess || hasTabAccess(tabName);
      btn.classList.toggle('tab-visible', show);
      btn.classList.toggle('tab-hidden', !show);
      btn.style.display = show ? '' : 'none';
    });
    var userDisplay = document.getElementById('userDisplay');
    if (userDisplay && window.LoginState && window.LoginState.user) {
      var displayRole = (role === 'kitchen') ? 'chef' : role;
      var roleLabel = typeof t === 'function' ? (t('role_' + displayRole) || displayRole) : role;
      userDisplay.textContent = window.LoginState.user + ' · ' + roleLabel;
    }
    var readyEl = document.getElementById('posReadyIndicator');
    if (readyEl && window.LoginState && window.LoginState.isLoggedIn) {
      readyEl.textContent = typeof t === 'function' ? (t('readyToOrder') || 'Ready') : 'Ready';
      readyEl.style.display = 'inline-block';
    }
    loadSupervisorSnapshotIfNeeded_();
    console.log('SnowbeeAccess: tabs updated for role', role, allowed);
  }

  function loadSupervisorSnapshotIfNeeded_() {
    var role = getRole();
    var el = document.getElementById('supervisorSnapshot');
    if (!el) return;
    var show = ['supervisor', 'manager', 'admin'].indexOf(role) >= 0;
    if (!show || !window.LoginState || !window.LoginState.isLoggedIn) {
      el.style.display = 'none';
      return;
    }
    el.style.display = 'block';
    if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) return;
    window.SecurityWrapper.secureServerCall('getSupervisorSnapshotSecure', {})
      .then(function(res) {
        var d = (res && res.data) ? res.data : res;
        if (!d) return;
        var label = typeof t === 'function' ? t('supervisorSnapshot') : 'Today';
        el.innerHTML = '<span style="font-size:0.72em;color:#64748b;">' + label + ': ' +
          (d.businessDate || '') + ' · ' +
          (typeof formatCurrency === 'function' ? formatCurrency(d.todaySales || 0) : (d.todaySales || 0)) +
          '</span>';
      })
      .catch(function() { el.style.display = 'none'; });
  }

  window.SnowbeeAccess = {
    hasTabAccess: hasTabAccess,
    updateTabVisibility: updateTabVisibility,
    getAllowedTabs: getAllowedTabs,
    getRole: getRole,
    getReturnTabFromPanel: getReturnTabFromPanel,
    getAccessibleDefaultTab: getAccessibleDefaultTab
  };
  window.hasTabAccess = hasTabAccess;
  window.updateTabVisibility = updateTabVisibility;
})();
</script>
