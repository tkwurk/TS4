<script>
// Security wrapper for server calls - prevents unauthorized access

/**
 * Secure server call wrapper that enforces authentication
 * This should replace all direct google.script.run calls
 */
function secureServerCall(functionName, params, options = {}) {
  return new Promise((resolve, reject) => {
    // First, validate user session
    if (!isUserAuthenticated()) {
      console.error(`SECURITY: Blocked unauthorized server call to ${functionName}`);
      reject(new Error('Authentication required'));
      
      // Force logout and show login
      if (window.forceLogout) {
        window.forceLogout();
      }
      return;
    }

    // Validate session hasn't expired
    if (!isSessionValid()) {
      console.error(`SECURITY: Blocked server call due to expired session: ${functionName}`);
      reject(new Error('Session expired'));
      
      // Force logout and show login
      if (window.forceLogout) {
        window.forceLogout();
      }
      return;
    }

    // Add authentication context to all server calls (Clean Login System Compatible)
    let deviceId = null;
    let username = null;
    let outlet = null;
    
    console.log('SECURITY DEBUG: Starting auth data collection for function:', functionName);
    
    // ✅ CLEAN LOGIN INTEGRATION: Get auth data from clean login system
    if (window.LoginState) {
      deviceId = window.LoginState.deviceId;
      username = window.LoginState.user;
      outlet = window.LoginState.outlet;
      console.log('SECURITY DEBUG: LoginState auth data - deviceId:', deviceId, 'username:', username, 'outlet:', outlet);
      console.log('SECURITY DEBUG: Full LoginState object:', window.LoginState);
    } else {
      console.log('SECURITY DEBUG: LoginState not available');
    }
    
    // Get username and outlet from global variables if not available from LoginState
    if (!username) {
      const globalUser = window.currentUser || (typeof currentUser !== 'undefined' ? currentUser : null);
      username = globalUser;
      console.log('SECURITY DEBUG: Got username from globals:', username);
    }
    if (!outlet) {
      const globalOutlet = window.currentOutlet || (typeof currentOutlet !== 'undefined' ? currentOutlet : null);
      outlet = globalOutlet;
      console.log('SECURITY DEBUG: Got outlet from globals:', outlet);
    }
    
    // Try to get deviceId if not available from LoginState
    if (!deviceId && window.getDeviceId && username) {
      deviceId = window.getDeviceId(username);
      console.log('SECURITY DEBUG: Retrieved deviceId using getDeviceId function - deviceId:', deviceId, 'username:', username);
    }
    
    // Validate minimum required authentication
    if (!deviceId || !username) {
      console.error('SECURITY: Missing required authentication - deviceId:', deviceId, 'username:', username, 'outlet:', outlet);
      reject(new Error('Authentication required: Missing username or outlet information'));
      forceLogout();
      return;
    }
    
    console.log('SECURITY DEBUG: Final auth context - deviceId:', deviceId, 'username:', username, 'outlet:', outlet);
    
    const enhancedParams = {
      ...params,
      _authContext: {
        deviceId: deviceId,
        username: username,
        outlet: outlet || 'DEFAULT', // Provide default outlet if missing
        timestamp: Date.now(),
        functionName: functionName
      }
    };

    console.log(`SECURE: Server call authorized: ${functionName}`);

    // Make the actual server call
    google.script.run
      .withSuccessHandler(result => {
        if (result && result.success === false) {
          console.error(`SECURE: Server returned failure: ${functionName}`, result.error);
          reject(new Error(result.error || 'Request failed'));
          return;
        }
        console.log(`SECURE: Authenticated call completed: ${functionName}`);
        resolve(result);
      })
      .withFailureHandler(error => {
        console.error(`SECURE: Authenticated call failed: ${functionName}`, error);
        
        // Check if error indicates session invalidation
        if (isSessionInvalidationError(error) && window.LoginState && window.LoginState.loginTime) {
          var sinceLogin = Date.now() - window.LoginState.loginTime;
          if (sinceLogin < 15000) {
            console.warn('SECURITY: Ignoring session invalidation shortly after login (' + sinceLogin + 'ms)');
          } else if (window.forceLogout) {
            console.error('SECURITY: Server indicated invalid session, forcing logout');
            window.forceLogout();
          }
        } else if (isSessionInvalidationError(error) && window.forceLogout) {
          console.error('SECURITY: Server indicated invalid session, forcing logout');
          window.forceLogout();
        }
        
        reject(error);
      })[functionName](enhancedParams);
  });
}

/**
 * Check if user is properly authenticated (Clean Login System Compatible)
 */
function isUserAuthenticated() {
  console.log('SECURITY DEBUG: Checking authentication...');
  
  // ✅ CLEAN LOGIN INTEGRATION: Use clean login system's authentication check
  if (window.CleanLogin && typeof window.CleanLogin.isAuthenticated === 'function') {
    const cleanLoginAuth = window.CleanLogin.isAuthenticated();
    console.log('SECURITY DEBUG: CleanLogin.isAuthenticated():', cleanLoginAuth);
    if (cleanLoginAuth) return true;
  }
  
  // Fallback: Check LoginState from clean login system
  if (window.LoginState) {
    const loginStateAuth = !!(window.LoginState.isLoggedIn && window.LoginState.user && window.LoginState.deviceId);
    console.log('SECURITY DEBUG: LoginState check - isLoggedIn:', window.LoginState.isLoggedIn, 'user:', window.LoginState.user, 'deviceId:', window.LoginState.deviceId, 'result:', loginStateAuth);
    if (loginStateAuth) return true;
  }
  
  // Legacy fallback: Check global variables
  const globalUser = window.currentUser || (typeof currentUser !== 'undefined' ? currentUser : null);
  const globalOutlet = window.currentOutlet || (typeof currentOutlet !== 'undefined' ? currentOutlet : null);
  const globalLoggedIn = window.isLoggedIn || (typeof isLoggedIn !== 'undefined' ? isLoggedIn : false);
  
  console.log('SECURITY DEBUG: Global variables - isLoggedIn:', globalLoggedIn, 'currentUser:', globalUser, 'currentOutlet:', globalOutlet);
  
  if (!globalLoggedIn || !globalUser || !globalOutlet) {
    console.log('SECURITY DEBUG: Missing required global authentication variables');
    return false;
  }

  return true;
}

/**
 * Check if current session is valid (Clean Login System Compatible)
 */
function isSessionValid() {
  // ✅ CLEAN LOGIN INTEGRATION: Use clean login system's session validation
  if (window.CleanLogin && window.LoginState) {
    if (window.LoginState.isLoggedIn && window.LoginState.user && window.LoginState.deviceId) {
      if (!window.LoginState.loginTime) {
        console.log('Fresh login detected, session is valid');
        return true;
      }
      const sessionAge = Date.now() - window.LoginState.loginTime;
      const maxAge = 4 * 60 * 60 * 1000; // 4 hours (matching clean login)
      const isValid = sessionAge < maxAge;
      console.log('Clean login session check:', {
        loginTime: window.LoginState.loginTime,
        sessionAge: Math.floor(sessionAge / 1000) + 's',
        maxAge: '4 hours',
        isValid: isValid
      });
      return isValid;
    }
  }
  
  // Legacy fallback: Check localStorage for last login time
  const lastLoginTime = localStorage.getItem('lastLoginTime');
  if (!lastLoginTime) {
    return false;
  }

  // Check if session has expired (24 hours for legacy)
  const now = Date.now();
  const sessionAge = now - parseInt(lastLoginTime);
  const maxAge = 24 * 60 * 60 * 1000; // 24 hours

  if (sessionAge > maxAge) {
    console.log('Legacy session expired (client-side check)');
    return false;
  }

  return true;
}

/**
 * Check if error indicates session invalidation
 */
function isSessionInvalidationError(error) {
  const errorStr = error.toString().toLowerCase();
  return errorStr.includes('session') || 
         errorStr.includes('authentication') || 
         errorStr.includes('unauthorized') ||
         errorStr.includes('invalid user') ||
         errorStr.includes('login required');
}

/**
 * Force logout and clear all session data (Clean Login System Compatible)
 */
function forceLogout() {
  console.log('SECURITY: Forcing logout due to authentication failure');
  
  // ✅ CLEAN LOGIN INTEGRATION: Use clean login system's logout
  if (window.CleanLogin && typeof window.CleanLogin.logout === 'function') {
    console.log('Using CleanLogin logout method');
    window.CleanLogin.logout();
    return;
  }
  
  // Fallback: Use clean login functions if available
  if (typeof window.cleanLogout === 'function') {
    console.log('Using cleanLogout function');
    window.cleanLogout();
    return;
  }
  
  // Legacy fallback: Clear client-side state manually
  console.log('Using legacy logout fallback');
  
  // Clear client-side state
  window.isLoggedIn = false;
  window.currentUser = null;
  window.currentOutlet = null;
  window.allowedTabs = [];
  
  // Clear LoginState if available
  if (window.LoginState) {
    window.LoginState.isLoggedIn = false;
    window.LoginState.user = null;
    window.LoginState.outlet = null;
    window.LoginState.allowedTabs = [];
    window.LoginState.deviceId = null;
    window.LoginState.loginTime = null;
  }
  
  // Clear localStorage
  localStorage.removeItem('lastUsername');
  localStorage.removeItem('lastLoginTime');
  localStorage.removeItem('currentSession');
  
  // Clear device ID
  if (window.clearDeviceId) {
    window.clearDeviceId();
  }
  
  // Clear app cache
  if (window.AppCache) {
    window.AppCache.clear();
  }
  
  // Clear expense account caches
  if (window.clearExpenseAccountCache) {
    window.clearExpenseAccountCache();
  }
  
  // Clear deposit account caches
  if (window.clearDepositAccountCache) {
    window.clearDepositAccountCache();
  }
  
  // Clear any other form-specific caches
  delete window._cachedExpenseAccounts;
  delete window._cachedInvestmentAccounts;
  delete window._cachedDepositAccounts;
  
  // Clear login cache
  if (window.LoginCache) {
    window.LoginCache.clearLoginCache();
  }
  
  // Show login modal
  const loginModal = document.getElementById('loginModal');
  const appContent = document.getElementById('appContent');
  
  if (loginModal) loginModal.style.display = 'flex';
  if (appContent) appContent.style.display = 'none';
  
  // Hide all restricted tabs
  const restrictedTabs = ['orders', 'purchasing', 'purchasingLocal', 'deposits', 'expenses', 'profitLoss', 'usageReport', 'monthlySalesReport', 'investments', 'inventoryConsumption', 'adminOrders'];
  restrictedTabs.forEach(tabName => {
    const tabButton = document.getElementById(tabName + 'Tab');
    if (tabButton) {
      tabButton.style.display = 'none';
    }
  });
  
  // Fire logout event
  window.dispatchEvent(new CustomEvent('logout'));
  
  console.log('SECURITY: Logout completed, user must re-authenticate');
}

/**
 * Sanitize cache keys to prevent issues with special characters
 * @param {string} key - The cache key to sanitize
 * @returns {string} - Sanitized cache key safe for storage
 */
function sanitizeCacheKey(key) {
  if (!key || typeof key !== 'string') {
    return 'invalid_key';
  }
  
  // Replace special characters with safe alternatives
  return key
    .replace(/[^a-zA-Z0-9\-_]/g, '_') // Replace special chars with underscore
    .replace(/_{2,}/g, '_')           // Replace multiple underscores with single
    .replace(/^_+|_+$/g, '')         // Remove leading/trailing underscores
    .toLowerCase()                   // Convert to lowercase for consistency
    .substring(0, 100);              // Limit length to prevent issues
}

/**
 * Enhanced server call wrapper with caching and security
 */
function secureServerCallWithCache(functionName, params, cacheKey, customTTL) {
  return new Promise((resolve, reject) => {
    // Security check first
    if (!isUserAuthenticated()) {
      reject(new Error('Authentication required'));
      forceLogout();
      return;
    }

    // Sanitize cache key to prevent special character issues
    const sanitizedCacheKey = sanitizeCacheKey(cacheKey);
    if (cacheKey !== sanitizedCacheKey) {
      console.log(`CACHE KEY SANITIZED: "${cacheKey}" → "${sanitizedCacheKey}"`);
    }

    // Try cache first (only if authenticated)
    if (window.AppCache && sanitizedCacheKey) {
      const cached = window.AppCache.get(sanitizedCacheKey);
      if (cached) {
        console.log(`SECURE CACHE HIT: ${functionName} (key: ${sanitizedCacheKey})`);
        resolve(cached);
        return;
      }
    }

    // Make secure server call
    secureServerCall(functionName, params)
      .then(result => {
        // Cache the result if successful
        if (window.AppCache && sanitizedCacheKey) {
          window.AppCache.set(sanitizedCacheKey, result, customTTL);
          console.log(`SECURE CACHE SET: ${functionName} (key: ${sanitizedCacheKey})`);
        }
        resolve(result);
      })
      .catch(reject);
  });
}

/**
 * Secure preload function that only runs after authentication
 */
function securePreloadCommonData() {
  console.log('SECURE: Starting authenticated data preload...');
  
  // Double-check authentication before any preloading
  if (!isUserAuthenticated()) {
    console.error('SECURITY: Preload blocked - user not authenticated');
    return;
  }

  const preloadTasks = [
    { fn: 'getProducts', key: 'products', ttl: 5 * 60 * 1000 },
    { fn: 'getExpenseAccounts', key: 'expenseAccounts', ttl: 10 * 60 * 1000 },
    { fn: 'getPaymentSources', key: 'paymentSources', ttl: 10 * 60 * 1000 },
    { fn: 'getDepositAccounts', key: 'depositAccounts', ttl: 10 * 60 * 1000 }
  ];

  preloadTasks.forEach(task => {
    secureServerCallWithCache(task.fn, null, task.key, task.ttl)
      .then(() => console.log(`SECURE: Preloaded ${task.key}`))
      .catch(error => console.error(`SECURE: Failed to preload ${task.key}:`, error));
  });
}

/**
 * Secure tab switching that checks authentication and updates visibility
 */
function secureTabSwitch(tab) {
  if (!isUserAuthenticated()) {
    console.error(`SECURITY: Blocked tab switch to ${tab} - not authenticated`);
    forceLogout();
    return false;
  }

  // Check if user has permission for this tab
  if (typeof hasTabAccess === 'function' && !hasTabAccess(tab)) {
    console.error(`SECURITY: User not authorized for tab: ${tab}`);
    
    // Use modern toast notification if available, fallback to alert
    if (window.showToast) {
      window.showToast(typeof t === 'function' ? t('toastAccessDenied') : `🔒 Access denied to ${tab}. Contact admin for permissions.`, 'error');
    } else {
      alert(`You are not authorized to access the ${tab} feature.`);
    }
    return false;
  }

  return true;
}

/**
 * Update login success handler to set security context and update UI
 */
function setSecureLoginContext(username, outlet, allowedTabs) {
  // Set login timestamp for session validation
  localStorage.setItem('lastLoginTime', Date.now().toString());
  
  // Set authentication flags
  window.isLoggedIn = true;
  window.currentUser = username;
  window.currentOutlet = outlet;
  window.allowedTabs = allowedTabs || [];
  
  console.log(`SECURITY: Secure context established for ${username} at ${outlet}`);
  console.log(`SECURITY: Allowed tabs:`, allowedTabs);
  
  // Update UI to reflect new permissions
  setTimeout(() => {
    // Update tab visibility if function is available
    if (window.updateTabVisibility) {
      window.updateTabVisibility();
    }
    
    // Update user display if function is available
    if (window.updateNavigationUserDisplay) {
      window.updateNavigationUserDisplay();
    }
    
    // Fire authentication changed event
    window.dispatchEvent(new CustomEvent('authenticationChanged', {
      detail: { username, outlet, allowedTabs }
    }));
    
    window.dispatchEvent(new CustomEvent('loginSuccess', {
      detail: { username, outlet, allowedTabs }
    }));
  }, 100);
  
  // Now safe to preload data
  setTimeout(() => {
    if (window.preloadCommonData) {
      window.preloadCommonData();
    }
  }, 200);
}

/**
 * Secure version of common UI functions
 */
const SecureUI = {
  loadExpenseAccounts: function() {
    return secureServerCallWithCache('getExpenseAccounts', null, 'expenseAccounts', 10 * 60 * 1000);
  },
  
  loadPaymentSources: function() {
    return secureServerCallWithCache('getPaymentSources', null, 'paymentSources', 10 * 60 * 1000);
  },
  
  loadProducts: function() {
    return secureServerCallWithCache('getProducts', null, 'products', 5 * 60 * 1000);
  },
  
  loadDepositAccounts: function() {
    return secureServerCallWithCache('getDepositAccounts', null, 'depositAccounts', 10 * 60 * 1000);
  },
  
  saveOrder: function(orderData) {
    return secureServerCall('saveOrder', orderData);
  },
  
  saveExpense: function(expenseData) {
    return secureServerCall('recordExpense', expenseData);
  },
  
  saveDeposit: function(depositData) {
    return secureServerCall('recordDeposit', depositData);
  },
  
  saveInvestment: function(investmentData) {
    return secureServerCall('recordInvestment', investmentData);
  },
  
  getInvestmentAccounts: function() {
    return secureServerCallWithCache('getInvestmentAccounts', null, 'investmentAccounts', 10 * 60 * 1000);
  }
};

// Initialize security on DOM ready
document.addEventListener('DOMContentLoaded', function() {
  initializeSecurityWrapper();
  window.forceLogout = forceLogout;
  window.secureServerCall = secureServerCall;
  window.secureServerCallWithCache = secureServerCallWithCache;
  window.SecureUI = SecureUI;
  window.setSecureLoginContext = setSecureLoginContext;
  
  console.log('SECURITY: Authentication controls loaded');
});

/**
 * Refresh current session without forcing full logout
 */
function refreshSession() {
  return new Promise((resolve, reject) => {
    const lastUsername = localStorage.getItem('lastUsername');
    if (!lastUsername) {
      reject(new Error('No stored username for session refresh'));
      return;
    }

    const deviceId = window.getDeviceId ? window.getDeviceId(lastUsername) : null;
    if (!deviceId) {
      reject(new Error('No device ID available for session refresh'));
      return;
    }

    console.log('SECURITY: Attempting session refresh for:', lastUsername);

    // Use the original google.script.run to avoid circular security checks
    const originalRun = window._originalGoogleScriptRun || google.script.run;
    
    originalRun
      .withSuccessHandler(result => {
        if (result && result.valid) {
          console.log('SECURITY: Session refresh successful');
          
          // Update authentication state (LoginState + globals)
          window.isLoggedIn = true;
          window.currentUser = result.username;
          window.currentOutlet = result.outlet;
          window.currentRole = result.role || window.currentRole || 'cashier';
          window.allowedTabs = result.allowedTabs || [];
          if (window.LoginState) {
            window.LoginState.isLoggedIn = true;
            window.LoginState.user = result.username;
            window.LoginState.outlet = result.outlet;
            window.LoginState.role = result.role || window.LoginState.role || 'cashier';
            if (typeof normalizeClientAllowedTabs_ === 'function') {
              window.LoginState.allowedTabs = normalizeClientAllowedTabs_(result.allowedTabs || [], window.LoginState.role);
            } else {
              window.LoginState.allowedTabs = result.allowedTabs || [];
            }
          }
          
          // Update login timestamp
          localStorage.setItem('lastLoginTime', Date.now().toString());
          
          if (typeof window.updateTabVisibility === 'function') {
            window.updateTabVisibility();
          }
          
          // Fire authentication restored event
          window.dispatchEvent(new CustomEvent('authenticationRestored'));
          window.dispatchEvent(new CustomEvent('sessionRefreshed', { detail: result }));
          
          resolve(result);
        } else {
          console.log('SECURITY: Session refresh failed - invalid session');
          reject(new Error('Session invalid'));
        }
      })
      .withFailureHandler(error => {
        console.error('SECURITY: Session refresh failed:', error);
        reject(error);
      })
      .validateSessionWithUserData(deviceId, lastUsername);
  });
}

// Export for use in other modules
window.SecurityWrapper = {
  secureServerCall,
  secureServerCallWithCache,
  isUserAuthenticated,
  isSessionValid,
  forceLogout,
  setSecureLoginContext,
  secureTabSwitch,
  refreshSession,
  SecureUI
};
</script>
