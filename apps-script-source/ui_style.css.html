<style>

/* Base Styles */
body {
  font-family: 'Inter', Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f7fb;
  color: #1a1a1a;
}

/* Make .container fill #appContent with no whitespace */
.container {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: none;
  border-radius: 0;
  box-shadow: none;
  min-height: 0;
  position: static;
  transition: none;
}

/* Wider container for Monthly Sales Report */
.container.monthly-sales-report {
  max-width: 1400px;
}

/* Enhanced Monthly Sales Report Layout for Wider Container */
.container.monthly-sales-report .summary-container {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) !important;
  gap: 15px;
  margin-bottom: 25px;
  max-width: 100%;
  padding: 20px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.container.monthly-sales-report .table-container {
  overflow-x: auto;
  margin: 0 -10px; /* Extend table to use full width */
}

.container.monthly-sales-report .table-container table {
  min-width: 1200px; /* Reduced from 1400px since we removed total orders column */
  font-size: 0.9rem; /* Slightly smaller font for better fit */
}

.container.monthly-sales-report .table-container th,
.container.monthly-sales-report .table-container td {
  padding: 10px 8px; /* Optimized padding for wider tables */
  white-space: nowrap; /* Prevent text wrapping */
}

.container.monthly-sales-report .report-header h3 {
  text-align: center;
  margin-bottom: 25px;
}

.container.monthly-sales-report .month-navigator {
  justify-content: center;
  margin-bottom: 25px;
}

/* Responsive adjustments for monthly sales report container */
@media (max-width: 1440px) {
  .container.monthly-sales-report {
    max-width: 95%;
  }
}

@media (max-width: 1200px) {
  .container.monthly-sales-report .summary-container {
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 12px;
    padding: 15px;
  }
  
  .container.monthly-sales-report .table-container {
    margin: 0; /* Reset margin on smaller screens */
  }
  
  .container.monthly-sales-report .table-container table {
    font-size: 0.85rem;
    min-width: 1000px; /* Reduced since we removed one column */
  }
}

@media (max-width: 768px) {
  .container.monthly-sales-report {
    max-width: 100%;
    padding: 20px 15px;
  }
  
  .container.monthly-sales-report .summary-container {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px;
    padding: 12px;
  }
  
  .container.monthly-sales-report .table-container th,
  .container.monthly-sales-report .table-container td {
    padding: 8px 4px;
    font-size: 0.8rem;
  }
  
  .container.monthly-sales-report .table-container table {
    min-width: 900px; /* Reduced since we removed one column */
  }
}

@media (max-width: 480px) {
  .container.monthly-sales-report .summary-container {
    grid-template-columns: 1fr !important;
    gap: 8px;
    padding: 10px;
  }

  .summary-card {
    min-height: 75px;
    padding: 15px;
  }

  .summary-card h5 {
    font-size: 0.8em;
    margin-bottom: 8px;
  }

  .summary-card .summary-value {
    font-size: 1.5em;
  }
}

/* Main content area */
#main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  width: 100%;
  box-sizing: border-box;
}

/* Responsive adjustments for main */
@media (max-width: 1240px) {
  #main {
    max-width: 95%;
    margin: 0 auto;
  }
}

@media (max-width: 768px) {
  #main {
    max-width: 100%;
    padding: 15px;
  }
}

/* Navigation */
.nav-bar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  margin-bottom: 26px;
  gap: 14px;
  flex-wrap: wrap;
  background: #f7fafc;
  border-radius: 13px;
  padding: 14px 10px;
  box-shadow: 0 2px 8px #f1f1f1;
}

.nav-btn {
  font-size: 1.04rem;
  padding: 11px 22px;
  border: none;
  border-radius: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-right: 6px;
  background: #e9e9ee;
  color: #545454;
  transition: all 0.15s;
  box-shadow: 0 1px 6px #eee;
}

.nav-btn.active {
  background: #5066e0;
  color: #fff;
  box-shadow: 0 2px 12px #dbe4ff;
}

.purchasing-btn.active {
  background: #8e44ad;
}

.deposits-btn.active {
  background: #2ecc71;
}

.expenses-btn.active {
  background: #e74c3c;
}

.monthly-sales-report-btn.active {
  background: #3498db;
}

.usage-report-btn.active {
  background: #9b59b6;
}

.inventory-consumption-btn.active {
  background: #1abc9c;
}

.investments-btn.active {
  background: #34495e;
}

.lang-select {
  margin-left: auto;
}

/* User Info Display */
.user-info {
  display: flex;
  align-items: center;
  margin-left: auto;
  margin-right: 15px;
  background: #fff;
  border-radius: 12px;
  padding: 8px 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  border: 1px solid #e2e8f0;
}

.user-details {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.user-label,
.outlet-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: #4a5568;
  display: flex;
  align-items: center;
  gap: 4px;
}

.user-label {
  color: #2d3748;
  font-weight: 600;
}

.outlet-label {
  color: #718096;
  font-size: 0.8rem;
}

/* Responsive adjustments for user info */
@media (max-width: 768px) {
  .user-info {
    margin-left: 8px;
    margin-right: 8px;
    padding: 6px 12px;
  }
  
  .user-details {
    gap: 1px;
  }
  
  .user-label,
  .outlet-label {
    font-size: 0.8rem;
  }
  
  .outlet-label {
    font-size: 0.75rem;
  }
}

/* Hide user info on very small screens */
@media (max-width: 480px) {
  .user-info {
    display: none;
  }
}

/* Item Search Bar */
.item-search-bar {
  padding: 6px 4px 4px;
  background: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.item-search-bar .item-search-wrap {
  flex: 1;
  min-width: 0;
}
.drawer-open-btn {
  flex-shrink: 0;
  padding: 8px 12px;
  border: 1.5px solid #d1d5db;
  border-radius: 20px;
  background: #f0fdf4;
  color: #166534;
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, border-color 0.2s;
}
.drawer-open-btn:hover {
  background: #dcfce7;
  border-color: #86efac;
}
.drawer-open-btn:active {
  background: #bbf7d0;
}
.item-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.item-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  font-size: 1em;
  pointer-events: none;
  line-height: 1;
  z-index: 1;
}
.item-search-input {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 36px 8px 32px;
  border: 1.5px solid #d1d5db;
  border-radius: 20px;
  font-size: 0.95em;
  background: #f9fafb;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  color: #1e293b;
}
.item-search-input:focus {
  border-color: #5066e0;
  box-shadow: 0 0 0 3px rgba(80,102,224,0.12);
  background: #fff;
}
.item-search-input::placeholder {
  color: #9ca3af;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: #e5e7eb;
  border: none;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.75em;
  color: #6b7280;
  line-height: 1;
  padding: 0;
  flex-shrink: 0;
}
.item-search-clear.visible { display: flex; }
.item-search-clear:hover { background: #d1d5db; color: #374151; }

/* Categories */
.categories {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
  gap: 7px;
  margin-bottom: 10px;
}

.cat-tile {
  border: 1.5px solid transparent;
  background: #fffbe6;
  border-radius: 12px;
  padding: 7px 0 3px 0;
  font-size: 0.86rem;
  font-weight: 500;
  min-height: 49px;
  height: 62px;
  cursor: pointer;
  transition: all 0.2s;
}

.cat-tile.active {
  border: 2px solid #fcbe03;
  background: radial-gradient(circle, #fff9e0 60%, #ffe796 100%);
  color: #c96d00;
  font-weight: 700;
  box-shadow: 0 2px 12px #ffe596;
  transform: scale(1.09);
}

.cat-icon {
  font-size: 1.15em;
  margin-bottom: 3px;
}

/* Enhanced Menu Items */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.menu-item {
  display: flex;
  align-items: center;
  background: #f9fafc;
  border-radius: 14px;
  padding: 14px 13px;
  gap: 18px;
  box-shadow: 0 2px 12px #f3f3f7;
  transition: box-shadow 0.13s, transform 0.2s;
  position: relative;
}

.menu-item:hover {
  box-shadow: 0 6px 22px #e8e9f7;
  transform: translateY(-1px);
}

.menu-item:active {
  transform: translateY(0);
}

.menu-item img {
  width: 66px;
  height: 66px;
  border-radius: 12px;
  object-fit: cover;
  border: 2px solid #f0f2fa;
  background: #fff;
  box-shadow: 0 2px 12px #f1f1ff;
  flex-shrink: 0;
}

.item-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.item-name {
  font-size: 1.13rem;
  font-weight: 700;
  color: #333;
  line-height: 1.3;
}

.item-price {
  color: #ffb300;
  font-weight: 700;
  font-size: 1.04rem;
  margin: 0;
}

.item-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Quantity Input Field */
.qty-input {
  width: 60px !important;
  text-align: center !important;
  margin: 0 5px !important;
  padding: 6px 4px !important;
  border: 1px solid #d1d5db !important;
  border-radius: 6px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
  background: #fff !important;
  color: #374151 !important;
  box-sizing: border-box !important;
}

.qty-input:focus {
  outline: none !important;
  border-color: #3b82f6 !important;
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1) !important;
}

.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button {
  -webkit-appearance: none !important;
  margin: 0 !important;
}

.qty-input[type=number] {
  -moz-appearance: textfield !important;
  appearance: textfield !important;
}

/* Action Buttons */
.add-btn, .remove-btn {
  background: #f3f3fc;
  border: none;
  padding: 9px 16px;
  border-radius: 9px;
  font-weight: 700;
  cursor: pointer;
  font-size: 1.1rem;
  margin-left: 10px;
  transition: background 0.12s, color 0.12s;
}

.add-btn {
  background: #51d881;
  color: #fff;
}

.add-btn:hover {
  background: #37c26b;
}

.remove-btn {
  background: #fc7686;
  color: #fff;
}

.remove-btn:disabled {
  background: #e3e3e8;
  color: #b7b7c7;
  cursor: not-allowed;
}

.add-btn:disabled {
  background: #e3e3e8 !important;
  color: #b7b7c7 !important;
  cursor: not-allowed !important;
}

.pay-btn:disabled, .payment-method-btn:disabled {
  background: #e3e3e8 !important;
  color: #b7b7c7 !important;
  cursor: not-allowed !important;
  opacity: 0.6 !important;
}

/* Summary Section */
.summary {
  background: #f6f6fd;
  border-radius: 13px;
  padding: 15px;
  margin-top: 15px;
  box-shadow: 0 2px 12px #f1f3fa;
  max-height: 50vh;
  overflow-y: auto;
  width: 100%;  /* Added to match parent width */
  box-sizing: border-box;  /* Include padding in width */
}

.summary h3 {
  margin-top: 0;
  font-size: 1.18rem;
  font-weight: 600;
  color: #5066e0;
  letter-spacing: 0.2px;
}

/* Payment Options */
.payment-options {
  margin-top: 20px;
}

.pay-btn {
  padding: 11px 26px;
  margin: 0 9px 7px 0;
  background: #5066e0;
  color: #fff;
  border: none;
  border-radius: 9px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.14s;
}

.pay-btn:hover {
  background: #3343b7;
}

/* Utility Buttons */
.sales-btn,
.neworder-btn {
  margin: 8px 0 8px 0;
  background: #f36b50;
  color: #fff;
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.12s;
  font-size: 1.01rem;
}

.neworder-btn {
  background: #ffcd39;
  color: #2a2317;
  margin-right: 10px;
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 18px;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 8px #f1f1f4;
}

table th,
table td {
  border: none;
  padding: 12px 10px;
  font-size: 0.97rem;
}

table th {
  background: #f1f2fa;
  color: #5066e0;
  font-weight: 700;
  letter-spacing: 0.3px;
}

table tr:not(:last-child) td {
  border-bottom: 1px solid #ececf1;
}

/* Forms */
input[type="date"],
input[type="number"],
input[type="text"],
select {
  font-size: 1.04rem;
  padding: 10px 14px;
  border-radius: 9px;
  border: 1px solid #dbe4ee;
  background: #f9fafd;
  margin: 2px 0 8px 0;
  transition: border 0.14s;
}

input:focus,
select:focus {
  outline: none;
  border: 1.5px solid #5066e0;
}

/* Purchasing Specific Styles */
.purchase-form {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed #eee;
}

.purchase-form input {
  width: 100%;
  padding: 8px 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.item-actions {
  display: flex;
  align-items: center;
  margin-left: auto;
}

.item-qty {
  min-width: 24px;
  text-align: center;
}

/* Loading and Error States */
.loading {
  padding: 20px;
  text-align: center;
  color: #666;
}

.error {
  padding: 20px;
  text-align: center;
  color: #d32f2f;
}

.error button {
  background: #5066e0;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  margin-top: 10px;
  cursor: pointer;
}

.no-products {
  padding: 20px;
  text-align: center;
  color: #666;
  font-style: italic;
}

/* Enhanced Login Modal Styles */
#loginModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
  box-sizing: border-box;
}

.login-container {
  background: white;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 400px;
  margin: auto;
  position: relative;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #333;
  font-size: 1.5rem;
}

#loginForm {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #555;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e1e5e9;
  border-radius: 8px;
  font-size: 16px; /* Prevents zoom on iOS */
  background: #f8f9fa;
  transition: border-color 0.2s, background-color 0.2s;
  box-sizing: border-box;
}

.form-group input:focus {
  outline: none;
  border-color: #5066e0;
  background: white;
}

#loginError {
  background: #ffebee;
  border: 1px solid #ffcdd2;
  color: #c62828;
  padding: 12px;
  border-radius: 8px;
  margin: 10px 0;
  display: none;
  text-align: center;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-30px);}
  to { opacity: 1; transform: translateY(0);}
}

/* Loading Spinner */
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid #5066e0;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#initialLoading {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  z-index: 9999;
}

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
}

/* Better focus indicators for accessibility */
button:focus,
input:focus,
select:focus {
  outline: 2px solid #5066e0;
  outline-offset: 2px;
}

/* Prevent text selection on UI elements */
.nav-btn, .cat-tile, .pay-btn, .sales-btn, .neworder-btn {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* Enhanced loading states */
.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid #5066e0;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* Enhanced Expense and Deposit Forms */
.expense-title, .deposit-title {
  text-align: center;
  font-size: 1.4rem;
  margin-bottom: 1.5rem;
  color: #333;
}

.expense-summary, .deposit-summary {
  width: 100%;
  margin: 16px auto;
  box-sizing: border-box;
  padding: 0 15px;
  background: #f8f9fa;
  border-radius: 12px;
  padding: 20px;
}

#expenseForm, #depositForm {
  width: 100%;
  margin: 0 auto;
  padding: 20px 15px;
  box-sizing: border-box;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

#expenseForm > div, #depositForm > div {
  margin-bottom: 18px;
}

#expenseForm label, #depositForm label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: #555;
  font-size: 1rem;
}

#expenseForm input, #expenseForm select,
#depositForm input, #depositForm select {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  font-size: 16px; /* Prevents zoom on iOS */
  padding: 14px 16px;
  border-radius: 8px;
  border: 2px solid #e3e6ee;
  background: #f9fafd;
  margin-top: 4px;
  margin-bottom: 0;
  transition: border 0.2s, background 0.2s;
  min-height: 48px;
}

#expenseForm input:focus, #expenseForm select:focus,
#depositForm input:focus, #depositForm select:focus {
  outline: none;
  border: 2px solid #5066e0;
  background: white;
}

#expenseForm button.pay-btn, #depositForm button.pay-btn {
  margin-top: 16px;
  width: 100%;
  padding: 16px;
  font-size: 1.1rem;
  border-radius: 8px;
  min-height: 48px;
  font-weight: 600;
}

/* Confirmation Screens */
.confirmation-screen {
  max-width: 400px;
  margin: 40px auto 0 auto;
  padding: 38px 30px 30px 30px;
  background: #fffbe8;
  border-radius: 15px;
  box-shadow: 0 4px 18px #f7e8a4a8;
  text-align: center;
}

.confirmation-screen h2 {
  color: #4A7B3A;
}

/* Investment Tab */
.sub-tab-bar {
  background: #f7fafc;
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 14px;
  box-shadow: 0 1px 5px #f3f3f3;
  display: flex;
  gap: 12px;
  justify-content: center;
}

.sub-tab-btn {
  padding: 8px 20px;
  border: none;
  background: #eee;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
  font-weight: bold;
  transition: background 0.2s;
}

.sub-tab-btn.active {
  background: #fff;
  border-bottom: 2px solid #09c372;
  color: #09c372;
}

/* Investment Form Summary Override */
#investment-summary.summary {
  max-height: none !important;  /* Remove height restriction */
  height: auto !important;      /* Allow natural height */
  min-height: 800px !important; /* Ensure minimum height to avoid scrolling */
