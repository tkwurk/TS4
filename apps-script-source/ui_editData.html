<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; margin:20px; }
    input, button, select { margin: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top:20px;}
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f5f5f5; }
    tr.selected { background: #e7f3ff; }
    .edit-form label { display: block; margin: 10px 0; }
    .edit-form button { margin: 5px 10px 0 0; }
    
    /* Loading spinner styles */
    .spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .spinner-text {
      color: white;
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Order Filter & Editor</h2>
  <label>Date: <input id="category" type="date"></label>
  <label>
    Outlet:
    <select id="status">
      <option value="">-- Select --</option>
      <option value="Cineam">Cineam</option>
      <option value="Pamarican">Pamarican</option>
    </select>
  </label>
  <button onclick="filterRows()">Filter</button>
  <div id="result"></div>

  <!-- Loading spinner overlay -->
  <div id="spinnerOverlay" class="spinner-overlay">
    <div>
      <div class="spinner"></div>
      <div class="spinner-text">Processing...</div>
    </div>
  </div>

  <script>
    let editingRowsData = null; // holds the current result set
    let editingRowNumber = null;
    let allTableData = null; // holds the complete data for filtering/sorting
    let currentHeaders = null;
    let sortColumn = null;
    let sortDirection = 'asc';

    // Spinner functions
    function showSpinner(text = 'Processing...') {
      const spinner = document.getElementById('spinnerOverlay');
      const spinnerText = document.querySelector('.spinner-text');
      spinnerText.textContent = text;
      spinner.style.display = 'flex';
    }

    function hideSpinner() {
      document.getElementById('spinnerOverlay').style.display = 'none';
    }

    function filterRows() {
      const cat = document.getElementById('category').value;
      const stat = document.getElementById('status').value;
      showSpinner('Loading data...');
      google.script.run
        .withSuccessHandler((data) => {
          hideSpinner();
          showTable(data);
        })
        .withFailureHandler((error) => {
          hideSpinner();
          document.getElementById('result').innerHTML = `<b>Error: ${error.message || error}</b>`;
        })
        .getRows(cat, stat);
    }

    function showTable(data) {
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (e) { /* ... */ }
      }
      if (!data || !data.rows) {
        document.getElementById('result').innerHTML = "<b>Error: No data returned from server.</b>"; return;
      }
      if (data.rows.length === 0) {
        document.getElementById('result').innerHTML = "<b>No rows found.</b>"; return;
      }
      
      // Store data for filtering/sorting
      allTableData = data.rows;
      currentHeaders = data.headers;
      editingRowsData = data.rows;
      
      renderTable();
    }

    function renderTable() {
      if (!allTableData || !currentHeaders) return;
      
      let html = `
        <div style="margin-bottom: 15px;">
          <input type="text" id="tableFilter" placeholder="Filter table..." onkeyup="filterTable()" style="width: 300px; padding: 8px;">
          <button onclick="clearFilter()">Clear</button>
        </div>
        <div id="tableContainer"></div>`;
      
      document.getElementById('result').innerHTML = html;
      renderTableContent();
    }

    function renderTableContent() {
      if (!editingRowsData || !currentHeaders) return;
      
      let html = '<table><tr>';
      
      currentHeaders.forEach((h, idx) => {
        const sortIcon = sortColumn === idx ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '';
        html += `<th style="cursor: pointer;" onclick="sortTable(${idx})">${h}${sortIcon}</th>`;
      });
      html += '<th>Actions</th></tr>';
      
      editingRowsData.forEach((row, idx) => {
        html += `<tr id="row${idx}">`;
        row.forEach(cell => html += `<td>${cell}</td>`);
        html += `<td><button onclick="editRow(${idx})">Edit</button></td></tr>`;
      });
      html += '</table>';
      
      document.getElementById('tableContainer').innerHTML = html;
    }

    function filterTable() {
      const filterValue = document.getElementById('tableFilter').value.toLowerCase();
      if (!filterValue) {
        editingRowsData = allTableData;
      } else {
        editingRowsData = allTableData.filter(row => {
          return row.some(cell => 
            String(cell).toLowerCase().includes(filterValue)
          );
        });
      }
      renderTableContent(); // Only re-render the table, not the filter input
    }

    function clearFilter() {
      document.getElementById('tableFilter').value = '';
      editingRowsData = allTableData;
      renderTableContent(); // Only re-render the table, not the filter input
    }

    function renderFilteredTable() {
      // This function is no longer needed, but keeping for compatibility
      renderTableContent();
    }

    function sortTable(columnIndex) {
      if (sortColumn === columnIndex) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = columnIndex;
        sortDirection = 'asc';
      }
      
      editingRowsData.sort((a, b) => {
        let aVal = a[columnIndex];
        let bVal = b[columnIndex];
        
        // Try to parse as numbers for proper numeric sorting
        const aNum = parseFloat(aVal);
        const bNum = parseFloat(bVal);
        
        if (!isNaN(aNum) && !isNaN(bNum)) {
          return sortDirection === 'asc' ? aNum - bNum : bNum - aNum;
        }
        
        // String comparison
        aVal = String(aVal).toLowerCase();
        bVal = String(bVal).toLowerCase();
        
        if (sortDirection === 'asc') {
          return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
        } else {
          return aVal > bVal ? -1 : aVal < bVal ? 1 : 0;
        }
      });
      
      renderTableContent(); // Only re-render the table, not the filter input
    }

    function editRow(idx) {
      const row = editingRowsData[idx];
      editingRowNumber = row[0]; // Row# in sheet (first element in row array)

      // Map to your columns: ["Row#", "Timestamp", "OrderNumber", "ItemName", "Qty", "Price", "PaymentMethod", "Total", "Category", "Outlet", "Username"]
      const qty = row[4];        // Qty
      const price = row[5];      // Price
      const payment = row[6];    // PaymentMethod

      document.getElementById('result').innerHTML = `
        <form id="editForm" class="edit-form" onsubmit="event.preventDefault(); saveRowForm();">
          <label>Qty: <input type="number" id="editQty" value="${qty}" required></label>
          <label>Price: <input type="number" step="0.01" id="editPrice" value="${price}" required></label>
          <label>Payment Method: <input type="text" id="editPayment" value="${payment}" required></label>
          <button type="submit">Save</button>
          <button type="button" onclick="deleteRowForm()">Delete Row</button>
          <button type="button" onclick="goBackToTable()">Cancel</button>
        </form>
      `;
    }

    function goBackToTable() {
      renderTable();
    }

    function saveRowForm() {
      const qty = document.getElementById('editQty').value;
      const price = document.getElementById('editPrice').value;
      const payment = document.getElementById('editPayment').value;
      
      showSpinner('Saving changes...');
      google.script.run
        .withSuccessHandler(() => {
          hideSpinner();
          filterRows(); // Reload data to get fresh results
        })
        .withFailureHandler((error) => {
          hideSpinner();
          alert('Error saving data: ' + (error.message || error));
        })
        .updateEditableFields(editingRowNumber, qty, price, payment);
    }

    function deleteRowForm() {
      if (!confirm("Are you sure you want to delete this row? This cannot be undone.")) return;
      
      showSpinner('Deleting row...');
      google.script.run
        .withSuccessHandler(() => {
          hideSpinner();
          filterRows(); // Reload data to get fresh results
        })
        .withFailureHandler((error) => {
          hideSpinner();
          alert('Error deleting row: ' + (error.message || error));
        })
        .deleteRow(editingRowNumber);
    }
  </script>
</body>
</html>
