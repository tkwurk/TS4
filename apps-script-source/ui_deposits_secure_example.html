<!-- EXAMPLE: Secure version of ui_deposits.html -->
<!-- This shows how to properly secure an existing UI component -->

<script>
  // SECURE Cash management and deposits functionality
  
  function showCashInHand() {
    // SECURITY CHECK FIRST - This is critical!
    if (!window.SecurityWrapper.isUserAuthenticated()) {
      console.error('SECURITY: showCashInHand blocked - user not authenticated');
      window.SecurityWrapper.forceLogout();
      return;
    }

    const renderCounter = getCurrentRenderCounter();
    
    // Use secure server call instead of direct google.script.run
    window.SecurityWrapper.secureServerCall('getDepositAccounts', null)
      .then(function(accounts) {
        // Check if this render is still valid
        if (!isCurrentTabRender('deposits', renderCounter)) {
          console.log('Ignoring stale deposits render');
          return;
        }
        renderCashInHand(accounts);
      })
      .catch(function(error) {
        console.error('Failed to load deposit accounts:', error);
        // Don't show error to user if it's an auth error (user is already being logged out)
        if (!error.message.includes('Authentication')) {
          window.showErrorModal && window.showErrorModal('Failed to load accounts. Please try again.');
        }
      });
  }

  function saveDeposit(event) {
    event.preventDefault();
    
    // SECURITY CHECK - Validate authentication before processing
    if (!window.SecurityWrapper.isUserAuthenticated()) {
      console.error('SECURITY: saveDeposit blocked - user not authenticated');
      window.SecurityWrapper.forceLogout();
      return;
    }
    
    // Prevent multiple submissions
    if (window._savingDeposit) {
      return;
    }
    
    window._savingDeposit = true;
    
    // Get form data
    const amt = getNumericValue(getElem('depositAmount').value, lang);
    const account = getElem('depositAccount').value.trim();
    const note = getElem('depositNote').value.trim();
    
    if (!amt || amt <= 0 || !account) {
      window._savingDeposit = false;
      window.showErrorModal && window.showErrorModal('Amount and Account are required');
      return;
    }
    
    // Prepare secure deposit data
    const deposit = {
      amount: amt,
      account: account, 
      note: note,
      date: new Date().toISOString(),
      // User context will be added automatically by secureServerCall
    };
    
    // Disable UI during processing
    const formInputs = document.querySelectorAll('#depositForm input, #depositForm select, #depositForm button');
    const submitButton = event.target.querySelector('button[type="submit"]');
    const originalButtonText = submitButton.innerHTML;
    
    formInputs.forEach(input => {
      input.disabled = true;
      input.style.opacity = '0.6';
    });
    
    submitButton.innerHTML = `
      <span class="btn-icon">⏳</span>
      Processing...
    `;
    
    // Disable navigation during processing
    if (window.disableAllNavigationWithRefreshProtection) {
      window.disableAllNavigationWithRefreshProtection();
    }
    
    // Use secure server call
    window.SecurityWrapper.secureServerCall('recordDeposit', deposit)
      .then(() => {
        window._savingDeposit = false;
        
        // Re-enable UI
        formInputs.forEach(input => {
          input.disabled = false;
          input.style.opacity = '1';
        });
        submitButton.innerHTML = originalButtonText;
        
        // Re-enable navigation
        if (window.enableAllNavigationAndAllowRefresh) {
          window.enableAllNavigationAndAllowRefresh();
        }
        
        showDepositConfirmation();
        console.log('SECURE: Deposit recorded successfully');
      })
      .catch(error => {
        window._savingDeposit = false;
        
        // Re-enable UI
        formInputs.forEach(input => {
          input.disabled = false;
          input.style.opacity = '1';
        });
        submitButton.innerHTML = originalButtonText;
        
        // Re-enable navigation
        if (window.enableAllNavigationAndAllowRefresh) {
          window.enableAllNavigationAndAllowRefresh();
        }
        
        console.error('SECURE: Deposit failed:', error);
        
        // Don't show error to user if it's an auth error
        if (!error.message.includes('Authentication')) {
          window.showErrorModal && window.showErrorModal('Failed to save deposit. Please try again.');
        }
      });
  }

  function loadDepositHistory() {
    // SECURITY CHECK
    if (!window.SecurityWrapper.isUserAuthenticated()) {
      console.error('SECURITY: loadDepositHistory blocked - user not authenticated');
      window.SecurityWrapper.forceLogout();
      return;
    }

    // Show loading state
    const historyEl = getElem('deposit-history');
    if (historyEl) {
      historyEl.className = 'loading';
      historyEl.innerHTML = 'Loading deposit history...';
    }

    // Use secure cached call for better performance
    window.SecurityWrapper.secureServerCallWithCache('getDepositHistory', null, 'depositHistory', 2 * 60 * 1000)
      .then(function(data) {
        renderDepositHistory(data);
      })
      .catch(function(error) {
        console.error('SECURE: Failed to load deposit history:', error);
        if (historyEl) {
          historyEl.innerHTML = '<div class="error-message">Failed to load deposit history</div>';
        }
      });
  }

  // SECURE version of deposit account loading for forms
  function loadDepositAccountsForForm() {
    // Use SecureUI helper for common operations
    return window.SecurityWrapper.SecureUI.loadDepositAccounts()
      .then(accounts => {
        console.log('SECURE: Loaded deposit accounts for form');
        return accounts;
      })
      .catch(error => {
        console.error('SECURE: Failed to load deposit accounts for form:', error);
        throw error;
      });
  }

  // Initialize secure deposits functionality
  function initializeSecureDeposits() {
    console.log('SECURE: Initializing deposits with authentication checks');
    
    // Only initialize if user is authenticated
    if (window.SecurityWrapper.isUserAuthenticated()) {
      // Load initial data securely
      loadDepositAccountsForForm()
        .then(accounts => {
          // Populate form options
          renderDepositAccountOptions(accounts);
        })
        .catch(error => {
          console.error('SECURE: Failed to initialize deposit accounts:', error);
        });
    } else {
      console.log('SECURE: Skipping deposits initialization - user not authenticated');
    }
  }

  // Tab activation with security check
  window.activateDepositTab = function(subTab) {
    // SECURITY CHECK
    if (!window.SecurityWrapper.isUserAuthenticated()) {
      console.error('SECURITY: Deposit tab activation blocked - user not authenticated');
      window.SecurityWrapper.forceLogout();
      return;
    }

    // Check if user has permission for deposits tab
    if (!window.SecurityWrapper.secureTabSwitch('deposits')) {
      return; // secureTabSwitch handles the error messaging
    }

    // Safe to activate the tab
    console.log('SECURE: Activating deposit sub-tab:', subTab);
    
    // Original tab activation logic here...
    if (subTab === 'add') {
      showDepositForm();
    } else if (subTab === 'history') {
      loadDepositHistory();
    }
  };

  // Override any existing unsafe functions
  window.showCashInHandSecure = showCashInHand;
  window.saveDepositSecure = saveDeposit;
  window.loadDepositHistorySecure = loadDepositHistory;

  console.log('SECURE: Secure deposits module loaded');
</script>

<!-- 
IMPLEMENTATION NOTES:

1. EVERY function that makes server calls now checks authentication FIRST
2. ALL google.script.run calls replaced with SecurityWrapper.secureServerCall
3. Added proper error handling that doesn't expose auth failures to users
4. Used caching for better performance on repeated calls
5. Disabled UI elements during processing to prevent double-submissions
6. Tab switching includes permission checks

SECURITY BENEFITS:
- Prevents unauthorized data access
- Validates user sessions on every server call
- Automatically logs out users with expired sessions
- Prevents cross-user data contamination
- Blocks access to features user isn't authorized for

PERFORMANCE BENEFITS:
- Caching reduces redundant server calls
- Secure preloading after authentication
- Proper loading states and error handling
- Debounced/throttled calls where appropriate
-->
