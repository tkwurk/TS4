<style>
  /* ===== PURCHASE SPREADSHEET LAYOUT ===== */
  .purchase-spreadsheet-wrapper { overflow-x: auto; margin-bottom: 12px; }
  .purchase-spreadsheet {
    width: 100%; border-collapse: collapse; font-size: 0.9em; background: #fff;
  }
  .purchase-spreadsheet thead tr {
    background: #e8eaf0; position: sticky; top: 0; z-index: 2;
  }
  .purchase-spreadsheet th {
    padding: 8px 10px; text-align: left; border-bottom: 2px solid #aab;
    white-space: nowrap; font-weight: 600; color: #333;
  }
  .purchase-spreadsheet th.col-qty,
  .purchase-spreadsheet th.col-price,
  .purchase-spreadsheet th.col-total { text-align: center; }
  .ss-row td { padding: 5px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  .ss-row:hover { background: #f7f9ff; }
  .ss-row-active { background: #eef4ff !important; }
  .ss-row-active .ss-total { font-weight: 700; color: #1a56db; }
  .ss-product-name { font-weight: 500; }
  .col-qty { width: 140px; text-align: center; }
  .col-price { width: 140px; text-align: right; }
  .col-total { width: 130px; text-align: right; }
  .ss-input {
    width: 72px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 0.95em; text-align: right; background: #fff;
  }
  .ss-input:focus { border-color: #4f86f7; outline: none; box-shadow: 0 0 0 2px rgba(79,134,247,0.2); }
  .ss-qty-controls { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .ss-btn {
    width: 26px; height: 26px; padding: 0; border: 1px solid #bbb;
    border-radius: 4px; background: #f5f5f5; cursor: pointer;
    font-size: 1em; line-height: 1; color: #444; flex-shrink: 0;
  }
  .ss-btn:hover:not(:disabled) { background: #e0e0e0; }
  .ss-btn:disabled { opacity: 0.35; cursor: default; }
  .ss-price-text { text-align: right; color: #555; padding-right: 10px !important; }
  .ss-total { text-align: right; min-width: 90px; color: #333; padding-right: 10px !important; }
  .ss-price-input { width: 100px; }
</style>
<script>
  // Purchasing functionality
  
  // Helper function to format date for backend in dd-mm-yyyy HH:mm:ss format
  function formatDateForBackend(date) {
    const d = new Date(date);
    
    // Use local time methods to avoid timezone issues
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    
    return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
  }
  
  function renderPurchasingUI() {
    const main = getElem('main');
    if (!main) {
      console.error('Main element not found in renderPurchasingUI');
      return;
    }
    
    // Force clear any existing content and styles
    main.innerHTML = '';
    main.className = '';
    
    main.innerHTML = `
      <div id="purchasing-container">
        <div class="sub-tab-bar">
          <button id="purchaseTabBtn" class="sub-tab-btn active" 
                  onclick="activatePurchasingTab('purchase')">
            Purchase
          </button>
          <button id="summaryTabBtn" class="sub-tab-btn" 
                  onclick="activatePurchasingTab('summary')">
            Summary
          </button>
        </div>
        <div id="purchase-form" style="display:block;">
          <div id="categories" class="categories"></div>
          <div class="item-search-bar">
            <div class="item-search-wrap">
              <span class="item-search-icon">🔍</span>
              <input id="purchasing-search" type="text" class="item-search-input"
                     placeholder="${t('searchProducts') || 'Search products...'}"
                     oninput="handlePurchasingSearch(this.value)"
                     autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
              <button class="item-search-clear" id="purchasing-search-clear" onclick="clearPurchasingSearch()" title="Clear">✕</button>
            </div>
          </div>
          <div id="purchasing-list" class="menu-list"></div>
          <div class="summary">
            <h3>${t('purchaseSummary')}</h3>
            <div id="purchase-summary"></div>
            <div class="purchase-form">
              <button class="pay-btn" onclick="proceedToPurchaseCheckout()" style="margin-top:12px;width:100%">
                ${t('proceedToCheckout')}
              </button>
            </div>
          </div>
        </div>
        <div id="summary-content" style="display:none;">
          <!-- Summary content will be loaded here -->
        </div>
      </div>
    `;
    loadPurchasingProducts();
  }

  function activatePurchasingTab(tab) {
    const purchaseTabBtn = getElem('purchaseTabBtn');
    const summaryTabBtn = getElem('summaryTabBtn');
    const purchaseForm = getElem('purchase-form');
    const summaryContent = getElem('summary-content');

    if (purchaseTabBtn) purchaseTabBtn.classList.remove('active');
    if (summaryTabBtn) summaryTabBtn.classList.remove('active');

    if (purchaseForm) purchaseForm.style.display = 'none';
    if (summaryContent) summaryContent.style.display = 'none';

    if (tab === 'purchase') {
      if (purchaseTabBtn) purchaseTabBtn.classList.add('active');
      if (purchaseForm) purchaseForm.style.display = 'block';
      loadPurchasingProducts();
    } else {
      if (summaryTabBtn) summaryTabBtn.classList.add('active');
      if (summaryContent) summaryContent.style.display = 'block';
      renderPurchaseSummaryTab();
    }
  }

  // Global function for showing purchasing tab - called by navigation
  function showPurchasingTab() {
    const renderCounter = getCurrentRenderCounter();
    fetchExpenseAccountsDirectly(renderCounter);
  }

  // ===== RECEIVE TAB =====

  // Standalone entry point — renders receive UI directly into main (called from nav)
  function showPurchaseReceiveTab() {
    const main = getElem('main');
    if (!main) return;
    main.innerHTML = `
      <div id="purchasing-container">
        <div style="padding:8px 0 4px;">
          <h2 style="margin:0;font-size:1.1em;color:#333;">Receive Goods</h2>
        </div>
        <div id="receive-content">
          <div class="loading" style="padding:20px">Loading ordered items...</div>
        </div>
      </div>
    `;
    loadReceiveContent();
  }

  // Sub-tab entry point — renders into existing #receive-content div
  function renderReceiveTab() {
    const container = getElem('receive-content');
    if (!container) return;
    container.innerHTML = '<div class="loading" style="padding:20px">Loading ordered items...</div>';
    loadReceiveContent();
  }

  // Shared data-loading logic for both entry points
  function loadReceiveContent() {
    google.script.run
      .withSuccessHandler(function(response) {
        const container = getElem('receive-content');
        if (!response || !response.success) {
          if (container) container.innerHTML = '<div class="error" style="padding:16px">Error loading ordered purchases: ' + (response && response.error ? response.error : 'Unknown error') + '</div>';
          return;
        }
        renderReceiveList(response.data || []);
      })
      .withFailureHandler(function(err) {
        const container = getElem('receive-content');
        if (container) container.innerHTML = '<div class="error" style="padding:16px">Failed to load ordered purchases: ' + err + '</div>';
      })
      .getOrderedPurchases(window.LoginState?.deviceId, window.LoginState?.currentusername || window.LoginState?.user || window.currentUser);
  }

  function renderReceiveList(items) {
    const container = getElem('receive-content');
    if (!container) return;

    if (!items.length) {
      container.innerHTML = '<div style="padding:20px;color:#666;text-align:center;">No pending ordered items to receive.</div>';
      return;
    }

    let rows = items.map((item, idx) => `
      <tr id="receive-row-${idx}">
        <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;">${item.date || ''}</td>
        <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-weight:500;">${escapeHtml(item.product)}</td>
        <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:center;">${item.qty}</td>
        <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:center;">
          <input type="number" id="rqty-${idx}" min="0" max="${item.qty}" step="0.01"
            value="${item.qty}"
            style="width:80px;padding:4px 6px;border:1px solid #ccc;border-radius:4px;text-align:right;"
          />
        </td>
        <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:center;">
          <button class="pay-btn"
            style="padding:5px 14px;font-size:0.85em;min-width:unset;"
            onclick="submitReceiveItem(${idx}, ${item.rowIndex})">
            Mark Received
          </button>
        </td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div style="padding:12px 0 6px;display:flex;align-items:center;justify-content:space-between;">
        <h3 style="margin:0;font-size:1.05em;color:#333;">Pending Ordered Items</h3>
        <button class="filter-reset-btn" onclick="renderReceiveTab()">
          <span class="btn-icon">🔄</span> Refresh
        </button>
      </div>
      <div class="purchase-spreadsheet-wrapper">
        <table class="purchase-spreadsheet">
          <thead>
            <tr>
              <th>Purchase Date</th>
              <th>Product Name</th>
              <th style="text-align:center;">Ordered Qty</th>
              <th style="text-align:center;">Received Qty</th>
              <th style="text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="receive-tbody">
            ${rows}
          </tbody>
        </table>
      </div>
    `;

    // Store items array on container for access in submit handler
    container._receiveItems = items;
  }

  function submitReceiveItem(idx, rowIndex) {
    const container = getElem('receive-content');
    const items = container && container._receiveItems;
    if (!items || !items[idx]) return;

    const rqtyInput = getElem('rqty-' + idx);
    const orderedQty = items[idx].qty;
    const rquantity = rqtyInput ? parseFloat(rqtyInput.value) : 0;
    if (isNaN(rquantity) || rquantity < 0) {
      alert('Please enter a valid received quantity.');
      return;
    }
    if (rquantity > orderedQty) {
      alert('Received quantity (' + rquantity + ') cannot exceed ordered quantity (' + orderedQty + ').');
      if (rqtyInput) rqtyInput.value = orderedQty;
      return;
    }

    const btn = rqtyInput && rqtyInput.closest('tr') && rqtyInput.closest('tr').querySelector('button');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

    window.SecurityWrapper.secureServerCall('updateReceiveQuantitySecure', {
      rowIndex: rowIndex,
      rquantity: rquantity
    })
      .then(function(result) {
        if (result && result.success) {
          // Remove row from table
          const row = getElem('receive-row-' + idx);
          if (row) row.remove();
          // If no rows left, show empty message
          const tbody = getElem('receive-tbody');
          if (tbody && !tbody.querySelector('tr')) {
            renderReceiveList([]);
          }
        } else {
          if (btn) { btn.disabled = false; btn.textContent = 'Mark Received'; }
          alert('Error: ' + (result && result.error ? result.error : 'Unknown error'));
        }
      })
      .catch(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Mark Received'; }
        alert('Failed to update: ' + err);
      });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ===== END RECEIVE TAB =====

  function renderPurchaseSummaryTab() {
    const container = getElem('summary-content');
    if (!container) return;
    
    // Initialize with filter controls and loading
    container.innerHTML = `
      <!-- Filter and Grouping Controls -->
      <div class="purchase-filters">
        <div class="filter-row">
          <div class="filter-group">
            <label for="purchaseGroupBySelect" class="filter-label">Group By</label>
            <select id="purchaseGroupBySelect" class="filter-select" onchange="updatePurchaseFilters()">
              <option value="none">No Grouping</option>
              <option value="month">By Month</option>
              <option value="product">By Product</option>
              <option value="both">By Month & Product</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label for="purchaseMonthFilter" class="filter-label">Filter Month</label>
            <select id="purchaseMonthFilter" class="filter-select" onchange="updatePurchaseFilters()">
              <option value="">All Months</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label for="purchaseProductFilter" class="filter-label">Filter Product</label>
            <select id="purchaseProductFilter" class="filter-select" onchange="updatePurchaseFilters()">
              <option value="">All Products</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label for="purchaseOutletFilter" class="filter-label">Filter Outlet</label>
            <select id="purchaseOutletFilter" class="filter-select" onchange="updatePurchaseFilters()">
              <option value="">All Outlets</option>
            </select>
          </div>
          
          <div class="filter-group">
            <button class="filter-reset-btn" onclick="resetPurchaseFilters()">
              <span class="btn-icon">🔄</span>
              Reset
            </button>
          </div>
        </div>
      </div>
      
      <div id="purchase-summary-content" class="loading">Loading purchase summary...</div>
    `;
    
    const renderCounter = getCurrentRenderCounter();
    google.script.run
      .withSuccessHandler(function(response) {
        // Check if this render is still valid
        if (!isCurrentTabRender('purchasing', renderCounter)) {
          console.log('Ignoring stale purchase summary render');
          return;
        }
        
        initializePurchaseFilters(response);
        renderPurchaseSummaryData(response);
      })
      .withFailureHandler(function(error) {
        const contentEl = getElem('purchase-summary-content');
        if (contentEl) {
          contentEl.innerHTML = `<div class="error">Error loading purchase summary: ${error}</div>`;
        }
      })
      .getPurchaseSummaryData(JSON.stringify({ groupBy: 'none', month: '', product: '', outlet: '' }), window.LoginState?.deviceId, window.LoginState?.currentusername || window.LoginState?.user || window.currentUser);
  }

  // ✅ CLEAN CACHE IMPLEMENTATION FOR BUY PRODUCTS
  window.buyProductsCache = {
    data: null,
    timestamp: null,
    outlet: null,
    ttl: 5 * 60 * 1000 // 5 minutes in milliseconds
  };

  // ✅ EXPENSE ACCOUNTS CACHE FOR PURCHASING
  window.expenseAccountsCache = {
    data: null,
    timestamp: null,
    ttl: 10 * 60 * 1000 // 10 minutes in milliseconds (accounts change less frequently)
  };

  // ✅ CACHE UTILITIES FOR BUY PRODUCTS
  window.clearBuyProductsCache = function() {
    console.log('🧹 Clearing Buy products cache...');
    window.buyProductsCache.data = null;
    window.buyProductsCache.timestamp = null;
    window.buyProductsCache.outlet = null;
    console.log('✅ Buy products cache cleared');
  };

  // ✅ DEBUG: Inspect cached buy products
  window.debugBuyProductsCache = function() {
    console.log(' Buy Products Cache Debug:');
    console.log('Cache exists:', !!window.buyProductsCache);
    console.log('Cache data:', window.buyProductsCache?.data?.length || 0, 'products');
    console.log('Cache outlet:', window.buyProductsCache?.outlet);
    console.log('Cache timestamp:', window.buyProductsCache?.timestamp);
    console.log('Cache age (minutes):', window.buyProductsCache?.timestamp ? 
      Math.round((Date.now() - window.buyProductsCache.timestamp) / 60000) : 'N/A');
    
    if (window.buyProductsCache?.data) {
      console.log('Sample cached products:');
      window.buyProductsCache.data.slice(0, 3).forEach((product, index) => {
        console.log(`  ${index + 1}. ${product.NAME} - Buy: ${product.BUYPRICE}, Type: ${product.TYPE}`);
      });
    }
    
    return window.buyProductsCache;
  };

  window.checkBuyProductsCache = function() {
    const cache = window.buyProductsCache;
    const now = Date.now();
    const age = cache.timestamp ? now - cache.timestamp : null;
    const currentOutlet = window.LoginState?.outlet || window.currentOutlet || 'default';
    const isValid = cache.data && cache.timestamp && age < cache.ttl && cache.outlet === currentOutlet;
    
    console.log('🔍 BUY PRODUCTS CACHE STATUS:');
    console.log('  - Has data:', !!cache.data);
    console.log('  - Has timestamp:', !!cache.timestamp);
    console.log('  - Cache outlet:', cache.outlet);
    console.log('  - Current outlet:', currentOutlet);
    console.log('  - Age (ms):', age);
    console.log('  - TTL (ms):', cache.ttl);
    console.log('  - Is valid:', isValid);
    console.log('  - Products count:', cache.data ? cache.data.length : 0);
    
    return {
      hasData: !!cache.data,
      hasTimestamp: !!cache.timestamp,
      cacheOutlet: cache.outlet,
      currentOutlet: currentOutlet,
      age: age,
      ttl: cache.ttl,
      isValid: isValid,
      productsCount: cache.data ? cache.data.length : 0
    };
  };

  // ✅ EXPENSE ACCOUNTS CACHE UTILITIES
  window.clearExpenseAccountsCache = function() {
    console.log('🧹 Clearing Expense Accounts cache...');
    window.expenseAccountsCache.data = null;
    window.expenseAccountsCache.timestamp = null;
    console.log('✅ Expense Accounts cache cleared');
  };

  window.checkExpenseAccountsCache = function() {
    const cache = window.expenseAccountsCache;
    const now = Date.now();
    const age = cache.timestamp ? now - cache.timestamp : null;
    const isValid = cache.data && cache.timestamp && age < cache.ttl;
    
    console.log('🔍 EXPENSE ACCOUNTS CACHE STATUS:');
    console.log('  - Has data:', !!cache.data);
    console.log('  - Has timestamp:', !!cache.timestamp);
    console.log('  - Age (ms):', age);
    console.log('  - TTL (ms):', cache.ttl);
    console.log('  - Is valid:', isValid);
    console.log('  - Accounts count:', cache.data ? cache.data.length : 0);
    
    return {
      hasData: !!cache.data,
      hasTimestamp: !!cache.timestamp,
      age: age,
      ttl: cache.ttl,
      isValid: isValid,
      accountsCount: cache.data ? cache.data.length : 0
    };
  };

  function fetchExpenseAccountsDirectly(renderCounter) {
    // ✅ Use SecurityWrapper for authenticated server calls
    if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) {
      console.error('SecurityWrapper not available - cannot fetch accounts');
      showErrorState();
      return;
    }

    // Purchases are saved against the first Expense-type account, auto-selected
    // so the user never picks an account manually.
    window.SecurityWrapper.secureServerCall('getExpenseAccounts', {})
      .then(accounts => {
        // Check if this render is still valid
        if (!isCurrentTabRender('purchasing', renderCounter)) {
          console.log('Ignoring stale purchasing render');
          return;
        }

        const expenseAccounts = Array.isArray(accounts) ? accounts : [];
        window._purchaseExpenseAccount = expenseAccounts[0] || '';
        console.log('Auto expense account:', window._purchaseExpenseAccount);
        renderPurchasingUI();
      })
      .catch(error => {
        console.error('SecurityWrapper failed to fetch accounts:', error);
        window._purchaseExpenseAccount = '';
        renderPurchasingUI();
      });
  }

  function fetchBuyProductsDirectly(renderCounter) {
    const currentOutlet = window.LoginState?.outlet || window.currentOutlet || 'default';
    
    // ✅ Use SecurityWrapper for authenticated server calls
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      window.SecurityWrapper.secureServerCall('getProductsSecure', { 
        type: 'ALL_TYPES', // Special marker to get all product types and filter client-side
        userOutlet: currentOutlet 
      })
        .then(response => {
          // Check if this render is still valid
          if (!isCurrentTabRender('purchasing', renderCounter)) {
            console.log('Ignoring stale purchasing products render');
            return;
          }
          
          try {
            let products = typeof response === 'string' ? JSON.parse(response) : response;
            if (!Array.isArray(products)) {
              throw new Error('Invalid product data format');
            }
            // Normalize all product keys to uppercase and remove spaces
            products = products.map(product => {
              const normalized = {};
              for (const key in product) {
                if (Object.prototype.hasOwnProperty.call(product, key)) {
                  const normKey = key.toUpperCase().replace(/\s+/g, '');
                  normalized[normKey] = product[key];
                }
              }
              return normalized;
            });
            if (typeof window.filterActiveProductsClient === 'function') {
              products = window.filterActiveProductsClient(products);
            }
            // CLIENT-SIDE FILTERING: Filter only for Type="Buy" products where Mode is not LO
            products = products.filter(product => {
              // Type="Buy" filter
              const isBuyType = product.TYPE && product.TYPE === 'Buy';
              // Exclude LO mode only (those belong to local purchasing)
              const productMode = (product.MODE || '').toString().trim().toUpperCase();
              const isNormalMode = productMode !== 'LO';
              // Check outlet filtering for comma-separated outlets
              let isValidOutlet = false;
              if (product.OUTLET) {
                const productOutlets = product.OUTLET.split(',').map(o => o.trim().toLowerCase());
                const currentOutletLower = currentOutlet.toLowerCase();
                isValidOutlet = productOutlets.includes('all') || 
                               productOutlets.some(outlet => {
                                 if (outlet === currentOutletLower) return true;
                                 if (currentOutletLower.includes(outlet)) return true;
                                 if (outlet.includes(currentOutletLower)) return true;
                                 return false;
                               });
              } else {
                isValidOutlet = true;
              }
              const shouldInclude = isBuyType && isValidOutlet && isNormalMode;
              if (isBuyType) {
                console.log(shouldInclude ? '✅ Including for purchasing:' : '❌ Excluding from purchasing:', 
                           product.NAME, 
                           '- Type:', product.TYPE, 
                           '- Outlets:', product.OUTLET || 'No outlet specified',
                           '- Current Outlet:', currentOutlet,
                           '- Outlet Match:', isValidOutlet);
              } else {
                console.log('❌ Excluding from purchasing:', product.NAME, '- Reason: Not Buy type');
              }
              return shouldInclude;
            });
            purchasingProducts = products;
            console.log('Loaded', purchasingProducts.length, 'Buy products');
            
            if (purchasingProducts.length === 0) {
              showNoProductsMessage();
            } else {
              renderPurchasingCategories(purchasingProducts);
              if (!currentCategory && purchasingProducts.length > 0) {
                currentCategory = (purchasingProducts[0].NAVCATEGORY || '').toString().trim() || purchasingProducts[0].CATEGORY;
              }
              showPurchasingProducts(currentCategory);
            }
          } catch (error) {
            console.error('Error processing Buy products:', error);
            showErrorState();
          }
        })
        .catch(error => {
          console.error('SecurityWrapper failed to fetch Buy products:', error);
          showErrorState();
        });
    } else {
      console.error('SecurityWrapper not available - cannot fetch products securely');
      showErrorState();
    }
  }

  function loadPurchasingProducts() {
    // Reset search state on reload
    _purchasingSearchQuery = '';
    const si = getElem('purchasing-search');
    if (si) si.value = '';
    const cb = getElem('purchasing-search-clear');
    if (cb) cb.classList.remove('visible');
    const cat = getElem('categories');
    if (cat) cat.style.display = '';

    const list = getElem('purchasing-list');
    if (list) list.innerHTML = '<div class="loading">Loading products...</div>';
    
    const renderCounter = getCurrentRenderCounter();
    
    fetchBuyProductsDirectly(renderCounter);
  }

  var _purchasingSearchQuery = '';

  function handlePurchasingSearch(value) {
    _purchasingSearchQuery = value.trim().toLowerCase();
    const clearBtn = getElem('purchasing-search-clear');
    if (clearBtn) clearBtn.classList.toggle('visible', _purchasingSearchQuery.length > 0);
    const catContainer = getElem('categories');
    if (_purchasingSearchQuery) {
      if (catContainer) catContainer.style.display = 'none';
      showPurchasingProducts('__search__');
    } else {
      if (catContainer) catContainer.style.display = '';
      renderPurchasingCategories(purchasingProducts);
      showPurchasingProducts(currentCategory);
    }
  }

  function clearPurchasingSearch() {
    const input = getElem('purchasing-search');
    if (input) { input.value = ''; input.focus(); }
    handlePurchasingSearch('');
  }

  function renderPurchasingCategories(products) {
    const categories = [...new Set(products.map(p => (p.NAVCATEGORY || '').toString().trim() || p.CATEGORY))];
    const container = getElem('categories');
    if (!container) return;
    container.innerHTML = '';

    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-tile${cat === currentCategory ? ' active' : ''}`;
      btn.innerHTML = `
        <span class="cat-icon">${categoryIcons[cat] || categoryIcons._default}</span>
        <span class="cat-label">${cat}</span>
      `;
      btn.onclick = function () {
        // 1. Remove .active from all
        document.querySelectorAll('.cat-tile').forEach(b => b.classList.remove('active'));
        // 2. Add .active to this
        btn.classList.add('active');
        // 3. Update currentCategory and show products
        currentCategory = cat;
        showPurchasingProducts(cat);
        // 4. (Optional) Scroll into view
        btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      };
      container.appendChild(btn);
    });
  }

  function isVoucherProduct(name) {
    return name && name.toString().toUpperCase().includes('VOUCHER');
  }

  function showPurchasingProducts(category) {
    const list = getElem('purchasing-list');
    if (!list) return;

    list.innerHTML = '';
    let filteredProducts;
    if (category === '__search__') {
      const sq = _purchasingSearchQuery;
      filteredProducts = purchasingProducts.filter(p => (p.NAME || '').toString().toLowerCase().includes(sq));
    } else {
      filteredProducts = purchasingProducts.filter(p => ((p.NAVCATEGORY || '').toString().trim() || p.CATEGORY) === category);
    }

    if (filteredProducts.length === 0) {
      list.innerHTML = `<div class="no-products">No products in ${category} category</div>`;
      return;
    }

    let rows = '';
    filteredProducts.forEach((product, idx) => {
      const qv = (product.QUANTITYVARIABLE || '').toString().toUpperCase().trim();
      const isVariableQuantity = qv === 'YES' || qv === 'Y';
      const price = parseFloat(product.BUYPRICE) || 0;
      const safeName = escapeString(product.NAME);
      const safeCategory = escapeString(product.CATEGORY);
      const rowId = `ss-row-${idx}`;

      let cartItem;
      if (isVariableQuantity) {
        cartItem = purchaseCart.find(i => i.name === product.NAME && i.category === product.CATEGORY && i.isVariableQuantity);
      } else {
        cartItem = purchaseCart.find(i => i.name === product.NAME && !i.isVariableQuantity);
      }
      const currentQty = cartItem ? cartItem.qty : 0;
      const currentPrice = cartItem ? cartItem.price : price;
      const rowTotal = currentQty * currentPrice;
      const isActive = currentQty > 0;

      if (isVariableQuantity) {
        rows += `
          <tr class="ss-row${isActive ? ' ss-row-active' : ''}${isVoucherProduct(product.NAME) ? ' ss-row-voucher' : ''}" id="${rowId}" data-product-name="${safeName}" data-category="${safeCategory}" style="${isVoucherProduct(product.NAME) ? 'background:#fff5f5;' : ''}">
            <td class="col-product ss-product-name">${product.NAME}${isVoucherProduct(product.NAME) ? ' <span style="font-size:0.75em;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;margin-left:4px;">DEDUCTION</span>' : ''}</td>
            <td class="col-total">
              <input type="number" class="ss-input ss-total-input"
                     id="${rowId}-total"
                     value="${rowTotal !== 0 ? Math.abs(rowTotal) : ''}"
                     placeholder="${t('enterTotal') || 'Enter Total'}"
                     min="0" step="1000"
                     data-name="${safeName}" data-category="${safeCategory}"
                     data-rowid="${rowId}"

              <input type="number" class="ss-input ss-price-input"

            <td class="col-qty">
              <input type="number" class="ss-input ss-qty-input"
                     id="ss-qty-${idx}"
                     value="${currentQty > 0 ? currentQty : ''}"
                     placeholder="0"
                     min="0" step="0.1"
                     data-name="${safeName}" data-category="${safeCategory}"
                     data-rowid="${rowId}" data-isvariable="1" data-defprice="${price}"
                     oninput="handleSpreadsheetQtyChange(this)"
                     onchange="handleSpreadsheetQtyChange(this)">
            </td>
          </tr>`;
      } else {
        rows += `
          <tr class="ss-row${isActive ? ' ss-row-active' : ''}${isVoucherProduct(product.NAME) ? ' ss-row-voucher' : ''}" id="${rowId}" data-product-name="${safeName}" data-category="${safeCategory}" style="${isVoucherProduct(product.NAME) ? 'background:#fff5f5;' : ''}">
            <td class="col-product ss-product-name">${product.NAME}${isVoucherProduct(product.NAME) ? ' <span style="font-size:0.75em;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;margin-left:4px;">DEDUCTION</span>' : ''}</td>
            <td class="col-total ss-total" id="${rowId}-total" style="${isVoucherProduct(product.NAME) && rowTotal !== 0 ? 'color:#dc2626;font-weight:600;' : ''}">${rowTotal !== 0 ? formatCurrency(rowTotal) : ''}</td>

            <td class="col-qty">
              <div class="ss-qty-controls">
                <button aria-label="Update purchase cart" class="ss-btn ss-minus"
                        data-name="${safeName}" data-price="${price}" data-category="${safeCategory}" data-change="-1"
                        onclick="updatePurchaseCart(this)" ${currentQty <= 0 ? 'disabled' : ''}>−</button>
                <input type="number" class="ss-input ss-qty-input"
                       id="ss-qty-${idx}"
                       value="${currentQty > 0 ? currentQty : ''}"
                       placeholder="0"
                       min="0" step="1"
                       data-name="${safeName}" data-price="${price}" data-category="${safeCategory}"

  function updatePurchaseCart(button) {
    // Prevent multiple rapid clicks
    if (button.disabled) {
      return;
    }
    
    // Temporarily disable the button
    button.disabled = true;
    button.style.opacity = '0.6';
    
    const name = button.getAttribute('data-name');
    const price = parseFloat(button.getAttribute('data-price'));
    const category = button.getAttribute('data-category');
    const change = parseInt(button.getAttribute('data-change'), 10);

    const product = purchasingProducts.find(p => p.NAME === name);
    const qv = (product && product.QUANTITYVARIABLE ? product.QUANTITYVARIABLE : '').toString().toUpperCase().trim();
    const isVariableQuantity = qv === 'YES' || qv === 'Y';
    
    if (isVariableQuantity) {
      // Re-enable button
      button.disabled = false;
      button.style.opacity = '1';
      return;
    }

    // Robustly extract product code from multiple possible property names
    let productCode = "";
    if (product) {
      productCode = product['PRODUCTCODE'] || product['PRODUCT CODE'] || product['ProductCode'] || product['productCode'] || product['code'] || product['Code'] || "";
    }
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product.BUYUNITSIZE ? product.BUYUNITSIZE : "";
    
    const item = purchaseCart.find(i => i.name === name && !i.isVariableQuantity);
    if (item) {
      item.qty += change;
      if (item.qty <= 0) {
        purchaseCart = purchaseCart.filter(i => !(i.name === name && !i.isVariableQuantity));
      }
    } else if (change > 0) {
      const storedPrice = isVoucherProduct(name) ? -Math.abs(price) : price;
      purchaseCart.push({ name, price: storedPrice, qty: 1, category, productName: name, code: productCode, supplier, buyUnit, buyUnitSize, expiryDate: '' });
    }
    
    // Update the spreadsheet row directly without full re-render
    const row = button.closest('tr.ss-row');
    if (row) {
      const rowId = row.id;
      const qtyInput = row.querySelector('.ss-qty-input');
      const cartItem = purchaseCart.find(i => i.name === name && !i.isVariableQuantity);
      const newQty = cartItem ? cartItem.qty : 0;
      if (qtyInput) qtyInput.value = newQty > 0 ? newQty : '';
      const totalCell = document.getElementById(rowId + '-total');
      if (totalCell) {
        totalCell.textContent = newQty > 0 ? formatCurrency(newQty * price) : '';
        if (isVoucherProduct(name)) { totalCell.style.color = newQty > 0 ? '#dc2626' : ''; totalCell.style.fontWeight = newQty > 0 ? '600' : ''; }
      }
      row.classList.toggle('ss-row-active', newQty > 0);
      const minusBtn = row.querySelector('.ss-minus');
      if (minusBtn) minusBtn.disabled = newQty <= 0;
    }
    
    renderPurchaseSummary();
    
    // Re-enable button after a short delay
    setTimeout(() => {
      button.disabled = false;
      button.style.opacity = '1';
    }, 300);
  }

  function updatePurchaseCartDirectly(input) {
    // Prevent multiple rapid updates
    if (window._updatingPurchaseCartDirectly) {
      return;
    }
    window._updatingPurchaseCartDirectly = true;
    
    const name = input.getAttribute('data-name');
    const price = parseFloat(input.getAttribute('data-price'));
    const category = input.getAttribute('data-category');
    const newQty = parseInt(input.value, 10);
    
    // Validate input
    if (isNaN(newQty) || newQty < 0) {
      input.value = 0;
      input.focus();
      input.select();
      window._updatingPurchaseCartDirectly = false;
      return;
    }
    
    // Use normalized keys
    const product = purchasingProducts.find(p => p.NAME === name);
    const qv2 = (product && product.QUANTITYVARIABLE ? product.QUANTITYVARIABLE : '').toString().toUpperCase().trim();
    const isVariableQuantity = qv2 === 'YES' || qv2 === 'Y';
    if (isVariableQuantity) {
      alert(t('useVariableControls') || 'This product supports variable quantity. Please use the variable controls to set quantity and price.');
      const existingItem = purchaseCart.find(i => i.name === name);
      input.value = existingItem ? existingItem.qty : 0;
      window._updatingPurchaseCartDirectly = false;
      return;
    }
    let productCode = product && product.PRODUCTCODE ? product.PRODUCTCODE : "";
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product.BUYUNITSIZE ? product.BUYUNITSIZE : "";
    
    // Find existing item in cart
    const existingItemIndex = purchaseCart.findIndex(i => i.name === name);

    if (newQty === 0) {
      // Remove item from cart if quantity is 0
      if (existingItemIndex >= 0) {
        purchaseCart.splice(existingItemIndex, 1);
      }
    } else {
      // Update or add item
      if (existingItemIndex >= 0) {
        // Update existing item
        purchaseCart[existingItemIndex].qty = newQty;
      } else {
        // Add new item
        purchaseCart.push({
          name,
          price,
          qty: newQty,
          category,
          productName: name,
          code: productCode,
          supplier: supplier,
          buyUnit: buyUnit,
          buyUnitSize: buyUnitSize,
          expiryDate: ''
        });
      }
    }

    // Update the display
    renderPurchaseSummary();
    showPurchasingProducts(currentCategory);

    // Reset the flag after a short delay
    setTimeout(() => {
      window._updatingPurchaseCartDirectly = false;
    }, 100);
  }

  function renderPurchaseSummary() {
    const summary = getElem('purchase-summary');
    if (!summary) return;

    if (purchaseCart.length === 0) {
      summary.innerHTML = `<div class="no-products">${t('noItems')}</div>`;
      return;
    }

    let html = `
      <table>
        <tr>
          <th>${t('item')}</th>
          <th style="display:none;">Supplier</th>
          <th style="display:none;">Code</th>
          <th>${t('qty')}</th>
          <th>${t('amount')}</th>
          <th>${t('expiryDate') || 'Expiry Date'}</th>
        </tr>
    `;

    purchaseCart.forEach((item, idx) => {
      const isVoucher = isVoucherProduct(item.name);
      const amount = item.price * item.qty;
      html += `
        <tr${isVoucher ? ' style="background:#fff5f5;"' : ''}>
          <td>${item.name}${isVoucher ? ' <span style="font-size:0.75em;background:#fee2e2;color:#dc2626;border-radius:4px;padding:2px 6px;margin-left:4px;">DEDUCTION</span>' : ''}</td>
          <td style="display:none;">${item.supplier || ''}</td>

          <td><input aria-label="Expiry date" type="date" value="${item.expiryDate || ''}" onchange="setPurchaseItemExpiryDate(${idx}, this.value)" style="width:120px;padding:4px;border:1px solid #ccc;border-radius:4px;font-size:0.85em;"></td>
        </tr>
      `;
    });

    const total = purchaseCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    html += `
        <tr style="font-weight:bold">
          <td colspan="4" style="text-align:right">Total:</td>
          <td style="text-align:right">${formatCurrency(total)}</td>
          <td></td>
        </tr>
      </table>
    `;

    summary.innerHTML = html;
  }

  function setPurchaseItemExpiryDate(index, value) {
    if (purchaseCart[index]) {
      purchaseCart[index].expiryDate = value;
    }
  }

  function proceedToPurchaseCheckout() {
    // Prevent multiple checkout attempts
    if (window._processingPurchaseCheckout) {
      return;
    }
    window._processingPurchaseCheckout = true;
    
    const account = (window._purchaseExpenseAccount || '').trim();
    if (!account) {
      alert("No Expense account is configured. Please add an Expense-type account in the Accounts sheet.");
      window._processingPurchaseCheckout = false;
      return;
    }
    if (purchaseCart.length === 0) {
      alert(t('pleaseAddItems'));
      window._processingPurchaseCheckout = false;
      return;
    }
    
    // Disable the checkout button
    const checkoutBtn = document.querySelector('.pay-btn');
    if (checkoutBtn) {
      checkoutBtn.disabled = true;
      checkoutBtn.style.opacity = '0.6';
      checkoutBtn.innerHTML = 'Processing...';
    }
    
    // Sync expiry dates from DOM inputs before building purchase
    purchaseCart.forEach((item, idx) => {
      const dateInput = document.querySelector(`input[type="date"][onchange*="setPurchaseItemExpiryDate(${idx}"]`);
      if (dateInput && dateInput.value) {
        item.expiryDate = dateInput.value;
      }
    });
    
    // Generate unique purchase ID
    const purchaseId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    // Deep copy items to ensure all properties survive GAS serialization
    const cleanItems = purchaseCart.map(item => ({
      name: item.name || '',
      price: item.price || 0,
      qty: item.qty || 0,
      category: item.category || '',
      productName: item.productName || '',
      code: item.code || '',
      supplier: item.supplier || '',
      buyUnit: item.buyUnit || '',
      buyUnitSize: item.buyUnitSize || '',
      expiryDate: item.expiryDate || ''
    }));
    
    const purchase = {
      id: purchaseId,
      items: cleanItems,
      account: account,
      total: purchaseCart.reduce((sum, item) => sum + (item.price * item.qty), 0),
      timestamp: formatDateForBackend(new Date()),
      payment: null // Will be set when user selects payment method
    };
    
    showPurchasePaymentSelection(purchase);
    
    // Reset the flag after showing payment selection
    setTimeout(() => {
      window._processingPurchaseCheckout = false;
    }, 500);
  }

  function selectPurchasePayment(method) {
    if (!window._pendingPurchase) {
      alert('No purchase found. Please try again.');
      return;
    }
    
    // Prevent multiple clicks on payment buttons
    if (window._selectingPayment) {
      console.log("Payment selection already in progress");
      return;
    }
    
    window._selectingPayment = true;
    
    // Disable all payment buttons
    const paymentButtons = document.querySelectorAll('.payment-method-btn');
    paymentButtons.forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.cursor = 'not-allowed';
    });
    
    window._pendingPurchase.payment = method;
    
    // ✅ SecurityWrapper handles all authentication automatically
    submitPurchaseWithPayment(window._pendingPurchase);
  }

  function submitPurchaseWithPayment(purchase) {
    console.log("purchase:Total purchase amount:", purchase.total);
    
    // Prevent duplicate submissions
    if (window._submittingPurchase) {
      console.log("Purchase submission already in progress, ignoring duplicate request");
      return;
    }
    
    // Set submission flag and show loading state
    window._submittingPurchase = true;
    showPurchaseSubmittingState();
    
    // ✅ SECURITY: Use SecurityWrapper for authenticated server calls
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      console.log('Using SecurityWrapper for purchase submission');
      
      window.SecurityWrapper.secureServerCall('recordPurchaseSecure', purchase)
        .then((result) => {
          // Clear all submission flags
          window._submittingPurchase = false;
          window._selectingPayment = false;
          window._pendingPurchase = null;
          
          console.log('Purchase recorded successfully via SecurityWrapper:', result);
          showPurchaseSuccessConfirmation(purchase);
          purchaseCart = [];
          renderPurchaseSummary();
        })
        .catch((error) => {
          // Clear submission flags on error
          window._submittingPurchase = false;
          window._selectingPayment = false;
          
          console.error('Failed to record purchase via SecurityWrapper:', error);
          
          // Check if it's an authentication error
          if (error && error.toString().toLowerCase().includes('authentication')) {
            console.warn('Authentication error during purchase submission, redirecting to login');
            window.SecurityWrapper.forceLogout();
          } else {
            if (window.showErrorModal) {
              window.showErrorModal('Failed to save purchase: ' + (error.message || error));
            } else {
              alert(`Error submitting purchase: ${error.message || error}`);
            }
            // Return to payment selection screen
            showPurchasePaymentSelection(purchase);
          }
        });
    } else {
      console.error('SecurityWrapper not available - purchase submission requires secure authentication');
      
      // Clear submission flags
      window._submittingPurchase = false;
      window._selectingPayment = false;
      
      if (window.showErrorModal) {
        window.showErrorModal('Security system not available. Please refresh the page and try again.');
      } else {
        alert('Security system not available. Please refresh the page and try again.');
      }
      
      // Return to payment selection screen
      showPurchasePaymentSelection(purchase);
    }
  }

  function renderPurchaseSummaryData(response) {
    const contentEl = getElem('purchase-summary-content');
    if (!contentEl) return;

    // Remove loading class
    contentEl.classList.remove('loading');

    console.log('Purchase summary response:', response);

    // Handle response format
    let data = [];
    let groupBy = 'none';
    let totalAmount = 0;
    
    try {
      if (typeof response === 'string') {
        const parsed = JSON.parse(response);
        data = parsed.data || [];
        groupBy = parsed.groupBy || 'none';
        totalAmount = parsed.totalAmount || 0;
      } else if (response && response.success !== undefined) {
        // Handle backend response format
        data = response.data || [];
        groupBy = response.groupBy || 'none';
        totalAmount = response.totalAmount || 0;
      } else if (Array.isArray(response)) {
        data = response;
        totalAmount = data.reduce((sum, item) => sum + (Number(item.total) || 0), 0);
      } else if (response && response.data) {
        data = response.data;
        groupBy = response.groupBy || 'none';
        totalAmount = response.totalAmount || 0;
      }
    } catch (error) {
      console.error('Error parsing purchase summary:', error);
      data = [];
    }

    console.log('Processed data:', data);
    console.log('GroupBy:', groupBy);
    console.log('Total amount:', totalAmount);

    // Store data globally
    window._purchaseSummaryData = data;
    window._purchaseGroupBy = groupBy;

    // Show message if no data
    if (!Array.isArray(data) || data.length === 0) {
      contentEl.innerHTML = `

      return;

        bVal = (bVal || '').toString().toLowerCase();

  function initializePurchaseFilters(response) {
    // Initialize month, product, and outlet filter options
    let allMonths = new Set();
    let allProducts = new Set();
    let allOutlets = new Set();
    
    try {
      let data = [];
      if (typeof response === 'string') {
        const parsed = JSON.parse(response);
        data = parsed.data || parsed;
      } else if (Array.isArray(response)) {
        data = response;
      } else if (response && response.data) {
        data = response.data;
      }
      
      data.forEach(item => {
        if (item.month) allMonths.add(item.month);
        if (item.product) allProducts.add(item.product);
        if (item.outlet) allOutlets.add(item.outlet);
        
        // If it's grouped data, also check items
        if (item.items && Array.isArray(item.items)) {
          item.items.forEach(subItem => {
            if (subItem.date) {
              const month = new Date(subItem.date).toISOString().slice(0, 7);
              allMonths.add(month);
            }
            if (subItem.product) allProducts.add(subItem.product);
            if (subItem.outlet) allOutlets.add(subItem.outlet);
          });
        } else if (item.date) {
          const month = new Date(item.date).toISOString().slice(0, 7);
          allMonths.add(month);
        }
      });
    } catch (error) {
      console.error('Error processing filter data:', error);
    }
    
    // Populate month filter
    const monthFilter = getElem('purchaseMonthFilter');
    if (monthFilter) {
      const sortedMonths = Array.from(allMonths).sort().reverse();
      sortedMonths.forEach(month => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = formatMonthLabel(month);
        monthFilter.appendChild(option);
      });
    }
    
    // Populate product filter
    const productFilter = getElem('purchaseProductFilter');
    if (productFilter) {
      const sortedProducts = Array.from(allProducts).sort();
      sortedProducts.forEach(product => {
        const option = document.createElement('option');
        option.value = product;
        option.textContent = product;
        productFilter.appendChild(option);
      });
    }
    
    // Populate outlet filter
    const outletFilter = getElem('purchaseOutletFilter');
    if (outletFilter) {
      const sortedOutlets = Array.from(allOutlets).sort();
      sortedOutlets.forEach(outlet => {
        const option = document.createElement('option');
        option.value = outlet;
        option.textContent = outlet;
        outletFilter.appendChild(option);
      });
    }
  }

    const productFilter = getElem('purchaseProductFilter')?.value || '';

    // Create filter options object
    const filterOptions = {
      groupBy: groupBy,
      month: monthFilter,

  // ===== VARIABLE QUANTITY FUNCTIONS FOR PURCHASING =====
  
  function adjustPurchaseVariableQuantity(name, category, delta) {
    // Find existing variable item in purchase cart
    let existingVar = purchaseCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    
    let newQty = 0;
    let currentPrice = 0;
    
    if (existingVar) {
      newQty = Math.max(0, parseFloat((existingVar.qty + delta).toFixed(1)));
      currentPrice = existingVar.price;
    } else {
      // Find the product to get default price (BuyPrice for purchasing)
      const product = purchasingProducts.find(p => p.NAME === name && p.CATEGORY === category);
      newQty = Math.max(0, parseFloat(delta.toFixed(1)));
      currentPrice = product ? (parseFloat(product.BUYPRICE) || 0) : 0;
    }
    
    // Update the display immediately
    updatePurchaseVariableDisplay(name, category, newQty, currentPrice);
    
    // Update cart if quantity > 0, otherwise remove item
    if (newQty > 0) {
      addPurchaseVariableQuantityDirectly(name, category, newQty, currentPrice);
    } else {
      // Remove item from cart
      purchaseCart = purchaseCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseSummary();
    }
  }
  
  function adjustPurchaseVariablePrice(name, category, delta) {
    // Find existing variable item in purchase cart
    let existingVar = purchaseCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    
    let currentQty = 0;
    let newPrice = 0;
    
    if (existingVar) {
      currentQty = existingVar.qty;
      newPrice = Math.max(0, existingVar.price + delta);
    } else {
      // Find the product to get default values (BuyPrice for purchasing)
      const product = purchasingProducts.find(p => p.NAME === name && p.CATEGORY === category);
      currentQty = 0; // Start with 0 quantity if adjusting price without quantity set
      newPrice = Math.max(0, (product ? (parseFloat(product.BUYPRICE) || 0) : 0) + delta);
    }
    
    // Update the display immediately
    updatePurchaseVariableDisplay(name, category, currentQty, newPrice);
    
    // Update cart only if quantity > 0
    if (currentQty > 0) {
      addPurchaseVariableQuantityDirectly(name, category, currentQty, newPrice);
    } else {
      // Remove item from cart if quantity is 0
      purchaseCart = purchaseCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseSummary();
    }
  }
  
  function updatePurchaseVariableDisplay(name, category, qty, price) {
    // Update input fields for purchasing (using purchase-specific IDs)
    const qtyInput = document.getElementById(`purchase-var-qty-input-${name}-${category}`);
    const priceInput = document.getElementById(`purchase-var-price-input-${name}-${category}`);
    
    if (qtyInput) {
      qtyInput.value = qty || 0;
    }
    
    if (priceInput) {
      priceInput.value = price || 0;
    }
    
    // Update button states for purchasing
    const qtyMinusBtn = document.querySelector(`button[onclick="adjustPurchaseVariableQuantity('${name}', '${category}', -0.1)"]`);
    const priceMinusBtn = document.querySelector(`button[onclick="adjustPurchaseVariablePrice('${name}', '${category}', -1000)"]`);
    
    if (qtyMinusBtn) {
      qtyMinusBtn.disabled = qty <= 0;
    }
    
    if (priceMinusBtn) {
      priceMinusBtn.disabled = price <= 0;
    }
  }

  function addPurchaseVariableQuantityDirectly(name, category, quantity, price) {
    // Find the product to get additional details
    const product = purchasingProducts.find(p => p.NAME === name && p.CATEGORY === category);
    const productCode = product && product['PRODUCTCODE'] ? product['PRODUCTCODE'] : "";
    const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
    const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
    const buyUnitSize = product && product.BUYUNITSIZE ? product.BUYUNITSIZE : "";
    
    // Remove any existing items of the same product (both regular and variable)
    purchaseCart = purchaseCart.filter(item => !(item.name === name && item.category === category));
    
    // Add new item with custom quantity and price (ensure voucher prices are negative)
    const storedPrice = isVoucherProduct(name) ? -Math.abs(price) : price;
    const newItem = {
      name,
      price: storedPrice,
      qty: quantity,
      category,
      productName: name,
      code: productCode,
      supplier: supplier,
      buyUnit: buyUnit,
      buyUnitSize: buyUnitSize,
      isVariableQuantity: true,
      originalPrice: product ? (parseFloat(product.BUYPRICE) || 0) : 0,
      expiryDate: ''
    };
    
    purchaseCart.push(newItem);
    
    renderPurchaseSummary();
  }

  // Input handler functions for purchase variable quantity
  function handlePurchaseVariableQuantityInputChange(name, category, value) {
    const newQty = parseFloat(value) || 0;
    
    if (newQty < 0) {
      updatePurchaseVariableDisplay(name, category, 0, getCurrentPurchaseVariablePrice(name, category));
      return;
    }
    
    const currentPrice = getCurrentPurchaseVariablePrice(name, category);
    
    if (newQty > 0) {
      addPurchaseVariableQuantityDirectly(name, category, newQty, currentPrice);
    } else {
      // Remove from cart if quantity is 0
      purchaseCart = purchaseCart.filter(item => !(item.name === name && item.category === category && item.isVariableQuantity));
      renderPurchaseSummary();
    }
  }

  function handlePurchaseVariablePriceInputChange(name, category, value) {
    const newPrice = parseFloat(value) || 0;
    
    if (newPrice < 0) {
      updatePurchaseVariableDisplay(name, category, getCurrentPurchaseVariableQty(name, category), 0);
      return;
    }
    
    const currentQty = getCurrentPurchaseVariableQty(name, category);
    
    if (currentQty > 0) {
      addPurchaseVariableQuantityDirectly(name, category, currentQty, newPrice);
    } else {
      // Just update display if no quantity
      updatePurchaseVariableDisplay(name, category, 0, newPrice);
    }
  }

  function handlePurchaseVariableQuantityKeypress(event, input, name, category) {
    if (event.key === 'Enter') {
      input.blur(); // This will trigger the onchange event
    }
  }

  function handlePurchaseVariablePriceKeypress(event, input, name, category) {
    if (event.key === 'Enter') {
      input.blur(); // This will trigger the onchange event
    }
  }

  // Helper functions to get current values
  function getCurrentPurchaseVariableQty(name, category) {
    const existingVar = purchaseCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    return existingVar ? existingVar.qty : 0;
  }

  function getCurrentPurchaseVariablePrice(name, category) {
    const existingVar = purchaseCart.find(item => item.name === name && item.category === category && item.isVariableQuantity);
    if (existingVar) {
      return existingVar.price;
    }
    // Get default price from product
    const product = purchasingProducts.find(p => p.NAME === name && p.CATEGORY === category);
    return product ? (parseFloat(product.BUYPRICE) || 0) : 0;
  }

  // ===== SPREADSHEET INPUT HANDLERS =====

  function handleSpreadsheetQtyChange(input) {
    const name = input.getAttribute('data-name');
    const category = input.getAttribute('data-category');
    const rowId = input.getAttribute('data-rowid');
    const isVariable = input.getAttribute('data-isvariable') === '1';
    const newQty = parseFloat(input.value) || 0;

    if (isVariable) {
      const row = document.getElementById(rowId);
      const priceInput = row ? row.querySelector('.ss-price-input') : null;
      const totalInput = document.getElementById(rowId + '-total');
      const defPrice = parseFloat(input.getAttribute('data-defprice')) || 0;
      const isVoucher = isVoucherProduct(name);
      let currentPrice;
      const totalVal = totalInput ? (parseFloat(totalInput.value) || 0) : 0;
      if (totalVal > 0 && newQty > 0) {
        const absPrice = totalVal / newQty;
        currentPrice = isVoucher ? -absPrice : absPrice;
        if (priceInput) priceInput.value = Math.round(absPrice);
      } else {
        const rawPrice = priceInput ? (parseFloat(priceInput.value) || defPrice) : getCurrentPurchaseVariablePrice(name, category);
        currentPrice = isVoucher ? -Math.abs(rawPrice || defPrice) : (rawPrice || defPrice);
      }

      if (newQty > 0) {
        addPurchaseVariableQuantityDirectly(name, category, newQty, currentPrice);
      } else {
        purchaseCart = purchaseCart.filter(i => !(i.name === name && i.category === category && i.isVariableQuantity));
        renderPurchaseSummary();
      }
      if (totalInput) totalInput.value = newQty > 0 && currentPrice !== 0 ? Math.abs(newQty * currentPrice) : '';
      if (row) row.classList.toggle('ss-row-active', newQty > 0);
    } else {
      const price = parseFloat(input.getAttribute('data-price')) || 0;
      const isVoucher = isVoucherProduct(name);
      const storedPrice = isVoucher ? -Math.abs(price) : price;
      const row = input.closest('tr.ss-row');
      if (!row) return;
      const product = purchasingProducts.find(p => p.NAME === name);
      const productCode = product && product.PRODUCTCODE ? product.PRODUCTCODE : "";
      const supplier = product && product.SUPPLIER ? product.SUPPLIER : "";
      const buyUnit = product && product.BUYUNIT ? product.BUYUNIT : "";
      const buyUnitSize = product && product.BUYUNITSIZE ? product.BUYUNITSIZE : "";
      const existingIndex = purchaseCart.findIndex(i => i.name === name && !i.isVariableQuantity);
      if (newQty <= 0) {
        if (existingIndex >= 0) purchaseCart.splice(existingIndex, 1);
      } else {
        if (existingIndex >= 0) {
          purchaseCart[existingIndex].qty = newQty;
        } else {
          purchaseCart.push({ name, price: storedPrice, qty: newQty, category, productName: name, code: productCode, supplier, buyUnit, buyUnitSize, expiryDate: '' });
        }
      }
      const totalCell = document.getElementById(rowId + '-total');
      if (totalCell) {
        totalCell.textContent = newQty > 0 ? formatCurrency(newQty * price) : '';
        if (isVoucher) { totalCell.style.color = newQty > 0 ? '#dc2626' : ''; totalCell.style.fontWeight = newQty > 0 ? '600' : ''; }
      }
      row.classList.toggle('ss-row-active', newQty > 0);
      const minusBtn = row.querySelector('.ss-minus');
      if (minusBtn) minusBtn.disabled = newQty <= 0;
      renderPurchaseSummary();
    }
  }

  function handleSpreadsheetPriceChange(input) {
    const name = input.getAttribute('data-name');
    const category = input.getAttribute('data-category');
    const rowId = input.getAttribute('data-rowid');
    const isVoucher = isVoucherProduct(name);
    const absPrice = Math.abs(parseFloat(input.value) || 0);
    const storedPrice = isVoucher ? -absPrice : absPrice;
    const row = document.getElementById(rowId);
    const qtyInput = row ? row.querySelector('.ss-qty-input') : null;
    const totalInput = document.getElementById(rowId + '-total');
    const currentQty = qtyInput ? (parseFloat(qtyInput.value) || 0) : getCurrentPurchaseVariableQty(name, category);
    if (currentQty > 0) {
      addPurchaseVariableQuantityDirectly(name, category, currentQty, storedPrice);
    }
    if (totalInput) totalInput.value = currentQty > 0 && absPrice > 0 ? Math.abs(currentQty * absPrice) : '';
  }

  function handleSpreadsheetTotalChange(input) {
    const name = input.getAttribute('data-name');
    const category = input.getAttribute('data-category');
    const rowId = input.getAttribute('data-rowid');
    const totalVal = parseFloat(input.value) || 0;
    const isVoucher = isVoucherProduct(name);
    const row = document.getElementById(rowId);
    const qtyInput = row ? row.querySelector('.ss-qty-input') : null;
    const priceInput = row ? row.querySelector('.ss-price-input') : null;
    const currentQty = qtyInput ? (parseFloat(qtyInput.value) || 0) : getCurrentPurchaseVariableQty(name, category);
    if (totalVal <= 0 || currentQty <= 0) return;
    const absPrice = totalVal / currentQty;
    const storedPrice = isVoucher ? -absPrice : absPrice;
    if (priceInput) priceInput.value = Math.round(absPrice);
    addPurchaseVariableQuantityDirectly(name, category, currentQty, storedPrice);
    if (row) row.classList.add('ss-row-active');
  }

  // Make purchase variable quantity functions globally accessible
  window.adjustPurchaseVariableQuantity = adjustPurchaseVariableQuantity;
  window.adjustPurchaseVariablePrice = adjustPurchaseVariablePrice;
  window.updatePurchaseVariableDisplay = updatePurchaseVariableDisplay;
  window.addPurchaseVariableQuantityDirectly = addPurchaseVariableQuantityDirectly;
  window.handlePurchaseVariableQuantityInputChange = handlePurchaseVariableQuantityInputChange;
  window.handlePurchaseVariablePriceInputChange = handlePurchaseVariablePriceInputChange;
  window.handlePurchaseVariableQuantityKeypress = handlePurchaseVariableQuantityKeypress;
  window.handlePurchaseVariablePriceKeypress = handlePurchaseVariablePriceKeypress;
  window.setPurchaseItemExpiryDate = setPurchaseItemExpiryDate;
  window.handleSpreadsheetQtyChange = handleSpreadsheetQtyChange;
  window.handleSpreadsheetPriceChange = handleSpreadsheetPriceChange;
  window.handleSpreadsheetTotalChange = handleSpreadsheetTotalChange;

  // Make showPurchasingTab globally accessible
  if (typeof window !== 'undefined') {
    window.showPurchasingTab = showPurchasingTab;
    window.showPurchaseReceiveTab = showPurchaseReceiveTab;
  }

</script>
