<script>
/** Shared i18n helpers (Snowbee D2 / G3.2) */
(function() {
  function renderSubTabBar(containerId, tabs) {
    var el = document.getElementById(containerId);
    if (!el) return;
    var html = '<div class="sub-tab-bar" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">';
    tabs.forEach(function(tab, idx) {
      var label = typeof t === 'function' ? t(tab.labelKey) : tab.labelKey;
      var active = idx === 0 ? ' active' : '';
      html += '<button type="button" class="sub-tab-btn' + active + '" data-subtab="' + tab.id + '" onclick="' + tab.onClick + '">' + label + '</button>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  function applyLoginI18n() {
    var h2 = document.querySelector('#loginForm h2');
    if (h2 && typeof t === 'function') h2.textContent = t('loginTitle');
    var lu = document.querySelector('label[for="loginUser"]');
    if (lu && typeof t === 'function') lu.textContent = t('loginUsername');
    var lc = document.querySelector('label[for="loginCode"]');
    if (lc && typeof t === 'function') lc.textContent = t('loginPin');
    var btn = document.querySelector('#loginForm button[type="submit"]');
    if (btn && typeof t === 'function') btn.textContent = t('loginButton');
  }

  function downloadCsv(res, defaultName) {
    var payload = (res && res.data) ? res.data : res;
    if (!payload || !payload.csv) return;
    var blob = new Blob([payload.csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = payload.filename || defaultName || 'export.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  window.SnowbeeI18n = {
    renderSubTabBar: renderSubTabBar,
    applyLoginI18n: applyLoginI18n,
    downloadCsv: downloadCsv
  };
})();
</script>
