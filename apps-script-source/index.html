<!DOCTYPE html>
<!-- DEPRECATED (Snowbee A1.6): Unauthenticated legacy POS. Not served by doGet(). Use ui_index.html. -->
<html>
<head>
  <title>Mini Restaurant App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f8f8f8; }
    .container { max-width: 700px; margin: 24px auto; background: #fff; border-radius: 14px; box-shadow: 0 0 16px #eee; padding: 22px; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap:wrap;}
    .lang-select { margin-left:8px; }
    .nav-btn { padding: 10px 18px; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; margin-right:8px; margin-bottom:8px;}
    .orders-btn { background: #fcbe03; color: #000; }
    .deposits-btn { background: #1ec1d9; color: #fff;}
    .expenses-btn { background: #e96f15; color: #fff;}
    .active { box-shadow: 0 2px 10px #ccc; }
    .categories { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap:wrap;}
    .cat-btn { padding: 7px 16px; border: none; background: #eee; border-radius: 14px; cursor: pointer; font-weight: bold;}
    .cat-btn.active { background: #fcbe03; color: #000; }
    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .menu-item { display: flex; align-items: center; background:#f3f3f3; border-radius:8px; padding:10px; gap:14px;}
    .menu-item img { width: 62px; height: 62px; border-radius:8px; object-fit:cover; background:#fff; }
    .item-name { font-size: 1.07rem; font-weight: 600;}
    .item-price { color:#fcbe03; font-weight: bold; margin-left: 10px;}
    .add-btn, .remove-btn { margin-left: auto; background: #fcbe03; border: none; padding: 7px 11px; border-radius: 8px; font-weight: bold; cursor:pointer;}
    .remove-btn { background: #f76c6c; color:#fff;}
    .summary { background: #faf6ea; border-radius:10px; padding:16px; margin-top: 24px; }
    .summary-item { display:flex; align-items:center; margin-bottom:8px;}
    .payment-options { margin-top:15px; }
    .pay-btn { padding: 9px 22px; margin: 0 7px; background: #09c372; color: #fff; border: none; border-radius:8px; font-weight:bold; cursor:pointer;}
    .sales-btn, .neworder-btn {margin:12px 0; background:#f76c6c; color:#fff; border:none; padding:8px 18px; border-radius:8px; font-weight:bold; cursor:pointer;}
    .neworder-btn {background:#fcbe03;color:#222;margin-right:10px;}
    table {width:100%; border-collapse:collapse; margin-bottom:14px;}
    table th, table td {border:1px solid #ddd; padding:8px;}
    table th {background:#fcbe03;}
    @media (max-width: 700px) {
      .container {padding:6px;}
      .menu-item img { width: 48px; height: 48px;}
    }
    /* Expense form */
    #expForm { max-width:400px;margin:0 auto;padding:24px 18px;background:#f9f6f3;border-radius:16px;box-shadow:0 2px 10px #eee; }
    #expForm label {font-weight:bold;}
    #expForm input, #expForm select {width:100%;padding:9px 12px;margin-top:5px;border-radius:8px;border:1px solid #ccc;font-size:1rem;}
  </style>
</head>

    let lang = "id"; // default Indonesian
    let products = [], categories = [], cart = [];
    let currentCategory = '';
    let activeTab = "orders";

    function t(key) {
      return texts[lang][key] || key;
    }

    function changeLang() {
      lang = document.getElementById('langSel').value;
      updateTabLabels();
      switchTab(activeTab);
    }

    function updateTabLabels() {
      document.getElementById('ordersTab').textContent = t('orders');
      document.getElementById('depositsTab').textContent = t('deposits');
      document.getElementById('expensesTab').textContent = t('expenses');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('ordersTab').classList.remove("active");
      document.getElementById('depositsTab').classList.remove("active");
      document.getElementById('expensesTab').classList.remove("active");
      document.getElementById(tab + 'Tab').classList.add("active");
     if(tab === 'orders') {
    renderAppUI();
    fetchProducts();
    setTimeout(function() {
      var dp = document.getElementById('salesDateInput');
      if (dp) {
        let today = new Date().toISOString().substr(0,10);
        dp.value = today;
        dp.max = today;
      }
    }, 100); // delay to wait for DOM update
  } else if(tab === 'deposits') {
    showDeposits();
  } else if(tab === 'expenses') {
    showExpenseForm();
  }
      
    }

    // ========== Orders Component ==========
    function renderAppUI() {
    document.getElementById('main').innerHTML = `
  <h2 style="text-align:center;">${t('menuTitle')}</h2>
  <div style="text-align:right;">
    <button onclick="showSalesSummary()" class="sales-btn" id="salesSummaryBtn">${t('salesSummaryBtn')}</button>
  </div>
  <div id="categories" class="categories"></div>
  <div id="menu" class="menu-list"></div>
  <div class="summary">
    <h3>${t('orderSummary')}</h3>
    <div id="summary"></div>
    <div class="payment-options">
      <span style="font-weight:bold;">${t('payment')}</span>
      <button class="pay-btn" onclick="selectPayment('cash')">${t('cash')}</button>
      <button class="pay-btn" onclick="selectPayment('Dana')">${t('dana')}</button>
    </div>
  </div>
`;

    }

    function fetchProducts() {
      google.script.run.withSuccessHandler(function(data){
        products = JSON.parse(data);
        renderMenu(products);
      }).getProducts();
    }

    function renderMenu(data) {
      // Ensure categories are capital case and filter out falsy values
      categories = [...new Set(data.map(p => (p.CATEGORY || '').toUpperCase()).filter(Boolean))];
      currentCategory = categories.length > 0 ? categories[0] : '';
      renderCategories();
      showProducts(currentCategory);
      renderSummary();
    }

    function renderCategories() {
      let cats = categories.map(cat => 
        `<button class="cat-btn${cat==currentCategory?' active':''}" onclick="switchCategory('${cat}')">${cat}</button>`
      ).join('');
      document.getElementById('categories').innerHTML = cats;
    }

    function switchCategory(cat) {
      currentCategory = cat;
      renderCategories();
      showProducts(cat);
    }
function showProducts(cat) {
  let nf = lang === "id" ? "id-ID" : "en-US";
  let filtered = products.filter(p => (p.CATEGORY || '').toUpperCase() === cat);
  let menuHtml = filtered.map((p, i) => {
    let safeName = p.NAME.replace(/'/g, "\\'");
    let price = Number(p.PRICE);
    // Find current quantity in cart
    let cartItem = cart.find(item => item.name === p.NAME);
    let qty = cartItem ? cartItem.qty : 0;
    return `
      <div class="menu-item">
        <img alt="" src="${p.IMAGEFILEID}">
        <span class="item-name">${p.NAME}</span>
        <span class="item-price">${(lang === "id" ? "Rp" : "IDR") + " " + price.toLocaleString(nf)}</span>
        <div style="display:flex;align-items:center;margin-left:auto;">
          <button aria-label="Remove from cart" class="remove-btn" onclick="removeFromCart('${safeName}')" ${qty === 0 ? 'disabled' : ''}" style="margin-right:5px;">–</button>
          <span style="min-width:24px;display:inline-block;text-align:center;font-weight:bold;">${qty}</span>
          <button aria-label="Add to cart" class="add-btn" onclick="addToCart('${safeName}','${price}','${p.IMAGEFILEID}','${p.CATEGORY}')" style="margin-left:5px;">+</button>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('menu').innerHTML = menuHtml;
}




 function addToCart(name, price, image, category) {
  let found = cart.find(item => item.name === name);
  if (found) found.qty += 1;
  else cart.push({ name, price: parseFloat(price), qty: 1, image, category });
  renderSummary();
  showProducts(currentCategory); // add this line
}

  function removeFromCart(name) {
  let idx = cart.findIndex(item => item.name === name);
  if (idx >= 0) {
    if (cart[idx].qty > 1) cart[idx].qty -= 1;
    else cart.splice(idx,1);
    renderSummary();
    showProducts(currentCategory); // add this line
  }
}

   function renderSummary() {
  let nf = lang === "id" ? "id-ID" : "en-US";
  let sumDiv = document.getElementById('summary');
  if(cart.length === 0){
    sumDiv.innerHTML = t('noItems');
    return;
  }
  let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  // Table header
  let html = `
    <table style="width:100%;margin-bottom:10px;">
      <tr>
        <th>${t('item')}</th>
        <th>${t('qty')}</th>
        <th>${t('amount')}</th>
        <th></th>
      </tr>
      ${
        cart.map(item => `
          <tr>
            <td>
              <img alt="" src="${item.image}" style="width:28px;height:28px;border-radius:4px;vertical-align:middle;margin-right:7px;">
              ${item.name}
            </td>
            <td style="text-align:center;">${item.qty}</td>
            <td style="text-align:right;">${(lang === "id" ? "Rp" : "IDR") + " " + (item.price * item.qty).toLocaleString(nf)}</td>
            <td style="text-align:center;">
              <button class="remove-btn" onclick="removeFromCart('${item.name}')">${t('remove')}</button>
            </td>
          </tr>
        `).join('')
      }
      <tr style="font-weight:bold;">
        <td style="text-align:right;" colspan="2">Total:</td>
        <td style="text-align:right;">${(lang === "id" ? "Rp" : "IDR") + " " + total.toLocaleString(nf)}</td>
        <td></td>
      </tr>
    </table>
  `;
  sumDiv.innerHTML = html;
}


    // Confirm order before saving
    function selectPayment(method) {
      if(cart.length === 0){
        alert(t('pleaseAddItems'));
        return;
      }
      let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      let order = {
        items: cart,
        total: total,
        payment: method
      };
      showOrderConfirmation(order);
    }

    function showOrderConfirmation(order) {
      let nf = lang === "id" ? "id-ID" : "en-US";
      let html = `
       
        <table style="width:100%;margin-bottom:16px;">      
          <tr>
            <th>${t('item')}</th>
            <th>${t('qty')}</th>
            <th>${t('amount')}</th>
          </tr>
          ${order.items.map(item => `
            <tr>
              <td>${item.name}</td>
              <td style="text-align:center;">${item.qty}</td>
              <td style="text-align:right;">${(lang==="id"?"Rp":"IDR")+" "+(item.price * item.qty).toLocaleString(nf)}</td>
            </tr>
          `).join('')}
          <tr>
            <td colspan="2" style="font-weight:bold;text-align:right;">Total:</td>
            <td style="font-weight:bold;text-align:right;">${(lang==="id"?"Rp":"IDR")+" "+(order.total).toLocaleString(nf)}</td>
          </tr>
          <tr>
            <td colspan="2" style="text-align:right;">${t('payment')}:</td>
            <td style="text-align:right;">${order.payment.toUpperCase()}</td>
          </tr>
        </table>
        <div style="text-align:center;">
          <button onclick="confirmOrderSubmission()" class="pay-btn" style="font-size:1rem;padding:10px 24px;">${t('confirmSave')}</button>
          <button onclick="renderAppUI(); fetchProducts();" class="remove-btn" style="margin-left:16px;">${t('back')}</button>
        </div>
      `;
      window._pendingOrder = order;
      document.getElementById('main').innerHTML = html;
    }

    function confirmOrderSubmission() {
      let order = window._pendingOrder;
      if(!order) return;
      google.script.run.withSuccessHandler(function() {
        cart = [];
        window._pendingOrder = null;
        showOrderPlacedScreen(order);
      }).saveOrder(JSON.stringify(order));
    }

    function showOrderPlacedScreen(order) {
      let nf = lang === "id" ? "id-ID" : "en-US";
      
      // Store order for printing
      window._lastReceiptOrder = order;
      
      // Check if BT printer functions are available (from ui_orders.html)
      var hasBt = typeof window.btPrintReceipt === 'function';
      var savedPrinter = localStorage.getItem('btPrinterName');
      var btBtnLabel = savedPrinter ? ('🖨️ BT: ' + savedPrinter) : '🔗 BT Printer';
      
      let html = `
        <h3 style="text-align:center;color:#09c372;">${t('orderPlaced')}</h3>
        <div style="margin:0 auto;max-width:350px;">
          <div id="receiptPreview" style="background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:16px;font-family:Courier,monospace;font-size:12px;line-height:1.4;max-width:320px;margin-left:auto;margin-right:auto;"></div>
          <div id="btPrintStatus" style="display:none;text-align:center;padding:8px;margin-bottom:8px;border-radius:6px;font-size:0.9em;"></div>
          <div style="text-align:center;margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            ${hasBt ? '<button id="btPrintBtn" onclick="btPrintReceipt()" class="pay-btn" style="font-size:0.95rem;padding:10px 18px;background:#007bff;">' + btBtnLabel + '</button>' : ''}
            <button onclick="printReceiptInline()" class="pay-btn" style="font-size:0.95rem;padding:10px 18px;background:#28a745;">🖨️ ${t('printReceipt') || 'Print'}</button>
            <button onclick="switchTab('orders')" class="neworder-btn" style="font-size:0.95rem;padding:10px 18px;">${t('newOrder')}</button>
          </div>
        </div>
      `;
      document.getElementById('main').innerHTML = html;
      
      // Render receipt preview inline
      renderReceiptPreview(order);
      
      // Fetch outlet printer config from server
      if (hasBt && typeof window.loadOutletPrinterConfig === 'function') {
        window.loadOutletPrinterConfig();
      }
    }

    // Render receipt preview inside the app
    function renderReceiptPreview(order) {
      var nf = lang === "id" ? "id-ID" : "en-US";
      var preview = document.getElementById('receiptPreview');
      if (!preview) return;
      
      var orderNumber = order.orderNumber || 'N/A';
      var currentDate = new Date();
      var dateStr = currentDate.toLocaleDateString(nf);
      var timeStr = currentDate.toLocaleTimeString(nf);
      var currencyPrefix = (lang === "id" ? "Rp" : "IDR");
      
      var itemsHtml = '';
      for (var i = 0; i < order.items.length; i++) {
        var item = order.items[i];
        var itemName = item.name.length > 20 ? item.name.substring(0, 17) + '...' : item.name;
        itemsHtml += '<div style="display:flex;justify-content:space-between;margin:2px 0;">' +
          '<div style="flex:1;">' + itemName + '</div>' +
          '<div style="width:30px;text-align:center;">' + item.qty + 'x</div>' +
          '<div style="width:70px;text-align:right;">' + (item.price * item.qty).toLocaleString(nf) + '</div>' +
          '</div>';
      }
      
      preview.innerHTML = '<div style="text-align:center;font-weight:bold;">POS RECEIPT</div>' +
        '<div style="text-align:center;">Order: ' + orderNumber + '</div>' +
        '<div style="text-align:center;">' + dateStr + ' ' + timeStr + '</div>' +
        '<div style="border-bottom:1px dashed #000;margin:6px 0;"></div>' +
        itemsHtml +
        '<div style="border-bottom:1px dashed #000;margin:6px 0;"></div>' +
        '<div style="display:flex;justify-content:space-between;font-weight:bold;border-top:1px solid #000;padding-top:4px;margin-top:4px;">' +
          '<div>TOTAL</div><div>' + currencyPrefix + ' ' + order.total.toLocaleString(nf) + '</div>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;"><div>Payment:</div><div>' + order.payment.toUpperCase() + '</div></div>' +
        '<div style="border-bottom:1px dashed #000;margin:6px 0;"></div>' +
        '<div style="text-align:center;">Thank you!</div>' +
        '<div style="text-align:center;">Please come again</div>';
    }

    // Print the receipt using an inline iframe (stays within the app)
    function printReceiptInline() {
      var order = window._lastReceiptOrder;
      if (!order) {

          '<div style="text-align:center;font-weight:bold;">POS RECEIPT</div>' +
          '<div style="text-align:center;">Order: ' + orderNumber + '</div>' +
          '<div style="text-align:center;">' + dateStr + ' ' + timeStr + '</div>' +
          '<div style="border-bottom:1px dashed #000;margin:4px 0;"></div>' +
          itemsHtml +
          '<div style="border-bottom:1px dashed #000;margin:4px 0;"></div>' +
          '<div style="display:flex;justify-content:space-between;font-weight:bold;border-top:1px solid #000;padding-top:4px;margin-top:4px;">' +
            '<div>TOTAL</div><div>' + currencyPrefix + ' ' + order.total.toLocaleString(nf) + '</div>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;"><div>Payment:</div><div>' + order.payment.toUpperCase() + '</div></div>' +

          '<div style="text-align:center;">Thank you!</div>' +
          '<div style="text-align:center;">Please come again</div>' +
          '</div>';
        
        document.body.appendChild(overlay);
      } catch (error) {
        console.error('Failed to print receipt:', error);
      }
    }

function renderSalesSummary(data, selectedDate) {
  let nf = lang === "id" ? "id-ID" : "en-US";
  let dateStr = "";
  if (selectedDate) {
    let dateObj = new Date(selectedDate);
    dateStr = dateObj.toLocaleDateString(nf, {year:'numeric', month:'short', day:'numeric'});
  }
  let html = `
    <h3>${t('salesSummary')} ${dateStr ? '('+dateStr+')' : ''}</h3>
    <div style="text-align:right; margin-bottom:10px;">
      <input type="date" id="salesDateInput"
        max=""
        value="${selectedDate || ''}"
        style="padding:7px 14px; border-radius:6px; border:1px solid #ddd;"
        onchange="showSalesSummary(this.value)">
      <button onclick="startNewOrder()" class="neworder-btn" style="margin-left:10px;">${t('newOrder')}</button>
    </div>
    <table>
      <tr><th>${t('item')}</th><th>${t('qty')}</th><th>${t('sales')}</th></tr>
  `;



  let hasData = false;
  if (data && data.summary && Object.keys(data.summary).length) {
    Object.keys(data.summary).sort().forEach(category => {
  html += `<tr><td colspan="3" style="font-weight:bold; background:#ffeab0;">${category}</td></tr>`;
  let catQty = 0, catSales = 0;
  // --- SORT items by qty descending ---
  const itemsArray = Object.entries(data.summary[category])
    .sort((a, b) => b[1].qty - a[1].qty);
  itemsArray.forEach(([item, rec]) => {
    catQty += rec.qty;
    catSales += rec.sales;
    html += `<tr>
      <td>${item}</td>
      <td>${rec.qty}</td>
      <td>${(lang==="id"?"Rp":"IDR")+" "+rec.sales.toLocaleString(nf)}</td>
    </tr>`;
  });
  html += `<tr style="background:#faf6ea;font-weight:bold;">
    <td style="text-align:right;">Subtotal:</td>
    <td>${catQty}</td>
    <td>${(lang==="id"?"Rp":"IDR")+" "+catSales.toLocaleString(nf)}</td>
  </tr>`;
  hasData = true;
});

  }
  if (!hasData) {
    html += `<tr><td colspan="3" style="text-align:center;">-</td></tr>`;
  }
  html += `</table>
    <div><b>${t('totalSales')}:</b> ${(lang==="id"?"Rp":"IDR")+" "+ (data.totalSales||0).toLocaleString(nf)}<br>
    <b>${t('ordersCount')}:</b> ${(data.ordersCount||0)}<br>
    <b>🚫 ${t('missedOrder') || 'Missed Orders'}:</b> ${(data.missedOrdersCount||0)} ${t('item') || 'items'} (${(lang==="id"?"Rp":"IDR")+" "+(data.missedOrdersTotal||0).toLocaleString(nf)})</div>
  `;
  document.getElementById('main').innerHTML = html;
}

          ${(data.allExpenses||[]).length === 0 ? `<tr><td colspan="5" style="text-align:center;">-</td></tr>` : ""}

    function submitDeposit() {
      var amt = parseFloat(document.getElementById('depositAmount').value);
      var note = document.getElementById('depositNote').value;
      if (!amt || amt <= 0) {
        alert('Please enter a valid deposit amount.');
        return;
      }
      google.script.run.withSuccessHandler(() => {
        showDeposits();
        alert(t('depositRecorded'));
      }).addDeposit(amt, note);
    }

    function renderExpenseForm(accounts, sources) {
      let nf = lang === "id" ? "id-ID" : "en-US";
      let accOptions = accounts.map(acc => `<option value="${acc}">${acc}</option>`).join('');
      let sourceOptions = sources.map(src => `<option value="${src}">${src}</option>`).join('');
      let html = `
        <h3 style="text-align:center;margin-bottom:20px;color:#e96f15;">${lang==="id"?"Catat Pengeluaran":"Record Expense"}</h3>
        <form id="expForm" onsubmit="event.preventDefault(); submitExpense();">
          <div style="margin-bottom:15px;">
            <label>${t('amount')}</label><br>
            <input type="number" id="expAmount" min="1" required placeholder="0">
          </div>
          <div style="margin-bottom:15px;">
            <label>${t('account')}</label><br>
            <select id="expAccount">${accOptions}</select>
          </div>
          <div style="margin-bottom:15px;">
            <label>${t('source')}</label><br>
            <select id="expSource">${sourceOptions}</select>
          </div>
          <div style="margin-bottom:20px;">
            <label>${t('note')}</label><br>
            <input type="text" id="expNote" placeholder="${t('note')} (${lang==='id'?'opsional':'optional'})">

          <button type="submit" class="pay-btn expenses-btn" style="width:100%;padding:12px;font-size:1.09rem;">${t('save')}</button>

          <button onclick="switchTab('orders')" class="neworder-btn" style="padding:10px 26px;font-size:1rem;">${t('newOrder')}</button>

      `;
      document.getElementById('main').innerHTML = html;
      fetchExpenseSummary();

    function submitExpense() {
      var amt = parseFloat(document.getElementById('expAmount').value);
      var acc = document.getElementById('expAccount').value;
      var source = document.getElementById('expSource').value;
      var note = document.getElementById('expNote').value;
      if (!amt || amt <= 0) {
        alert(lang==="id"?"Masukkan jumlah valid!":"Enter a valid amount!");
        return;
      }
      google.script.run.withSuccessHandler(() => {
        alert(t('expenseRecorded'));
        showExpenseForm();
      }).addExpense(amt, acc, source, note);
    }

function fetchSalesSummaryByDate() {

}

function setDatePickerToToday() {
  var dateInput = document.getElementById('salesDateInput');
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var dd = String(today.getDate()).padStart(2, '0');
  var todayStr = yyyy + '-' + mm + '-' + dd;
  return todayStr;
  // Set default selected value to today
}
