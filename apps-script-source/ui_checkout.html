<script>
  // Payment and checkout functionality
  
  // Helper function to format date for backend in dd-mm-yyyy HH:mm:ss format
  function formatDateForBackend(date) {
    const d = new Date(date);
    
    // Use local time methods to avoid timezone issues
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const seconds = String(d.getSeconds()).padStart(2, '0');
    
    return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
  }
  
  function unlockCartScrollState_() {
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
  }

  function resetCheckoutButtonState_() {
    window._processingCheckout = false;
    var checkoutBtn = document.getElementById('cartCheckoutBtn');
    if (checkoutBtn) {
      checkoutBtn.disabled = cart.length === 0;
      checkoutBtn.style.opacity = '';
      checkoutBtn.innerHTML = typeof t === 'function' ? t('proceedToCheckout') : 'Proceed to Checkout';
    }
  }

  function proceedToCheckout() {
    // Prevent multiple checkout attempts
    if (window._processingCheckout) {
      return;
    }
    window._processingCheckout = true;

    try {
      if (cart.length === 0) {
        window.showErrorModal(t('pleaseAddItems') || 'Please add items to your cart first.');
        resetCheckoutButtonState_();
        return;
      }

      if (typeof window.toggleCartPanel === 'function') {
        window.toggleCartPanel(false);
      }
      unlockCartScrollState_();

      // Disable the cart checkout button (not generic .pay-btn elsewhere in the app)
      const checkoutBtn = document.getElementById('cartCheckoutBtn');
      if (checkoutBtn) {
        checkoutBtn.disabled = true;
        checkoutBtn.style.opacity = '0.6';
        checkoutBtn.innerHTML = typeof t === 'function' ? (t('processing') || 'Processing...') : 'Processing...';
      }

      let total = cart.reduce((sum, item) => sum + (item.isSoldOut ? 0 : item.price * item.qty), 0);
      if (typeof window.syncActiveWorkflowOrderFromCart === 'function') {
        window.syncActiveWorkflowOrderFromCart();
      }
      var activeWorkflowOrder = (typeof window.getCurrentActiveWorkflowOrder === 'function')
        ? window.getCurrentActiveWorkflowOrder()
        : null;

      let order = {
        orderNumber: generateClientOrderNumber(),
        items: cart,
        total: total,
        payment: null, // Will be set when user selects payment method
        parkedOrderId: activeWorkflowOrder ? activeWorkflowOrder.id : '',
        parkedIdentifier: activeWorkflowOrder ? (activeWorkflowOrder.identifier || '') : ''
      };

      // If all items are sold-out, skip payment and just save missed orders
      var hasRegularItems = cart.some(function(item) { return !item.isSoldOut; });
      if (!hasRegularItems) {
        order.payment = 'none';
        order.submittedAt = formatDateForBackend(new Date());
        window._pendingOrder = order;
        showSpinner(typeof t === 'function' ? t('recordingMissedOrders') : 'Recording missed orders...');
        if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
          var missedPayload = {
            orderNumber: order.orderNumber,
            items: order.items,
            submittedAt: order.submittedAt
          };
          window.SecurityWrapper.secureServerCall('saveMissedOrdersSecure', { missedData: JSON.stringify(missedPayload) })
            .then(function() {
              hideSpinner();
              cart = [];
              window._pendingOrder = null;
              showToast(typeof t === 'function' ? t('missedOrdersRecorded') : 'Missed orders recorded', 'success');
              startNewOrder();
            })
            .catch(function(err) {
              hideSpinner();
              console.error('Failed to save missed orders:', err);
              window.showErrorModal(typeof t === 'function' ? t('failedToSaveMissedOrders') : 'Failed to save missed orders. Please try again.');
            })
            .finally(function() {
              resetCheckoutButtonState_();
            });
        } else {
          resetCheckoutButtonState_();
        }
        return;
      }

      showPaymentSelection(order);
    } catch (error) {
      console.error('proceedToCheckout failed:', error);
      if (window.showErrorModal) {
        window.showErrorModal((t('checkoutFailed') || 'Could not open checkout') + ': ' + (error.message || error));
      }
      resetCheckoutButtonState_();
      return;
    }

    // Reset the flag after showing payment selection
    setTimeout(function() {
      window._processingCheckout = false;
      var checkoutBtn = document.getElementById('cartCheckoutBtn');
      if (checkoutBtn) {
        checkoutBtn.disabled = false;
        checkoutBtn.style.opacity = '';
        checkoutBtn.innerHTML = typeof t === 'function' ? t('proceedToCheckout') : 'Proceed to Checkout';
      }
    }, 500);
  }

  function handleCartCheckout_() {
    if (!window.SecurityWrapper || typeof window.SecurityWrapper.isUserAuthenticated !== 'function') {
      if (window.showErrorModal) {
        window.showErrorModal('Security not ready. Please refresh the page.');
      }
      return;
    }
    if (!window.SecurityWrapper.isUserAuthenticated()) {
      window.SecurityWrapper.forceLogout();
      return;
    }
    proceedToCheckout();
  }

  function shouldSkipCheckoutConfirm_() {
    return localStorage.getItem('snowbeeSkipCheckoutConfirm') !== '0';
  }

  function selectPayment(method) {
    // Prevent multiple payment selections
    if (window._selectingPayment) {
      return;
    }
    
    if (!window._pendingOrder) {
      window.showErrorModal(t('noOrderFound') || 'No order found. Please try again.');
      return;
    }
    
    // For cash payments, show cash tendered screen first
    if (method.toLowerCase() === 'cash') {
      showCashTenderedForm(method);
      return;
    }
    
    if (shouldSkipCheckoutConfirm_()) {
      processPaymentSelection(method);
      return;
    }

    // Show professional confirmation modal
    window.showConfirmationModal(
      t('confirmSubmitOrder') || 'Are you sure you want to submit this order?',
      () => {
        // User confirmed - proceed with submission
        processPaymentSelection(method);
      },
      () => {
        // User cancelled - do nothing
        console.log('Order submission cancelled by user');
      }
    );
  }

  function showCashTenderedForm(method) {
    if (!window._pendingOrder) return;
    var cashMethod = method || 'cash';
    
    let nf = lang === "id" ? "id-ID" : "en-US";
    let total = window._pendingOrder.total;
    let currencySymbol = lang === "id" ? "Rp" : "IDR";
    
    let html = `
      <div class="cash-tendered-screen">
        <h2 style="text-align:center">💵 ${t('cashPayment') || 'Cash Payment'}</h2>
        
        <div class="order-summary-preview">
          <h3>${t('orderSummary')}</h3>
          <table style="width:100%;margin-bottom:16px;">
            <tr>
              <th>${t('item')}</th>
              <th>${t('qty')}</th>
              <th>${t('amount')}</th>
            </tr>
            ${window._pendingOrder.items.filter(item => !item.isSoldOut).map(item => `
              <tr>
                <td>${item.name}</td>
                <td style="text-align:center;">${item.qty}</td>
                <td style="text-align:right;">${currencySymbol} ${(item.price * item.qty).toLocaleString(nf)}</td>
              </tr>
            `).join('')}
            <tr style="font-weight:bold;border-top:2px solid #ddd;">
              <td colspan="2" style="text-align:right;">Total:</td>
              <td style="text-align:right;">${currencySymbol} ${total.toLocaleString(nf)}</td>
            </tr>
          </table>
        </div>
        
        <div style="background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; padding: 20px; margin: 20px 0;">
          <div style="text-align:center; margin-bottom: 16px;">
            <label for="cashTenderedInput" style="display: block; font-weight: bold; font-size: 1.1em; margin-bottom: 8px;">
              ${t('amountPaid') || 'Amount Paid by Customer'}:
            </label>
            <input type="number" 
                   id="cashTenderedInput" 
                   min="${total}"
                   step="1000"
                   placeholder="${total}"
                   style="width: 80%; max-width: 300px; padding: 14px; font-size: 1.3em; border: 2px solid #28a745; border-radius: 8px; text-align: center; font-weight: bold;"
                   oninput="calculateChange()"
                   autofocus>
          </div>
          
          <div id="changeDisplay" style="background: white; padding: 16px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="font-weight: bold;">${t('orderTotal') || 'Order Total'}:</span>
              <span>${currencySymbol} ${total.toLocaleString(nf)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="font-weight: bold;">${t('amountPaid') || 'Amount Paid'}:</span>
              <span id="paidAmountDisplay">${currencySymbol} 0</span>
            </div>
            <hr style="margin: 12px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 1.3em; font-weight: bold;">
              <span>🔄 ${t('change') || 'Change'}:</span>
              <span id="changeAmountDisplay" style="color: #dc3545;">${currencySymbol} 0</span>
            </div>
          </div>
          
          <div id="cashValidationMessage" style="margin-top: 12px; padding: 8px; border-radius: 4px; display: none;"></div>
        </div>

        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;">
          <button type="button" class="pay-btn" style="padding:10px 16px;font-size:0.95em;" onclick="setQuickCashAmount('exact')">${t('cashExact') || 'Exact'}</button>
          <button type="button" class="pay-btn" style="padding:10px 16px;font-size:0.95em;background:#17a2b8;" onclick="setQuickCashAmount(50000)">+50k</button>
          <button type="button" class="pay-btn" style="padding:10px 16px;font-size:0.95em;background:#17a2b8;" onclick="setQuickCashAmount(100000)">+100k</button>
        </div>
        
        <div style="text-align:center;margin-top:20px;">
          <button id="confirmCashPaymentBtn" 
                  class="pay-btn" 
                  onclick="confirmCashPayment('${cashMethod}')" 
                  style="margin-right: 16px; padding: 16px 32px; font-size: 16px;"
                  disabled>
            ${t('confirmPayment') || 'Confirm Payment'}
          </button>
          <button onclick="showPaymentSelection(window._pendingOrder)" class="remove-btn" style="padding: 16px 32px; font-size: 16px;">
            ${t('back') || 'Back'}
          </button>
        </div>
      </div>
    `;
    
    getElem('main').innerHTML = html;
    
    // Focus the input after render
    setTimeout(() => {
      const input = document.getElementById('cashTenderedInput');
      if (input) input.focus();
    }, 100);
  }

  function setQuickCashAmount(mode) {
    if (!window._pendingOrder) return;
    var input = document.getElementById('cashTenderedInput');
    if (!input) return;
    var total = window._pendingOrder.total;
    if (mode === 'exact') {
      input.value = total;
    } else {
      var current = parseFloat(input.value) || total;
      input.value = current + Number(mode);
    }
    calculateChange();
  }

  function calculateChange() {
    if (!window._pendingOrder) return;
    
    let total = window._pendingOrder.total;
    let cashInput = document.getElementById('cashTenderedInput');
    let amountPaid = parseFloat(cashInput.value) || 0;
    let change = amountPaid - total;
    
    let nf = lang === "id" ? "id-ID" : "en-US";
    let currencySymbol = lang === "id" ? "Rp" : "IDR";
    
    document.getElementById('paidAmountDisplay').textContent = currencySymbol + ' ' + amountPaid.toLocaleString(nf);
    
    let changeDisplay = document.getElementById('changeAmountDisplay');
    let validationMsg = document.getElementById('cashValidationMessage');
    let confirmBtn = document.getElementById('confirmCashPaymentBtn');
    
    if (amountPaid <= 0) {
      changeDisplay.textContent = currencySymbol + ' 0';
      changeDisplay.style.color = '#dc3545';
      validationMsg.innerHTML = '⚠️ ' + (t('enterAmountPaid') || 'Please enter the amount paid by the customer');
      validationMsg.style.display = 'block';
      validationMsg.style.background = '#fff3cd';
      validationMsg.style.color = '#856404';
      validationMsg.style.border = '1px solid #ffeaa7';
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = '0.5';
    } else if (change < 0) {
      changeDisplay.textContent = currencySymbol + ' ' + change.toLocaleString(nf);
      changeDisplay.style.color = '#dc3545';
      validationMsg.innerHTML = '❌ ' + (t('insufficientAmount') || 'Insufficient amount. Customer needs to pay at least') + ' ' + currencySymbol + ' ' + total.toLocaleString(nf);
      validationMsg.style.display = 'block';
      validationMsg.style.background = '#f8d7da';
      validationMsg.style.color = '#721c24';
      validationMsg.style.border = '1px solid #f5c6cb';
      confirmBtn.disabled = true;
      confirmBtn.style.opacity = '0.5';
    } else {
      changeDisplay.textContent = currencySymbol + ' ' + change.toLocaleString(nf);
      changeDisplay.style.color = '#28a745';
      if (change > 0) {
        validationMsg.innerHTML = '💰 ' + (t('returnChange') || 'Return change to customer') + ': <strong>' + currencySymbol + ' ' + change.toLocaleString(nf) + '</strong>';
        validationMsg.style.display = 'block';
        validationMsg.style.background = '#d4edda';
        validationMsg.style.color = '#155724';
        validationMsg.style.border = '1px solid #c3e6cb';
      } else {
        validationMsg.style.display = 'none';
      }
      confirmBtn.disabled = false;
      confirmBtn.style.opacity = '1';
    }
  }

  function confirmCashPayment(method) {
    if (!window._pendingOrder) return;
    var cashMethod = method || 'cash';
    
    let total = window._pendingOrder.total;
    let amountPaid = parseFloat(document.getElementById('cashTenderedInput').value) || 0;
    let change = amountPaid - total;
    
    if (amountPaid < total) {
      window.showErrorModal(t('insufficientAmount') || 'Insufficient amount.');
      return;
    }
    
    // Store cash tendered info on the order
    window._pendingOrder.cashTendered = amountPaid;
    window._pendingOrder.changeAmount = change;
    
    var cashMethodName = cashMethod;
    if (shouldSkipCheckoutConfirm_()) {
      processPaymentSelection(cashMethodName);
      return;
    }
    window.showConfirmationModal(
      t('confirmSubmitOrder') || 'Are you sure you want to submit this order?',
      () => {
        processPaymentSelection(cashMethodName);
      },
      () => {
        console.log('Order submission cancelled by user');
      }
    );
  }

  window.setQuickCashAmount = setQuickCashAmount;
  window.showCashTenderedForm = showCashTenderedForm;
  window.calculateChange = calculateChange;
  window.confirmCashPayment = confirmCashPayment;
  window.setDiscountMode = setDiscountMode;
  window.updateDiscountDisplay = updateDiscountDisplay;
  window.applyDiscountToOrder = applyDiscountToOrder;
  window.selectPaymentWithDiscount = selectPaymentWithDiscount;

  function getPaymentMethodMeta(methodName) {
    var methods = window._cachedPaymentMethods || [];
    var key = String(methodName || '').trim().toLowerCase();
    for (var i = 0; i < methods.length; i++) {
      if (String(methods[i].name || '').trim().toLowerCase() === key) return methods[i];
    }
    return null;
  }

  function paymentMethodOpensDrawer(methodName) {
    var meta = getPaymentMethodMeta(methodName);
    if (meta && typeof meta.openDrawer === 'boolean') return meta.openDrawer;
    return String(methodName || '').trim().toLowerCase() === 'cash';
  }

  function resolveOrderOpenCashDrawer(order) {
    if (!order || !order.payment) return false;
    var total = Number(order.total) || 0;
    if (total <= 0) return false;
    var pay = String(order.payment).trim().toLowerCase();
    if (order.paymentDetails || (order.paymentSplits && order.paymentSplits.length)) {
      var cashPortion = 0;
      if (order.paymentSplits && order.paymentSplits.length) {
        order.paymentSplits.forEach(function(s) {
          if (String(s.method || '').trim().toLowerCase() === 'cash') cashPortion += Number(s.amount) || 0;
        });
      } else {
        cashPortion = Number(order.paymentDetails.cash) || 0;
      }
      if (cashPortion <= 0) return false;
      return paymentMethodOpensDrawer('cash');
    }
    return paymentMethodOpensDrawer(order.payment);
  }

  window.getPaymentMethodMeta = getPaymentMethodMeta;
  window.paymentMethodOpensDrawer = paymentMethodOpensDrawer;
  window.resolveOrderOpenCashDrawer = resolveOrderOpenCashDrawer;

  /** Stamp autoDeposit + destinationAccount from login-cached payment methods (avoids server sheet read). */
  function attachPaymentMetaToOrder_(order) {
    if (!order || typeof getPaymentMethodMeta !== 'function') return order;

    if (order.paymentSplits && order.paymentSplits.length) {
      order.paymentSplits = order.paymentSplits.map(function(split) {
        var meta = getPaymentMethodMeta(split.method);
        return {
          method: split.method,
          amount: split.amount,
          destinationAccount: split.destinationAccount || (meta ? meta.destinationAccount : '') || '',
          autoDeposit: meta ? !!meta.autoDeposit : false
        };
      });
      return order;
    }

    if (order.payment) {
      var paymentMeta = getPaymentMethodMeta(order.payment);
      if (paymentMeta) {
        order.destinationAccount = order.destinationAccount || paymentMeta.destinationAccount || '';
        order.autoDeposit = !!paymentMeta.autoDeposit;
      }
    }
    return order;
  }

  function processPaymentSelection(method) {
    // Set the flag after confirmation to prevent multiple submissions
    window._selectingPayment = true;
    
    // Disable all payment buttons and show processing state
    const paymentButtons = document.querySelectorAll('.payment-method-btn');
    paymentButtons.forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      if (btn.onclick && btn.onclick.toString().includes(method)) {
        btn.innerHTML = `<div style="font-size:1.5rem;">⏳</div><div>Processing...</div>`;
      }
    });
    
    // Also disable the back button to prevent navigation during processing
    const backButton = document.querySelector('.remove-btn');
    if (backButton) {
      backButton.disabled = true;
      backButton.style.opacity = '0.6';
      backButton.style.pointerEvents = 'none';
    }
    
    // Disable all navigation tabs to prevent tab switching during processing
    const navButtons = document.querySelectorAll('.nav-btn');
    navButtons.forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';
    });
    
    // Use global navigation control if available
    if (window.disableAllNavigationWithRefreshProtection) {
      window.disableAllNavigationWithRefreshProtection();
    } else if (window.disableAllNavigation) {
      window.disableAllNavigation();
    }
    
    // Set payment method and submit order immediately
    window._pendingOrder.payment = method;
    attachPaymentMetaToOrder_(window._pendingOrder);
    window._pendingOrder.openCashDrawer = resolveOrderOpenCashDrawer(window._pendingOrder);
    window._pendingOrder.submittedAt = formatDateForBackend(new Date());
    
    // Submit the order directly (SecurityWrapper will handle authentication)
    submitOrderDirectly(window._pendingOrder);
  }

  function showPaymentSelection(order) {
    let nf = lang === "id" ? "id-ID" : "en-US";
    let cs = lang === "id" ? "Rp" : "IDR";

    // Preserve original total so discount can be re-applied correctly on back navigation
    if (order.originalTotal === undefined) {
      order.originalTotal = order.total;
    } else {
      order.total = order.originalTotal;
      order.discount = 0;
    }

    // Reset discount mode each time the screen is shown
    window._discountMode = 'amount';
    
    let html = `
      <div class="payment-selection-screen">
        <h2 style="text-align:center">${t('selectPayment')}</h2>
        
        <!-- Order Summary -->
        <div class="order-summary-preview">
          <h3>${t('orderSummary')}</h3>
          <table style="width:100%;margin-bottom:16px;">
            <tr>
              <th>${t('item')}</th>
              <th>${t('qty')}</th>
              <th>${t('amount')}</th>
            </tr>
            ${order.items.filter(item => !item.isSoldOut).map(item => `
              <tr>
                <td>${item.name}</td>
                <td style="text-align:center;">${item.qty}</td>
                <td style="text-align:right;">${cs+" "+(item.price * item.qty).toLocaleString(nf)}</td>
              </tr>
            `).join('')}
            <tr style="font-weight:bold;border-top:2px solid #ddd;">
              <td colspan="2" style="text-align:right;">Total:</td>
              <td style="text-align:right;">${cs+" "+(order.total).toLocaleString(nf)}</td>
            </tr>
            ${order.items.filter(item => item.isSoldOut).length > 0 ? '<tr><td colspan="3" style="padding-top:8px;color:#dc2626;font-weight:600;font-size:0.85em;">🚫 ' + (typeof t === "function" && t("missedOrderItems") || "Missed / Sold-Out Items") + '</td></tr>' + order.items.filter(item => item.isSoldOut).map(item => '<tr style="background:#fef2f2;"><td style="color:#dc2626;text-decoration:line-through;">' + item.name + '</td><td style="text-align:center;color:#dc2626;">' + item.qty + '</td><td style="text-align:right;color:#dc2626;text-decoration:line-through;">' + (cs+" "+(item.price * item.qty).toLocaleString(nf)) + '</td></tr>').join('') : ''}
          </table>
        </div>

        <!-- Discount Section -->
        <div style="background:#f8f9fa;border:2px solid #e9ecef;border-radius:12px;padding:16px;margin:16px 0;">
          <h3 style="text-align:center;margin:0 0 12px 0;font-size:1em;color:#475569;">
            💸 ${t('discount') || 'Discount'} <span style="font-weight:normal;font-size:0.9em;">(${t('optional') || 'Optional'})</span>
          </h3>
          <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;">
            <button id="discountModeAmountBtn"
                    onclick="setDiscountMode('amount')"
                    class="pay-btn"
                    style="padding:8px 20px;font-size:0.9em;min-width:90px;">
              ${t('amount') || 'Amount'}
            </button>
            <button aria-label="Set discount mode" id="discountModePercentBtn"
                    onclick="setDiscountMode('percent')"
                    class="remove-btn"
                    style="padding:8px 20px;font-size:0.9em;min-width:90px;">
              %
            </button>
          </div>
          <div style="text-align:center;margin-bottom:12px;">
            <input type="number"
                   id="discountInput"
                   min="0"
                   step="1000"
                   placeholder="0"
                   style="width:60%;max-width:240px;padding:10px;font-size:1.2em;border:2px solid #0ea5e9;border-radius:8px;text-align:center;font-weight:bold;"
                   oninput="updateDiscountDisplay()">
          </div>
          <div id="discountSummary" style="background:white;padding:12px;border-radius:8px;border:1px solid #ddd;display:none;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span>${t('subtotal') || 'Subtotal'}:</span>
              <span id="discountOriginalTotal"></span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:#dc2626;font-weight:600;">
              <span>${t('discount') || 'Discount'}:</span>
              <span id="discountAmountDisplay"></span>
            </div>
            <hr style="margin:8px 0;">
            <div style="display:flex;justify-content:space-between;font-size:1.1em;font-weight:bold;">
              <span>${t('finalTotal') || 'Final Total'}:</span>
              <span id="discountFinalTotal" style="color:#16a34a;"></span>
            </div>
          </div>
        </div>
        
        <!-- Payment Method Selection -->
        <div class="payment-method-selection">
          <h3 style="text-align:center;margin-bottom:20px;">${t('selectPaymentMethod')}</h3>
          <div id="payment-buttons-container" class="payment-buttons" style="display:flex;flex-wrap:wrap;justify-content:center;">
            <div style="padding:20px;color:#94a3b8;">${t('loading') || 'Loading...'}</div>
          </div>
        </div>
        
        <div style="text-align:center;margin-top:20px;">
          <button onclick="switchTab('orders')" class="remove-btn">${t('back')}</button>
        </div>
      </div>
    `;
    window._pendingOrder = order;
    unlockCartScrollState_();
    var main = getElem('main');
    if (!main) {
      throw new Error('Main content area not found');
    }
    main.innerHTML = html;
    // Render synchronously if already preloaded; otherwise fetch and render
    if (window._cachedPaymentMethods) {
      renderDynamicPaymentButtons(window._cachedPaymentMethods);
    } else {
      getCachedPaymentMethods().then(function(methods) {
        renderDynamicPaymentButtons(methods || []);
      }).catch(function(err) {
        console.error('Failed to load payment methods for checkout:', err);
        renderDynamicPaymentButtons([]);
      });
    }
  }

  var _paymentIcons = {
    'cash': '💵', 'bank': '🏦', 'qris': '📱',
    'ovo': '💜', 'credit card': '💳', 'dana': '📲'
  };

  window.initPaymentMethodsCache = function(deviceId, username) {
    window._cachedPaymentMethods = null;
    window._paymentMethodsPromise = null;
    var dId = deviceId || (window.LoginState ? window.LoginState.deviceId : null);
    var uname = username || (window.LoginState ? window.LoginState.user : null);
    if (!dId || !uname) return;
    window._paymentMethodsPromise = new Promise(function(resolve) {
      google.script.run
        .withSuccessHandler(function(methods) {
          window._cachedPaymentMethods = Array.isArray(methods) ? methods : [];
          console.log('Payment methods cached:', window._cachedPaymentMethods.length);
          resolve(window._cachedPaymentMethods);
        })
        .withFailureHandler(function() {
          console.warn('Failed to load payment methods');
          window._cachedPaymentMethods = [];
          resolve([]);
        })
        .getPaymentMethods(dId, uname);
    });
  };

  function getCachedPaymentMethods() {
    if (window._cachedPaymentMethods) {
      return Promise.resolve(window._cachedPaymentMethods);
    }
    if (window._paymentMethodsPromise) {
      return window._paymentMethodsPromise; // Reuse in-flight - no second server call
    }
    // Fallback: should not normally reach here
    window.initPaymentMethodsCache();
    return window._paymentMethodsPromise;
  }

  // Filters cached payment methods to those enabled for a given module.
  // Empty module column = available for all modules.
  window._getCachedPaymentMethodsForModule = function(moduleFilter, callback) {
    function applyFilter(methods) {
      callback(methods.filter(function(m) {
        var mod = (m.module || '').trim();
        return !mod || mod.split(',').some(function(s) {
          return s.trim().toLowerCase() === moduleFilter.toLowerCase();
        });
      }));
    }
    if (window._cachedPaymentMethods) {
      applyFilter(window._cachedPaymentMethods);
    } else {
      getCachedPaymentMethods().then(applyFilter);
    }
  };

  function isCheckoutOnlyPaymentKey(key) {
    key = (key || '').toString().trim().toLowerCase();
    return key === 'partial' || key === 'split';
  }

  function renderDynamicPaymentButtons(methods) {
    var container = document.getElementById('payment-buttons-container');
    if (!container) return;
    var html = '';
    var filtered = methods.filter(function(m) {
      var mod = (m.module || '').trim();
      var key = m.name.toLowerCase();
      if (isCheckoutOnlyPaymentKey(key)) return false;
      return !mod || mod.split(',').some(function(s) { return s.trim().toLowerCase() === 'selling'; });
    });
    filtered.forEach(function(m) {
      var key = m.name.toLowerCase();
      var icon = _paymentIcons[key] || '💳';
      var dest = String(m.destinationAccount || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      var escapedName = String(m.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      html += '<button class="pay-btn payment-method-btn" ' +
        'onclick="window._pendingOrder.destinationAccount=\'' + dest + '\'; selectPaymentWithDiscount(\'' + escapedName + '\')" ' +
        'style="margin:10px;padding:20px;width:30%;">' +
        '<div style="font-size:2rem;margin-bottom:8px;">' + icon + '</div>' +
        '<div>' + m.name + '</div>' +
        '</button>';
    });
    html += '<button id="splitPaymentBtn" class="pay-btn payment-method-btn" ' +
      'onclick="showSplitPaymentFormWithDiscount()" ' +
      'style="margin:10px;padding:20px;width:30%;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);border:2px solid #6366f1;">' +
      '<div style="font-size:2rem;margin-bottom:8px;">🔀</div>' +
      '<div>' + (t('splitPayment') || 'Split Payment') + '</div>' +
      '</button>';
    container.innerHTML = html;
    // Apply Free-visibility rule against the current discount state
    if (typeof updateDiscountDisplay === 'function') updateDiscountDisplay();
  }

  function setDiscountMode(mode) {
    window._discountMode = mode;
    const amountBtn = document.getElementById('discountModeAmountBtn');
    const percentBtn = document.getElementById('discountModePercentBtn');
    if (amountBtn) amountBtn.className = mode === 'amount' ? 'pay-btn' : 'remove-btn';
    if (percentBtn) percentBtn.className = mode === 'percent' ? 'pay-btn' : 'remove-btn';
    updateDiscountDisplay();
  }

  function updateDiscountDisplay() {
    if (!window._pendingOrder) return;
    const originalTotal = window._pendingOrder.originalTotal || window._pendingOrder.total;
    const input = document.getElementById('discountInput');
    const discountVal = parseFloat(input ? input.value : 0) || 0;
    const mode = window._discountMode || 'amount';
    const nf = lang === 'id' ? 'id-ID' : 'en-US';
    const cs = lang === 'id' ? 'Rp' : 'IDR';

    let discountAmount = 0;
    if (discountVal > 0) {
      discountAmount = mode === 'percent'
        ? Math.min(originalTotal * discountVal / 100, originalTotal)
        : Math.min(discountVal, originalTotal);
      discountAmount = Math.max(0, Math.round(discountAmount));
    }
    const finalTotal = originalTotal - discountAmount;

    const summary = document.getElementById('discountSummary');
    if (discountVal > 0) {
      if (summary) summary.style.display = 'block';
      const origEl = document.getElementById('discountOriginalTotal');
      const amtEl = document.getElementById('discountAmountDisplay');
      const finalEl = document.getElementById('discountFinalTotal');
      if (origEl) origEl.textContent = cs + ' ' + originalTotal.toLocaleString(nf);
      if (amtEl) amtEl.textContent = '- ' + cs + ' ' + discountAmount.toLocaleString(nf);
      if (finalEl) finalEl.textContent = cs + ' ' + finalTotal.toLocaleString(nf);
    } else {
      if (summary) summary.style.display = 'none';
    }

    // Free payment is only valid when the discount covers the entire order value.
    // Show only Free when total is fully discounted; otherwise hide Free and show the rest.
    var allPaymentBtns = document.querySelectorAll('.payment-method-btn');
    var fullyDiscounted = finalTotal === 0 && discountVal > 0;
    if (fullyDiscounted) {
      allPaymentBtns.forEach(function(btn) {
        var btnText = btn.textContent || btn.innerText || '';
        var isFree = btnText.trim().toLowerCase().indexOf('free') !== -1 ||
                     btnText.trim().toLowerCase().indexOf('gratis') !== -1;
        btn.style.display = isFree ? '' : 'none';
      });
    } else {
      allPaymentBtns.forEach(function(btn) {
        var btnText = btn.textContent || btn.innerText || '';
        var isFree = btnText.trim().toLowerCase().indexOf('free') !== -1 ||
                     btnText.trim().toLowerCase().indexOf('gratis') !== -1;
        // Keep Free hidden unless the whole order value is discounted
        btn.style.display = isFree ? 'none' : '';
      });
      // Disable partial payment button when discount is active
      var splitBtn = document.getElementById('splitPaymentBtn');
      if (splitBtn) {
        if (discountVal > 0) {
          splitBtn.disabled = true;
          splitBtn.style.opacity = '0.4';
          splitBtn.style.cursor = 'not-allowed';
          splitBtn.title = t('splitNotAllowedWithDiscount') || t('partialNotAllowedWithDiscount') || 'Split payment not available with discount';
        } else {
          splitBtn.disabled = false;
          splitBtn.style.opacity = '';
          splitBtn.style.cursor = '';
          splitBtn.title = '';
        }
      }
    }
  }

  function isFreePaymentMethodName_(method) {
    var name = (method || '').toString().trim().toLowerCase();
    return name.indexOf('free') !== -1 || name.indexOf('gratis') !== -1;
  }

  function applyDiscountToOrder(forceMethod) {
    if (!window._pendingOrder) return;
    const originalTotal = window._pendingOrder.originalTotal !== undefined
      ? window._pendingOrder.originalTotal
      : window._pendingOrder.total;
    window._pendingOrder.originalTotal = originalTotal;

    const input = document.getElementById('discountInput');
    const discountVal = parseFloat(input ? input.value : 0) || 0;
    const mode = window._discountMode || 'amount';

    let discountAmount = 0;
    if (discountVal > 0) {
      discountAmount = mode === 'percent'
        ? Math.min(originalTotal * discountVal / 100, originalTotal)
        : Math.min(discountVal, originalTotal);
      discountAmount = Math.max(0, Math.round(discountAmount));
    }

    // Free payment: the entire order value is treated as a discount so it is
    // recorded as a "free" expense and nets to zero effect on cash in hand.
    if (isFreePaymentMethodName_(forceMethod)) {
      discountAmount = Math.max(0, Math.round(originalTotal));
      window._pendingOrder.discountMode = 'amount';
      window._pendingOrder.discountValue = discountAmount;
    } else {
      window._pendingOrder.discountMode = mode;
      window._pendingOrder.discountValue = discountVal;
    }

    window._pendingOrder.discount = discountAmount;
    window._pendingOrder.total = originalTotal - discountAmount;
  }

  function selectPaymentWithDiscount(method) {
    applyDiscountToOrder(method);
    selectPayment(method);
  }

  function showSplitPaymentFormWithDiscount() {
    var input = document.getElementById('discountInput');
    var discountVal = parseFloat(input ? input.value : 0) || 0;
    if (discountVal > 0) {
      alert(t('splitNotAllowedWithDiscount') || t('partialNotAllowedWithDiscount') || 'Split payment is not available when a discount is applied.');
      return;
    }
    applyDiscountToOrder();
    showSplitPaymentForm();
  }

  window.showSplitPaymentFormWithDiscount = showSplitPaymentFormWithDiscount;
  window.showPartialPaymentFormWithDiscount = showSplitPaymentFormWithDiscount;

  function generateClientOrderNumber() {
    // Generate a temporary order number for display purposes
    // Server will generate the final order number to ensure uniqueness
    var now = new Date();
    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    var hours = String(now.getHours()).padStart(2, '0');
    var minutes = String(now.getMinutes()).padStart(2, '0');
    var seconds = String(now.getSeconds()).padStart(2, '0');
    var random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
    
    return 'ORD-' + year + month + day + '-' + hours + minutes + seconds + '-' + random;
  }

  function startNewOrder() {
    if (typeof window.startNewOrderWithWorkflow === 'function') {
      window.startNewOrderWithWorkflow();
    } else {
      cart = [];
    }
    currentCategory = '';
    
    // Clear the orders tab state to ensure fresh display
    clearTabState('orders');
    
    switchTab('orders');
  }

  function submitOrderDirectly(order) {
    if (!order) {
      window._selectingPayment = false;
      restorePaymentButtons();
      window.showErrorModal(t('noOrderFound') || 'No order found. Please try again.');
      return;
    }
    
    // Separate sold-out (missed) items from regular items
    var regularItems = order.items.filter(function(item) { return !item.isSoldOut; });
    var missedItems = order.items.filter(function(item) { return item.isSoldOut; });

    // Build the order with only regular items for the Orders sheet
    var regularOrder = Object.assign({}, order, { items: regularItems });
    attachPaymentMetaToOrder_(regularOrder);

    // Try online submission
    showSpinner('Submitting order...');

    // ✅ SECURITY: Use SecurityWrapper for authenticated server calls
    if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
      console.log('Using SecurityWrapper for order submission');
      
      // Submit regular order (only if there are regular items)
      var orderPromise = regularItems.length > 0
        ? window.SecurityWrapper.secureServerCall('saveOrderSecure', { orderData: JSON.stringify(regularOrder) })
        : Promise.resolve({ success: true, orderNumber: order.orderNumber, itemCount: 0 });

      // Submit missed orders in parallel (fire-and-forget, don't block checkout)
      if (missedItems.length > 0) {
        var missedPayload = {
          orderNumber: order.orderNumber,
          items: missedItems,
          submittedAt: order.submittedAt
        };
        window.SecurityWrapper.secureServerCall('saveMissedOrdersSecure', { missedData: JSON.stringify(missedPayload) })
          .then(function() { console.log('Missed orders saved successfully'); })
          .catch(function(err) { console.warn('Failed to save missed orders (non-blocking):', err); });
      }

      orderPromise
        .then(function(result) {
          if (result && result.success === false) {
            hideSpinner();
            window._selectingPayment = false;
            restoreNavigationAfterSubmission();
            window.showErrorModal(result.error || t('orderSubmissionFailed') || 'Order submission failed. Please try again.');
            return;
          }
          hideSpinner();
          window._selectingPayment = false;
          cart = [];
          window._pendingOrder = null;

          // Show success immediately — don't wait for background refreshes
          showOrderPlacedScreen(order);
          restoreNavigationAfterSubmission();

          if (typeof window.closeActiveWorkflowOrder === 'function') {
            try {
              window.closeActiveWorkflowOrder(order);
            } catch (workflowError) {
              console.warn('Failed to close active workflow order:', workflowError);
            }
          }

          if (typeof kickCashDrawerIfNeeded === 'function') {
            kickCashDrawerIfNeeded(order);
          }
          if (typeof isOutletAutoPrintEnabled === 'function' && isOutletAutoPrintEnabled() && typeof smartPrintReceipt === 'function') {
            setTimeout(function() { smartPrintReceipt(); }, 150);
          }
          if (localStorage.getItem('snowbeeAutoNewOrder') !== '0') {
            setTimeout(function() { startNewOrder(); }, 2000);
          }

          // Background work after UI is responsive
          setTimeout(function() {
            if (typeof fetchAyamStock === 'function') fetchAyamStock();
            if (typeof refreshRecookAlertsFromServer === 'function') refreshRecookAlertsFromServer();
            else if (typeof fetchRecookAlerts === 'function') fetchRecookAlerts(true);
          }, 0);

          // Record discount as expense (fire-and-forget, non-blocking)
          if (order.discount && order.discount > 0 && order.payment) {
            var discountOrderRef = (result.orderNumbers && result.orderNumbers.length > 0)
              ? result.orderNumbers.join(', ')
              : (result.orderNumber || order.orderNumber);
            var discountExpense = {
              amount: order.discount,
              account: typeof t === 'function' ? (t('discount') || 'Discount') : 'Discount',
              payment: order.payment,
              note: discountOrderRef,
              date: order.submittedAt || formatDateForBackend(new Date())
            };
            window.SecurityWrapper.secureServerCall('recordExpenseSecure', discountExpense)
              .then(function() { console.log('Discount expense recorded:', order.discount); })
              .catch(function(err) { console.warn('Failed to record discount expense (non-blocking):', err); });
          }
          return;
        })
        .catch(function(error) {
          hideSpinner(); // Hide the spinner on failed submission
          console.error('Order submission failed via SecurityWrapper:', error);
          window._selectingPayment = false;
          
          // Restore navigation tabs after failed submission
          restoreNavigationAfterSubmission();
          
          // Check if it's an authentication error
          if (error && error.toString().toLowerCase().includes('authentication')) {
            console.warn('Authentication error during order submission, redirecting to login');
            window.SecurityWrapper.forceLogout();
          } else {
            // Show error message
            window.showErrorModal(t('orderSubmissionFailed') || 'Order submission failed. Please try again.');
          }
        });
    } else {
      console.error('SecurityWrapper not available - order submission requires secure authentication');
      hideSpinner();
      window._selectingPayment = false;
      
      // Restore navigation tabs
      restoreNavigationAfterSubmission();
      
      // Show error message
      if (window.showErrorModal) {
        window.showErrorModal('Security system not available. Please refresh the page and try again.');
      } else {
        alert('Security system not available. Please refresh the page and try again.');
      }
    }
  }

  // Helper function to restore payment buttons to original state
  function restorePaymentButtons() {
    const paymentButtons = document.querySelectorAll('.payment-method-btn');
    paymentButtons.forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = '1';
      
      // Restore original button content based on payment type
      if (btn.onclick && btn.onclick.toString().includes('cash')) {
        btn.innerHTML = `<div style="font-size:2rem;margin-bottom:8px;">💵</div><div>${t('cash')}</div>`;
      } else if (btn.onclick && btn.onclick.toString().includes('dana')) {
        btn.innerHTML = `<div style="font-size:2rem;margin-bottom:8px;">📱</div><div>${t('dana')}</div>`;
      } else if (btn.id === 'splitPaymentBtn' || (btn.onclick && btn.onclick.toString().indexOf('showSplitPaymentForm') >= 0)) {
        btn.innerHTML = '<div style="font-size:2rem;margin-bottom:8px;">🔀</div><div>' + (t('splitPayment') || 'Split Payment') + '</div>';
      }
    });
    
    // Also restore the back button
    const backButton = document.querySelector('.remove-btn');
    if (backButton) {
      backButton.disabled = false;
      backButton.style.opacity = '1';
      backButton.style.pointerEvents = 'auto';
    }
  }

  // Function to restore navigation after order submission (success or failure)
  function restoreNavigationAfterSubmission() {
    console.log('Restoring navigation after order submission');
    
    // Restore all navigation tabs
    const navButtons = document.querySelectorAll('.nav-btn');
    navButtons.forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    });
    
    // Use global navigation control if available
    if (window.enableAllNavigationAndAllowRefresh) {
      console.log('Using global enableAllNavigationAndAllowRefresh');
      window.enableAllNavigationAndAllowRefresh();
    } else if (window.enableAllNavigation) {
      console.log('Using global enableAllNavigation');
      window.enableAllNavigation();
    }
    
    // Also restore payment buttons
    restorePaymentButtons();
    
    // Clear processing flags
    window._processingCheckout = false;
    window._selectingPayment = false;
    
    console.log('Navigation restoration complete');
  }


  window.startNewOrder = startNewOrder;
  window.proceedToCheckout = proceedToCheckout;
  window.handleCartCheckout = handleCartCheckout_;
  window.showPaymentSelection = showPaymentSelection;
  window.attachPaymentMetaToOrder_ = attachPaymentMetaToOrder_;
</script>
