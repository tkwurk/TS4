<script>
/**
 * Role-focused sidebar groups, default landing tabs, and focus/maximize modes.
 */
(function() {
  var TAB_ORDER = [
    'orders', 'salesSummary', 'stockReport', 'purchasing', 'purchasingReceive',
    'purchasingLocal', 'deposits', 'profitLoss', 'usageReport',
    'monthlySalesReport', 'inventoryConsumption', 'investments', 'attendance',
    'checklist', 'kitchenCooking', 'adminOrders', 'agentConsole', 'tutorials'
  ];

  var NAV_GROUPS = [
    { id: 'selling', labelKey: 'navGroupSelling', tabs: ['orders'] },
    { id: 'reports', labelKey: 'navGroupReports', tabs: ['salesSummary', 'stockReport', 'usageReport', 'monthlySalesReport', 'profitLoss'] },
    { id: 'cash', labelKey: 'navGroupCash', tabs: ['deposits', 'inventoryConsumption'] },
    { id: 'inventory', labelKey: 'navGroupInventory', tabs: ['purchasing', 'purchasingReceive', 'purchasingLocal'] },
    { id: 'chef', labelKey: 'navGroupChef', tabs: ['kitchenCooking'] },
    { id: 'people', labelKey: 'navGroupPeople', tabs: ['attendance', 'checklist'] },
    { id: 'admin', labelKey: 'navGroupAdmin', tabs: ['adminOrders', 'investments', 'agentConsole'] },
    { id: 'help', labelKey: 'navGroupHelp', tabs: ['tutorials'] }
  ];

  var ROLE_DEFAULT_TAB = {
    cashier: 'orders',
    chef: 'kitchenCooking',
    supervisor: 'orders',
    manager: 'orders',
    admin: 'adminOrders',
    readonly: 'salesSummary'
  };

  /** Tabs that auto-collapse sidebar for maximum workspace (unless user pinned open). */
  var FOCUS_TABS = ['orders', 'salesSummary', 'stockReport', 'kitchenCooking', 'inventoryConsumption'];
  var REPORT_MAX_TABS = ['salesSummary', 'stockReport', 'usageReport', 'monthlySalesReport', 'profitLoss', 'inventoryConsumption'];

  function tLabel(key, fallback) {
    return (typeof t === 'function' ? t(key) : null) || fallback || key;
  }

  function getRole() {
    if (window.SnowbeeAccess && window.SnowbeeAccess.getRole) {
      return window.SnowbeeAccess.getRole();
    }
    return (window.LoginState && window.LoginState.role) || window.currentRole || 'cashier';
  }

  function getDefaultTab() {
    if (window.SnowbeeAccess && typeof window.SnowbeeAccess.getAccessibleDefaultTab === 'function') {
      return window.SnowbeeAccess.getAccessibleDefaultTab();
    }
    var role = (getRole() || 'cashier').toString().toLowerCase();
    return ROLE_DEFAULT_TAB[role] || ROLE_DEFAULT_TAB.cashier;
  }

  function isTabVisible(btn) {
    if (!btn) return false;
    if (btn.classList.contains('tab-hidden')) return false;
    if (btn.style.display === 'none') return false;
    return btn.classList.contains('tab-visible') || btn.style.display !== 'none';
  }

  function ensureFlatNavCache() {
    var parts = TAB_ORDER.map(function(tabId) {
      var btn = document.getElementById(tabId + 'Tab');
      return btn ? btn.outerHTML : '';
    });
    var found = parts.filter(Boolean).length;
    // Only store a complete snapshot — partial DOM would corrupt the cache permanently
    if (found === TAB_ORDER.length) {
      window._sidebarTabsFlatHTML = parts.join('\n');
      window._sidebarTabsFlatComplete = true;
      return true;
    }
    if (!window._sidebarTabsFlatHTML && found > 0) {
      window._sidebarTabsFlatHTML = parts.filter(Boolean).join('\n');
    }
    return !!window._sidebarTabsFlatComplete;
  }

  function restoreFlatNavButtons() {
    var container = document.querySelector('.sidebar-tabs');
    if (!container || !window._sidebarTabsFlatHTML) return false;
    container.innerHTML = window._sidebarTabsFlatHTML;
    return true;
  }

  function resetFlatNavCache() {
    window._sidebarTabsFlatHTML = null;
    window._sidebarTabsFlatComplete = false;
  }

  function isTabAllowed(tabId) {
    if (window.SnowbeeAccess && typeof window.SnowbeeAccess.hasTabAccess === 'function') {
      return window.SnowbeeAccess.hasTabAccess(tabId);
    }
    var btn = document.getElementById(tabId + 'Tab');
    return isTabVisible(btn);
  }

  function applyButtonVisibility() {
    TAB_ORDER.forEach(function(tabId) {
      var btn = document.getElementById(tabId + 'Tab');
      if (!btn) return;
      var show = isTabAllowed(tabId);
      btn.classList.toggle('tab-visible', show);
      btn.classList.toggle('tab-hidden', !show);
      btn.style.display = show ? '' : 'none';
    });
  }

  function organizeSidebar() {
    var container = document.querySelector('.sidebar-tabs');
    if (!container) return;

    // Always restore the full button set from cache before applying visibility
    if (window._sidebarTabsFlatHTML) {
      restoreFlatNavButtons();
    } else {
      ensureFlatNavCache();
    }
    if (!window._sidebarTabsFlatHTML) return;

    applyButtonVisibility();

    var grouped = {};
    NAV_GROUPS.forEach(function(group) {
      group.tabs.forEach(function(tabId) { grouped[tabId] = true; });
    });

    var fragment = document.createDocumentFragment();
    NAV_GROUPS.forEach(function(group) {
      var visibleBtns = [];
      group.tabs.forEach(function(tabId) {
        if (!isTabAllowed(tabId)) return;
        var btn = document.getElementById(tabId + 'Tab');
        if (btn) visibleBtns.push(btn);
      });
      if (!visibleBtns.length) return;

      var header = document.createElement('div');
      header.className = 'nav-group-header';
      header.setAttribute('data-group', group.id);
      header.textContent = tLabel(group.labelKey, group.id);
      fragment.appendChild(header);

      visibleBtns.forEach(function(btn) {
        fragment.appendChild(btn);
      });
    });

    // Any allowed tab not listed in a group still appears at the bottom
    var orphanBtns = [];
    TAB_ORDER.forEach(function(tabId) {
      if (grouped[tabId]) return;
      if (!isTabAllowed(tabId)) return;
      var btn = document.getElementById(tabId + 'Tab');
      if (btn) orphanBtns.push(btn);
    });
    if (orphanBtns.length) {
      var orphanHeader = document.createElement('div');
      orphanHeader.className = 'nav-group-header';
      orphanHeader.setAttribute('data-group', 'other');
      orphanHeader.textContent = tLabel('navGroupOther', 'Other');
      fragment.appendChild(orphanHeader);
      orphanBtns.forEach(function(btn) { fragment.appendChild(btn); });
    }

    container.innerHTML = '';
    container.appendChild(fragment);

    // Refresh cache only while every tab button exists in the live DOM
    ensureFlatNavCache();
  }

  function collapseSidebarForFocus() {
    var sidebar = document.getElementById('sidebarNav');
    if (!sidebar || window._sidebarPinnedOpen) return;
    sidebar.classList.add('collapsed');
    document.body.classList.add('sidebar-collapsed');
  }

  function applyFocusMode(tab) {
    document.body.classList.remove('role-focus', 'report-maximize');
    var container = document.querySelector('#appContent > .container');
    if (container) container.classList.remove('report-maximize');

    if (FOCUS_TABS.indexOf(tab) >= 0) {
      document.body.classList.add('role-focus');
      collapseSidebarForFocus();
    }

    if (REPORT_MAX_TABS.indexOf(tab) >= 0) {
      document.body.classList.add('report-maximize');
      if (container) container.classList.add('report-maximize');
    }

    var oqs = document.getElementById('orderQueueSidebar');
    if (oqs) {
      if (tab === 'orders') {
        oqs.style.display = '';
      } else if (tab === 'salesSummary' || tab === 'stockReport' || tab === 'kitchenCooking') {
        oqs.style.display = 'none';
      }
    }
  }

  function initSidebarPinListener() {
    var toggle = document.getElementById('sidebarToggle');
    if (!toggle || toggle._roleNavBound) return;
    toggle._roleNavBound = true;
    toggle.addEventListener('click', function() {
      var sidebar = document.getElementById('sidebarNav');
      if (!sidebar) return;
      window._sidebarPinnedOpen = !sidebar.classList.contains('collapsed');
    });
  }

  window.SnowbeeRoleNav = {
    organizeSidebar: organizeSidebar,
    applyFocusMode: applyFocusMode,
    getDefaultTab: getDefaultTab,
    resetFlatNavCache: resetFlatNavCache,
    NAV_GROUPS: NAV_GROUPS,
    ROLE_DEFAULT_TAB: ROLE_DEFAULT_TAB,
    TAB_ORDER: TAB_ORDER
  };

  window.getRoleDefaultTab = getDefaultTab;

  var _origUpdateTabVisibility = window.updateTabVisibility;
  window.updateTabVisibility = function() {
    if (_origUpdateTabVisibility) _origUpdateTabVisibility();
    organizeSidebar();
    initSidebarPinListener();
  };

  document.addEventListener('DOMContentLoaded', function() {
    ensureFlatNavCache();
    initSidebarPinListener();
  });

  document.addEventListener('loginSuccess', function() {
    setTimeout(function() {
      if (typeof window.updateTabVisibility === 'function') {
        window.updateTabVisibility();
      } else {
        organizeSidebar();
      }
    }, 150);
  });

  document.addEventListener('logout', function() {
    resetFlatNavCache();
  });
})();
</script>
