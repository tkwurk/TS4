// ===== MERGED SALES MODULE =====
// This module combines all sales-related functionality

// Main sales summary function - this is the primary entry point
function showSalesSummary(selectedDate) {
  window._salesSummaryView = 'summary';
  // Get main element
  const main = getElem('main');
  if (!main) {
    console.error('Main element not found');
    return;
  }
  
  // Clear and show loading
  main.innerHTML = '<div class="loading">Loading sales summary...</div>';
  
  let today = new Date();
  let dateStr = selectedDate || setDatePickerToToday();

  // ✅ SECURITY: Use SecurityWrapper for authenticated calls to ensure outlet filtering
  if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
    window.SecurityWrapper.secureServerCall('getSalesSummaryByDate', { dateString: dateStr })
      .then(function(data) {
        // Guard: only render if still on salesSummary tab
        if (window.currentTab !== 'salesSummary') { console.log('Sales summary response ignored - tab changed'); return; }
        try {
          const parsedData = typeof data === 'string' ? JSON.parse(data) : data;
          
          renderSalesSummary(parsedData, dateStr);
        } catch (error) {
          console.error('Error rendering sales summary:', error);
          showSalesErrorState(`Error rendering sales data: ${error.message}`);
        }
      })
      .catch(function(error) {
        if (window.currentTab !== 'salesSummary') return;
        console.error('Failed to load sales summary:', error);
        showSalesErrorState(`Failed to load sales data: ${error}`);
      });
  } else {
    // Fallback for backward compatibility (without outlet filtering)
    console.warn('SecurityWrapper not available, using legacy call without outlet filtering');
    google.script.run.withSuccessHandler(function(data){
      // Guard: only render if still on salesSummary tab
      if (window.currentTab !== 'salesSummary') { console.log('Sales summary response ignored - tab changed'); return; }
      try {
        renderSalesSummary(JSON.parse(data), dateStr);
      } catch (error) {
        console.error('Error rendering sales summary:', error);
        showSalesErrorState(`Error rendering sales data: ${error.message}`);
      }
    }).withFailureHandler(function(error) {
      console.error('Failed to load sales summary:', error);
      showSalesErrorState(`Failed to load sales data: ${error}`);
    }).getSalesSummaryByDate(dateStr);
  }
}

// Initialize sales module for main app integration
function initSalesModule() {
  // Check if the external module functions exist
  if (typeof renderSalesSummary === 'function') {
    // External module is loaded, call the external function directly
    const main = getElem('main');
    if (main) {
      // Initialize the main content area for sales summary
      main.innerHTML = '<div id="sales-summary-container"></div>';
      
      // Get today's date for initial load
      const today = new Date();
      const dateStr = today.getFullYear() + '-' + 
                     String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                     String(today.getDate()).padStart(2, '0');
      
      // ✅ SECURITY: Use SecurityWrapper for authenticated calls to ensure outlet filtering
      if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
        window.SecurityWrapper.secureServerCall('getSalesSummaryByDate', { dateString: dateStr })
          .then(function(data) {
            const parsedData = typeof data === 'string' ? JSON.parse(data) : data;
            // Set main content for sales summary
            main.innerHTML = '<div id="sales-summary-content"></div>';
            // Call the external module's render function
            renderSalesSummary(parsedData, dateStr);
          })
          .catch(function(error) {
            main.innerHTML = `<div class="error">Failed to load sales summary: ${error}</div>`;
          });
      } else {
        // Fallback for backward compatibility
        console.warn('SecurityWrapper not available, using legacy call');
        google.script.run
          .withSuccessHandler(function(data) {
            // Set main content for sales summary
            main.innerHTML = '<div id="sales-summary-content"></div>';
            // Call the external module's render function
            renderSalesSummary(JSON.parse(data), dateStr);
          })
          .withFailureHandler(function(error) {
            main.innerHTML = `<div class="error">Failed to load sales summary: ${error}</div>`;
          })
          .getSalesSummaryByDate(dateStr);
      }
    }
  } else {
    // External module not loaded, show placeholder
    showSalesErrorFallback();
  }
}

function setDatePickerToToday() {
  var dateInput = document.getElementById('salesDateInput');
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var dd = String(today.getDate()).padStart(2, '0');
  var todayStr = yyyy + '-' + mm + '-' + dd;
  return todayStr;
}

function exportSalesSummaryCsv() {
  var dateInput = document.getElementById('salesDateInput');
  var dateStr = dateInput ? dateInput.value : '';
  if (!window.SecurityWrapper || !window.SecurityWrapper.secureServerCall) return;
  window.SecurityWrapper.secureServerCall('exportSalesSummaryCsvSecure', { date: dateStr })
    .then(function(res) {
      if (window.SnowbeeI18n && window.SnowbeeI18n.downloadCsv) {
        window.SnowbeeI18n.downloadCsv(res, 'sales.csv');
      }
    })
    .catch(function(err) {
      if (window.showToast) window.showToast('CSV export failed: ' + err, 'error');
    });
}

  if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {

        showSalesErrorState((t('orderLinesLoadFailed') || 'Failed to load order lines') + ': ' + error);

      })
      .withFailureHandler(function(error) {
        showSalesErrorState((t('orderLinesLoadFailed') || 'Failed to load order lines') + ': ' + error);
      })
      .getOrderLinesByDate(dateStr);

                 onchange="${activeView === 'lines' ? 'loadOrderLinesView(this.value)' : 'showSalesSummary(this.value)'}">

            <span class="btn-icon">➕</span>

window._orderLinesSource = [];
window._orderLinesData = [];
window._orderLinesSort = { col: 0, dir: 'asc' };
window._orderLinesFilters = {};

var ORDER_LINES_KEYS = ['timestamp', 'orderNumber', 'category', 'productName', 'qty', 'price', 'lineTotal', 'payment', 'username'];
var ORDER_LINES_SELECT_COLS = { 2: true, 7: true, 8: true };

function orderLinesFilterPlaceholder(col) {
  if (ORDER_LINES_SELECT_COLS[col]) return '';
  return t('filterPlaceholder') || 'Filter…';
}

function orderLinesUniqueValues(field) {
  var seen = {};
  (window._orderLinesSource || []).forEach(function(row) {
    var v = String(row[field] || '').trim();
    if (v) seen[v] = true;
  });
  return Object.keys(seen).sort(function(a, b) { return a.localeCompare(b); });
}

function orderLinesCellDisplay(row, col, nf) {
  var key = ORDER_LINES_KEYS[col];
  if (key === 'timestamp') {
    var ts = row.timestamp ? new Date(row.timestamp) : null;
    return ts && !isNaN(ts.getTime())
      ? ts.toLocaleTimeString(nf, { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : String(row.timestamp || '');
  }
  if (key === 'price' || key === 'lineTotal') {
    return String(row[key] != null ? row[key] : '');
  }
  return String(row[key] != null ? row[key] : '');
}

function rowMatchesOrderLinesFilter(row, col, filterVal, nf) {
  if (!filterVal) return true;
  var key = ORDER_LINES_KEYS[col];
  var val = orderLinesCellDisplay(row, col, nf);
  if (ORDER_LINES_SELECT_COLS[col]) {
    return val.toLowerCase() === String(filterVal).toLowerCase();
  }
  return val.toLowerCase().indexOf(String(filterVal).toLowerCase().trim()) !== -1;
}

function getFilteredOrderLines() {
  var source = window._orderLinesSource || [];
  var filters = window._orderLinesFilters || {};
  var nf = lang === 'id' ? 'id-ID' : 'en-US';
  var hasFilter = false;
  for (var c = 0; c < ORDER_LINES_KEYS.length; c++) {
    if (filters[c]) { hasFilter = true; break; }
  }
  if (!hasFilter) return source.slice();
  return source.filter(function(row) {
    for (var col = 0; col < ORDER_LINES_KEYS.length; col++) {
      if (filters[col] && !rowMatchesOrderLinesFilter(row, col, filters[col], nf)) return false;
    }
    return true;
  });
}

function sortOrderLinesArray(lines) {
  if (!lines || !lines.length) return lines || [];
  var sort = window._orderLinesSort || { col: 0, dir: 'asc' };
  var dir = sort.dir;
  var key = ORDER_LINES_KEYS[sort.col] || 'timestamp';
  return lines.slice().sort(function(a, b) {
    var va = a[key];
    var vb = b[key];
    if (key === 'timestamp') {
      va = new Date(va).getTime();
      vb = new Date(vb).getTime();
      if (isNaN(va)) va = 0;
      if (isNaN(vb)) vb = 0;
      return dir === 'asc' ? va - vb : vb - va;
    }
    if (key === 'qty' || key === 'price' || key === 'lineTotal') {
      va = Number(va) || 0;
      vb = Number(vb) || 0;
      return dir === 'asc' ? va - vb : vb - va;
    }
    if (key === 'orderNumber') {
      var na = parseFloat(va);
      var nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) {
        return dir === 'asc' ? na - nb : nb - na;
      }
    }
    va = String(va || '').toLowerCase();
    vb = String(vb || '').toLowerCase();
    var cmp = va.localeCompare(vb);
    return dir === 'asc' ? cmp : -cmp;
  });
}

function orderLinesSortIndicator(col) {
  var sort = window._orderLinesSort || {};
  if (sort.col !== col) return '';
  return '<span class="order-lines-sort-ind">' + (sort.dir === 'asc' ? '▲' : '▼') + '</span>';
}

function buildOrderLinesFilterControl(col) {
  var filters = window._orderLinesFilters || {};
  var val = filters[col] || '';
  if (ORDER_LINES_SELECT_COLS[col]) {
    var key = ORDER_LINES_KEYS[col];
    var opts = orderLinesUniqueValues(key);
    var allLabel = t('filterAll') || 'All';
    var html = '<select class="order-lines-filter" onchange="setOrderLinesFilter(' + col + ', this.value)" onclick="event.stopPropagation()">' +
      '<option value="">' + allLabel + '</option>';
    opts.forEach(function(o) {
      var sel = val === o ? ' selected' : '';
      html += '<option value="' + String(o).replace(/"/g, '&quot;') + '"' + sel + '>' + o + '</option>';
    });
    html += '</select>';
    return html;
  }
  return '<input type="text" class="order-lines-filter" placeholder="' + orderLinesFilterPlaceholder(col) + '" value="' +
    String(val).replace(/"/g, '&quot;') + '" oninput="setOrderLinesFilter(' + col + ', this.value)" onclick="event.stopPropagation()">';
}

function buildOrderLinesTableHead() {

    t('colCategory') || 'Category',
    t('item') || 'Item',
    t('qty') || 'Qty',

    t('colPayment') || 'Payment',
    t('colCashier') || 'Cashier'
  ];
  var rightCols = { 4: true, 5: true, 6: true };
  var cells = labels.map(function(label, col) {
    var cls = rightCols[col] ? ' class="right"' : '';
    return '<th' + cls + '>' +
      '<div role="button" tabindex="0" class="order-lines-th-sort" onclick="sortOrderLinesTable(' + col + ')">' + label + orderLinesSortIndicator(col) + '</div>' +
      buildOrderLinesFilterControl(col) +
      '</th>';
  }).join('');
  return '<thead><tr>' + cells + '</tr></thead>';
}

function updateOrderLinesMeta() {
  var metaEl = document.getElementById('order-lines-meta');
  if (!metaEl) return;
  var source = window._orderLinesSource || [];
  var visible = window._orderLinesData || [];
  var totalAmount = 0;
  visible.forEach(function(row) {
    totalAmount += Number(row.lineTotal) || 0;
  });
  var filters = window._orderLinesFilters || {};
  var hasFilter = false;
  for (var c = 0; c < ORDER_LINES_KEYS.length; c++) {
    if (filters[c]) { hasFilter = true; break; }
  }
  var countText;
  if (hasFilter && visible.length !== source.length) {
    var showingTpl = t('orderLinesShowing') || 'Showing {n} of {total}';
    countText = showingTpl.replace('{n}', visible.length).replace('{total}', source.length);
  } else {
    countText = (t('orderLinesCount') || 'Line items') + ': <strong>' + source.length + '</strong>';
  }
  var clearBtn = hasFilter
    ? ' <button type="button" class="order-lines-filter-clear" onclick="clearOrderLinesFilters()">' +
      (t('clearFilters') || 'Clear filters') + '</button>'
    : '';
  metaEl.innerHTML = countText + ' · ' +
    (t('totalSales') || 'Total') + ': <strong>' + formatCurrency(totalAmount) + '</strong>' + clearBtn;
}

function updateOrderLinesSortIndicators() {
  var labels = [
    t('colTime') || 'Time',
    t('colOrderNo') || 'Order #',
    t('colCategory') || 'Category',
    t('item') || 'Item',
    t('qty') || 'Qty',
    t('colPrice') || 'Price',
    t('colLineTotal') || 'Total',
    t('colPayment') || 'Payment',
    t('colCashier') || 'Cashier'
  ];
  var sortEls = document.querySelectorAll('.order-lines-table .order-lines-th-sort');
  sortEls.forEach(function(el, col) {
    if (labels[col]) el.innerHTML = labels[col] + orderLinesSortIndicator(col);
  });
}

function applyOrderLinesView() {
  var filtered = getFilteredOrderLines();
  window._orderLinesData = sortOrderLinesArray(filtered);
  var nf = lang === 'id' ? 'id-ID' : 'en-US';
  var body = document.getElementById('order-lines-body');
  if (body) body.innerHTML = buildOrderLinesRows(window._orderLinesData, nf);
  updateOrderLinesSortIndicators();
  updateOrderLinesMeta();
}

function setOrderLinesFilter(col, value) {
  if (!window._orderLinesFilters) window._orderLinesFilters = {};
  if (value) {
    window._orderLinesFilters[col] = value;
  } else {
    delete window._orderLinesFilters[col];
  }
  applyOrderLinesView();
}

function clearOrderLinesFilters() {
  window._orderLinesFilters = {};
  applyOrderLinesView();
}

function renderOrderLinesView(data, selectedDate) {
  window._orderLinesSource = (data && data.lines) ? data.lines.slice() : [];
  window._orderLinesFilters = {};
  window._orderLinesSort = { col: 0, dir: 'asc' };
  var nf = lang === 'id' ? 'id-ID' : 'en-US';
  var header = buildSalesSummaryHeader(selectedDate, 'lines');
  window._orderLinesData = sortOrderLinesArray(getFilteredOrderLines());

  var meta = '<div class="order-lines-meta" id="order-lines-meta"></div>';

  var tableHead = '<div class="order-lines-panel"><div class="order-lines-scroll"><table class="order-lines-table">' +
    buildOrderLinesTableHead() +
    '<tbody id="order-lines-body">' +
    buildOrderLinesRows(window._orderLinesData, nf) +
    '</tbody></table></div></div>';

  var footer = '</div>';
  var main = getElem('main');
  if (main) {
    main.innerHTML = header + meta + tableHead + footer;
    updateOrderLinesMeta();
  }
}

function buildOrderLinesRows(lines, nf) {
  if (!lines || !lines.length) {
    var hasFilter = false;
    var filters = window._orderLinesFilters || {};
    for (var c = 0; c < ORDER_LINES_KEYS.length; c++) {
      if (filters[c]) { hasFilter = true; break; }
    }
    var sourceLen = (window._orderLinesSource || []).length;
    var msg = (hasFilter && sourceLen > 0)
      ? (t('noOrderLinesMatchFilter') || 'No rows match the current filters')
      : (t('noOrderLines') || 'No order lines for this date');
    return '<tr><td colspan="9" style="text-align:center;padding:32px;color:#666;">' + msg + '</td></tr>';
  }
  return lines.map(function(row) {
    var ts = row.timestamp ? new Date(row.timestamp) : null;
    var timeStr = ts && !isNaN(ts.getTime())
      ? ts.toLocaleTimeString(nf, { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      : (row.timestamp || '');
    return '<tr>' +
      '<td>' + timeStr + '</td>' +
      '<td>' + (row.orderNumber || '') + '</td>' +
      '<td>' + (row.category || '') + '</td>' +
      '<td>' + (row.productName || '') + '</td>' +
      '<td class="right">' + (row.qty || 0) + '</td>' +
      '<td class="right">' + formatCurrency(row.price || 0) + '</td>' +
      '<td class="right">' + formatCurrency(row.lineTotal || 0) + '</td>' +
      '<td>' + (row.payment || '') + '</td>' +
      '<td>' + (row.username || '') + '</td>' +
      '</tr>';
  }).join('');
}

function sortOrderLinesTable(col) {
  if (!window._orderLinesSource || !window._orderLinesSource.length) return;
  if (window._orderLinesSort.col === col) {
    window._orderLinesSort.dir = window._orderLinesSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    window._orderLinesSort.col = col;
    window._orderLinesSort.dir = 'asc';
  }
  applyOrderLinesView();
}

function exportOrderLinesCsv() {
  var lines = window._orderLinesData || [];
  if (!lines.length) {
    if (window.showToast) window.showToast(t('noOrderLines') || 'No data to export', 'warning');
    return;
  }
  var rows = [['Time', 'Order#', 'Category', 'Product', 'Qty', 'Price', 'Total', 'Payment', 'Cashier']];
  lines.forEach(function(r) {
    rows.push([
      r.timestamp || '', r.orderNumber || '', r.category || '', r.productName || '',
      r.qty || 0, r.price || 0, r.lineTotal || 0, r.payment || '', r.username || ''
    ]);
  });
  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var dateInput = document.getElementById('salesDateInput');
  var dateStr = dateInput ? dateInput.value : 'export';
  if (window.SnowbeeI18n && window.SnowbeeI18n.downloadCsv) {
    window.SnowbeeI18n.downloadCsv({ csv: csv, filename: 'order-lines-' + dateStr + '.csv' }, 'order-lines.csv');
  } else {
    var blob = new Blob([csv], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'order-lines-' + dateStr + '.csv';
    a.click();
  }
}

function showSalesReport(reportType = 'daily') {
  const main = getElem('main');
  if (!main) return;
  
  main.innerHTML = `
    <h2 style="text-align:center">${t('salesReport')}</h2>
    <div class="report-controls" style="text-align:center; margin-bottom:20px;">
      <button class="report-btn ${reportType === 'daily' ? 'active' : ''}" onclick="showSalesReport('daily')">Daily</button>
      <button class="report-btn ${reportType === 'weekly' ? 'active' : ''}" onclick="showSalesReport('weekly')">Weekly</button>
      <button class="report-btn ${reportType === 'monthly' ? 'active' : ''}" onclick="showSalesReport('monthly')">Monthly</button>
    </div>
    <div id="sales-report-content">
      <div class="loading">Loading ${reportType} sales report...</div>
    </div>
  `;
  
  // Load report data based on type
  const methodName = `getSales${reportType.charAt(0).toUpperCase() + reportType.slice(1)}Report`;
  
  // ✅ SECURITY: Use SecurityWrapper for authenticated calls to ensure outlet filtering
  if (window.SecurityWrapper && window.SecurityWrapper.secureServerCall) {
    window.SecurityWrapper.secureServerCall(methodName)
      .then(function(data) {
        const parsedData = typeof data === 'string' ? JSON.parse(data) : data;
        renderSalesReportData(parsedData, reportType);
      })
      .catch(function(error) {
        const content = getElem('sales-report-content');
        if (content) {
          content.innerHTML = `<div class="error">Failed to load ${reportType} report: ${error}</div>`;
        }
      });
  } else {
    // Fallback for backward compatibility
    console.warn('SecurityWrapper not available, using legacy call');
    google.script.run
      .withSuccessHandler(function(data) {
        renderSalesReportData(JSON.parse(data), reportType);
      })
      .withFailureHandler(function(error) {
        const content = getElem('sales-report-content');
        if (content) {
          content.innerHTML = `<div class="error">Failed to load ${reportType} report: ${error}</div>`;
        }
      })[methodName]();
  }
}

function renderSalesReportData(data, reportType) {
  const content = getElem('sales-report-content');
  if (!content) return;
  
  if (!data || data.length === 0) {
    content.innerHTML = `<div class="no-data">No ${reportType} sales data found</div>`;
    return;
  }
  
  let html = `

  `;
  
  let totalSales = 0;
  let totalOrders = 0;
  
  data.forEach(row => {
    const sales = Number(row.totalSales) || 0;

    html += `

      </tr>

  });
  
  const overallAvg = totalOrders > 0 ? totalSales / totalOrders : 0;
  
  html += `
        </tbody>
        <tfoot>
          <tr>
            <td><strong>Total:</strong></td>
            <td style="text-align:center"><strong>${totalOrders}</strong></td>
            <td class="right"><strong>${formatCurrency(totalSales)}</strong></td>
            <td class="right"><strong>${formatCurrency(overallAvg)}</strong></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
  
  content.innerHTML = html;
}

// Helper functions for formatting and optimization
const productNameCache = new Map(); // Memoization cache for product names

function extractProductName(item, rec) {
  // Check cache first for performance
  const cacheKey = `${item}_${rec.itemName || ''}`;
  if (productNameCache.has(cacheKey)) {
    return productNameCache.get(cacheKey);
  }
  
  // Extract product name logic
  const productName = rec.itemName || 
    (item.includes('_') ? 
      item.split('_').slice(1).join('_').replace(/_/g, ' ') : 
      item);
  
  // Cache the result
  productNameCache.set(cacheKey, productName);
  return productName;
}

function formatDate(dateStr) {
  const date = new Date(dateStr);
  const nf = lang === "id" ? "id-ID" : "en-US";
  return date.toLocaleDateString(nf, {year:'numeric', month:'short', day:'numeric'});
}

function formatCurrency(amount) {
  const nf = lang === "id" ? "id-ID" : "en-US";
  return (lang==="id"?"Rp":"IDR")+" "+ (amount||0).toLocaleString(nf);
}

// Global variables for table sorting with optimization
let currentSortColumn = -1;
let currentSortDirection = 'asc';
let salesTableData = {};
let sortIndicatorCache = {}; // ⚡ Cache DOM elements

// ⚡ Optimized function to sort the sales table by column
function sortSalesSummaryTable(columnIndex) {
  const tableBody = document.getElementById('sales-table-body');
  if (!tableBody || !salesTableData || Object.keys(salesTableData).length === 0) {
    return;
  }
  
  // ⚡ Cache sort indicators for performance
  if (!sortIndicatorCache.initialized) {
    for (let i = 0; i <= 2; i++) {
      sortIndicatorCache[i] = document.getElementById(`sort-${i}`);
    }
    sortIndicatorCache.initialized = true;
  }
  
  // Reset all sort indicators
  for (let i = 0; i <= 2; i++) {
    const indicator = sortIndicatorCache[i];
    if (indicator) {
      indicator.className = 'sort-indicator';
      indicator.innerHTML = '↕️';
    }
  }
  
  // Determine sort direction
  if (currentSortColumn === columnIndex) {
    currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
  } else {
    currentSortDirection = 'asc';
    currentSortColumn = columnIndex;
  }
  
  // Update sort indicator for current column
  const currentIndicator = sortIndicatorCache[columnIndex];
  if (currentIndicator) {
    currentIndicator.className = `sort-indicator ${currentSortDirection}`;
    currentIndicator.innerHTML = currentSortDirection === 'asc' ? '↑' : '↓';
  }
  
  // Sort the table data and re-render
  sortAndRenderTable(columnIndex, currentSortDirection);
}

// ⚡ Combined sort and render function for better performance
function sortAndRenderTable(columnIndex, direction) {
  // Sort each category's items in-place
  Object.keys(salesTableData).forEach(category => {
    const items = salesTableData[category];
    
    items.sort((a, b) => {
      let valueA, valueB;
      
      switch (columnIndex) {
        case 0: // Item name
          valueA = (a.displayName || a.productName || '').toLowerCase();
          valueB = (b.displayName || b.productName || '').toLowerCase();
          return direction === 'asc' ? 
            valueA.localeCompare(valueB) : 
            valueB.localeCompare(valueA);
        case 1: // Quantity
          valueA = Number(a.qty) || 0;
          valueB = Number(b.qty) || 0;
          break;
        case 2: // Sales
          valueA = Number(a.sales) || 0;
          valueB = Number(b.sales) || 0;
          break;
        default:
          return 0;
      }
      
      // Numeric comparison for qty and sales
      return direction === 'asc' ? valueA - valueB : valueB - valueA;
    });
  });
  
  // ⚡ Optimized table rendering
  renderOptimizedTable();
}

// ⚡ High-performance table rendering function
function renderOptimizedTable() {
  const tableBody = document.getElementById('sales-table-body');
  if (!tableBody || !salesTableData) return;
  
  const nf = lang === "id" ? "id-ID" : "en-US";
  
  // ⚡ Use DocumentFragment for efficient DOM manipulation
  const fragment = document.createDocumentFragment();
  
  // Sort categories efficiently
  const categoryOrder = ['Ayam', 'Nasi', 'Saus', 'Ice cream', 'Sundaes', 'Additional', 'MINUMAN', 'MISC'];
  const leftoverCategory = t('leftoverWasteItems');
  
  const sortedCategories = Object.keys(salesTableData).sort((a, b) => {
    if (a === leftoverCategory) return -1;
    if (b === leftoverCategory) return 1;
    
    const aIndex = categoryOrder.indexOf(a);
    const bIndex = categoryOrder.indexOf(b);
    
    if (aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
    if (aIndex !== -1) return -1;
    if (bIndex !== -1) return 1;
    return a.localeCompare(b);
  });
  
  // ⚡ Build content efficiently
  sortedCategories.forEach(category => {
    const isLeftoverCategory = category === leftoverCategory;
    const items = salesTableData[category];
    
    // Get category icon
    let categoryIcon;
    if (isLeftoverCategory) {
      categoryIcon = "🗑️";
    } else {
      categoryIcon = window.categoryIcons && window.categoryIcons[category] ? 
        window.categoryIcons[category] : 
        (categoryIcons && categoryIcons[category] ? categoryIcons[category] : "📂");
    }
    
    // Create category header row
    const categoryRow = document.createElement('tr');
    categoryRow.className = 'category-row';
    if (isLeftoverCategory) categoryRow.style.background = '#fff3cd';
    
    const categoryCell = document.createElement('td');
    categoryCell.colSpan = 3;
    categoryCell.className = 'category-header';
    if (isLeftoverCategory) {
      categoryCell.style.background = '#fff3cd';
      categoryCell.style.color = '#856404';
      categoryCell.style.fontWeight = 'bold';
    }
    categoryCell.innerHTML = `<span class="category-icon">${categoryIcon}</span>${category}`;
    categoryRow.appendChild(categoryCell);
    fragment.appendChild(categoryRow);
    
    let catQty = 0, catSales = 0;
    
    // Create item rows
    items.forEach(item => {
      catQty += item.qty;
      catSales += item.sales;
      
      const itemRow = document.createElement('tr');
      itemRow.className = 'item-row';
      if (isLeftoverCategory) itemRow.style.background = '#fef9e7';
      
      const nameCell = document.createElement('td');
      nameCell.className = 'item-name';
      nameCell.textContent = item.displayName || item.productName || '';
      
      const qtyCell = document.createElement('td');
      qtyCell.className = 'center item-qty';
      qtyCell.textContent = item.qty;
      
      const salesCell = document.createElement('td');
      salesCell.className = 'right item-sales';
      if (item.isLeftover) {
        salesCell.innerHTML = `<span style="color: #28a745; font-weight: bold;">${t('freeLeftover')}</span>`;
      } else {
        salesCell.textContent = (lang==="id"?"Rp":"IDR")+" "+item.sales.toLocaleString(nf);
      }
      
      itemRow.appendChild(nameCell);
      itemRow.appendChild(qtyCell);
      itemRow.appendChild(salesCell);
      fragment.appendChild(itemRow);
    });
    
    // Create subtotal row
    const subtotalRow = document.createElement('tr');
    subtotalRow.className = 'subtotal-row';
    if (isLeftoverCategory) subtotalRow.style.background = '#fff3cd';
    
    const subtotalLabelCell = document.createElement('td');
    subtotalLabelCell.className = 'subtotal-label';
    if (isLeftoverCategory) subtotalLabelCell.style.color = '#856404';
    subtotalLabelCell.textContent = isLeftoverCategory ? t('leftoverSubtotal') : 'Subtotal:';
    
    const subtotalQtyCell = document.createElement('td');
    subtotalQtyCell.className = 'center subtotal-qty';
    if (isLeftoverCategory) subtotalQtyCell.style.color = '#856404';
    subtotalQtyCell.textContent = catQty;
    
    const subtotalSalesCell = document.createElement('td');
    subtotalSalesCell.className = 'right subtotal-sales';
    if (isLeftoverCategory) {
      subtotalSalesCell.innerHTML = `<span style="color: #28a745; font-weight: bold;">${t('free')}</span>`;
    } else {
      subtotalSalesCell.textContent = (lang==="id"?"Rp":"IDR")+" "+catSales.toLocaleString(nf);
    }
    
    subtotalRow.appendChild(subtotalLabelCell);
    subtotalRow.appendChild(subtotalQtyCell);
    subtotalRow.appendChild(subtotalSalesCell);
    fragment.appendChild(subtotalRow);
  });
  
  // ⚡ Single DOM update for maximum performance
  tableBody.innerHTML = '';
  tableBody.appendChild(fragment);
}

// ⚡ Optimized function to initialize table data for sorting
function initializeTableSorting(data) {
  salesTableData = {};
  
  if (!data) return;
  
  // ⚡ Process leftover items efficiently
  if (data.leftoverItems && Object.keys(data.leftoverItems).length > 0) {
    const leftoverCategoryKey = t('leftoverWasteItems');
    salesTableData[leftoverCategoryKey] = [];
    
    // Flatten leftover items from all categories
    Object.keys(data.leftoverItems).forEach(category => {
      data.leftoverItems[category].forEach(itemData => {
        salesTableData[leftoverCategoryKey].push({
          key: itemData.key,
          itemName: itemData.itemName,
          productName: itemData.productName,
          displayName: `🗑️ ${itemData.productName} (${itemData.category})`,
          qty: itemData.qty,
          sales: 0, // Always 0 for leftover items
          actualTransactionPrice: itemData.actualTransactionPrice, // Store actual price from orders
          isLeftover: true
        });
      });
    });
  }
  
  // ⚡ Process regular items efficiently
  if (data.regularItems && Object.keys(data.regularItems).length > 0) {
    Object.keys(data.regularItems).forEach(category => {
      if (data.regularItems[category] && data.regularItems[category].length > 0) {
        salesTableData[category] = data.regularItems[category].map(itemData => ({
          key: itemData.key,
          itemName: itemData.itemName,
          productName: itemData.productName,
          displayName: itemData.productName,
          qty: itemData.qty,
          sales: itemData.sales,
          actualTransactionPrice: itemData.actualTransactionPrice, // Store actual price from orders
          isLeftover: false
        }));
      }
    });
  }
  
  // ⚡ Clear sort state for fresh initialization
  currentSortColumn = -1;
  currentSortDirection = 'asc';
  sortIndicatorCache = {};
}
